s match two known issues:\n- **KI-014:** The index job for one tenant's folder gets stuck. The fix is to restart the index worker and re-queue the folder [known-issues KI-014].\n- **KI-029:** The worker's temp folder fills up, so the worker stops with a disk warning. The fix is to stop the worker, clear the temp folder and start it again [known-issues KI-029].\n\nSince July, every fix has included clearing the temp folder. That suggests the temp folder keeps filling up (KI-029). The tickets don't confirm this, and none of them records anything done to stop it happening again.\n\n**Is anything open?**\nNo. Live Jira shows no open POC issues mentioning \"Fabrikam\" or \"index worker.\" All the tickets above are resolved.\n\nIt might be worth opening a Jira item to find out why the index worker's temp folder keeps filling up. A regular cleanup or a disk-space alert on that folder could stop this coming back.\n\nCITED: known-issues KI-014, known-issues KI-029, ticket TCK-4433 Fabrikam Legal 2026-04-14, ticket TCK-4471 Fabrikam Legal 2026-07-09, ticket TCK-4512 Fabrikam Legal 2026-09-21\n```\n\n**Observed:** Claude calls find_tickets(\"Fabrikam Legal\"), then jira_search with status != Done twice (0 issues). It answers: three reports, the fix each time, and nothing open.\n\n## 3. Happy: Is vendor B's pricing answer still open?\n\n```\npython rag.py agent \"Is vendor B's pricing answer still open?\" --jira http://localhost:8089\n```\n\nLook for: Does Claude's JQL keep POC-12 (Done) in view?\n\nExit code 0, 21.6 s.\n\n```text\nagent for sam, tools: search_docs, find_tickets, jira_search (http://localhost:8089)\n  1. jira_search({\"jql\": \"project = POC AND text ~ \\\"vendor B\\\"\"}) -> 6\n       [jira live POC-1] POC-1 Central log platform POC. Status: In Progress. Updated 2026-10-07.\n       [jira live POC-10] POC-10 Book demo slots with vendors A, B and C. Status: Done. Updated 2026-09-10\n       [jira live POC-11] POC-11 Ask vendor A: does an on-premise parser exist?.
