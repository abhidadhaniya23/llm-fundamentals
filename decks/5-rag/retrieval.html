<script>window.DECK = {"flow": [{"title": "Two ways to search", "file": "content/retrieval/keyword-and-semantic.md"}, {"title": "Hybrid search and reranking", "file": "content/retrieval/hybrid-and-rerank.md"}, {"title": "Query transformation", "file": "content/retrieval/query-transformation.md"}], "files": {"content/retrieval/keyword-and-semantic.md": "# Two ways to search\n\n\n## Overview\n\n**Goal:** Predict whether keyword search (BM25) or semantic search wins a given Contoso question.\n\n**Walk out with:** BM25 for IDs, codes and names; semantic for paraphrases; neither alone for everything.\n\n<div class=\"diagram\" id=\"req-ret\"><svg viewBox=\"0 0 1000 250\" font-family=\"system-ui,sans-serif\" style=\"max-height:320px\">\n<text x=\"405\" y=\"22\" text-anchor=\"middle\" font-size=\"17\" letter-spacing=\"2\" style=\"fill:var(--muted)\">THE REQUEST WE SEND<\/text>\n<rect x=\"8\" y=\"34\" width=\"794\" height=\"118\" rx=\"14\" style=\"fill:none;stroke:var(--navy);stroke-width:2;stroke-dasharray:7 6\"/>\n<path d=\"M806 93 L838 93\" style=\"stroke:var(--navy);stroke-width:3\"/><path d=\"M838 85 L852 93 L838 101 Z\" style=\"fill:var(--navy)\"/>\n<text x=\"925\" y=\"22\" text-anchor=\"middle\" font-size=\"17\" letter-spacing=\"2\" style=\"fill:var(--muted)\">BACK<\/text>\n<rect x=\"20\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"92\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">System<\/text>\n<text x=\"92\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">prompt<\/text>\n<rect x=\"176\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"248\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">Tool<\/text>\n<text x=\"248\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">definitions<\/text>\n<rect x=\"332\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"404\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">Conversation<\/text>\n<text x=\"404\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">so far<\/text>\n<rect x=\"488\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:3\"/>\n<text x=\"560\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--ink)\">Retrieved<\/text>\n<text x=\"560\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--ink)\">context<\/text>\n<g>\n<path d=\"M560 142 L560 166\" style=\"stroke:var(--orange);stroke-width:2\"/>\n<text x=\"560\" y=\"188\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">BM25, hybrid,<\/text>\n<text x=\"560\" y=\"211\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">rerank, top-k<\/text>\n<\/g>\n<rect x=\"644\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:3\"/>\n<text x=\"716\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--ink)\">New<\/text>\n<text x=\"716\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--ink)\">message<\/text>\n<g>\n<path d=\"M716 142 L716 166\" style=\"stroke:var(--orange);stroke-width:2\"/>\n<text x=\"716\" y=\"188\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">query rewrite<\/text>\n<text x=\"716\" y=\"211\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">before search<\/text>\n<\/g>\n<rect x=\"858\" y=\"46\" width=\"134\" height=\"94\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"925\" y=\"100\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">Response<\/text>\n<\/svg><\/div>\n\n\n## Two questions\n\n<div class=\"diagram\" id=\"twoq\"><svg viewBox=\"0 0 1000 250\" font-family=\"system-ui,sans-serif\" style=\"max-height:310px\">\n<rect x=\"10\" y=\"20\" width=\"440\" height=\"80\" rx=\"14\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"30\" y=\"56\" font-size=\"17\" font-weight=\"700\" style=\"fill:var(--navy)\">A<\/text>\n<text x=\"60\" y=\"68\" font-size=\"21\" style=\"fill:var(--ink);font-family:var(--mono)\">transfer TIMEOUT 7f3a-91c2<\/text>\n<rect x=\"550\" y=\"20\" width=\"440\" height=\"80\" rx=\"14\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"570\" y=\"56\" font-size=\"17\" font-weight=\"700\" style=\"fill:var(--navy)\">B<\/text>\n<text x=\"600\" y=\"58\" font-size=\"19\" style=\"fill:var(--ink)\">why do night reprocessing<\/text>\n<text x=\"600\" y=\"84\" font-size=\"19\" style=\"fill:var(--ink)\">jobs fail?<\/text>\n<g class=\"rv qa\">\n<path d=\"M230 104 L230 140\" style=\"stroke:var(--orange);stroke-width:3\"/>\n<rect x=\"10\" y=\"140\" width=\"440\" height=\"90\" rx=\"10\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n<text x=\"26\" y=\"172\" font-size=\"16\" style=\"fill:var(--ink);font-family:var(--mono)\">transfer.log 02:14:07 7f3a-91c2<\/text>\n<text x=\"26\" y=\"198\" font-size=\"16\" style=\"fill:var(--ink);font-family:var(--mono)\">target busy, retry 3/3 failed<\/text>\n<text x=\"434\" y=\"220\" text-anchor=\"end\" font-size=\"15\" font-weight=\"700\" style=\"fill:var(--orange)\">keyword wins: the exact ID<\/text>\n<\/g>\n<g class=\"rv qa\">\n<path d=\"M770 104 L770 140\" style=\"stroke:var(--good);stroke-width:3\"/>\n<rect x=\"550\" y=\"140\" width=\"440\" height=\"90\" rx=\"10\" style=\"fill:var(--good-tint);stroke:var(--good);stroke-width:2\"/>\n<text x=\"566\" y=\"172\" font-size=\"16\" style=\"fill:var(--ink)\">KI-022 transfer timeout… target busy<\/text>\n<text x=\"566\" y=\"198\" font-size=\"16\" style=\"fill:var(--ink)\">during the night batch…<\/text>\n<text x=\"974\" y=\"220\" text-anchor=\"end\" font-size=\"15\" font-weight=\"700\" style=\"fill:var(--good)\">semantic wins: no shared words<\/text>\n<\/g>\n<\/svg><\/div>\n\n**Ask:** Which does keyword search win, and which does semantic search win? Hands up for A, then B.\n\n::: reveal Answer | #twoq .qa\n**Keyword search wins A** (an exact ID). **Semantic search wins B** (no shared words with KI-022: \"reprocessing jobs fail\" vs \"transfer timeout, target busy\").\n:::\n\n\n\n## How BM25 scores\n\n<div class=\"diagram\" id=\"bm25\"><svg viewBox=\"0 0 1000 260\" font-family=\"system-ui,sans-serif\" style=\"max-height:330px\">\n<g font-size=\"20\" style=\"font-family:var(--mono)\">\n<rect x=\"10\" y=\"20\" width=\"170\" height=\"50\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><text x=\"95\" y=\"52\" text-anchor=\"middle\" style=\"fill:var(--ink)\">transfer<\/text>\n<rect x=\"200\" y=\"20\" width=\"170\" height=\"50\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><text x=\"285\" y=\"52\" text-anchor=\"middle\" style=\"fill:var(--ink)\">TIMEOUT<\/text>\n<rect x=\"390\" y=\"20\" width=\"170\" height=\"50\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><text x=\"475\" y=\"52\" text-anchor=\"middle\" style=\"fill:var(--ink)\">7f3a-91c2<\/text>\n<\/g>\n<g class=\"rv bm1\">\n<text x=\"600\" y=\"52\" font-size=\"18\" style=\"fill:var(--ink)\"><tspan font-weight=\"700\">1.<\/tspan> does the chunk contain the word?<\/text>\n<\/g>\n<g class=\"rv bm2\">\n<text x=\"600\" y=\"110\" font-size=\"18\" style=\"fill:var(--ink)\"><tspan font-weight=\"700\">2.<\/tspan> rare words count more<\/text>\n<rect x=\"390\" y=\"78\" width=\"170\" height=\"40\" rx=\"6\" style=\"fill:var(--orange);stroke:var(--orange)\"/><text x=\"475\" y=\"105\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" style=\"fill:#fff\">rare: high weight<\/text>\n<\/g>\n<g class=\"rv bm3\">\n<text x=\"600\" y=\"168\" font-size=\"18\" style=\"fill:var(--ink)\"><tspan font-weight=\"700\">3.<\/tspan> long chunks count a bit less<\/text>\n<rect x=\"10\" y=\"140\" width=\"120\" height=\"40\" rx=\"6\" style=\"fill:var(--good-tint);stroke:var(--good)\"/><text x=\"70\" y=\"166\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--ink)\">log line<\/text>\n<rect x=\"150\" y=\"140\" width=\"400\" height=\"40\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/><text x=\"350\" y=\"166\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--ink)\">a long SOP section that mentions transfer once<\/text>\n<\/g>\n<g class=\"rv bm4\">\n<rect x=\"10\" y=\"200\" width=\"980\" height=\"50\" rx=\"10\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n<text x=\"500\" y=\"232\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" style=\"fill:var(--ink)\">top hit: transfer.log 02:14:07 7f3a-91c2 target busy, retry 3/3 failed<\/text>\n<\/g>\n<\/svg><\/div>\n\n::: reveal Contains the word | #bm25 .bm1\n:::\n::: reveal Rare words | #bm25 .bm2\n:::\n::: reveal Short chunks | #bm25 .bm3\n:::\n::: reveal Top hit | #bm25 .bm4\n:::\n\n\n## Rare words weigh more\n\n**Ask:** Rank the three query words by how much they add to the score: `transfer`, `TIMEOUT`, `7f3a-91c2`.\n\n<div class=\"diagram\" id=\"idf\"><svg viewBox=\"0 0 1000 200\" font-family=\"system-ui,sans-serif\" style=\"max-height:260px\">\n<g font-size=\"19\" style=\"font-family:var(--mono);fill:var(--ink)\"><text x=\"10\" y=\"50\">transfer<\/text><text x=\"10\" y=\"110\">TIMEOUT<\/text><text x=\"10\" y=\"170\">7f3a-91c2<\/text><\/g>\n<g class=\"rv idf\">\n<rect x=\"200\" y=\"28\" width=\"140\" height=\"32\" rx=\"4\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><text x=\"355\" y=\"51\" font-size=\"16\" style=\"fill:var(--muted)\">in many chunks<\/text>\n<rect x=\"200\" y=\"88\" width=\"290\" height=\"32\" rx=\"4\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><text x=\"505\" y=\"111\" font-size=\"16\" style=\"fill:var(--muted)\">in a few<\/text>\n<rect x=\"200\" y=\"148\" width=\"620\" height=\"32\" rx=\"4\" style=\"fill:var(--orange);stroke:var(--orange)\"/><text x=\"835\" y=\"171\" font-size=\"16\" style=\"fill:var(--ink)\">in one chunk<\/text>\n<\/g>\n<\/svg><\/div>\n\n::: reveal Answer | #idf .idf\n**`7f3a-91c2`** adds the most: it's in one chunk only. **`transfer`** adds the least: it's in many. (Bars are illustrative.)\n:::\n\n\n## Strong for, weak for\n\n**Strong for:** IDs, error codes, server names, KI numbers\n\n**Weak for:** synonyms, paraphrases, other languages\n\n**Ask:** Sam types *\"indexer stuck\"*. KI-014 says *\"index worker\"*. Does BM25 find it?\n\n::: reveal Answer\n**Probably not.** \"Indexer\" isn't \"index\", and \"stuck\" isn't \"stalled\". No shared words, no score.\n:::\n\n\n## Semantic search\n\n<div class=\"diagram\" id=\"sem\"><svg viewBox=\"0 0 1000 220\" font-family=\"system-ui,sans-serif\" style=\"max-height:290px\">\n<rect x=\"10\" y=\"70\" width=\"250\" height=\"80\" rx=\"40\" style=\"fill:var(--navy);stroke:var(--navy)\"/>\n<text x=\"135\" y=\"106\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:#fff\">why do night reprocessing<\/text>\n<text x=\"135\" y=\"128\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:#fff\">jobs fail?<\/text>\n<path d=\"M264 110 L310 110\" style=\"stroke:var(--navy);stroke-width:3\"/><path d=\"M310 102 L324 110 L310 118 Z\" style=\"fill:var(--navy)\"/>\n<rect x=\"330\" y=\"80\" width=\"150\" height=\"60\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"405\" y=\"116\" text-anchor=\"middle\" font-size=\"18\" style=\"fill:var(--navy)\">embed<\/text>\n<path d=\"M484 110 L530 110\" style=\"stroke:var(--navy);stroke-width:3\"/><path d=\"M530 102 L544 110 L530 118 Z\" style=\"fill:var(--navy)\"/>\n<rect x=\"550\" y=\"80\" width=\"150\" height=\"60\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"625\" y=\"116\" text-anchor=\"middle\" font-size=\"18\" style=\"fill:var(--navy)\">nearest k<\/text>\n<g class=\"rv se1\">\n<path d=\"M704 110 L740 60 M704 110 L740 110 M704 110 L740 160\" style=\"stroke:var(--good);stroke-width:2\"/>\n<g font-size=\"16\" style=\"fill:var(--ink)\"><rect x=\"740\" y=\"40\" width=\"250\" height=\"40\" rx=\"6\" style=\"fill:var(--good-tint);stroke:var(--good)\"/><text x=\"752\" y=\"66\">KI-022 target busy, night<\/text><rect x=\"740\" y=\"90\" width=\"250\" height=\"40\" rx=\"6\" style=\"fill:var(--good-tint);stroke:var(--good)\"/><text x=\"752\" y=\"116\">SOP-CH-07 §3 night batch<\/text><rect x=\"740\" y=\"140\" width=\"250\" height=\"40\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/><text x=\"752\" y=\"166\">transfer.log line<\/text><\/g>\n<\/g>\n<\/svg><\/div>\n\n::: reveal Nearest chunks | #sem .se1\n:::\n\n\n## Two eyes\n\n<div class=\"diagram\" id=\"eyes\"><svg viewBox=\"0 0 1000 260\" font-family=\"system-ui,sans-serif\" style=\"max-height:330px\">\n<text x=\"250\" y=\"30\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" style=\"fill:var(--navy)\">Keyword (BM25)<\/text>\n<text x=\"750\" y=\"30\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" style=\"fill:var(--navy)\">Semantic<\/text>\n<path d=\"M500 10 L500 250\" style=\"stroke:var(--line);stroke-width:2\"/>\n<g font-size=\"18\" style=\"fill:var(--ink)\">\n<text x=\"20\" y=\"80\">IDs, codes, server names<\/text><text x=\"440\" y=\"80\" text-anchor=\"end\" style=\"fill:var(--good)\">✓<\/text>\n<text x=\"20\" y=\"120\">KI numbers: \"KI-047\"<\/text><text x=\"440\" y=\"120\" text-anchor=\"end\" style=\"fill:var(--good)\">✓<\/text>\n<text x=\"20\" y=\"160\">synonyms: \"indexer\"<\/text><text x=\"440\" y=\"160\" text-anchor=\"end\" style=\"fill:var(--bad)\">✗<\/text>\n<text x=\"520\" y=\"80\">paraphrases<\/text><text x=\"980\" y=\"80\" text-anchor=\"end\" style=\"fill:var(--good)\">✓<\/text>\n<text x=\"520\" y=\"120\">\"files missing\" → \"search empty\"<\/text><text x=\"980\" y=\"120\" text-anchor=\"end\" style=\"fill:var(--good)\">✓<\/text>\n<text x=\"520\" y=\"160\">exact IDs: \"7f3a-91c2\"<\/text><text x=\"980\" y=\"160\" text-anchor=\"end\" style=\"fill:var(--bad)\">✗<\/text>\n<\/g>\n<g class=\"rv ey\">\n<rect x=\"150\" y=\"196\" width=\"700\" height=\"54\" rx=\"27\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:3\"/>\n<text x=\"500\" y=\"230\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" style=\"fill:var(--ink)\">use both: hybrid search (next topic)<\/text>\n<\/g>\n<\/svg><\/div>\n\n**Ask:** Each column is blind exactly where the other sees. So what do we do?\n\n::: reveal Answer | #eyes .ey\n**Run both and merge them.** That's hybrid search.\n:::\n\n\n", "content/retrieval/hybrid-and-rerank.md": "# Hybrid search and reranking\n\n\n## Overview\n\n**Goal:** Merge keyword and semantic results with Reciprocal Rank Fusion, narrow with filters, and rerank the top with a cross-encoder.\n\n**Walk out with:** filter → hybrid (BM25 + semantic, fused) → top 50 → rerank → top 5.\n\n\n## Reciprocal Rank Fusion\n\n<div class=\"diagram\" id=\"rrf\"><svg viewBox=\"0 0 1000 300\" font-family=\"system-ui,sans-serif\" style=\"max-height:360px\">\n<text x=\"150\" y=\"26\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--navy)\">BM25 ranks<\/text>\n<text x=\"500\" y=\"26\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--navy)\">Semantic ranks<\/text>\n<g font-size=\"16\" style=\"fill:var(--ink)\">\n<rect x=\"20\" y=\"44\" width=\"260\" height=\"40\" rx=\"6\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/><text x=\"32\" y=\"70\">1 transfer.log 7f3a-91c2<\/text>\n<rect x=\"20\" y=\"92\" width=\"260\" height=\"40\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/><text x=\"32\" y=\"118\">2 KI-022<\/text>\n<rect x=\"20\" y=\"140\" width=\"260\" height=\"40\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/><text x=\"32\" y=\"166\">3 transfer.log 5c11-04ad<\/text>\n<rect x=\"370\" y=\"44\" width=\"260\" height=\"40\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/><text x=\"382\" y=\"70\">1 transfer.log 5c11-04ad<\/text>\n<rect x=\"370\" y=\"92\" width=\"260\" height=\"40\" rx=\"6\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/><text x=\"382\" y=\"118\">2 transfer.log 7f3a-91c2<\/text>\n<rect x=\"370\" y=\"140\" width=\"260\" height=\"40\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/><text x=\"382\" y=\"166\">3 SOP-CH-07 §3<\/text>\n<rect x=\"370\" y=\"188\" width=\"260\" height=\"40\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/><text x=\"382\" y=\"214\">4 KI-022<\/text>\n<\/g>\n<g class=\"rv rf1\">\n<rect x=\"20\" y=\"248\" width=\"610\" height=\"44\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n<text x=\"325\" y=\"277\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--navy)\">each list: score = 1 / (60 + rank), then add<\/text>\n<\/g>\n<g class=\"rv rf2\">\n<path d=\"M640 120 L680 120\" style=\"stroke:var(--orange);stroke-width:3\"/><path d=\"M680 112 L694 120 L680 128 Z\" style=\"fill:var(--orange)\"/>\n<text x=\"845\" y=\"26\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--orange)\">Fused<\/text>\n<g font-size=\"16\" style=\"fill:var(--ink)\">\n<rect x=\"700\" y=\"44\" width=\"290\" height=\"40\" rx=\"6\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/><text x=\"712\" y=\"70\">1 transfer.log 7f3a-91c2<\/text>\n<rect x=\"700\" y=\"92\" width=\"290\" height=\"40\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/><text x=\"712\" y=\"118\">2 transfer.log 5c11-04ad<\/text>\n<rect x=\"700\" y=\"140\" width=\"290\" height=\"40\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/><text x=\"712\" y=\"166\">3 KI-022<\/text>\n<\/g>\n<\/g>\n<\/svg><\/div>\n\n::: reveal The rule | #rrf .rf1\n:::\n::: reveal Fused list | #rrf .rf2\n:::\n\n\n\n## RRF by hand\n\n**Ask:** The 7f3a-91c2 line is rank 1 in BM25 and rank 2 in semantic. KI-022 is rank 2 and rank 4. Work out both fused scores.\n\n::: reveal Answer\n- 7f3a-91c2 line: 1/61 + 1/62 = 0.0164 + 0.0161 = **0.0325**\n- KI-022: 1/62 + 1/64 = 0.0161 + 0.0156 = **0.0317**\n\nThe log line wins. Note how close they are: the 60 keeps one list from dominating.\n:::\n\n\n## Filters first\n\n<div class=\"diagram\" id=\"filters\"><svg viewBox=\"0 0 1000 250\" font-family=\"system-ui,sans-serif\" style=\"max-height:320px\">\n<path d=\"M10 30 L990 30 L780 220 L220 220 Z\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"500\" y=\"22\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--muted)\">all chunks<\/text>\n<g font-size=\"18\" text-anchor=\"middle\" style=\"fill:var(--ink);font-family:var(--mono)\">\n<text x=\"500\" y=\"70\" class=\"rv fl1\">platform = Content Hub<\/text>\n<text x=\"500\" y=\"110\" class=\"rv fl2\">stream = POC<\/text>\n<text x=\"500\" y=\"150\" class=\"rv fl3\">date &gt;= 2026-09-01<\/text>\n<text x=\"500\" y=\"190\" class=\"rv fl4\">access includes asker<\/text>\n<\/g>\n<text x=\"500\" y=\"246\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" style=\"fill:var(--orange)\">then search what's left<\/text>\n<\/svg><\/div>\n\n::: reveal Platform | #filters .fl1\n:::\n::: reveal Stream | #filters .fl2\n:::\n::: reveal Date | #filters .fl3\n:::\n::: reveal Access | #filters .fl4\n:::\n\n\n\n## Demo: the search lab\n\n<div class=\"diagram\"><iframe src=\"content/rag-assets/demos/search-lab.html?preset=ids\" style=\"width:100%;height:600px;border:0\" loading=\"lazy\"><\/iframe><\/div>\n\n\n## Two stages\n\n<div class=\"diagram\" id=\"stages\"><svg viewBox=\"0 0 1000 250\" font-family=\"system-ui,sans-serif\" style=\"max-height:320px\">\n<rect x=\"10\" y=\"40\" width=\"260\" height=\"170\" rx=\"12\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"140\" y=\"120\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" style=\"fill:var(--muted)\">all chunks<\/text>\n<text x=\"140\" y=\"150\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--muted)\">thousands<\/text>\n<g class=\"rv sg1\">\n<path d=\"M274 125 L320 125\" style=\"stroke:var(--navy);stroke-width:3\"/><path d=\"M320 117 L334 125 L320 133 Z\" style=\"fill:var(--navy)\"/>\n<rect x=\"340\" y=\"60\" width=\"290\" height=\"130\" rx=\"12\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"485\" y=\"100\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--navy)\">1. fast and rough<\/text>\n<text x=\"485\" y=\"130\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">hybrid search, bi-encoder<\/text>\n<text x=\"485\" y=\"168\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" style=\"fill:var(--ink)\">keeps 50<\/text>\n<\/g>\n<g class=\"rv sg2\">\n<path d=\"M634 125 L680 125\" style=\"stroke:var(--orange);stroke-width:3\"/><path d=\"M680 117 L694 125 L680 133 Z\" style=\"fill:var(--orange)\"/>\n<rect x=\"700\" y=\"80\" width=\"290\" height=\"90\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:3\"/>\n<text x=\"845\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--ink)\">2. slow and precise<\/text>\n<text x=\"845\" y=\"138\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">cross-encoder rerank<\/text>\n<text x=\"845\" y=\"200\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" style=\"fill:var(--ink)\">keeps 5<\/text>\n<\/g>\n<\/svg><\/div>\n\n::: reveal First stage | #stages .sg1\n:::\n::: reveal Second stage | #stages .sg2\n:::\n\n\n## Bi-encoder and cross-encoder\n\n<div class=\"diagram\" id=\"encoders\"><svg viewBox=\"0 0 1000 280\" font-family=\"system-ui,sans-serif\" style=\"max-height:340px\">\n<text x=\"240\" y=\"26\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" style=\"fill:var(--navy)\">Bi-encoder<\/text>\n<text x=\"760\" y=\"26\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" style=\"fill:var(--orange)\">Cross-encoder<\/text>\n<path d=\"M500 10 L500 270\" style=\"stroke:var(--line);stroke-width:2\"/>\n<g class=\"rv en1\">\n<rect x=\"20\" y=\"50\" width=\"190\" height=\"50\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><text x=\"115\" y=\"81\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">query<\/text>\n<rect x=\"270\" y=\"50\" width=\"190\" height=\"50\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy)\"/><text x=\"365\" y=\"81\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">chunk<\/text>\n<path d=\"M115 104 L115 136 M365 104 L365 136\" style=\"stroke:var(--navy);stroke-width:2\"/>\n<rect x=\"45\" y=\"136\" width=\"140\" height=\"44\" rx=\"8\" style=\"fill:var(--navy);stroke:var(--navy)\"/><text x=\"115\" y=\"164\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:#fff\">embed<\/text>\n<rect x=\"295\" y=\"136\" width=\"140\" height=\"44\" rx=\"8\" style=\"fill:var(--navy);stroke:var(--navy)\"/><text x=\"365\" y=\"164\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:#fff\">embed (ahead)<\/text>\n<path d=\"M115 184 L240 220 M365 184 L240 220\" style=\"stroke:var(--navy);stroke-width:2\"/>\n<text x=\"240\" y=\"244\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" style=\"fill:var(--ink)\">compare vectors: cosine<\/text>\n<text x=\"240\" y=\"268\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--muted)\">separately, fast, chunk vectors stored<\/text>\n<\/g>\n<g class=\"rv en2\">\n<rect x=\"560\" y=\"50\" width=\"400\" height=\"50\" rx=\"8\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/><text x=\"760\" y=\"81\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">query + chunk, read together<\/text>\n<path d=\"M760 104 L760 136\" style=\"stroke:var(--orange);stroke-width:2\"/>\n<rect x=\"660\" y=\"136\" width=\"200\" height=\"44\" rx=\"8\" style=\"fill:var(--orange);stroke:var(--orange)\"/><text x=\"760\" y=\"164\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:#fff\">one model reads both<\/text>\n<text x=\"760\" y=\"214\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" style=\"fill:var(--ink)\">relevance 0.97<\/text>\n<text x=\"760\" y=\"268\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--muted)\">together, slow, one call per pair<\/text>\n<\/g>\n<\/svg><\/div>\n\n::: reveal Bi-encoder | #encoders .en1\n:::\n::: reveal Cross-encoder | #encoders .en2\n:::\n\n\n## Vendor A, reranked\n\n<div class=\"diagram\" id=\"rerank\"><svg viewBox=\"0 0 1000 260\" font-family=\"system-ui,sans-serif\" style=\"max-height:320px\">\n<text x=\"240\" y=\"26\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--navy)\">First stage<\/text>\n<text x=\"760\" y=\"26\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--orange)\">After rerank<\/text>\n<g font-size=\"17\" style=\"fill:var(--ink)\">\n<rect x=\"20\" y=\"44\" width=\"440\" height=\"44\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/><text x=\"34\" y=\"73\">1 minutes 09-17 §Vendor A demo<\/text>\n<rect x=\"20\" y=\"96\" width=\"440\" height=\"44\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/><text x=\"34\" y=\"125\">2 minutes 09-17 §Asks<\/text>\n<rect x=\"20\" y=\"148\" width=\"440\" height=\"44\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/><text x=\"34\" y=\"177\">3 vendor A mail (quoted reply)<\/text>\n<rect x=\"20\" y=\"200\" width=\"440\" height=\"44\" rx=\"6\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/><text x=\"34\" y=\"229\">… minutes 10-01 §Decision<\/text>\n<\/g>\n<g class=\"rv rr\">\n<path d=\"M464 222 Q520 140 536 70\" style=\"fill:none;stroke:var(--orange);stroke-width:3\"/><path d=\"M528 74 L538 60 L544 76 Z\" style=\"fill:var(--orange)\"/>\n<g font-size=\"17\" style=\"fill:var(--ink)\">\n<rect x=\"540\" y=\"44\" width=\"440\" height=\"44\" rx=\"6\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/><text x=\"554\" y=\"73\">1 minutes 10-01 §Decision<\/text>\n<rect x=\"540\" y=\"96\" width=\"440\" height=\"44\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/><text x=\"554\" y=\"125\">2 vendor A mail: no on-prem parser<\/text>\n<rect x=\"540\" y=\"148\" width=\"440\" height=\"44\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/><text x=\"554\" y=\"177\">3 SD-LOG-01 §2 Requirements<\/text>\n<rect x=\"540\" y=\"200\" width=\"440\" height=\"44\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/><text x=\"554\" y=\"229\">4 minutes 09-03 §Success criteria<\/text>\n<\/g>\n<\/g>\n<\/svg><\/div>\n\n**Ask:** For *\"why did we drop vendor A?\"*, the first stage puts the 09-17 demo minutes first. Why?\n\n::: reveal Answer | #rerank .rr\nThey **mention vendor A the most**. The reranker reads question and chunk together and moves the **10-01 decision** to the top.\n:::\n\n\n\n## Demo: rerank vendor A\n\n<div class=\"diagram\"><iframe src=\"content/rag-assets/demos/search-lab.html?preset=vendorA\" style=\"width:100%;height:600px;border:0\" loading=\"lazy\"><\/iframe><\/div>\n\n\n", "content/retrieval/query-transformation.md": "# Query transformation\n\n\n## Overview\n\n**Goal:** Turn a chatty or partial question into better searches (rewrite, resolve, split, draft) and pick a retrieval strategy per question.\n\n**Walk out with:** the question Sam types is rarely the best search; and a quick rule for keyword, semantic, hybrid and rerank.\n\n\n## One question, several searches\n\n<div class=\"diagram\" id=\"fanout\"><svg viewBox=\"0 0 1000 300\" font-family=\"system-ui,sans-serif\" style=\"max-height:360px\">\n<rect x=\"10\" y=\"120\" width=\"240\" height=\"70\" rx=\"35\" style=\"fill:var(--navy);stroke:var(--navy)\"/>\n<text x=\"130\" y=\"161\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" style=\"fill:#fff\">Compare vendor A and B<\/text>\n<path d=\"M254 155 L300 155\" style=\"stroke:var(--navy);stroke-width:3\"/>\n<rect x=\"300\" y=\"115\" width=\"160\" height=\"80\" rx=\"12\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"380\" y=\"150\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--navy)\">model writes<\/text>\n<text x=\"380\" y=\"174\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--navy)\">the searches<\/text>\n<g class=\"rv fo1\"><path d=\"M464 155 L560 60\" style=\"stroke:var(--orange);stroke-width:2\"/><rect x=\"560\" y=\"36\" width=\"250\" height=\"48\" rx=\"8\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/><text x=\"575\" y=\"67\" font-size=\"17\" style=\"fill:var(--ink)\">vendor A on-premise<\/text><\/g>\n<g class=\"rv fo2\"><path d=\"M464 155 L560 155\" style=\"stroke:var(--orange);stroke-width:2\"/><rect x=\"560\" y=\"131\" width=\"250\" height=\"48\" rx=\"8\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/><text x=\"575\" y=\"162\" font-size=\"17\" style=\"fill:var(--ink)\">vendor B on-premise<\/text><\/g>\n<g class=\"rv fo3\"><path d=\"M464 155 L560 250\" style=\"stroke:var(--orange);stroke-width:2\"/><rect x=\"560\" y=\"226\" width=\"250\" height=\"48\" rx=\"8\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/><text x=\"575\" y=\"257\" font-size=\"17\" style=\"fill:var(--ink)\">vendor B pricing<\/text><\/g>\n<g class=\"rv fo4\"><path d=\"M814 60 L870 155 M814 155 L870 155 M814 250 L870 155\" style=\"stroke:var(--good);stroke-width:2\"/><rect x=\"870\" y=\"115\" width=\"120\" height=\"80\" rx=\"12\" style=\"fill:var(--good-tint);stroke:var(--good);stroke-width:2\"/><text x=\"930\" y=\"150\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">merge,<\/text><text x=\"930\" y=\"172\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">dedupe<\/text><\/g>\n<\/svg><\/div>\n\n::: reveal Search 1 | #fanout .fo1\n:::\n::: reveal Search 2 | #fanout .fo2\n:::\n::: reveal Search 3 | #fanout .fo3\n:::\n::: reveal Merge | #fanout .fo4\n:::\n\n\n\n## Rewrite and resolve\n\n| Technique | What it does | Contoso example |\n|---|---|---|\n| Rewrite | Turns a chatty question into a search query | \"hey that search thing for Fabrikam is broken again??\" → \"Content Hub search returns nothing tenant Fabrikam Legal\" |\n| Use the conversation | Resolves \"it\" | \"and why was it dropped?\" → \"why was vendor A dropped from the log platform POC\" |\n\n**Ask:** Sam's second message is *\"and why was it dropped?\"*. What does a search for exactly that find?\n\n::: reveal Answer\n**Anything that was ever dropped.** \"It\" means nothing to a search engine. The model reads the conversation so far and writes \"why was vendor A dropped from the log platform POC\".\n:::\n\n\n## Multi-query and HyDE\n\n| Technique | What it does | Contoso example |\n|---|---|---|\n| Multi-query | Splits the question into several searches | \"Compare vendor A and B\" → \"vendor A on-premise\", \"vendor B on-premise\", \"vendor B pricing\" |\n| HyDE | Drafts an answer and searches with it | Draft: \"Restart the index worker and re-index the tenant folder.\" It matches KI-014's wording |\n\n**Ask:** HyDE searches with a *made-up* answer. Isn't that dangerous?\n\n::: reveal Answer\n**No, because the draft is never shown.** It's only used as a search query. It sounds like a document, so it lands near documents. The real answer is still written from what was retrieved.\n:::\n\n\n\n## Demo: query transformation\n\n<div class=\"diagram\"><iframe src=\"content/rag-assets/demos/query-transform.html\" style=\"width:100%;height:600px;border:0\" loading=\"lazy\"><\/iframe><\/div>\n\n\n\n## Your turn (1–3)\n\n**Task for participants:** For each question, write **keyword**, **semantic** or **hybrid**, and whether **reranking** helps.\n\n1. \"KI-047\"\n2. \"batches stuck\"\n3. \"what did we agree on log retention?\"\n\n::: reveal 1\n**Keyword.** An exact ID, one chunk has it. Reranking adds nothing.\n:::\n::: reveal 2\n**Hybrid.** \"Batch stuck\" is in KI-047's wording, but tickets say \"hanging\" or \"not arriving\". Rerank: small help.\n:::\n::: reveal 3\n**Hybrid + rerank**, with dates. SOP-OPS-02 says 14 days and the Content Hub config says 30: show both with their dates.\n:::\n\n\n## Your turn (4–5)\n\n4. \"why not vendor A?\"\n5. \"has Fabrikam Legal reported this before?\"\n\n::: reveal 4\n**Hybrid + rerank.** The first stage loves the 09-17 demo minutes; the reranker lifts the 10-01 decision. A rewrite helps too: \"why was vendor A dropped\".\n:::\n::: reveal 5\n**Keyword** for the tenant name, filtered to tickets; resolve \"this\" from the conversation. Really it's a lookup over live tickets: flow 8.\n:::\n\n\n## Close\n\n**Ask:** Back to the two questions from the start: \"transfer TIMEOUT 7f3a-91c2\" and \"why do night reprocessing jobs fail?\". One pipeline for both?\n\n::: reveal Answer\n**Hybrid search, then rerank.** Keyword catches the ID, semantic catches the meaning, RRF merges, the reranker orders the top 5.\n:::\n\n> *Search with two eyes: one for the words, one for the meaning.*\n\n---\n"}, "css": ["viewer/student.css", "viewer/theme.css"]};</script>
