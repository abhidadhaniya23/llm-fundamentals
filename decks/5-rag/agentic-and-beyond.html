<script>window.DECK = {"flow": [{"title": "One question, four sources", "file": "content/agentic-and-beyond/indexed-or-live.md"}, {"title": "From workflow to agent", "file": "content/agentic-and-beyond/workflow-to-agent.md"}, {"title": "Graphs and pictures", "file": "content/agentic-and-beyond/graph-and-multimodal.md"}], "files": {"content/agentic-and-beyond/indexed-or-live.md": "# One question, four sources\n\n## Overview\n\n**Goal:** Decide, source by source, whether Contoso's knowledge gets indexed or asked live, and see why one search over one index can't answer Sam's question.\n\n**Walk out with:** the rule: text that changes slowly gets indexed; facts that change quickly get asked live.\n\n\n## One question, four sources\n\n> Sam, on call: *\"Has Fabrikam Legal reported this before, what did we do, and is anything open?\"*\n\n<div class=\"diagram\" id=\"four\"><svg viewBox=\"0 0 1000 200\" role=\"img\" aria-label=\"Three parts of Sam's question answered by four sources: tickets, the known-issues sheet, Priya's note and Jira\">\n  <g>\n    <rect x=\"30\" y=\"10\" width=\"290\" height=\"50\" rx=\"25\" style=\"fill:var(--navy);stroke:var(--navy)\"/>\n    <text x=\"175\" y=\"42\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:#fff\">reported before?<\/text>\n    <rect x=\"355\" y=\"10\" width=\"290\" height=\"50\" rx=\"25\" style=\"fill:var(--navy);stroke:var(--navy)\"/>\n    <text x=\"500\" y=\"42\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:#fff\">what did we do?<\/text>\n    <rect x=\"680\" y=\"10\" width=\"290\" height=\"50\" rx=\"25\" style=\"fill:var(--navy);stroke:var(--navy)\"/>\n    <text x=\"825\" y=\"42\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:#fff\">anything open?<\/text>\n  <\/g>\n  <g class=\"rv src\">\n    <line x1=\"175\" y1=\"60\" x2=\"120\" y2=\"90\" style=\"stroke:var(--muted);stroke-width:2\"/>\n    <line x1=\"500\" y1=\"60\" x2=\"370\" y2=\"90\" style=\"stroke:var(--muted);stroke-width:2\"/>\n    <line x1=\"500\" y1=\"60\" x2=\"620\" y2=\"90\" style=\"stroke:var(--muted);stroke-width:2\"/>\n    <line x1=\"825\" y1=\"60\" x2=\"870\" y2=\"90\" style=\"stroke:var(--muted);stroke-width:2\"/>\n    <rect x=\"20\" y=\"90\" width=\"210\" height=\"62\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"125\" y=\"116\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--navy)\">Tickets<\/text>\n    <text x=\"125\" y=\"140\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--ink)\">3 from Fabrikam Legal<\/text>\n    <rect x=\"265\" y=\"90\" width=\"210\" height=\"62\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"370\" y=\"116\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--navy)\">known-issues.xlsx<\/text>\n    <text x=\"370\" y=\"140\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--ink)\">KI-014<\/text>\n    <rect x=\"515\" y=\"90\" width=\"210\" height=\"62\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"620\" y=\"116\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--navy)\">Priya's note<\/text>\n    <text x=\"620\" y=\"140\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--ink)\">clear the temp folder<\/text>\n    <rect x=\"765\" y=\"90\" width=\"210\" height=\"62\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"870\" y=\"116\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--navy)\">Jira<\/text>\n    <text x=\"870\" y=\"140\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--ink)\">open items, now<\/text>\n  <\/g>\n  <g class=\"rv one\">\n    <rect x=\"300\" y=\"160\" width=\"400\" height=\"36\" rx=\"8\" style=\"fill:var(--bad-tint);stroke:var(--bad);stroke-width:2\"/>\n    <text x=\"500\" y=\"184\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:var(--bad)\">one search over one index ✗<\/text>\n  <\/g>\n<\/svg><\/div>\n\n**Ask:** which sources does Sam's question need?\n\n::: reveal Sources | #four .src\n**Tickets, the known-issues sheet, Priya's note and Jira.**\n:::\n\n::: reveal Can one search do it? | #four .one\n:::\n\n\n\n## Search it or ask it live?\n\nBack to the question from the first hour. Hold up the sources in your head: **which would you search, and which would you ask live?**\n\n<div class=\"diagram\" id=\"rate\"><svg viewBox=\"0 0 1000 230\" role=\"img\" aria-label=\"Contoso sources placed by how often they change, with a line between indexed and live\">\n  <defs><marker id=\"rt-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--ink)\"/><\/marker><\/defs>\n  <g>\n    <line x1=\"20\" y1=\"190\" x2=\"980\" y2=\"190\" style=\"stroke:var(--ink);stroke-width:2\" marker-end=\"url(#rt-a)\"/>\n    <text x=\"20\" y=\"218\" style=\"font-size:15px;fill:var(--muted)\">changes rarely<\/text>\n    <text x=\"975\" y=\"218\" text-anchor=\"end\" style=\"font-size:15px;fill:var(--muted)\">changes hourly<\/text>\n    <rect x=\"20\" y=\"40\" width=\"150\" height=\"40\" rx=\"20\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"95\" y=\"66\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">OneDrive notes<\/text>\n    <rect x=\"20\" y=\"100\" width=\"150\" height=\"40\" rx=\"20\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"95\" y=\"126\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">known-issues.xlsx<\/text>\n    <rect x=\"200\" y=\"70\" width=\"170\" height=\"40\" rx=\"20\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"285\" y=\"96\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">Content Hub SOPs<\/text>\n    <rect x=\"400\" y=\"40\" width=\"150\" height=\"40\" rx=\"20\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"475\" y=\"66\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">minutes<\/text>\n    <rect x=\"400\" y=\"100\" width=\"150\" height=\"40\" rx=\"20\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"475\" y=\"126\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">mail<\/text>\n    <rect x=\"740\" y=\"40\" width=\"150\" height=\"40\" rx=\"20\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/>\n    <text x=\"815\" y=\"66\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">tickets<\/text>\n    <rect x=\"800\" y=\"100\" width=\"150\" height=\"40\" rx=\"20\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/>\n    <text x=\"875\" y=\"126\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">Jira status<\/text>\n  <\/g>\n  <g class=\"rv cut\">\n    <line x1=\"640\" y1=\"20\" x2=\"640\" y2=\"180\" style=\"stroke:var(--orange);stroke-width:4;stroke-dasharray:10 6\"/>\n    <text x=\"620\" y=\"164\" text-anchor=\"end\" style=\"font-size:16px;font-weight:700;fill:var(--navy)\">← index it<\/text>\n    <text x=\"660\" y=\"164\" style=\"font-size:16px;font-weight:700;fill:var(--orange)\">ask it live →<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal The rule | #rate .cut\n**Text that changes slowly gets indexed. Facts that change quickly get asked live.**\n:::\n\n\n\n\n## Two lanes\n\n<div class=\"diagram\" id=\"lanes\"><svg viewBox=\"0 0 1000 280\" role=\"img\" aria-label=\"Two lanes: slow-changing text is ingested into an index and searched; Jira, tickets and config values are asked live through tools\">\n  <defs><marker id=\"ln-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--muted)\"/><\/marker><\/defs>\n  <g>\n    <rect x=\"780\" y=\"90\" width=\"200\" height=\"100\" rx=\"14\" style=\"fill:var(--card);stroke:var(--ink);stroke-width:3\"/>\n    <text x=\"880\" y=\"134\" text-anchor=\"middle\" style=\"font-size:20px;font-weight:700;fill:var(--ink)\">Assistant<\/text>\n    <text x=\"880\" y=\"160\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">at question time<\/text>\n  <\/g>\n  <g class=\"rv idx\">\n    <rect x=\"10\" y=\"10\" width=\"740\" height=\"120\" rx=\"12\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"26\" y=\"36\" style=\"font-size:15px;font-weight:700;fill:var(--navy)\">INDEX IT · slow-changing text<\/text>\n    <text x=\"26\" y=\"64\" style=\"font-size:15px;fill:var(--ink)\">Content Hub SOPs, designs, policies<\/text>\n    <text x=\"26\" y=\"88\" style=\"font-size:15px;fill:var(--ink)\">minutes · mail threads · known-issues rows<\/text>\n    <text x=\"26\" y=\"112\" style=\"font-size:15px;fill:var(--ink)\">OneDrive notes (once moved to a shared place)<\/text>\n    <rect x=\"410\" y=\"44\" width=\"110\" height=\"60\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy)\"/>\n    <text x=\"465\" y=\"72\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">ingest<\/text>\n    <text x=\"465\" y=\"92\" text-anchor=\"middle\" style=\"font-size:12px;fill:var(--muted)\">nightly / delta<\/text>\n    <rect x=\"550\" y=\"44\" width=\"80\" height=\"60\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy)\"/>\n    <text x=\"590\" y=\"80\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">index<\/text>\n    <line x1=\"520\" y1=\"74\" x2=\"548\" y2=\"74\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#ln-a)\"/>\n    <line x1=\"630\" y1=\"74\" x2=\"778\" y2=\"120\" style=\"stroke:var(--navy);stroke-width:3\" marker-end=\"url(#ln-a)\"/>\n    <text x=\"700\" y=\"80\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:13px;fill:var(--navy)\">search_docs<\/text>\n  <\/g>\n  <g class=\"rv live\">\n    <rect x=\"10\" y=\"150\" width=\"740\" height=\"120\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"26\" y=\"176\" style=\"font-size:15px;font-weight:700;fill:var(--orange)\">ASK IT LIVE · fast-changing, structured<\/text>\n    <text x=\"26\" y=\"204\" style=\"font-size:15px;fill:var(--ink)\">Jira status<\/text>\n    <text x=\"26\" y=\"228\" style=\"font-size:15px;fill:var(--ink)\">tickets for a tenant<\/text>\n    <text x=\"26\" y=\"252\" style=\"font-size:15px;fill:var(--ink)\">current config values<\/text>\n    <line x1=\"420\" y1=\"210\" x2=\"778\" y2=\"164\" style=\"stroke:var(--orange);stroke-width:3\" marker-end=\"url(#ln-a)\"/>\n    <text x=\"560\" y=\"214\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:13px;fill:var(--orange)\">jira_search · find_tickets<\/text>\n    <text x=\"560\" y=\"238\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--muted)\">no copy: asked at question time<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal Index it | #lanes .idx\n:::\n::: reveal Ask it live | #lanes .live\n:::\n\n\n", "content/agentic-and-beyond/workflow-to-agent.md": "# From workflow to agent\n\n## Overview\n\n**Goal:** Tell a RAG workflow (search runs every time, the model fills the last step) from agentic retrieval (search is a set of tools and the model decides which to call).\n\n**Walk out with:** the agent run for Sam's question: three tool calls, one answer citing all of them, and its price.\n\n\n## Workflow or agent?\n\n<div class=\"diagram\" id=\"wfa\"><svg viewBox=\"0 0 1000 270\" role=\"img\" aria-label=\"Left: a workflow, question to search to prompt to answer. Right: an agent, a model that calls search_docs, find_tickets and jira_search in a loop\">\n  <defs><marker id=\"wf-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--muted)\"/><\/marker><marker id=\"wf-o\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--orange)\"/><\/marker><\/defs>\n  <g>\n    <text x=\"10\" y=\"22\" style=\"font-size:15px;font-weight:700;fill:var(--navy)\">WORKFLOW (SO FAR)<\/text>\n    <rect x=\"10\" y=\"60\" width=\"96\" height=\"60\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"58\" y=\"96\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">question<\/text>\n    <line x1=\"106\" y1=\"90\" x2=\"124\" y2=\"90\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#wf-a)\"/>\n    <rect x=\"128\" y=\"60\" width=\"96\" height=\"60\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"176\" y=\"96\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">search<\/text>\n    <line x1=\"224\" y1=\"90\" x2=\"242\" y2=\"90\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#wf-a)\"/>\n    <rect x=\"246\" y=\"60\" width=\"96\" height=\"60\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"294\" y=\"96\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">prompt<\/text>\n    <line x1=\"342\" y1=\"90\" x2=\"360\" y2=\"90\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#wf-a)\"/>\n    <rect x=\"364\" y=\"60\" width=\"106\" height=\"60\" rx=\"8\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"417\" y=\"88\" text-anchor=\"middle\" style=\"font-size:15px;font-weight:700;fill:var(--ink)\">answer<\/text>\n    <text x=\"417\" y=\"108\" text-anchor=\"middle\" style=\"font-size:12px;fill:var(--muted)\">the model<\/text>\n    <text x=\"240\" y=\"160\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">Every question runs the same path.<\/text>\n    <text x=\"240\" y=\"184\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">The model only fills the last step.<\/text>\n    <line x1=\"500\" y1=\"10\" x2=\"500\" y2=\"260\" style=\"stroke:var(--line);stroke-width:2\"/>\n  <\/g>\n  <g class=\"rv ag\">\n    <text x=\"520\" y=\"22\" style=\"font-size:15px;font-weight:700;fill:var(--orange)\">AGENT<\/text>\n    <rect x=\"680\" y=\"100\" width=\"140\" height=\"64\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:3\"/>\n    <text x=\"750\" y=\"130\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--ink)\">model<\/text>\n    <text x=\"750\" y=\"152\" text-anchor=\"middle\" style=\"font-size:12px;fill:var(--muted)\">decides<\/text>\n    <rect x=\"520\" y=\"200\" width=\"150\" height=\"40\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"595\" y=\"225\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:13px;fill:var(--ink)\">search_docs<\/text>\n    <rect x=\"680\" y=\"210\" width=\"140\" height=\"40\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"750\" y=\"235\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:13px;fill:var(--ink)\">find_tickets<\/text>\n    <rect x=\"830\" y=\"200\" width=\"150\" height=\"40\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"905\" y=\"225\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:13px;fill:var(--ink)\">jira_search<\/text>\n    <line x1=\"700\" y1=\"164\" x2=\"610\" y2=\"198\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#wf-a)\"/>\n    <line x1=\"750\" y1=\"164\" x2=\"750\" y2=\"208\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#wf-a)\"/>\n    <line x1=\"800\" y1=\"164\" x2=\"890\" y2=\"198\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#wf-a)\"/>\n    <path d=\"M 820 112 C 900 70 900 40 820 40 L 690 40 C 620 40 620 80 678 108\" style=\"fill:none;stroke:var(--orange);stroke-width:2;stroke-dasharray:6 4\" marker-end=\"url(#wf-o)\"/>\n    <text x=\"750\" y=\"34\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--orange)\">search again until it can answer<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal The agent | #wfa .ag\n**Search becomes a set of tools.** The model decides which to call, with what, and whether to search again.\n:::\n\n\n\n\n## The run: three tool calls\n\nSam's question: *\"Has Fabrikam Legal reported this before, what did we do, and is anything open?\"*\n\n<div class=\"diagram\" id=\"run\"><svg viewBox=\"0 0 1000 260\" role=\"img\" aria-label=\"Three tool calls and their results, then the answer citing all of them\">\n  <g>\n    <rect x=\"10\" y=\"4\" width=\"980\" height=\"34\" rx=\"6\" style=\"fill:var(--navy)\"/>\n    <text x=\"22\" y=\"27\" style=\"font-size:15px;font-weight:700;fill:#fff\">#<\/text>\n    <text x=\"56\" y=\"27\" style=\"font-size:15px;font-weight:700;fill:#fff\">The model calls<\/text>\n    <text x=\"660\" y=\"27\" style=\"font-size:15px;font-weight:700;fill:#fff\">Our code returns<\/text>\n  <\/g>\n  <g class=\"rv t1\">\n    <rect x=\"10\" y=\"42\" width=\"980\" height=\"46\" rx=\"6\" style=\"fill:var(--navy-tint)\"/>\n    <text x=\"22\" y=\"71\" style=\"font-size:16px;font-weight:700;fill:var(--navy)\">1<\/text>\n    <text x=\"56\" y=\"71\" style=\"font-family:var(--mono);font-size:14px;fill:var(--ink)\">find_tickets(\"Fabrikam Legal\")<\/text>\n    <text x=\"660\" y=\"71\" style=\"font-size:15px;fill:var(--ink)\">3 earlier tickets: 2026-04, -07, -09<\/text>\n  <\/g>\n  <g class=\"rv t2\">\n    <rect x=\"10\" y=\"92\" width=\"980\" height=\"46\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/>\n    <text x=\"22\" y=\"121\" style=\"font-size:16px;font-weight:700;fill:var(--navy)\">2<\/text>\n    <text x=\"56\" y=\"121\" style=\"font-family:var(--mono);font-size:14px;fill:var(--ink)\">search_docs(\"search returns nothing\", platform=\"Content Hub\")<\/text>\n    <text x=\"660\" y=\"121\" style=\"font-size:15px;fill:var(--ink)\">KI-014 and Priya's note<\/text>\n  <\/g>\n  <g class=\"rv t3\">\n    <rect x=\"10\" y=\"142\" width=\"980\" height=\"46\" rx=\"6\" style=\"fill:var(--navy-tint)\"/>\n    <text x=\"22\" y=\"171\" style=\"font-size:16px;font-weight:700;fill:var(--navy)\">3<\/text>\n    <text x=\"56\" y=\"171\" style=\"font-family:var(--mono);font-size:14px;fill:var(--ink)\">jira_search(\"text ~ Fabrikam AND status != Done\")<\/text>\n    <text x=\"660\" y=\"171\" style=\"font-size:15px;fill:var(--ink)\">nothing open<\/text>\n  <\/g>\n  <g class=\"rv t4\">\n    <rect x=\"10\" y=\"194\" width=\"980\" height=\"62\" rx=\"8\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"22\" y=\"219\" style=\"font-size:16px;font-weight:700;fill:var(--orange)\">4<\/text>\n    <text x=\"56\" y=\"219\" style=\"font-size:14px;fill:var(--ink)\">Yes, three times this year [tickets]. Each time: restart the index worker and re-queue [KI-014];<\/text>\n    <text x=\"56\" y=\"241\" style=\"font-size:14px;fill:var(--ink)\">if that fails, clear the worker's temp folder first [Priya's note]. Nothing is open [Jira].<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal Call 1 | #run .t1\n:::\n::: reveal Call 2 | #run .t2\n:::\n::: reveal Call 3 | #run .t3\n:::\n::: reveal The answer | #run .t4\n**The price:** more calls, more tokens, less predictable.\n:::\n\n\n\n## Demo: agentic\n\n<div class=\"diagram\"><iframe src=\"content/rag-assets/demos/agentic.html\" style=\"width:100%;height:600px;border:0\" loading=\"lazy\"><\/iframe><\/div>\n\n\n", "content/agentic-and-beyond/graph-and-multimodal.md": "# Graphs and pictures\n\n## Overview\n\n**Goal:** Recognise two questions plain text search can't answer well: questions about connections (GraphRAG) and questions whose answer is in a picture (multimodal RAG).\n\n**Walk out with:** one Contoso example of each, and what each one costs.\n\n\n## A graph of what's connected\n\nThe 02:14 alert from last night, as things and the links between them:\n\n<div class=\"diagram\" id=\"graph\"><svg viewBox=\"0 0 1000 190\" role=\"img\" aria-label=\"Entity graph: tenant Fabrikam Legal, server CH-07, alert 7f3a-91c2, known issue KI-022, SOP-CH-07\">\n  <defs><marker id=\"gr-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--navy)\"/><\/marker><\/defs>\n  <g>\n    <text x=\"85\" y=\"44\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:700;fill:var(--muted)\">TENANT<\/text>\n    <ellipse cx=\"85\" cy=\"90\" rx=\"78\" ry=\"34\" style=\"fill:var(--navy);stroke:var(--navy)\"/>\n    <text x=\"85\" y=\"96\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:#fff\">Fabrikam Legal<\/text>\n  <\/g>\n  <g class=\"rv n2\">\n    <line x1=\"163\" y1=\"90\" x2=\"222\" y2=\"90\" style=\"stroke:var(--navy);stroke-width:2\" marker-end=\"url(#gr-a)\"/>\n    <text x=\"192\" y=\"140\" text-anchor=\"middle\" style=\"font-size:13px;font-style:italic;fill:var(--muted)\">stored on<\/text>\n    <text x=\"300\" y=\"44\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:700;fill:var(--muted)\">SERVER<\/text>\n    <ellipse cx=\"300\" cy=\"90\" rx=\"74\" ry=\"34\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"300\" y=\"96\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--navy)\">CH-07<\/text>\n  <\/g>\n  <g class=\"rv n3\">\n    <line x1=\"374\" y1=\"90\" x2=\"428\" y2=\"90\" style=\"stroke:var(--navy);stroke-width:2\" marker-end=\"url(#gr-a)\"/>\n    <text x=\"401\" y=\"140\" text-anchor=\"middle\" style=\"font-size:13px;font-style:italic;fill:var(--muted)\">raised<\/text>\n    <text x=\"505\" y=\"44\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:700;fill:var(--muted)\">ALERT<\/text>\n    <ellipse cx=\"505\" cy=\"90\" rx=\"74\" ry=\"34\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"505\" y=\"96\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:15px;font-weight:700;fill:var(--navy)\">7f3a-91c2<\/text>\n  <\/g>\n  <g class=\"rv n4\">\n    <line x1=\"579\" y1=\"90\" x2=\"633\" y2=\"90\" style=\"stroke:var(--navy);stroke-width:2\" marker-end=\"url(#gr-a)\"/>\n    <text x=\"606\" y=\"140\" text-anchor=\"middle\" style=\"font-size:13px;font-style:italic;fill:var(--muted)\">matches<\/text>\n    <text x=\"710\" y=\"44\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:700;fill:var(--muted)\">KNOWN ISSUE<\/text>\n    <ellipse cx=\"710\" cy=\"90\" rx=\"74\" ry=\"34\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"710\" y=\"96\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--ink)\">KI-022<\/text>\n  <\/g>\n  <g class=\"rv n5\">\n    <line x1=\"784\" y1=\"90\" x2=\"838\" y2=\"90\" style=\"stroke:var(--navy);stroke-width:2\" marker-end=\"url(#gr-a)\"/>\n    <text x=\"811\" y=\"140\" text-anchor=\"middle\" style=\"font-size:13px;font-style:italic;fill:var(--muted)\">handled by<\/text>\n    <text x=\"915\" y=\"44\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:700;fill:var(--muted)\">SOP<\/text>\n    <ellipse cx=\"915\" cy=\"90\" rx=\"78\" ry=\"34\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"915\" y=\"96\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:var(--navy)\">SOP-CH-07<\/text>\n  <\/g>\n  <g class=\"rv src\">\n    <text x=\"500\" y=\"178\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">each node and link extracted by a model from tickets, alert mails, the sheet and the SOPs<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal Server | #graph .n2\n:::\n::: reveal Alert | #graph .n3\n:::\n::: reveal Known issue | #graph .n4\n:::\n::: reveal SOP | #graph .n5\n:::\n::: reveal Where it comes from | #graph .src\n**GraphRAG:** entities and relations are extracted from the documents and stored as a graph.\n:::\n\n\n\n## Follow the edges\n\n**Ask:** \"Which tenants were hit by KI-022?\" Why can't vector search answer this well?\n\n<div class=\"diagram\" id=\"walk\"><svg viewBox=\"0 0 1000 230\" role=\"img\" aria-label=\"Walking back from KI-022 through alerts and servers to the tenants\">\n  <g>\n    <text x=\"90\" y=\"20\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:700;fill:var(--muted)\">TENANTS<\/text>\n    <text x=\"360\" y=\"20\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:700;fill:var(--muted)\">SERVERS<\/text>\n    <text x=\"630\" y=\"20\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:700;fill:var(--muted)\">ALERTS<\/text>\n    <text x=\"890\" y=\"20\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:700;fill:var(--muted)\">KNOWN ISSUE<\/text>\n    <line x1=\"170\" y1=\"60\" x2=\"290\" y2=\"60\" style=\"stroke:var(--line);stroke-width:2\"/>\n    <line x1=\"170\" y1=\"130\" x2=\"290\" y2=\"60\" style=\"stroke:var(--line);stroke-width:2\"/>\n    <line x1=\"170\" y1=\"190\" x2=\"290\" y2=\"160\" style=\"stroke:var(--line);stroke-width:2\"/>\n    <line x1=\"430\" y1=\"60\" x2=\"560\" y2=\"60\" style=\"stroke:var(--line);stroke-width:2\"/>\n    <line x1=\"430\" y1=\"60\" x2=\"560\" y2=\"120\" style=\"stroke:var(--line);stroke-width:2\"/>\n    <line x1=\"430\" y1=\"160\" x2=\"560\" y2=\"180\" style=\"stroke:var(--line);stroke-width:2\"/>\n    <line x1=\"700\" y1=\"60\" x2=\"820\" y2=\"110\" style=\"stroke:var(--line);stroke-width:2\"/>\n    <line x1=\"700\" y1=\"120\" x2=\"820\" y2=\"110\" style=\"stroke:var(--line);stroke-width:2\"/>\n    <line x1=\"700\" y1=\"180\" x2=\"820\" y2=\"110\" style=\"stroke:var(--line);stroke-width:2\"/>\n    <rect x=\"10\" y=\"40\" width=\"160\" height=\"40\" rx=\"20\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"90\" y=\"66\" text-anchor=\"middle\" style=\"font-size:15px;font-weight:700;fill:var(--navy)\">Fabrikam Legal<\/text>\n    <rect x=\"10\" y=\"110\" width=\"160\" height=\"40\" rx=\"20\" style=\"fill:var(--card);stroke:var(--line);stroke-dasharray:5 4\"/>\n    <text x=\"90\" y=\"136\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--muted)\">tenant …<\/text>\n    <rect x=\"10\" y=\"170\" width=\"160\" height=\"40\" rx=\"20\" style=\"fill:var(--card);stroke:var(--line);stroke-dasharray:5 4\"/>\n    <text x=\"90\" y=\"196\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--muted)\">tenant …<\/text>\n    <rect x=\"290\" y=\"40\" width=\"140\" height=\"40\" rx=\"20\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"360\" y=\"66\" text-anchor=\"middle\" style=\"font-size:15px;font-weight:700;fill:var(--navy)\">CH-07<\/text>\n    <rect x=\"290\" y=\"140\" width=\"140\" height=\"40\" rx=\"20\" style=\"fill:var(--card);stroke:var(--line);stroke-dasharray:5 4\"/>\n    <text x=\"360\" y=\"166\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--muted)\">server …<\/text>\n    <rect x=\"560\" y=\"40\" width=\"140\" height=\"40\" rx=\"20\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"630\" y=\"66\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:14px;font-weight:700;fill:var(--navy)\">7f3a-91c2<\/text>\n    <rect x=\"560\" y=\"100\" width=\"140\" height=\"40\" rx=\"20\" style=\"fill:var(--card);stroke:var(--line);stroke-dasharray:5 4\"/>\n    <text x=\"630\" y=\"126\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--muted)\">alert …<\/text>\n    <rect x=\"560\" y=\"160\" width=\"140\" height=\"40\" rx=\"20\" style=\"fill:var(--card);stroke:var(--line);stroke-dasharray:5 4\"/>\n    <text x=\"630\" y=\"186\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--muted)\">alert …<\/text>\n    <rect x=\"820\" y=\"90\" width=\"140\" height=\"40\" rx=\"20\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"890\" y=\"116\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:var(--ink)\">KI-022<\/text>\n  <\/g>\n  <g class=\"rv path\">\n    <line x1=\"820\" y1=\"110\" x2=\"700\" y2=\"60\" style=\"stroke:var(--orange);stroke-width:4\"/>\n    <line x1=\"820\" y1=\"110\" x2=\"700\" y2=\"120\" style=\"stroke:var(--orange);stroke-width:4\"/>\n    <line x1=\"820\" y1=\"110\" x2=\"700\" y2=\"180\" style=\"stroke:var(--orange);stroke-width:4\"/>\n    <line x1=\"560\" y1=\"60\" x2=\"430\" y2=\"60\" style=\"stroke:var(--orange);stroke-width:4\"/>\n    <line x1=\"560\" y1=\"120\" x2=\"430\" y2=\"60\" style=\"stroke:var(--orange);stroke-width:4\"/>\n    <line x1=\"560\" y1=\"180\" x2=\"430\" y2=\"160\" style=\"stroke:var(--orange);stroke-width:4\"/>\n    <line x1=\"290\" y1=\"60\" x2=\"170\" y2=\"60\" style=\"stroke:var(--orange);stroke-width:4\"/>\n    <line x1=\"290\" y1=\"60\" x2=\"170\" y2=\"130\" style=\"stroke:var(--orange);stroke-width:4\"/>\n    <line x1=\"290\" y1=\"160\" x2=\"170\" y2=\"190\" style=\"stroke:var(--orange);stroke-width:4\"/>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal Answer | #walk .path\n**No single passage lists them.** Follow the edges back from KI-022.\n:::\n\n::: reveal The price\n**Costly to build and to keep current.**\n:::\n\n\n\n## Scans and screenshots\n\n**Ask:** Capture's blurry scans and failed-OCR pages are Confidential. A model has to *look* at them. Where must it run?\n\n<div class=\"diagram\" id=\"mm\"><svg viewBox=\"0 0 1000 230\" role=\"img\" aria-label=\"A blurry Capture scan goes to a vision model running on-premise; the page is retrieved as an image\">\n  <defs><marker id=\"mm-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--muted)\"/><\/marker><\/defs>\n  <g>\n    <rect x=\"60\" y=\"30\" width=\"130\" height=\"170\" rx=\"4\" style=\"fill:var(--card);stroke:var(--ink);stroke-width:2\"/>\n    <line x1=\"78\" y1=\"60\" x2=\"172\" y2=\"60\" style=\"stroke:var(--muted);stroke-width:5;opacity:.5\"/>\n    <line x1=\"78\" y1=\"80\" x2=\"160\" y2=\"82\" style=\"stroke:var(--muted);stroke-width:5;opacity:.4\"/>\n    <line x1=\"78\" y1=\"100\" x2=\"168\" y2=\"98\" style=\"stroke:var(--muted);stroke-width:5;opacity:.5\"/>\n    <line x1=\"78\" y1=\"120\" x2=\"150\" y2=\"121\" style=\"stroke:var(--muted);stroke-width:5;opacity:.3\"/>\n    <rect x=\"78\" y=\"138\" width=\"94\" height=\"40\" style=\"fill:var(--navy-tint);stroke:var(--muted)\"/>\n    <rect x=\"70\" y=\"80\" width=\"112\" height=\"30\" rx=\"4\" transform=\"rotate(-12 126 95)\" style=\"fill:none;stroke:var(--bad);stroke-width:3\"/>\n    <text x=\"126\" y=\"101\" text-anchor=\"middle\" transform=\"rotate(-12 126 95)\" style=\"font-size:14px;font-weight:700;fill:var(--bad)\">OCR FAILED<\/text>\n    <text x=\"125\" y=\"222\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">Capture scan<\/text>\n    <line x1=\"200\" y1=\"115\" x2=\"320\" y2=\"115\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#mm-a)\"/>\n    <text x=\"260\" y=\"104\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--muted)\">page image<\/text>\n    <rect x=\"330\" y=\"70\" width=\"220\" height=\"90\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"440\" y=\"108\" text-anchor=\"middle\" style=\"font-size:18px;font-weight:700;fill:var(--ink)\">vision model<\/text>\n    <text x=\"440\" y=\"134\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">reads the page<\/text>\n    <line x1=\"550\" y1=\"115\" x2=\"660\" y2=\"115\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#mm-a)\"/>\n    <rect x=\"670\" y=\"70\" width=\"280\" height=\"90\" rx=\"12\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"810\" y=\"104\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:var(--navy)\">answer + the page<\/text>\n    <text x=\"810\" y=\"130\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">retrieved as an image, cited<\/text>\n  <\/g>\n  <g class=\"rv local\">\n    <rect x=\"20\" y=\"10\" width=\"560\" height=\"214\" rx=\"16\" style=\"fill:none;stroke:var(--navy);stroke-width:3;stroke-dasharray:10 6\"/>\n    <rect x=\"330\" y=\"180\" width=\"236\" height=\"32\" rx=\"16\" style=\"fill:var(--navy)\"/>\n    <text x=\"448\" y=\"202\" text-anchor=\"middle\" style=\"font-size:14px;font-weight:700;fill:#fff\">on-premise · local model<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal Answer | #mm .local\n**On-premise.** The documents are Confidential, so the vision model is local.\n:::\n\n\n\n## Close\n\n**Ask:** back to Sam's Fabrikam Legal question. What made it need an agent?\n\n::: reveal Answer\n**More than one search, in different places, one of them live.** The model chose the searches.\n:::\n\n> *When the question needs more than one search, let the model choose the searches.*\n\n\n---\n"}, "css": ["viewer/student.css", "viewer/theme.css"]};</script>
