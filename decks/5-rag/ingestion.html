-weight=\"400\" style=\"fill:var(--muted)\">definitions<\/text>\n<rect x=\"332\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"404\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">Conversation<\/text>\n<text x=\"404\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">so far<\/text>\n<rect x=\"488\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:3\"/>\n<text x=\"560\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--ink)\">Retrieved<\/text>\n<text x=\"560\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--ink)\">context<\/text>\n<g>\n<path d=\"M560 142 L560 166\" style=\"stroke:var(--orange);stroke-width:2\"/>\n<text x=\"560\" y=\"188\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">today: how the<\/text>\n<text x=\"560\" y=\"211\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">chunks are made<\/text>\n<\/g>\n<rect x=\"644\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"716\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">New<\/text>\n<text x=\"716\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">message<\/text>\n<rect x=\"858\" y=\"46\" width=\"134\" height=\"94\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"925\" y=\"100\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">Response<\/text>\n<\/svg><\/div>\n\n\n## Right SOP, wrong step\n\n> Sam asks the assistant: *\"Search returns nothing for Fabrikam Legal on Content Hub, what do I check?\"* The answer: **step 5 of SOP-CH-03: escalate.** Not the index check in step 3.\n\n**Ask:** It found the right SOP. So why the wrong step? Write down your guess.\n\n::: reveal Answer\n**The SOP was cut badly.** Step 3 sat in a chunk that never mentions \"search returns nothing\".\n:::\n\n\n## Where step 3 went\n\n<div class=\"diagram\" id=\"sop-cut\"><svg viewBox=\"0 0 1000 300\" font-family=\"system-ui,sans-serif\" style=\"max-height:360px\">\n<text x=\"10\" y=\"24\" font-size=\"18\" font-weight=\"700\" style=\"fill:var(--navy)\">SOP-CH-03 \"Search issue triage\", cut every 200 tokens<\/text>\n<g style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"><rect x=\"10\" y=\"44\" width=\"150\" height=\"70\" rx=\"6\"/><rect x=\"170\" y=\"44\" width=\"230\" height=\"70\" rx=\"6\"/><rect x=\"410\" y=\"44\" width=\"230\" height=\"70\" rx=\"6\"/><rect x=\"650\" y=\"44\" width=\"170\" height=\"70\" rx=\"6\"/><rect x=\"830\" y=\"44\" width=\"160\" height=\"70\" rx=\"6\"/><\/g>\n<g font-size=\"17\" text-anchor=\"middle\" style=\"fill:var(--ink)\"><text x=\"85\" y=\"85\">1 Scope<\/text><text x=\"285\" y=\"85\">2 First checks<\/text><text x=\"525\" y=\"85\">3 Index checks<\/text><text x=\"735\" y=\"85\">4 Index workers<\/text><text x=\"910\" y=\"85\">5 Escalation<\/text><\/g>\n<g class=\"rv c-cut\">\n<path d=\"M290 36 L290 124\" style=\"stroke:var(--bad);stroke-width:3;stroke-dasharray:6 4\"/><path d=\"M525 36 L525 124\" style=\"stroke:var(--bad);stroke-width:3;stroke-dasharray:6 4\"/><path d=\"M780 36 L780 124\" style=\"stroke:var(--bad);stroke-width:3;stroke-dasharray:6 4\"/>\n<g style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"><rect x=\"10\" y=\"150\" width=\"270\" height=\"56\" rx=\"6\"/><rect x=\"300\" y=\"150\" width=\"215\" height=\"56\" rx=\"6\"/><rect x=\"535\" y=\"150\" width=\"235\" height=\"56\" rx=\"6\"/><rect x=\"790\" y=\"150\" width=\"200\" height=\"56\" rx=\"6\"/><\/g>\n<g font-size=\"16\" text-anchor=\"middle\" style=\"fill:var(--ink)\"><text x=\"145\" y=\"184\">chunk text-anchor=\"middle\" font-size=\"21\" font-weight=\"700\" style=\"fill:#fff\">Parser<\/text>\n<g style=\"stroke:var(--line);stroke-width:2\"><path d=\"M214 32 L298 120\"/><path d=\"M214 86 L298 130\"/><path d=\"M214 140 L298 140\"/><path d=\"M214 194 L298 150\"/><path d=\"M214 248 L298 160\"/><\/g>\n<g class=\"rv p-bad\">\n<path d=\"M484 140 L560 70\" style=\"stroke:var(--bad);stroke-width:3\"/>\n<rect x=\"565\" y=\"20\" width=\"425\" height=\"110\" rx=\"10\" style=\"fill:var(--bad-tint);stroke:var(--bad);stroke-width:2\"/>\n<text x=\"580\" y=\"52\" font-size=\"16\" style=\"fill:var(--ink);font-family:var(--mono)\">Page 3 of 9 CONFIDENTIAL Index checks<\/text>\n<text x=\"580\" y=\"78\" font-size=\"16\" style=\"fill:var(--ink);font-family:var(--mono)\">KI-014 Content Hub Search returns…<\/text>\n<text x=\"580\" y=\"104\" font-size=\"16\" style=\"fill:var(--ink);font-family:var(--mono)\">&gt; &gt; &gt; Could you confirm whether…<\/text>\n<text x=\"975\" y=\"124\" text-anchor=\"end\" font-size=\"15\" style=\"fill:var(--bad)\">soup<\/text>\n<\/g>\n<g class=\"rv p-good\">\n<path d=\"M484 140 L560 210\" style=\"stroke:var(--good);stroke-width:3\"/>\n<rect x=\"565\" y=\"160\" width=\"425\" height=\"120\" rx=\"10\" style=\"fill:var(--good-tint);stroke:var(--good);stroke-width:2\"/>\n<text x=\"580\" y=\"192\" font-size=\"16\" style=\"fill:var(--ink)\">§3 Index checks: open the index queue…<\/text>\n<text x=\"580\" y=\"218\" font-size=\"16\" style=\"fill:var(--ink)\">Known issue KI-014. Platform: Content Hub…<\/text>\n<text x=\"580\" y=\"244\" font-size=\"16\" style=\"fill:var(--ink)\">From vendor A, 2026-09-30: no on-prem parser…<\/text>\n<text x=\"975\" y=\"272\" text-anchor=\"end\" font-size=\"15\" style=\"fill:var(--good)\">clean text, one unit each<\/text>\n<\/g>\n<\/svg><\/div>\n\n::: reveal Parsed blindly | #parse .p-bad\n:::\n::: reveal Parsed per source | #parse .p-good\n:::\n\n\n## Documents and sheets\n\n| Source | What goes wrong | What to do |\n|---|---|---|\n| SOP as PDF | Headers and footers on every page; two columns read across | Strip headers; read by layout |\n| Design in Word | Headings are just bold text; tables jumble | Real heading styles; keep tables whole |\n| `known-issues.xlsx` | A row becomes words without column names | One chunk per row, with column names written in |\n\n**Ask:** SD-LOG-01 is a Word draft where the headings are just bold text. What does a heading-aware chunker do with it?\n\n::: reveal Answer\n**Nothing useful.** It sees no headings, so it falls back to paragraphs or size. Fix the document's heading styles, or the chunks lose their structure.\n:::\n\n\n## Mail, notes, minutes, logs\n\n| Source | What goes wrong | What to do |\n|---|---|---|\n| Email | Quoted replies repeat the thread four times; signatures; disclaimers | One chunk per message, quoted text and signatures stripped |\n| OneDrive note | Informal, no headings, no date in the text | Take the date and owner from the file's metadata |\n| Minutes | All look alike | Keep date and stream as metadata |\n| Logs | Long lines, IDs | Keep the document ID; never cut mid-line |\n\n\n\n## Demo: the vendor A thread\n\n<div class=\"diagram\"><iframe src=\"content/rag-assets/demos/chunker.html?preset=mail\" style=\"width:100%;height:600px;border:0\" loading=\"lazy\"><\/iframe><\/div>\n\n\n## The row, written out\n\n<div class=\"diagram\" id=\"row\"><svg viewBox=\"0 0 1000 280\" font-family=\"system-ui,sans-serif\" style=\"max-height:340px\">\n<g font-size=\"15\" text-anchor=\"middle\">\n<g style=\"fill:var(--navy)\"><rect x=\"10\" y=\"10\" width=\"110\" height=\"34\"/><rect x=\"122\" y=\"10\" width=\"140\" height=\"34\"/><rect x=\"264\" y=\"10\" width=\"210\" height=\"34\"/><rect x=\"476\" y=\"10\" width=\"190\" height=\"34\"/><rect x=\"668\" y=\"10\" width=\"160\" height=\"34\"/><rect x=\"830\" y=\"10\" width=\"160\" height=\"34\"/><\/g>\n<g style=\"fill:#fff\"><text x=\"65\" y=\"33\">ID<\/text><text x=\"192\" y=\"33\">Platform<\/text><text x=\"369\" y=\"33\">Symptom<\/text><text x=\"571\" y=\"33\">Cause<\/text><text x=\"748\" y=\"33\">Check<\/text><text x=\"910\" y=\"33\">Fix<\/text><\/g>\n<g style=\"fill:var(--card);stroke:var(--line)\"><rect x=\"10\" y=\"46\" width=\"110\" height=\"56\"/><rect x=\"122\" y=\"46\" width=\"140\" height=\"56\"/><rect x=\"264\" y=\"46\" width=\"210\" height=\"56\"/><rect x=\"476\" y=\"46\" width=\"190\" height=\"56\"/><rect x=\"668\" y=\"46\" width=\"160\" height=\"56\"/><rect x=\"830\" y=\"46\" width=\"160\" height=\"56\"/><\/g>\n<g style=\"fill:var(--ink)\"><text x=\"65\" y=\"79\">KI-014<\/text><text x=\"192\" y=\"79\">Content Hub<\/text><text x=\"369\" y=\"70\">Search returns nothing<\/text><text x=\"369\" y=\"92\">for one tenant<\/text><text x=\"571\" y=\"70\">Index job for the<\/text><text x=\"571\" y=\"92\">folder stalled<\/text><text x=\"748\" y=\"70\">Index queue;<\/text><text x=\"748\" y=\"92\">worker status<\/text><text x=\"910\" y=\"70\">Restart worker,<\/text><text x=\"910\" y=\"92\">re-queue folder<\/text><\/g>\n<\/g>\n<g class=\"rv r-bad\">\n<text x=\"10\" y=\"140\" font-size=\"17\" font-weight=\"700\" style=\"fill:var(--bad)\">Parsed blindly:<\/text>\n<text x=\"160\" y=\"140\" font-size=\"16\" style=\"fill:var(--ink);font-family:var(--mono)\">KI-014 Content Hub Search returns nothing for one tenant Index job…<\/text>\n<\/g>\n<g class=\"rv r-good\">\n<rect x=\"10\" y=\"160\" width=\"980\" height=\"110\" rx=\"10\" style=\"fill:var(--good-tint);stroke:var(--good);stroke-width:2\"/>\n<text x=\"26\" y=\"190\" font-size=\"17\" style=\"fill:var(--ink)\">Known issue KI-014. Platform: Content Hub. Symptom: search returns nothing for one tenant.<\/text>\n<text x=\"26\" y=\"218\" font-size=\"17\" style=\"fill:var(--ink)\">Cause: index job for that tenant's folder stalled. Check: index queue; index worker status.<\/text>\n<text x=\"26\" y=\"246\" font-size=\"17\" style=\"fill:var(--ink)\">Fix: restart the index worker, re-queue the folder.<\/text>\n<\/g>\n<\/svg><\/div>\n\n::: reveal Parsed blindly | #row .r-bad\n:::\n::: reveal Column names written in | #row .r-good\n:::\n\n\n", "content/ingestion/chunking.md": "# Chunking: where to cut\n\n\n## Overview\n\n**Goal:** Compare five ways to cut SOP-CH-03 and choose a size and overlap, or no size at all.\n\n**Walk out with:** structure beats size: cut on the document's own seams (sections, rows, messages) before you count tokens.\n\n\n## SOP-CH-03, cut five ways\n\n**Ask:** Five ways to cut a document: **fixed size**, **recursive**, **by sentence**, **semantic**, **hierarchical**. Which one keeps step 3 of SOP-CH-03 whole *and* findable? Vote with fingers, 1 to 5.\n\n::: reveal Answer\n**Recursive** (one chunk per section) keeps it whole. **Hierarchical** does that and more: search the paragraph, return the section. Fixed size is the one that broke it this morning.\n:::\n\n\n## Five chunkers side by side\n\n<div class=\"diagram\" id=\"chunkers\"><svg viewBox=\"0 0 1000 340\" font-family=\"system-ui,sans-serif\" style=\"max-height:400px\">\n<g font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--navy)\"><text x=\"100\" y=\"26\">Fixed size<\/text><text x=\"298\" y=\"26\">Recursive<\/text><text x=\"496\" y=\"26\">By sentence<\/text><text x=\"694\" y=\"26\">Semantic<\/text><text x=\"892\" y=\"26\">Hierarchical<\/text><\/g>\n<g class=\"rv k1\">\n<rect x=\"30\" y=\"40\" width=\"140\" height=\"60\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><rect x=\"30\" y=\"100\" width=\"140\" height=\"60\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/><rect x=\"30\" y=\"160\" width=\"140\" height=\"60\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><rect x=\"30\" y=\"220\" width=\"140\" height=\"60\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/>\n<path d=\"M20 160 L180 160\" style=\"stroke:var(--bad);stroke-width:4\"/><text x=\"100\" y=\"310\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--bad)\">step 3 cut in half<\/text>\n<\/g>\n<g class=\"rv k2\">\n<rect x=\"228\" y=\"40\" width=\"140\" height=\"30\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><rect x=\"228\" y=\"70\" width=\"140\" height=\"50\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/><rect x=\"228\" y=\"120\" width=\"140\" height=\"70\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><rect x=\"228\" y=\"190\" width=\"140\" height=\"50\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/><rect x=\"228\" y=\"240\" width=\"140\" height=\"40\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n<g font-size=\"14\" text-anchor=\"middle\" style=\"fill:var(--ink)\"><text x=\"298\" y=\"60\">§1<\/text><text x=\"298\" y=\"100\">§2<\/text><text x=\"298\" y=\"160\">§3<\/text><text x=\"298\" y=\"220\">§4<\/text><text x=\"298\" y=\"265\">§5<\/text><\/g>\n<text x=\"298\" y=\"310\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--good)\">one chunk per section<\/text>\n<\/g>\n<g class=\"rv k3\">\n<rect x=\"426\" y=\"40\" width=\"140\" height=\"20\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><rect x=\"426\" y=\"60\" width=\"140\" height=\"20\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/><rect x=\"426\" y=\"80\" width=\"140\" height=\"20\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><rect x=\"426\" y=\"100\" width=\"140\" height=\"20\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/><rect x=\"426\" y=\"120\" width=\"140\" height=\"20\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><rect x=\"426\" y=\"140\" width=\"140\" height=\"20\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/><rect x=\"426\" y=\"160\" width=\"140\" height=\"20\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><rect x=\"426\" y=\"180\" width=\"140\" height=\"20\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/><rect x=\"426\" y=\"200\" width=\"140\" height=\"20\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><rect x=\"426\" y=\"220\" width=\"140\" height=\"20\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/><rect x=\"426\" y=\"240\" width=\"140\" height=\"20\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><rect x=\"426\" y=\"260\" width=\"140\" height=\"20\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/>\n<path d=\"M416 140 L576 140\" style=\"stroke:var(--bad);stroke-width:4\"/><path d=\"M416 180 L576 180\" style=\"stroke:var(--bad);stroke-width:4\"/><text x=\"496\" y=\"310\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--bad)\">numbered steps break apart<\/text>\n<\/g>\n<g class=\"rv k4\">\n<rect x=\"624\" y=\"40\" width=\"140\" height=\"30\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><rect x=\"624\" y=\"70\" width=\"140\" height=\"50\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/><rect x=\"624\" y=\"120\" width=\"140\" height=\"120\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><rect x=\"624\" y=\"240\" width=\"140\" height=\"40\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/>\n<text x=\"694\" y=\"100\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--ink)\">first checks<\/text><text x=\"694\" y=\"180\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--ink)\">index checks<\/text>\n<text x=\"694\" y=\"310\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--ink)\">cuts where the topic shifts<\/text>\n<\/g>\n<g class=\"rv k5\">\n<rect x=\"822\" y=\"40\" width=\"140\" height=\"240\" rx=\"4\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"/>\n<rect x=\"832\" y=\"120\" width=\"120\" height=\"70\" rx=\"4\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n<rect x=\"842\" y=\"130\" width=\"100\" height=\"22\" style=\"fill:var(--card);stroke:var(--line)\"/><rect x=\"842\" y=\"158\" width=\"100\" height=\"22\" style=\"fill:var(--navy);stroke:var(--navy)\"/>\n<g style=\"fill:var(--navy-tint);stroke:var(--line)\"><rect x=\"832\" y=\"50\" width=\"120\" height=\"25\"/><rect x=\"832\" y=\"80\" width=\"120\" height=\"35\"/><rect x=\"832\" y=\"195\" width=\"120\" height=\"40\"/><rect x=\"832\" y=\"240\" width=\"120\" height=\"32\"/><\/g>\n<text x=\"892\" y=\"310\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--good)\">find paragraph, return §3<\/text>\n<\/g>\n<\/svg><\/div>\n\n::: reveal Fixed size | #chunkers .k1\n:::\n::: reveal Recursive | #chunkers .k2\n:::\n::: reveal By sentence | #chunkers .k3\n:::\n::: reveal Semantic | #chunkers .k4\n:::\n::: reveal Hierarchical | #chunkers .k5\n:::\n\n\n## What each does to SOP-CH-03\n\n<table id=\"chunk-table\">\n<thead><tr><th>Strategy<\/th><th>How it cuts<\/th><th>On SOP-CH-03<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Fixed size<\/td><td>Every 200 tokens<\/td><td class=\"rv t1\">Cuts step 3 in half; the second half has no heading<\/td><\/tr>\n<tr><td>Recursive<\/td><td>Headings, then paragraphs, then sentences, until under the size<\/td><td class=\"rv t2\">One chunk per section<\/td><\/tr>\n<tr><td>By sentence<\/td><td>Groups of N sentences<\/td><td class=\"rv t3\">Numbered steps break apart<\/td><\/tr>\n<tr><td>Semantic<\/td><td>New chunk where the topic shifts (embedding distance jumps)<\/td><td class=\"rv t4\">Splits \"first checks\" from \"index checks\" without a heading<\/td><\/tr>\n<tr><td>Hierarchical<\/td><td>Document → section → paragraph<\/td><td class=\"rv t5\">Search paragraphs, return the section<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n::: reveal Fixed | #chunk-table .t1\n:::\n::: reveal Recursive | #chunk-table .t2\n:::\n::: reveal Sentence | #chunk-table .t3\n:::\n::: reveal Semantic | #chunk-table .t4\n:::\n::: reveal Hierarchical | #chunk-table .t5\n:::\n\n\n## Demo: cut the SOP\n\n<div class=\"diagram\"><iframe src=\"content/rag-assets/demos/chunker.html?preset=sop-fixed\" style=\"width:100%;height:600px;border:0\" loading=\"lazy\"><\/iframe><\/div>\n\n\n\n## Small or large\n\n<div class=\"diagram\" id=\"size\"><svg viewBox=\"0 0 1000 230\" font-family=\"system-ui,sans-serif\" style=\"max-height:300px\">\n<g class=\"rv z1\">\n<text x=\"10\" y=\"28\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--navy)\">Small: 100–200 tokens<\/text>\n<rect x=\"10\" y=\"44\" width=\"460\" height=\"56\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"26\" y=\"78\" font-size=\"17\" style=\"fill:var(--ink)\">\"Restart the index worker.\"<\/text>\n<text x=\"10\" y=\"132\" font-size=\"17\" style=\"fill:var(--good)\">precise match<\/text>\n<text x=\"10\" y=\"158\" font-size=\"17\" style=\"fill:var(--bad)\">thin: restart it for what?<\/text>\n<\/g>\n<g class=\"rv z2\">\n<text x=\"530\" y=\"28\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--navy)\">Large: 800–1,500 tokens<\/text>\n<rect x=\"530\" y=\"44\" width=\"460\" height=\"170\" rx=\"8\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n<text x=\"546\" y=\"78\" font-size=\"16\" style=\"fill:var(--ink)\">§2 First checks … §3 Index checks … the index<\/text>\n<text x=\"546\" y=\"102\" font-size=\"16\" style=\"fill:var(--ink)\">queue … §4 Restart the index worker and re-queue<\/text>\n<text x=\"546\" y=\"126\" font-size=\"16\" style=\"fill:var(--ink)\">the folder … §5 Escalation …<\/text>\n<text x=\"546\" y=\"166\" font-size=\"17\" style=\"fill:var(--good)\">full context<\/text>\n<text x=\"546\" y=\"192\" font-size=\"17\" style=\"fill:var(--bad)\">diluted match; fewer fit in the prompt<\/text>\n<\/g>\n<\/svg><\/div>\n\n::: reveal Small | #size .z1\n:::\n::: reveal Large | #size .z2\n:::\n\n\n## Overlap\n\n<div class=\"diagram\" id=\"overlap\"><svg viewBox=\"0 0 1000 200\" font-family=\"system-ui,sans-serif\" style=\"max-height:270px\">\n<rect x=\"10\" y=\"30\" width=\"560\" height=\"70\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"26\" y=\"72\" font-size=\"17\" style=\"fill:var(--ink)\">chunk 2 … If items are waiting for more than<\/text>\n<rect x=\"430\" y=\"110\" width=\"560\" height=\"70\" rx=\"8\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n<text x=\"446\" y=\"152\" font-size=\"17\" style=\"fill:var(--ink)\">one hour, the index job is stalled. chunk 3 …<\/text>\n<g class=\"rv ov\">\n<rect x=\"430\" y=\"22\" width=\"140\" height=\"166\" rx=\"8\" style=\"fill:none;stroke:var(--good);stroke-width:4;stroke-dasharray:8 5\"/>\n<text x=\"700\" y=\"60\" font-size=\"18\" font-weight=\"700\" style=\"fill:var(--good)\">overlap 10–20%:<\/text>\n<text x=\"700\" y=\"86\" font-size=\"17\" style=\"fill:var(--ink)\">the cut sentence survives<\/text>\n<text x=\"700\" y=\"108\" font-size=\"17\" style=\"fill:var(--ink)\">whole in one chunk<\/text>\n<\/g>\n<\/svg><\/div>\n\n::: reveal Add overlap | #overlap .ov\n:::\n\n\n## A row is 60 tokens\n\n**Ask:** A `known-issues.xlsx` row is about 60 tokens. What chunk size should we use for the sheet? Write a number.\n\n::: reveal Answer\n**None.** One row is one chunk. **Structure beats size.**\n:::\n\n\n\n## Demo: cut the sheet\n\n<div class=\"diagram\"><iframe src=\"content/rag-assets/demos/chunker.html?preset=ki-fixed\" style=\"width:100%;height:600px;border:0\" loading=\"lazy\"><\/iframe><\/div>\n\n\n", "content/ingestion/context-and-metadata.md": "# Context and metadata\n\n\n## Overview\n\n**Goal:** Give each chunk its context (parent section, contextual prefix) and its metadata, and say what each one fixes.\n\n**Walk out with:** search small, return big; prefix the chunk with where it sits; label it with source, date, owner, access and data class.\n\n\n## Search small, return big\n\n<div class=\"diagram\" id=\"parent\"><svg viewBox=\"0 0 1000 300\" font-family=\"system-ui,sans-serif\" style=\"max-height:360px\">\n<rect x=\"10\" y=\"110\" width=\"200\" height=\"70\" rx=\"35\" style=\"fill:var(--navy);stroke:var(--navy)\"/>\n<text x=\"110\" y=\"141\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:#fff\">\"index queue<\/text>\n<text x=\"110\" y=\"163\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:#fff\">waiting an hour\"<\/text>\n<rect x=\"330\" y=\"20\" width=\"300\" height=\"260\" rx=\"12\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"480\" y=\"50\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" style=\"fill:var(--navy)\">SOP-CH-03 §3 Index checks<\/text>\n<g style=\"fill:var(--navy-tint);stroke:var(--line)\"><rect x=\"350\" y=\"70\" width=\"260\" height=\"56\" rx=\"6\"/><rect x=\"350\" y=\"206\" width=\"260\" height=\"56\" rx=\"6\"/><\/g>\n<rect x=\"350\" y=\"138\" width=\"260\" height=\"56\" rx=\"6\" style=\"fill:var(--navy-tint);stroke:var(--line)\"/>\n<g font-size=\"15\" text-anchor=\"middle\" style=\"fill:var(--ink)\"><text x=\"480\" y=\"103\">open the index queue…<\/text><text x=\"480\" y=\"171\">waiting more than 1 hour…<\/text><text x=\"480\" y=\"239\">check the worker status…<\/text><\/g>\n<g class=\"rv p1\">\n<path d=\"M214 145 L344 165\" style=\"stroke:var(--orange);stroke-width:3\"/>\n<rect x=\"350\" y=\"138\" width=\"260\" height=\"56\" rx=\"6\" style=\"fill:none;stroke:var(--orange);stroke-width:4\"/>\n<text x=\"270\" y=\"130\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" style=\"fill:var(--orange)\">1. match the child<\/text>\n<\/g>\n<g class=\"rv p2\">\n<rect x=\"326\" y=\"16\" width=\"308\" height=\"268\" rx=\"14\" style=\"fill:none;stroke:var(--good);stroke-width:4\"/>\n<path d=\"M638 150 L740 150\" style=\"stroke:var(--good);stroke-width:3\"/><path d=\"M740 142 L754 150 L740 158 Z\" style=\"fill:var(--good)\"/>\n<rect x=\"760\" y=\"100\" width=\"230\" height=\"100\" rx=\"12\" style=\"fill:var(--good-tint);stroke:var(--good);stroke-width:2\"/>\n<text x=\"875\" y=\"142\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" style=\"fill:var(--ink)\">2. send the parent<\/text>\n<text x=\"875\" y=\"168\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">all of section 3<\/text>\n<\/g>\n<\/svg><\/div>\n\n::: reveal Match the small chunk | #parent .p1\n:::\n::: reveal Return the parent | #parent .p2\n:::\n\n\n\n## Why not search the big one?\n\n**Ask:** If we're going to send all of section 3 anyway, why not just index section 3 as one chunk and search that?\n\n::: reveal Answer\n**Because a big chunk matches worse.** One paragraph about \"waiting more than one hour\" is a sharp match for that question; a whole section blends it with five other things. Parent-child gets the **sharp match** of the small chunk and the **full context** of the big one.\n:::\n\n\n\n## A chunk that forgot where it came from\n\n**Ask:** Here's one chunk from the index, exactly as stored:\n\n`Restart the index worker and re-queue the folder.`\n\nWhich platform? Which problem? Which SOP? Would Sam's question about Fabrikam Legal find it?\n\n::: reveal Answer\n**You can't tell, and neither can the search.** The chunk lost its heading, its document and its problem when it was cut.\n:::\n\n\n## Before and after the prefix\n\n<div class=\"diagram\" id=\"prefix\"><svg viewBox=\"0 0 1000 260\" font-family=\"system-ui,sans-serif\" style=\"max-height:330px\">\n<text x=\"10\" y=\"28\" font-size=\"18\" font-weight=\"700\" style=\"fill:var(--muted)\">Before<\/text>\n<rect x=\"10\" y=\"40\" width=\"980\" height=\"56\" rx=\"8\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"26\" y=\"75\" font-size=\"18\" style=\"fill:var(--ink)\">Restart the index worker and re-queue the folder.<\/text>\n<g class=\"rv x1\">\n<text x=\"10\" y=\"134\" font-size=\"18\" font-weight=\"700\" style=\"fill:var(--orange)\">After<\/text>\n<rect x=\"10\" y=\"146\" width=\"980\" height=\"104\" rx=\"8\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n<text x=\"26\" y=\"178\" font-size=\"17\" font-weight=\"700\" style=\"fill:var(--ink)\">From SOP-CH-03 \"Search issue triage\", section 4 Index workers: the fix when search<\/text>\n<text x=\"26\" y=\"204\" font-size=\"17\" font-weight=\"700\" style=\"fill:var(--ink)\">returns nothing for one tenant on Content Hub.<\/text>\n<text x=\"26\" y=\"232\" font-size=\"17\" style=\"fill:var(--ink)\">Restart the index worker and re-queue the folder.<\/text>\n<\/g>\n<\/svg><\/div>\n\n::: reveal Add the prefix | #prefix .x1\n:::\n\n\n\n## Paid once\n\n<div class=\"diagram\" id=\"once\"><svg viewBox=\"0 0 1000 250\" font-family=\"system-ui,sans-serif\" style=\"max-height:320px\">\n<text x=\"250\" y=\"26\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" style=\"fill:var(--navy)\">Ingestion: once per chunk<\/text>\n<text x=\"760\" y=\"26\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" style=\"fill:var(--navy)\">Question time: every question<\/text>\n<path d=\"M505 10 L505 240\" style=\"stroke:var(--line);stroke-width:2;stroke-dasharray:6 6\"/>\n<g style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"><rect x=\"10\" y=\"80\" width=\"130\" height=\"70\" rx=\"8\"/><rect x=\"180\" y=\"80\" width=\"140\" height=\"70\" rx=\"8\"/><rect x=\"360\" y=\"80\" width=\"130\" height=\"70\" rx=\"8\"/><\/g>\n<g font-size=\"16\" text-anchor=\"middle\" style=\"fill:var(--ink)\"><text x=\"75\" y=\"120\">chunk<\/text><text x=\"250\" y=\"110\">model writes<\/text><text x=\"250\" y=\"132\">the prefix<\/text><text x=\"425\" y=\"110\">embed and<\/text><text x=\"425\" y=\"132\">store<\/text><\/g>\n<path d=\"M142 115 L176 115\" style=\"stroke:var(--navy);stroke-width:2\"/><path d=\"M322 115 L356 115\" style=\"stroke:var(--navy);stroke-width:2\"/>\n<g class=\"rv o1\">\n<text x=\"250\" y=\"200\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--orange)\">cost: one model call per chunk<\/text>\n<\/g>\n<g style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"><rect x=\"540\" y=\"80\" width=\"130\" height=\"70\" rx=\"8\"/><rect x=\"700\" y=\"80\" width=\"130\" height=\"70\" rx=\"8\"/><rect x=\"860\" y=\"80\" width=\"130\" height=\"70\" rx=\"8\"/><\/g>\n<g font-size=\"16\" text-anchor=\"middle\" style=\"fill:var(--ink)\"><text x=\"605\" y=\"120\">question<\/text><text x=\"765\" y=\"120\">search<\/text><text x=\"925\" y=\"120\">answer<\/text><\/g>\n<g class=\"rv o2\">\n<text x=\"765\" y=\"200\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--good)\">cost: nothing extra<\/text>\n<\/g>\n<\/svg><\/div>\n\n::: reveal At ingestion | #once .o1\n:::\n::: reveal At question time | #once .o2\n:::\n\n\n## Demo: contextual retrieval\n\n<div class=\"diagram\"><iframe src=\"content/rag-assets/demos/contextual.html\" style=\"width:100%;height:600px;border:0\" loading=\"lazy\"><\/iframe><\/div>\n\n\n## The metadata card\n\n<div class=\"diagram\" id=\"meta\"><svg viewBox=\"0 0 1000 300\" font-family=\"system-ui,sans-serif\" style=\"max-height:360px\">\n<rect x=\"10\" y=\"20\" width=\"420\" height=\"260\" rx=\"12\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"30\" y=\"56\" font-size=\"18\" font-weight=\"700\" style=\"fill:var(--navy)\">chunk SOP-CH-03#4<\/text>\n<text x=\"30\" y=\"96\" font-size=\"16\" style=\"fill:var(--ink)\">From SOP-CH-03 \"Search issue triage\",<\/text>\n<text x=\"30\" y=\"120\" font-size=\"16\" style=\"fill:var(--ink)\">section 4 Index workers: the fix when<\/text>\n<text x=\"30\" y=\"144\" font-size=\"16\" style=\"fill:var(--ink)\">search returns nothing for one tenant…<\/text>\n<text x=\"30\" y=\"168\" font-size=\"16\" style=\"fill:var(--ink)\">Restart the index worker and re-queue<\/text>\n<text x=\"30\" y=\"192\" font-size=\"16\" style=\"fill:var(--ink)\">the folder.<\/text>\n<path d=\"M434 150 L480 150\" style=\"stroke:var(--orange);stroke-width:3\"/>\n<g class=\"rv m1\">\n<rect x=\"490\" y=\"20\" width=\"500\" height=\"260\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n<g font-size=\"17\" style=\"fill:var(--ink)\">\n<text x=\"510\" y=\"54\"><tspan font-weight=\"700\">source<\/tspan>  SOP-CH-03 §4<\/text>\n<text x=\"510\" y=\"84\"><tspan font-weight=\"700\">source type<\/tspan>  content-hub<\/text>\n<text x=\"510\" y=\"114\"><tspan font-weight=\"700\">date<\/tspan>  2026-05-12<\/text>\n<text x=\"510\" y=\"144\"><tspan font-weight=\"700\">owner<\/tspan>  Content Hub sub-team<\/text>\n<text x=\"510\" y=\"174\"><tspan font-weight=\"700\">platform<\/tspan>  Content Hub<\/text>\n<text x=\"510\" y=\"204\"><tspan font-weight=\"700\">access<\/tspan>  team<\/text>\n<text x=\"510\" y=\"234\"><tspan font-weight=\"700\">data class<\/tspan>  Confidential<\/text>\n<\/g>\n<\/g>\n<\/svg><\/div>\n\n::: reveal The labels | #meta .m1\n:::\n\n\n\n## What each field is for (1)\n\n| Field | Example | Used for |\n|---|---|---|\n| source | SOP-CH-03 §4 | the citation |\n| source type | content-hub, mail, onedrive, minutes | filters; different freshness rules |\n| date | 2026-05-12 | prefer the newest; spot stale content |\n| owner | Content Hub sub-team / Priya | who to ask |\n\n**Ask:** Which field would have stopped \"log retention: 14 days\" from sounding current?\n\n::: reveal Answer\n**date.** SOP-OPS-02 was revised 2025-11-20; the cleanup config was changed 2026-08-04. With dates on both, the drift is visible. (Flow 6 has this case.)\n:::\n\n\n## What each field is for (2)\n\n| Field | Example | Used for |\n|---|---|---|\n| stream | POC central log platform | \"only this stream\" |\n| platform | Content Hub | filter |\n| access | team; Priya only; vendor-facing | permission-aware retrieval (flow 9) |\n| data class | Confidential | which model may read it |\n\n\n\n## Your turn: chunk it two ways\n\n**Task for participants:** In pairs, chunk **SOP-CH-03** and the **known-issues sheet** two ways (use the `chunker` demo or paper). Then say which one finds **KI-014** for *\"search returns nothing for one tenant\"*, and why.\n\n::: reveal Answer\n**Row per chunk, with column names written in.** Fixed size splits KI-014's symptom from its fix, or glues it to KI-022. For the SOP: **recursive** (one chunk per section) keeps step 3 whole, and a **contextual prefix** puts \"search returns nothing\" into step 4's chunk.\n:::\n\n\n## Close\n\n**Ask:** Back to Sam's question this morning: why did the assistant say \"escalate\" instead of \"check the index\"?\n\n::: reveal Answer\nBecause SOP-CH-03 was cut by size: step 3 lost its heading, and only step 5 said \"search returns nothing\". Cut by section, add the prefix and the metadata, and step 3 comes back.\n:::\n\n> *Most RAG bugs happen before the first question: in how the documents were cut.*\n\n\n---\n"}, "css": ["viewer/student.css", "viewer/theme.css"]};</script>
