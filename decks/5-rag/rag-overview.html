:2\"/>\n    <text x=\"252\" y=\"48\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:var(--ink)\">OneDrive<\/text>\n    <text x=\"252\" y=\"82\" text-anchor=\"middle\" style=\"font-size:24px;font-weight:700;fill:var(--good)\">✓<\/text>\n    <rect x=\"340\" y=\"10\" width=\"155\" height=\"100\" rx=\"12\" style=\"fill:var(--good-tint);stroke:var(--good);stroke-width:2\"/>\n    <text x=\"417\" y=\"48\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:var(--ink)\">SharePoint<\/text>\n    <text x=\"417\" y=\"82\" text-anchor=\"middle\" style=\"font-size:24px;font-weight:700;fill:var(--good)\">✓<\/text>\n  <\/g>\n  <g class=\"rv blind\">\n    <rect x=\"505\" y=\"10\" width=\"155\" height=\"100\" rx=\"12\" style=\"fill:var(--bad-tint);stroke:var(--bad);stroke-width:2\"/>\n    <text x=\"582\" y=\"48\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:var(--ink)\">Content Hub<\/text>\n    <text x=\"582\" y=\"82\" text-anchor=\"middle\" style=\"font-size:24px;font-weight:700;fill:var(--bad)\">✗<\/text>\n    <rect x=\"670\" y=\"10\" width=\"155\" height=\"100\" rx=\"12\" style=\"fill:var(--bad-tint);stroke:var(--bad);stroke-width:2\"/>\n    <text x=\"747\" y=\"48\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:var(--ink)\">Jira<\/text>\n    <text x=\"747\" y=\"82\" text-anchor=\"middle\" style=\"font-size:15px;font-weight:700;fill:var(--bad)\">connector only<\/text>\n    <rect x=\"835\" y=\"10\" width=\"155\" height=\"100\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"912\" y=\"48\" text-anchor=\"middle\" style=\"font-size:15px;font-weight:700;fill:var(--ink)\">known-issues<\/text>\n    <text x=\"912\" y=\"82\" text-anchor=\"middle\" style=\"font-size:15px;font-weight:700;fill:var(--orange)\">weak on rows<\/text>\n    <text x=\"500\" y=\"150\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">Build when: outside Graph · rows or IDs matter · numbers · Confidential · it has to act<\/text>\n  <\/g>\n<\/svg><\/div>\n\n**Ask:** Copilot already does RAG over Graph. Where is it blind?\n\n::: reveal Answer | #ov-cp .blind\n:::\n\n\n## The ladder\n\n<div class=\"diagram\" id=\"ov-lad\"><svg viewBox=\"0 0 1000 240\" role=\"img\" aria-label=\"The tool ladder as a staircase from Copilot chat to Python\">\n  <g>\n    <rect x=\"10\" y=\"190\" width=\"130\" height=\"44\" rx=\"6\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"75\" y=\"217\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:700;fill:var(--ink)\">Copilot chat<\/text>\n    <rect x=\"150\" y=\"162\" width=\"130\" height=\"44\" rx=\"6\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"215\" y=\"189\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:700;fill:var(--ink)\">Agent builder<\/text>\n    <rect x=\"290\" y=\"134\" width=\"130\" height=\"44\" rx=\"6\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"355\" y=\"161\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:700;fill:var(--ink)\">Copilot Studio<\/text>\n    <rect x=\"430\" y=\"106\" width=\"130\" height=\"44\" rx=\"6\" style=\"fill:var(--card);stroke:var(--navy)\"/>\n    <text x=\"495\" y=\"133\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:700;fill:var(--ink)\">Azure AI Search<\/text>\n    <rect x=\"570\" y=\"78\" width=\"130\" height=\"44\" rx=\"6\" style=\"fill:var(--card);stroke:var(--muted);stroke-dasharray:5 4\"/>\n    <text x=\"635\" y=\"99\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:700;fill:var(--muted)\">Foundry IQ<\/text>\n    <text x=\"635\" y=\"115\" text-anchor=\"middle\" style=\"font-size:11px;font-weight:700;fill:var(--bad)\">unconfirmed<\/text>\n    <rect x=\"710\" y=\"50\" width=\"140\" height=\"44\" rx=\"6\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/>\n    <text x=\"780\" y=\"70\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:700;fill:var(--ink)\">n8n + Nexus<\/text>\n    <text x=\"780\" y=\"86\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:700;fill:var(--ink)\">or Ollama<\/text>\n    <rect x=\"860\" y=\"22\" width=\"130\" height=\"44\" rx=\"6\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/>\n    <text x=\"925\" y=\"49\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:700;fill:var(--ink)\">Python<\/text>\n    <text x=\"10\" y=\"30\" style=\"font-size:14px;font-weight:700;fill:var(--muted)\">more control, more effort ↗<\/text>\n  <\/g>\n  <g class=\"rv why\">\n    <text x=\"10\" y=\"58\" style=\"font-size:13px;fill:var(--ink)\">why move up: can't scope, see or measure<\/text>\n    <text x=\"10\" y=\"78\" style=\"font-size:13px;fill:var(--ink)\">→ no custom chunking or eval → licensing,<\/text>\n    <text x=\"10\" y=\"98\" style=\"font-size:13px;fill:var(--ink)\">still cloud → check the data class →<\/text>\n    <text x=\"10\" y=\"118\" style=\"font-size:13px;fill:var(--ink)\">on-premise, every step visible → full control<\/text>\n  <\/g>\n<\/svg><\/div>\n\n**Ask:** for Sam's Content Hub question, which rung?\n\n::: reveal Why move up | #ov-lad .why\n**n8n + Nexus or Ollama, on-premise:** outside Graph, rows, Confidential. Foundry IQ: watch it, don't build on it yet.\n:::\n\n\n## Close: vendor A again\n\n**Ask:** \"Why did we drop vendor A?\" What does the answer look like now?\n\n::: reveal Answer\n> Vendor A was dropped on 2026-10-01: its collector parses logs in vendor A's cloud and no on-premise parser exists before next year [minutes 2026-10-01 §Decision]. On-premise collection was a success criterion from the kick-off [minutes 2026-09-03], because logs can carry user and document identifiers [SD-LOG-01 §2].\n:::\n\n> *RAG doesn't make the model smarter. It hands the model the right page and makes it show where it read the answer.*\n\n\n---\n"}, "css": ["viewer/student.css", "viewer/theme.css"]};</script>
