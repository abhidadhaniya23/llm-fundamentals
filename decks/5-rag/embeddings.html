<script>window.DECK = {"flow": [{"title": "Search by meaning", "file": "content/embeddings/meaning.md"}, {"title": "How close is close", "file": "content/embeddings/cosine-and-stores.md"}, {"title": "Keeping the index current", "file": "content/embeddings/keeping-current.md"}], "files": {"content/embeddings/meaning.md": "# Search by meaning\n\n\n## Overview\n\n**Goal:** Explain how a whole chunk becomes one vector, and why a question can find a chunk it shares no words with.\n\n**Walk out with:** an embedding is a passage's position in a space of meaning; neighbours share meaning.\n\n<div class=\"diagram\" id=\"req-emb\"><svg viewBox=\"0 0 1000 250\" font-family=\"system-ui,sans-serif\" style=\"max-height:320px\">\n<text x=\"405\" y=\"22\" text-anchor=\"middle\" font-size=\"17\" letter-spacing=\"2\" style=\"fill:var(--muted)\">THE REQUEST WE SEND<\/text>\n<rect x=\"8\" y=\"34\" width=\"794\" height=\"118\" rx=\"14\" style=\"fill:none;stroke:var(--navy);stroke-width:2;stroke-dasharray:7 6\"/>\n<path d=\"M806 93 L838 93\" style=\"stroke:var(--navy);stroke-width:3\"/><path d=\"M838 85 L852 93 L838 101 Z\" style=\"fill:var(--navy)\"/>\n<text x=\"925\" y=\"22\" text-anchor=\"middle\" font-size=\"17\" letter-spacing=\"2\" style=\"fill:var(--muted)\">BACK<\/text>\n<rect x=\"20\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"92\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">System<\/text>\n<text x=\"92\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">prompt<\/text>\n<rect x=\"176\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"248\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">Tool<\/text>\n<text x=\"248\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">definitions<\/text>\n<rect x=\"332\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"404\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">Conversation<\/text>\n<text x=\"404\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">so far<\/text>\n<rect x=\"488\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:3\"/>\n<text x=\"560\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--ink)\">Retrieved<\/text>\n<text x=\"560\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--ink)\">context<\/text>\n<g>\n<path d=\"M560 142 L560 166\" style=\"stroke:var(--orange);stroke-width:2\"/>\n<text x=\"560\" y=\"188\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">today: how chunks<\/text>\n<text x=\"560\" y=\"211\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">are found by meaning<\/text>\n<\/g>\n<rect x=\"644\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"716\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">New<\/text>\n<text x=\"716\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">message<\/text>\n<rect x=\"858\" y=\"46\" width=\"134\" height=\"94\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"925\" y=\"100\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">Response<\/text>\n<\/svg><\/div>\n\n\n## No shared words\n\n<div class=\"diagram\" id=\"nowords\"><svg viewBox=\"0 0 1000 240\" font-family=\"system-ui,sans-serif\" style=\"max-height:300px\">\n<rect x=\"10\" y=\"40\" width=\"420\" height=\"120\" rx=\"14\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"30\" y=\"30\" font-size=\"16\" style=\"fill:var(--muted)\">Sam types<\/text>\n<text x=\"30\" y=\"90\" font-size=\"20\" style=\"fill:var(--ink)\">users can't find archived files<\/text>\n<text x=\"30\" y=\"120\" font-size=\"20\" style=\"fill:var(--ink)\">for Fabrikam Legal<\/text>\n<rect x=\"570\" y=\"40\" width=\"420\" height=\"120\" rx=\"14\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"590\" y=\"30\" font-size=\"16\" style=\"fill:var(--muted)\">KI-014 says<\/text>\n<text x=\"590\" y=\"90\" font-size=\"20\" style=\"fill:var(--ink)\">search returns nothing<\/text>\n<text x=\"590\" y=\"120\" font-size=\"20\" style=\"fill:var(--ink)\">for one tenant<\/text>\n<g class=\"rv w0\">\n<path d=\"M440 100 L560 100\" style=\"stroke:var(--bad);stroke-width:3;stroke-dasharray:8 6\"/>\n<text x=\"500\" y=\"88\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" style=\"fill:var(--bad)\">0 words<\/text>\n<text x=\"500\" y=\"122\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"700\" style=\"fill:var(--bad)\">in common<\/text>\n<\/g>\n<g class=\"rv w1\">\n<path d=\"M220 170 Q500 250 780 170\" style=\"fill:none;stroke:var(--good);stroke-width:4\"/>\n<text x=\"500\" y=\"230\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--good)\">same meaning<\/text>\n<\/g>\n<\/svg><\/div>\n\n::: reveal Shared words | #nowords .w0\n:::\n\n**Ask:** They share no words. How could search find KI-014?\n\n::: reveal Answer | #nowords .w1\n**By meaning, not by words.**\n:::\n\n\n## The company it keeps\n\n<div class=\"diagram\" id=\"space\"><svg viewBox=\"0 0 1000 340\" font-family=\"system-ui,sans-serif\" style=\"max-height:400px\">\n<rect x=\"10\" y=\"10\" width=\"980\" height=\"320\" rx=\"12\" style=\"fill:var(--card);stroke:var(--line)\"/>\n<g class=\"rv sp1\">\n<ellipse cx=\"220\" cy=\"200\" rx=\"190\" ry=\"100\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-dasharray:6 5\"/>\n<g font-size=\"17\" style=\"fill:var(--ink)\"><circle cx=\"140\" cy=\"170\" r=\"6\" style=\"fill:var(--navy)\"/><text x=\"152\" y=\"176\">search returns nothing<\/text><circle cx=\"120\" cy=\"215\" r=\"6\" style=\"fill:var(--navy)\"/><text x=\"132\" y=\"221\">can't find files<\/text><circle cx=\"200\" cy=\"255\" r=\"6\" style=\"fill:var(--navy)\"/><text x=\"212\" y=\"261\">index worker<\/text><circle cx=\"250\" cy=\"140\" r=\"6\" style=\"fill:var(--navy)\"/><text x=\"262\" y=\"146\">indexer<\/text><\/g>\n<\/g>\n<g class=\"rv sp2\">\n<ellipse cx=\"770\" cy=\"110\" rx=\"200\" ry=\"85\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-dasharray:6 5\"/>\n<g font-size=\"17\" style=\"fill:var(--ink)\"><circle cx=\"660\" cy=\"90\" r=\"6\" style=\"fill:var(--orange)\"/><text x=\"672\" y=\"96\">vendor A dropped<\/text><circle cx=\"720\" cy=\"140\" r=\"6\" style=\"fill:var(--orange)\"/><text x=\"732\" y=\"146\">on-premise parser<\/text><circle cx=\"830\" cy=\"70\" r=\"6\" style=\"fill:var(--orange)\"/><text x=\"842\" y=\"76\">vendor B pricing<\/text><\/g>\n<\/g>\n<g class=\"rv sp3\">\n<ellipse cx=\"640\" cy=\"265\" rx=\"180\" ry=\"55\" style=\"fill:var(--good-tint);stroke:var(--good);stroke-dasharray:6 5\"/>\n<g font-size=\"17\" style=\"fill:var(--ink)\"><circle cx=\"520\" cy=\"255\" r=\"6\" style=\"fill:var(--good)\"/><text x=\"532\" y=\"261\">transfer timeout<\/text><circle cx=\"680\" cy=\"285\" r=\"6\" style=\"fill:var(--good)\"/><text x=\"692\" y=\"291\">alert mail<\/text><circle cx=\"690\" cy=\"240\" r=\"6\" style=\"fill:var(--good)\"/><text x=\"702\" y=\"246\">error email<\/text><\/g>\n<\/g>\n<\/svg><\/div>\n\n::: reveal Index problems | #space .sp1\n:::\n::: reveal The POC | #space .sp2\n:::\n::: reveal Alerts and logs | #space .sp3\n:::\n\n\n\n## One chunk, one vector\n\n<div class=\"diagram\" id=\"vec\"><svg viewBox=\"0 0 1000 220\" font-family=\"system-ui,sans-serif\" style=\"max-height:290px\">\n<rect x=\"10\" y=\"40\" width=\"330\" height=\"140\" rx=\"12\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"26\" y=\"74\" font-size=\"16\" style=\"fill:var(--ink)\">Known issue KI-014. Platform:<\/text>\n<text x=\"26\" y=\"98\" font-size=\"16\" style=\"fill:var(--ink)\">Content Hub. Symptom: search<\/text>\n<text x=\"26\" y=\"122\" font-size=\"16\" style=\"fill:var(--ink)\">returns nothing for one tenant.<\/text>\n<text x=\"26\" y=\"146\" font-size=\"16\" style=\"fill:var(--ink)\">Cause: … Fix: …<\/text>\n<path d=\"M344 110 L392 110\" style=\"stroke:var(--navy);stroke-width:3\"/><path d=\"M392 102 L406 110 L392 118 Z\" style=\"fill:var(--navy)\"/>\n<rect x=\"410\" y=\"60\" width=\"200\" height=\"100\" rx=\"12\" style=\"fill:var(--navy);stroke:var(--navy)\"/>\n<text x=\"510\" y=\"104\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:#fff\">embedding<\/text>\n<text x=\"510\" y=\"128\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:#fff\">model<\/text>\n<g class=\"rv v1\">\n<path d=\"M614 110 L662 110\" style=\"stroke:var(--orange);stroke-width:3\"/><path d=\"M662 102 L676 110 L662 118 Z\" style=\"fill:var(--orange)\"/>\n<rect x=\"680\" y=\"60\" width=\"310\" height=\"100\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n<text x=\"835\" y=\"104\" text-anchor=\"middle\" font-size=\"18\" style=\"fill:var(--ink);font-family:var(--mono)\">[0.12, −0.48, 0.07, …]<\/text>\n<text x=\"835\" y=\"134\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">768 or 1,536 numbers<\/text>\n<\/g>\n<\/svg><\/div>\n\n::: reveal The vector | #vec .v1\n:::\n\n\n\n## Close or far?\n\n**Ask:** For *\"users can't find archived files\"*, mark each passage close, medium or far.\n\n<table id=\"closefar\">\n<thead><tr><th>Passage<\/th><th>Close to the question?<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>KI-014 Search returns nothing for one tenant<\/td><td class=\"rv f1\">close<\/td><\/tr>\n<tr><td>KI-040 File not found for a document that search lists<\/td><td class=\"rv f2\">close<\/td><\/tr>\n<tr><td>Priya's note: clear the worker's temp folder<\/td><td class=\"rv f3\">medium<\/td><\/tr>\n<tr><td>Minutes 2026-09-24 vendor B pricing<\/td><td class=\"rv f4\">far<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n::: reveal KI-014 | #closefar .f1\n:::\n::: reveal KI-040 | #closefar .f2\n:::\n::: reveal Priya's note | #closefar .f3\n:::\n::: reveal Vendor B | #closefar .f4\n:::\n\n\n", "content/embeddings/cosine-and-stores.md": "# How close is close\n\n\n## Overview\n\n**Goal:** Compute a cosine score by hand on two numbers, and choose a vector store for Confidential content.\n\n**Walk out with:** cosine = the angle; and the vector store sits where the documents are allowed to be.\n\n\n## The angle\n\n<div class=\"diagram\" id=\"angle\"><svg viewBox=\"0 0 1000 300\" font-family=\"system-ui,sans-serif\" style=\"max-height:360px\">\n<path d=\"M60 270 L60 20\" style=\"stroke:var(--line);stroke-width:2\"/><path d=\"M60 270 L560 270\" style=\"stroke:var(--line);stroke-width:2\"/>\n<path d=\"M60 270 L420 40\" style=\"stroke:var(--navy);stroke-width:4\"/><text x=\"430\" y=\"40\" font-size=\"18\" font-weight=\"700\" style=\"fill:var(--navy)\">question<\/text>\n<g class=\"rv a1\">\n<path d=\"M60 270 L440 80\" style=\"stroke:var(--good);stroke-width:4\"/><text x=\"450\" y=\"90\" font-size=\"18\" font-weight=\"700\" style=\"fill:var(--good)\">KI-014<\/text>\n<\/g>\n<g class=\"rv a2\">\n<path d=\"M60 270 L520 250\" style=\"stroke:var(--bad);stroke-width:4\"/><text x=\"380\" y=\"235\" font-size=\"18\" font-weight=\"700\" style=\"fill:var(--bad)\">vendor B pricing<\/text>\n<\/g>\n<g font-size=\"20\" style=\"fill:var(--ink)\">\n<text x=\"620\" y=\"80\"><tspan font-weight=\"700\">1<\/tspan>  same direction<\/text>\n<text x=\"620\" y=\"130\"><tspan font-weight=\"700\">0<\/tspan>  unrelated<\/text>\n<text x=\"620\" y=\"190\" font-size=\"17\" style=\"fill:var(--muted)\">small angle, high score<\/text>\n<\/g>\n<\/svg><\/div>\n\n::: reveal A close passage | #angle .a1\n:::\n::: reveal A far passage | #angle .a2\n:::\n\n\n\n## Dot product\n\n**Dot product** = angle × lengths. It equals cosine when the vectors are normalised to length 1, as most embedding models do.\n\n**Ask:** A vector store offers \"cosine\" and \"dot product\". Your embedding model normalises its vectors. Does the choice matter?\n\n::: reveal Answer\n**No.** With length-1 vectors they give the same ranking. Dot product is just cheaper to compute.\n:::\n\n\n## With two numbers\n\n**Ask:** Query (0.8, 0.6). KI-014 (0.7, 0.7). Vendor B pricing (−0.2, 0.98). Which is closer? Estimate first, then multiply and add.\n\n::: reveal Answer\n- Query · KI-014 = 0.8×0.7 + 0.6×0.7 = **0.99** (after dividing by the lengths)\n- Query · vendor B = 0.8×(−0.2) + 0.6×0.98 = **0.43**\n\nKI-014 is the neighbour.\n:::\n\n\n## Demo: the embedding map\n\n<div class=\"diagram\"><iframe src=\"content/rag-assets/demos/embedding-map.html\" style=\"width:100%;height:600px;border:0\" loading=\"lazy\"><\/iframe><\/div>\n\n\n## Where the vectors live\n\n<div class=\"diagram\" id=\"stores\"><svg viewBox=\"0 0 1000 280\" font-family=\"system-ui,sans-serif\" style=\"max-height:340px\">\n<rect x=\"10\" y=\"20\" width=\"570\" height=\"190\" rx=\"14\" style=\"fill:var(--good-tint);stroke:var(--good);stroke-width:2;stroke-dasharray:8 6\"/>\n<text x=\"24\" y=\"44\" font-size=\"16\" font-weight=\"700\" style=\"fill:var(--good)\">ON-PREMISE: Confidential may live here<\/text>\n<rect x=\"620\" y=\"20\" width=\"370\" height=\"190\" rx=\"14\" style=\"fill:var(--bad-tint);stroke:var(--bad);stroke-width:2;stroke-dasharray:8 6\"/>\n<text x=\"975\" y=\"44\" text-anchor=\"end\" font-size=\"16\" font-weight=\"700\" style=\"fill:var(--bad)\">CLOUD<\/text>\n<g class=\"rv st1\"><rect x=\"25\" y=\"70\" width=\"140\" height=\"110\" rx=\"10\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"/><text x=\"95\" y=\"118\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--navy)\">FAISS<\/text><text x=\"95\" y=\"146\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--ink)\">a library<\/text><\/g>\n<g class=\"rv st2\"><rect x=\"180\" y=\"70\" width=\"140\" height=\"110\" rx=\"10\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"/><text x=\"250\" y=\"118\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--navy)\">Chroma<\/text><text x=\"250\" y=\"146\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--ink)\">small local DB<\/text><\/g>\n<g class=\"rv st3\"><rect x=\"335\" y=\"70\" width=\"140\" height=\"110\" rx=\"10\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:3\"/><text x=\"405\" y=\"118\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--ink)\">Qdrant<\/text><text x=\"405\" y=\"146\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--ink)\">the lab<\/text><\/g>\n<g class=\"rv st4\"><rect x=\"800\" y=\"70\" width=\"170\" height=\"110\" rx=\"10\" style=\"fill:var(--card);stroke:var(--bad);stroke-width:2\"/><text x=\"885\" y=\"118\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--bad)\">Pinecone<\/text><text x=\"885\" y=\"146\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--ink)\">hosted service<\/text><\/g>\n<g class=\"rv st5\"><rect x=\"495\" y=\"70\" width=\"210\" height=\"110\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/><text x=\"600\" y=\"112\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" style=\"fill:var(--navy)\">Azure AI Search<\/text><text x=\"600\" y=\"138\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--ink)\">managed by Microsoft<\/text><text x=\"600\" y=\"160\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--ink)\">check the data class<\/text><\/g>\n<text x=\"500\" y=\"250\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--muted)\">simple ← → more features: filters, hybrid, reranking, scale<\/text>\n<\/svg><\/div>\n\n::: reveal FAISS | #stores .st1\n:::\n::: reveal Chroma | #stores .st2\n:::\n::: reveal Qdrant | #stores .st3\n:::\n::: reveal Pinecone | #stores .st4\n:::\n::: reveal Azure AI Search | #stores .st5\n:::\n\n\n## Five stores\n\n| Store | What it is | For Contoso |\n|---|---|---|\n| FAISS | A library: an index in memory or a file | Code, local experiments |\n| Chroma | A small local database | n8n or code, on-premise |\n| Qdrant | A vector database with filters and hybrid search, self-hosted | **The lab** |\n| Pinecone | Hosted cloud service | Not for Confidential data |\n| Azure AI Search | Microsoft's managed search: vectors, keywords, reranking | The Microsoft step up |\n\n\n## Which store for the SOPs?\n\n**Ask:** SOP-CH-03 is Confidential. You need filters (platform, access) and keyword search for IDs. Which store? One word on your sheet.\n\n::: reveal Answer\n**Qdrant, self-hosted.** On-premise, with filters and hybrid search. Chroma works for a small start; Pinecone is out for Confidential data; Azure AI Search only if the data class allows it.\n:::\n\n", "content/embeddings/keeping-current.md": "# Keeping the index current\n\n\n## Overview\n\n**Goal:** Keep the vector index in step with the sources: stable chunk IDs, upsert and delete, a trigger per source.\n\n**Walk out with:** a document changes → delete its old chunks, insert the new ones; and know what triggers that for each source.\n\n\n## Chunk IDs\n\n<div class=\"diagram\" id=\"ids\"><svg viewBox=\"0 0 1000 200\" font-family=\"system-ui,sans-serif\" style=\"max-height:270px\">\n<g font-size=\"34\" font-weight=\"700\" style=\"font-family:var(--mono)\">\n<text x=\"200\" y=\"90\" style=\"fill:var(--navy)\">SOP-CH-03<\/text>\n<text x=\"392\" y=\"90\" style=\"fill:var(--muted)\">#<\/text>\n<text x=\"414\" y=\"90\" class=\"rv i2\" style=\"fill:var(--orange)\">4<\/text>\n<text x=\"436\" y=\"90\" class=\"rv i3\" style=\"fill:var(--orange)\">.2<\/text>\n<\/g>\n<g class=\"rv i1\"><path d=\"M200 106 L384 106\" style=\"stroke:var(--navy);stroke-width:3\"/><text x=\"292\" y=\"136\" text-anchor=\"middle\" font-size=\"18\" style=\"fill:var(--ink)\">the document<\/text><\/g>\n<g class=\"rv i2\"><path d=\"M414 106 L434 106\" style=\"stroke:var(--orange);stroke-width:3\"/><text x=\"424\" y=\"170\" text-anchor=\"middle\" font-size=\"18\" style=\"fill:var(--ink)\">section 4<\/text><\/g>\n<g class=\"rv i3\"><path d=\"M438 106 L478 106\" style=\"stroke:var(--orange);stroke-width:3\"/><text x=\"500\" y=\"136\" font-size=\"18\" style=\"fill:var(--ink)\">paragraph 2<\/text><\/g>\n<\/svg><\/div>\n\n::: reveal Document | #ids .i1\n:::\n::: reveal Section | #ids .i2\n:::\n::: reveal Position | #ids .i3\n:::\n\n\n\n## Upsert and delete\n\n<div class=\"diagram\" id=\"upsert\"><svg viewBox=\"0 0 1000 260\" font-family=\"system-ui,sans-serif\" style=\"max-height:330px\">\n<text x=\"150\" y=\"28\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" style=\"fill:var(--navy)\">Index<\/text>\n<g font-size=\"16\" style=\"font-family:var(--mono)\">\n<rect x=\"20\" y=\"44\" width=\"260\" height=\"38\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/><text x=\"34\" y=\"69\" style=\"fill:var(--ink)\">SOP-CH-03#3.1<\/text>\n<rect x=\"20\" y=\"88\" width=\"260\" height=\"38\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/><text x=\"34\" y=\"113\" style=\"fill:var(--ink)\">SOP-OPS-02#1.1  14 days<\/text>\n<rect x=\"20\" y=\"132\" width=\"260\" height=\"38\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/><text x=\"34\" y=\"157\" style=\"fill:var(--ink)\">SOP-OPS-02#1.2<\/text>\n<rect x=\"20\" y=\"176\" width=\"260\" height=\"38\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/><text x=\"34\" y=\"201\" style=\"fill:var(--ink)\">KI-014<\/text>\n<\/g>\n<g class=\"rv u1\">\n<rect x=\"380\" y=\"70\" width=\"260\" height=\"70\" rx=\"10\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n<text x=\"510\" y=\"100\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" style=\"fill:var(--ink)\">SOP-OPS-02 changed<\/text>\n<text x=\"510\" y=\"124\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">to 30 days<\/text>\n<\/g>\n<g class=\"rv u2\">\n<path d=\"M20 107 L280 107 M20 151 L280 151\" style=\"stroke:var(--bad);stroke-width:4\"/>\n<text x=\"510\" y=\"184\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" style=\"fill:var(--bad)\">1. delete its old chunks<\/text>\n<\/g>\n<g class=\"rv u3\">\n<g font-size=\"16\" style=\"font-family:var(--mono)\">\n<rect x=\"720\" y=\"88\" width=\"270\" height=\"38\" rx=\"6\" style=\"fill:var(--good-tint);stroke:var(--good)\"/><text x=\"734\" y=\"113\" style=\"fill:var(--ink)\">SOP-OPS-02#1.1  30 days<\/text>\n<rect x=\"720\" y=\"132\" width=\"270\" height=\"38\" rx=\"6\" style=\"fill:var(--good-tint);stroke:var(--good)\"/><text x=\"734\" y=\"157\" style=\"fill:var(--ink)\">SOP-OPS-02#1.2<\/text>\n<\/g>\n<text x=\"855\" y=\"210\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" style=\"fill:var(--good)\">2. insert the new ones<\/text>\n<text x=\"510\" y=\"240\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--muted)\">together: upsert · deleted document: remove its chunks<\/text>\n<\/g>\n<\/svg><\/div>\n\n::: reveal The source changes | #upsert .u1\n:::\n::: reveal Delete old | #upsert .u2\n:::\n::: reveal Insert new | #upsert .u3\n:::\n\n\n## A trigger per source\n\n<div class=\"diagram\" id=\"triggers\"><svg viewBox=\"0 0 1000 260\" font-family=\"system-ui,sans-serif\" style=\"max-height:330px\">\n<g style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"><rect x=\"10\" y=\"20\" width=\"230\" height=\"56\" rx=\"8\"/><rect x=\"10\" y=\"100\" width=\"230\" height=\"56\" rx=\"8\"/><rect x=\"10\" y=\"180\" width=\"230\" height=\"56\" rx=\"8\"/><\/g>\n<g font-size=\"18\" text-anchor=\"middle\" style=\"fill:var(--ink)\"><text x=\"125\" y=\"54\">Content Hub<\/text><text x=\"125\" y=\"134\">OneDrive and mail<\/text><text x=\"125\" y=\"214\">SharePoint<\/text><\/g>\n<g class=\"rv tr1\"><path d=\"M244 48 L360 48\" style=\"stroke:var(--navy);stroke-width:2\"/><rect x=\"360\" y=\"20\" width=\"300\" height=\"56\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><text x=\"510\" y=\"54\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">nightly export<\/text><\/g>\n<g class=\"rv tr2\"><path d=\"M244 128 L360 128\" style=\"stroke:var(--navy);stroke-width:2\"/><rect x=\"360\" y=\"100\" width=\"300\" height=\"56\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><text x=\"510\" y=\"134\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">Graph delta queries<\/text><\/g>\n<g class=\"rv tr3\"><path d=\"M244 208 L360 208\" style=\"stroke:var(--navy);stroke-width:2\"/><rect x=\"360\" y=\"180\" width=\"300\" height=\"56\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><text x=\"510\" y=\"214\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">webhook or Power Automate<\/text><\/g>\n<g style=\"stroke:var(--orange);stroke-width:2\"><path d=\"M664 48 L780 128\"/><path d=\"M664 128 L780 128\"/><path d=\"M664 208 L780 128\"/><\/g>\n<rect x=\"780\" y=\"90\" width=\"210\" height=\"76\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n<text x=\"885\" y=\"124\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" style=\"fill:var(--ink)\">re-chunk, embed,<\/text>\n<text x=\"885\" y=\"148\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" style=\"fill:var(--ink)\">upsert<\/text>\n<\/svg><\/div>\n\n::: reveal Content Hub | #triggers .tr1\n:::\n::: reveal OneDrive and mail | #triggers .tr2\n:::\n::: reveal SharePoint | #triggers .tr3\n:::\n\n\n\n## The 14-day answer\n\n**Ask:** the SOP owner corrects SOP-OPS-02 to 30 days, to match the config. The index isn't refreshed. Sam asks *\"how long do we keep server logs?\"*. What does the assistant say?\n\n::: reveal Answer\n**14 days**, with a citation to SOP-OPS-02, confidently. The citation is real; it just points at a copy that's out of date.\n:::\n\n\n\n\n## Same meaning, no shared words\n\n**Ask:** In pairs, name three Contoso pairs that mean the same thing but share no words. One minute.\n\n::: reveal Answer\n- \"file not found\" / \"document missing\"\n- \"worker\" / \"indexer\"\n- \"alert mail\" / \"error email\"\n:::\n\n\n## Close\n\n**Ask:** Back to the start: how did *\"users can't find archived files for Fabrikam Legal\"* find KI-014?\n\n::: reveal Answer\nBoth were turned into vectors by the same model; they point the same way; cosine said \"close\".\n:::\n\n> *Embeddings find what you meant, not what you typed.*\n\n---\n"}, "css": ["viewer/student.css", "viewer/theme.css"]};</script>
