<script>window.DECK = {"flow": [{"title": "Seven questions, seven wrong answers", "file": "content/failure-modes/naive-pipeline.md"}, {"title": "Cases 1 to 4: cut, search, rank", "file": "content/failure-modes/cases-cut-and-search.md"}, {"title": "Cases 5 to 7: the answer and the data", "file": "content/failure-modes/cases-answer-and-data.md"}], "files": {"content/failure-modes/naive-pipeline.md": "# Seven questions, seven wrong answers\n\n## Overview\n\n**Goal:** Read a wrong RAG answer and name the stage that broke, before anyone blames the model.\n\n**Walk out with:** the failure map: six stages, the symptom each one leaves, and its fix.\n\n\n## The naive pipeline\n\n> Sam's team wired up the quickest pipeline a tutorial allows. Seven questions later, seven answers are wrong.\n\n<div class=\"diagram\" id=\"naive\"><svg viewBox=\"0 0 1000 220\" role=\"img\" aria-label=\"The naive pipeline: sources, parse, chunk, embed, retrieve, generate, with its naive choices under each step\">\n  <defs><marker id=\"np-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--muted)\"/><\/marker><\/defs>\n  <g>\n    <rect x=\"20\" y=\"20\" width=\"140\" height=\"80\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"90\" y=\"55\" text-anchor=\"middle\" style=\"font-size:20px;font-weight:700;fill:var(--navy)\">Sources<\/text>\n    <text x=\"90\" y=\"80\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">mail, minutes, SOPs<\/text>\n    <rect x=\"184\" y=\"20\" width=\"140\" height=\"80\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"254\" y=\"55\" text-anchor=\"middle\" style=\"font-size:20px;font-weight:700;fill:var(--navy)\">Parse<\/text>\n    <text x=\"254\" y=\"80\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">file → text<\/text>\n    <rect x=\"348\" y=\"20\" width=\"140\" height=\"80\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"418\" y=\"55\" text-anchor=\"middle\" style=\"font-size:20px;font-weight:700;fill:var(--navy)\">Chunk<\/text>\n    <text x=\"418\" y=\"80\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">text → pieces<\/text>\n    <rect x=\"512\" y=\"20\" width=\"140\" height=\"80\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"582\" y=\"55\" text-anchor=\"middle\" style=\"font-size:20px;font-weight:700;fill:var(--navy)\">Embed<\/text>\n    <text x=\"582\" y=\"80\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">piece → vector<\/text>\n    <rect x=\"676\" y=\"20\" width=\"140\" height=\"80\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"746\" y=\"55\" text-anchor=\"middle\" style=\"font-size:20px;font-weight:700;fill:var(--navy)\">Retrieve<\/text>\n    <text x=\"746\" y=\"80\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">question → passages<\/text>\n    <rect x=\"840\" y=\"20\" width=\"140\" height=\"80\" rx=\"10\" style=\"fill:var(--card);stroke:var(--ink);stroke-width:2\"/>\n    <text x=\"910\" y=\"55\" text-anchor=\"middle\" style=\"font-size:20px;font-weight:700;fill:var(--ink)\">Generate<\/text>\n    <text x=\"910\" y=\"80\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">passages → answer<\/text>\n    <line x1=\"160\" y1=\"60\" x2=\"182\" y2=\"60\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#np-a)\"/>\n    <line x1=\"324\" y1=\"60\" x2=\"346\" y2=\"60\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#np-a)\"/>\n    <line x1=\"488\" y1=\"60\" x2=\"510\" y2=\"60\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#np-a)\"/>\n    <line x1=\"652\" y1=\"60\" x2=\"674\" y2=\"60\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#np-a)\"/>\n    <line x1=\"816\" y1=\"60\" x2=\"838\" y2=\"60\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#np-a)\"/>\n  <\/g>\n  <g class=\"rv naive\">\n    <rect x=\"20\" y=\"125\" width=\"140\" height=\"60\" rx=\"8\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"90\" y=\"150\" text-anchor=\"middle\" style=\"font-size:15px;font-weight:700;fill:var(--ink)\">Jira indexed<\/text>\n    <text x=\"90\" y=\"172\" text-anchor=\"middle\" style=\"font-size:15px;font-weight:700;fill:var(--ink)\">like a document<\/text>\n    <rect x=\"184\" y=\"125\" width=\"140\" height=\"60\" rx=\"8\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"254\" y=\"161\" text-anchor=\"middle\" style=\"font-size:15px;font-weight:700;fill:var(--ink)\">no metadata<\/text>\n    <rect x=\"348\" y=\"125\" width=\"140\" height=\"60\" rx=\"8\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"418\" y=\"161\" text-anchor=\"middle\" style=\"font-size:15px;font-weight:700;fill:var(--ink)\">fixed 500 tokens<\/text>\n    <rect x=\"512\" y=\"125\" width=\"140\" height=\"60\" rx=\"8\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"582\" y=\"161\" text-anchor=\"middle\" style=\"font-size:15px;font-weight:700;fill:var(--ink)\">semantic only<\/text>\n    <rect x=\"676\" y=\"125\" width=\"140\" height=\"60\" rx=\"8\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"746\" y=\"161\" text-anchor=\"middle\" style=\"font-size:15px;font-weight:700;fill:var(--ink)\">top 3, sent as is<\/text>\n    <text x=\"910\" y=\"161\" text-anchor=\"middle\" style=\"font-size:15px;font-style:italic;fill:var(--bad)\">gets the blame<\/text>\n  <\/g>\n<\/svg><\/div>\n\n**Ask:** each choice is a tutorial default. Which one worries you most? Hands up per box.\n\n::: reveal The naive choices | #naive .naive\n:::\n\n\n\n\n## The failure map\n\n<div class=\"diagram\" id=\"fmap\"><svg viewBox=\"0 0 1000 312\" role=\"img\" aria-label=\"Failure map: stage, symptom, fix for six stages\">\n  <g>\n    <rect x=\"10\" y=\"4\" width=\"980\" height=\"40\" rx=\"6\" style=\"fill:var(--navy)\"/>\n    <text x=\"24\" y=\"31\" style=\"font-size:18px;font-weight:700;fill:#fff\">Stage<\/text>\n    <text x=\"185\" y=\"31\" style=\"font-size:18px;font-weight:700;fill:#fff\">Symptom<\/text>\n    <text x=\"550\" y=\"31\" style=\"font-size:18px;font-weight:700;fill:#fff\">Fix<\/text>\n  <\/g>\n  <g class=\"rv r1\">\n    <rect x=\"10\" y=\"48\" width=\"980\" height=\"40\" rx=\"6\" style=\"fill:var(--navy-tint)\"/>\n    <text x=\"24\" y=\"74\" style=\"font-size:16px;font-weight:700;fill:var(--navy)\">Parsing<\/text>\n    <text x=\"185\" y=\"74\" style=\"font-size:15.5px;fill:var(--ink)\">Table or mail thread turns into soup<\/text>\n    <text x=\"550\" y=\"74\" style=\"font-size:15.5px;fill:var(--good)\">Row-per-chunk; strip quoted replies<\/text>\n  <\/g>\n  <g class=\"rv r2\">\n    <rect x=\"10\" y=\"92\" width=\"980\" height=\"40\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/>\n    <text x=\"24\" y=\"118\" style=\"font-size:16px;font-weight:700;fill:var(--navy)\">Chunking<\/text>\n    <text x=\"185\" y=\"118\" style=\"font-size:15.5px;fill:var(--ink)\">Answer split across two chunks<\/text>\n    <text x=\"550\" y=\"118\" style=\"font-size:15.5px;fill:var(--good)\">Structure-aware chunking, overlap, parent-child<\/text>\n  <\/g>\n  <g class=\"rv r3\">\n    <rect x=\"10\" y=\"136\" width=\"980\" height=\"40\" rx=\"6\" style=\"fill:var(--navy-tint)\"/>\n    <text x=\"24\" y=\"162\" style=\"font-size:16px;font-weight:700;fill:var(--navy)\">Embedding<\/text>\n    <text x=\"185\" y=\"162\" style=\"font-size:15.5px;fill:var(--ink)\">Exact IDs not found<\/text>\n    <text x=\"550\" y=\"162\" style=\"font-size:15.5px;fill:var(--good)\">Hybrid with BM25<\/text>\n  <\/g>\n  <g class=\"rv r4\">\n    <rect x=\"10\" y=\"180\" width=\"980\" height=\"40\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/>\n    <text x=\"24\" y=\"206\" style=\"font-size:16px;font-weight:700;fill:var(--navy)\">Retrieval<\/text>\n    <text x=\"185\" y=\"206\" style=\"font-size:15.5px;fill:var(--ink)\">Right doc ranked 7th, only the top 3 sent<\/text>\n    <text x=\"550\" y=\"206\" style=\"font-size:15.5px;fill:var(--good)\">Rerank; bigger first stage<\/text>\n  <\/g>\n  <g class=\"rv r5\">\n    <rect x=\"10\" y=\"224\" width=\"980\" height=\"40\" rx=\"6\" style=\"fill:var(--navy-tint)\"/>\n    <text x=\"24\" y=\"250\" style=\"font-size:16px;font-weight:700;fill:var(--navy)\">Generation<\/text>\n    <text x=\"185\" y=\"250\" style=\"font-size:15.5px;fill:var(--ink)\">Right passage sent, then ignored<\/text>\n    <text x=\"550\" y=\"250\" style=\"font-size:15.5px;fill:var(--good)\">Fewer passages, best first, grounding<\/text>\n  <\/g>\n  <g class=\"rv r6\">\n    <rect x=\"10\" y=\"268\" width=\"980\" height=\"40\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/>\n    <text x=\"24\" y=\"294\" style=\"font-size:16px;font-weight:700;fill:var(--navy)\">Data<\/text>\n    <text x=\"185\" y=\"294\" style=\"font-size:15.5px;fill:var(--ink)\">Old, contradictory or fast-changing content<\/text>\n    <text x=\"550\" y=\"294\" style=\"font-size:15.5px;fill:var(--good)\">Dates in metadata; prefer newest; live tools for status<\/text>\n  <\/g>\n<\/svg><\/div>\n\n**Ask:** before each row: if this stage broke, what would Sam see in the answer?\n\n::: reveal Parsing | #fmap .r1\n:::\n::: reveal Chunking | #fmap .r2\n:::\n::: reveal Embedding | #fmap .r3\n:::\n::: reveal Retrieval | #fmap .r4\n:::\n::: reveal Generation | #fmap .r5\n:::\n::: reveal Data | #fmap .r6\n:::\n\n\n\n", "content/failure-modes/cases-cut-and-search.md": "# Cases 1 to 4: cut, search, rank\n\n## Overview\n\n**Goal:** Diagnose four wrong answers that broke before the model saw anything: in parsing, chunking, embedding or ranking.\n\n**Walk out with:** four symptoms you'll recognise next time: the half row, the missing ID, the echo, the look-alike minutes.\n\n\n## Case 1: the split row\n\nSam asks: **\"What fixes KI-014?\"** Which stage broke? Commit before the reveal.\n\n<div class=\"diagram\" id=\"case1\"><svg viewBox=\"0 0 1000 250\" role=\"img\" aria-label=\"KI-014 cut across two chunks: the cause in chunk 7, the fix in chunk 8, which was not sent\">\n  <g>\n    <text x=\"10\" y=\"18\" style=\"font-size:14px;font-weight:700;fill:var(--muted)\">WHAT THE SEARCH SENT<\/text>\n    <text x=\"590\" y=\"18\" style=\"font-size:14px;font-weight:700;fill:var(--muted)\">WHAT THE ASSISTANT SAID<\/text>\n    <rect x=\"10\" y=\"28\" width=\"270\" height=\"130\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"22\" y=\"50\" style=\"font-size:13px;font-weight:700;fill:var(--navy)\">chunk 7 · sent, rank 1<\/text>\n    <text x=\"22\" y=\"74\" style=\"font-size:14px;fill:var(--ink)\">… | KI-014 | Content Hub |<\/text>\n    <text x=\"22\" y=\"96\" style=\"font-size:14px;fill:var(--ink)\">Search returns nothing for<\/text>\n    <text x=\"22\" y=\"118\" style=\"font-size:14px;fill:var(--ink)\">one tenant | Index job for that<\/text>\n    <text x=\"22\" y=\"140\" style=\"font-size:14px;fill:var(--ink)\">tenant's folder stalled | Index<\/text>\n    <rect x=\"290\" y=\"28\" width=\"270\" height=\"130\" rx=\"8\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2;stroke-dasharray:6 4\"/>\n    <text x=\"302\" y=\"50\" style=\"font-size:13px;font-weight:700;fill:var(--muted)\">chunk 8 · rank 6, not sent<\/text>\n    <text x=\"302\" y=\"74\" style=\"font-size:14px;fill:var(--muted)\">queue for the tenant; index<\/text>\n    <text x=\"302\" y=\"96\" style=\"font-size:14px;fill:var(--muted)\">worker status | Restart the<\/text>\n    <text x=\"302\" y=\"118\" style=\"font-size:14px;fill:var(--muted)\">index worker, re-queue the<\/text>\n    <text x=\"302\" y=\"140\" style=\"font-size:14px;fill:var(--muted)\">folder | KI-022 | Content Hub …<\/text>\n    <rect x=\"590\" y=\"28\" width=\"400\" height=\"130\" rx=\"14\" style=\"fill:var(--card);stroke:var(--bad);stroke-width:2\"/>\n    <text x=\"608\" y=\"62\" style=\"font-size:16px;fill:var(--ink)\">KI-014 happens when the index job<\/text>\n    <text x=\"608\" y=\"86\" style=\"font-size:16px;fill:var(--ink)\">for the tenant's folder stalls.<\/text>\n    <text x=\"608\" y=\"120\" style=\"font-size:16px;font-weight:700;fill:var(--bad)\">I don't find a documented fix.<\/text>\n  <\/g>\n  <g class=\"rv stage\">\n    <rect x=\"272\" y=\"22\" width=\"26\" height=\"142\" rx=\"6\" style=\"fill:none;stroke:var(--bad);stroke-width:3;stroke-dasharray:5 4\"/>\n    <text x=\"285\" y=\"182\" text-anchor=\"middle\" style=\"font-size:14px;font-weight:700;fill:var(--bad)\">the row is cut here<\/text>\n  <\/g>\n  <g class=\"rv fix\">\n    <rect x=\"10\" y=\"194\" width=\"980\" height=\"52\" rx=\"8\" style=\"fill:var(--card);stroke:var(--good);stroke-width:2\"/>\n    <text x=\"24\" y=\"216\" style=\"font-size:14px;fill:var(--ink)\"><tspan style=\"font-weight:700;fill:var(--good)\">One row, one chunk: <\/tspan>Known issue KI-014. Platform: Content Hub. Symptom: search returns nothing for one tenant.<\/text>\n    <text x=\"24\" y=\"237\" style=\"font-size:14px;fill:var(--ink)\">Cause: index job for that tenant's folder stalled. Check: index queue; index worker status. <tspan style=\"font-weight:700\">Fix: restart the index worker, re-queue the folder.<\/tspan><\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal Stage | #case1 .stage\n**Chunking.** A fixed 500-token cut put the cause in one chunk and the fix in the next.\n:::\n\n::: reveal Fix | #case1 .fix\n**One row per chunk,** with the column names written in.\n:::\n\n\n\n\n## Demo: the split row\n\n<div class=\"diagram\"><iframe src=\"content/rag-assets/demos/chunker.html?preset=ki-fixed\" style=\"width:100%;height:600px;border:0\" loading=\"lazy\"><\/iframe><\/div>\n\n\n## Case 2: logs that look alike\n\nSam asks: **\"What happened with 7f3a-91c2?\"** Which stage broke?\n\n<div class=\"diagram\" id=\"case2\"><svg viewBox=\"0 0 1000 250\" role=\"img\" aria-label=\"Five near-identical transfer.log chunks, none with the ID 7f3a-91c2\">\n  <g>\n    <text x=\"10\" y=\"18\" style=\"font-size:14px;font-weight:700;fill:var(--muted)\">TOP 5 BY MEANING (SEMANTIC ONLY)<\/text>\n    <text x=\"590\" y=\"18\" style=\"font-size:14px;font-weight:700;fill:var(--muted)\">WHAT THE ASSISTANT SAID<\/text>\n    <rect x=\"10\" y=\"28\" width=\"550\" height=\"24\" rx=\"4\" style=\"fill:var(--navy-tint)\"/>\n    <text x=\"20\" y=\"45\" style=\"font-family:var(--mono);font-size:13px;fill:var(--ink)\">02:13:51 transfer doc-id 5c11-04ad target busy, retry 1/3<\/text>\n    <rect x=\"10\" y=\"56\" width=\"550\" height=\"24\" rx=\"4\" style=\"fill:var(--navy-tint)\"/>\n    <text x=\"20\" y=\"73\" style=\"font-family:var(--mono);font-size:13px;fill:var(--ink)\">02:11:09 transfer doc-id 9b20-77e1 target busy, retry 1/3<\/text>\n    <rect x=\"10\" y=\"84\" width=\"550\" height=\"24\" rx=\"4\" style=\"fill:var(--navy-tint)\"/>\n    <text x=\"20\" y=\"101\" style=\"font-family:var(--mono);font-size:13px;fill:var(--ink)\">02:14:30 transfer doc-id 5c11-04ad target busy, retry 2/3<\/text>\n    <rect x=\"10\" y=\"112\" width=\"550\" height=\"24\" rx=\"4\" style=\"fill:var(--navy-tint)\"/>\n    <text x=\"20\" y=\"129\" style=\"font-family:var(--mono);font-size:13px;fill:var(--ink)\">02:09:44 transfer doc-id 2d4f-0a19 target busy, retry 1/3<\/text>\n    <rect x=\"10\" y=\"140\" width=\"550\" height=\"24\" rx=\"4\" style=\"fill:var(--navy-tint)\"/>\n    <text x=\"20\" y=\"157\" style=\"font-family:var(--mono);font-size:13px;fill:var(--ink)\">02:15:02 transfer doc-id e8a0-3c55 target busy, retry 1/3<\/text>\n    <rect x=\"590\" y=\"28\" width=\"400\" height=\"136\" rx=\"14\" style=\"fill:var(--card);stroke:var(--bad);stroke-width:2\"/>\n    <text x=\"608\" y=\"64\" style=\"font-size:16px;fill:var(--ink)\">Transfers were retried because<\/text>\n    <text x=\"608\" y=\"88\" style=\"font-size:16px;fill:var(--ink)\">the target was busy during the<\/text>\n    <text x=\"608\" y=\"112\" style=\"font-size:16px;fill:var(--ink)\">night batch.<\/text>\n    <text x=\"608\" y=\"144\" style=\"font-size:16px;font-weight:700;fill:var(--bad)\">(About other documents.)<\/text>\n  <\/g>\n  <g class=\"rv stage\">\n    <rect x=\"4\" y=\"24\" width=\"562\" height=\"144\" rx=\"6\" style=\"fill:none;stroke:var(--bad);stroke-width:3;stroke-dasharray:5 4\"/>\n    <text x=\"285\" y=\"186\" text-anchor=\"middle\" style=\"font-size:14px;font-weight:700;fill:var(--bad)\">same meaning to an embedding; none carries 7f3a-91c2<\/text>\n  <\/g>\n  <g class=\"rv fix\">\n    <rect x=\"10\" y=\"196\" width=\"980\" height=\"50\" rx=\"8\" style=\"fill:var(--card);stroke:var(--good);stroke-width:2\"/>\n    <text x=\"24\" y=\"218\" style=\"font-size:14px;fill:var(--ink)\"><tspan style=\"font-weight:700;fill:var(--good)\">BM25 + semantic, filter doc_id = 7f3a-91c2: <\/tspan><\/text>\n    <text x=\"24\" y=\"238\" style=\"font-family:var(--mono);font-size:13px;fill:var(--ink)\">transfer.log 02:14:07 7f3a-91c2 target busy, retry 3/3 failed, result=TIMEOUT<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal Stage | #case2 .stage\n**Embedding.** To a vector, every `transfer.log` line means the same thing. An ID carries no meaning.\n:::\n\n::: reveal Fix | #case2 .fix\n**Hybrid search with BM25,** and the document ID as metadata.\n:::\n\n\n\n## Demo: logs that look alike\n\n<div class=\"diagram\"><iframe src=\"content/rag-assets/demos/search-lab.html?preset=naive\" style=\"width:100%;height:600px;border:0\" loading=\"lazy\"><\/iframe><\/div>\n\n\n## Case 3: the echoing thread\n\nSam asks: **\"What did vendor A say about on-prem?\"** Which stage broke?\n\n<div class=\"diagram\" id=\"case3\"><svg viewBox=\"0 0 1000 250\" role=\"img\" aria-label=\"Top 3 are the same quoted paragraph from three replies; vendor A's real answer is ranked 4th and not sent\">\n  <g>\n    <text x=\"10\" y=\"18\" style=\"font-size:14px;font-weight:700;fill:var(--muted)\">TOP 3 FROM THE VENDOR A THREAD<\/text>\n    <text x=\"590\" y=\"18\" style=\"font-size:14px;font-weight:700;fill:var(--muted)\">WHAT THE ASSISTANT SAID<\/text>\n    <rect x=\"10\" y=\"28\" width=\"550\" height=\"30\" rx=\"4\" style=\"fill:var(--navy-tint)\"/>\n    <text x=\"20\" y=\"48\" style=\"font-size:14px;fill:var(--ink)\"><tspan style=\"font-weight:700\">1 · Re: Re: Re:<\/tspan>  › Sam wrote: Could you confirm whether an on-premise parser exists?<\/text>\n    <rect x=\"10\" y=\"62\" width=\"550\" height=\"30\" rx=\"4\" style=\"fill:var(--navy-tint)\"/>\n    <text x=\"20\" y=\"82\" style=\"font-size:14px;fill:var(--ink)\"><tspan style=\"font-weight:700\">2 · Re: Re:<\/tspan>  › Sam wrote: Could you confirm whether an on-premise parser exists?<\/text>\n    <rect x=\"10\" y=\"96\" width=\"550\" height=\"30\" rx=\"4\" style=\"fill:var(--navy-tint)\"/>\n    <text x=\"20\" y=\"116\" style=\"font-size:14px;fill:var(--ink)\"><tspan style=\"font-weight:700\">3 · Re:<\/tspan>  › Sam wrote: Could you confirm whether an on-premise parser exists?<\/text>\n    <line x1=\"10\" y1=\"134\" x2=\"560\" y2=\"134\" style=\"stroke:var(--muted);stroke-width:2;stroke-dasharray:6 4\"/>\n    <text x=\"560\" y=\"130\" text-anchor=\"end\" style=\"font-size:12px;fill:var(--muted)\">top 3 ends here<\/text>\n    <rect x=\"10\" y=\"140\" width=\"550\" height=\"30\" rx=\"4\" style=\"fill:var(--card);stroke:var(--line)\"/>\n    <text x=\"20\" y=\"160\" style=\"font-size:14px;fill:var(--muted)\"><tspan style=\"font-weight:700\">4 · vendor A:<\/tspan> an on-premise parser is not on our roadmap before next year.<\/text>\n    <rect x=\"590\" y=\"28\" width=\"400\" height=\"142\" rx=\"14\" style=\"fill:var(--card);stroke:var(--bad);stroke-width:2\"/>\n    <text x=\"608\" y=\"64\" style=\"font-size:16px;fill:var(--ink)\">Sam asked vendor A whe \n## Demo: retrieved but ignored\n\n<div class=\"diagram\"><iframe src=\"content/rag-assets/demos/grounded-answer.html?preset=middle\" style=\"width:100%;height:600px;border:0\" loading=\"lazy\"><\/iframe><\/div>\n\n\n## Case 6: out of date\n\nSam asks: **\"How long do we keep server logs?\"** Which stage broke?\n\n<div class=\"diagram\" id=\"case6\"><svg viewBox=\"0 0 1000 250\" role=\"img\" aria-label=\"The SOP says 14 days, the Content Hub config says 30; the assistant says 14\">\n  <g>\n    <text x=\"10\" y=\"18\" style=\"font-size:14px;font-weight:700;fill:var(--muted)\">WHAT THE SEARCH SENT<\/text>\n    <text x=\"590\" y=\"18\" style=\"font-size:14px;font-weight:700;fill:var(--muted)\">WHAT THE ASSISTANT SAID<\/text>\n    <rect x=\"10\" y=\"28\" width=\"550\" height=\"64\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"22\" y=\"52\" style=\"font-size:14px;font-weight:700;fill:var(--navy)\">SOP-OPS-02 §1 Log retention<\/text>\n    <text x=\"22\" y=\"76\" style=\"font-size:15px;fill:var(--ink)\">Server logs are kept for 14 days on each server, then deleted.<\/text>\n    <rect x=\"10\" y=\"102\" width=\"550\" height=\"64\" rx=\"8\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2;stroke-dasharray:6 4\"/>\n    <text x=\"22\" y=\"126\" style=\"font-size:14px;font-weight:700;fill:var(--muted)\">contenthub-cleanup.xml (not in the top 3)<\/text>\n    <text x=\"22\" y=\"150\" style=\"font-family:var(--mono);font-size:13px;fill:var(--muted)\">&lt;cleanup task=\"server-logs\" retentionDays=\"30\" …/&gt;<\/text>\n    <rect x=\"590\" y=\"28\" width=\"400\" height=\"138\" rx=\"14\" style=\"fill:var(--card);stroke:var(--bad);stroke-width:2\"/>\n    <text x=\"608\" y=\"84\" style=\"font-size:22px;font-weight:700;fill:var(--ink)\">Server logs are kept<\/text>\n    <text x=\"608\" y=\"114\" style=\"font-size:22px;font-weight:700;fill:var(--ink)\">for 14 days.<\/text>\n    <text x=\"608\" y=\"146\" style=\"font-size:14px;fill:var(--muted)\">(no date, no doubt)<\/text>\n  <\/g>\n  <g class=\"rv stage\">\n    <text x=\"520\" y=\"52\" text-anchor=\"end\" style=\"font-size:14px;font-weight:700;fill:var(--bad)\">rev. 2025-11-20<\/text>\n    <text x=\"520\" y=\"126\" text-anchor=\"end\" style=\"font-size:14px;font-weight:700;fill:var(--bad)\">2026-08-04<\/text>\n    <path d=\"M 540 64 C 575 80 575 114 540 132\" style=\"fill:none;stroke:var(--bad);stroke-width:3\"/>\n    <text x=\"285\" y=\"186\" text-anchor=\"middle\" style=\"font-size:14px;font-weight:700;fill:var(--bad)\">the SOP and the config disagree: the content drifted<\/text>\n  <\/g>\n  <g class=\"rv fix\">\n    <rect x=\"10\" y=\"196\" width=\"980\" height=\"50\" rx=\"8\" style=\"fill:var(--card);stroke:var(--good);stroke-width:2\"/>\n    <text x=\"24\" y=\"218\" style=\"font-size:14px;fill:var(--ink)\"><tspan style=\"font-weight:700;fill:var(--good)\">With dates: <\/tspan>SOP-OPS-02 (revised 2025-11-20) says 14 days. The Content Hub cleanup config (2026-08-04)<\/text>\n    <text x=\"24\" y=\"238\" style=\"font-size:14px;fill:var(--ink)\">keeps 30. <tspan style=\"font-weight:700\">They disagree: check with the SOP owner.<\/tspan><\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal Stage | #case6 .stage\n**Data.** The SOP says 14 days, the config 30. That's a data problem, not a model problem.\n:::\n\n::: reveal Fix | #case6 .fix\n**Show the revision date and flag the drift.**\n:::\n\n\n\n## Demo: out of date\n\n<div class=\"diagram\"><iframe src=\"content/rag-assets/demos/grounded-answer.html?preset=contradict\" style=\"width:100%;height:600px;border:0\" loading=\"lazy\"><\/iframe><\/div>\n\n\n## Case 7: the stale status\n\nSam asks: **\"Is vendor B's pricing answer still open?\"** Which stage broke?\n\n<div class=\"diagram\" id=\"case7\"><svg viewBox=\"0 0 1000 250\" role=\"img\" aria-label=\"The nightly index says POC-12 is Open; live Jira says Done since yesterday\">\n  <g>\n    <text x=\"10\" y=\"18\" style=\"font-size:14px;font-weight:700;fill:var(--muted)\">WHAT THE SEARCH SENT<\/text>\n    <text x=\"590\" y=\"18\" style=\"font-size:14px;font-weight:700;fill:var(--muted)\">WHAT THE ASSISTANT SAID<\/text>\n    <rect x=\"10\" y=\"28\" width=\"550\" height=\"64\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"22\" y=\"52\" style=\"font-size:14px;font-weight:700;fill:var(--navy)\">jira snapshot · nightly index<\/text>\n    <text x=\"22\" y=\"76\" style=\"font-size:15px;fill:var(--ink)\">POC-12 Ask vendor B: pricing per GB at 200 GB/day. <tspan style=\"font-weight:700\">Status: Open<\/tspan><\/text>\n    <rect x=\"590\" y=\"28\" width=\"400\" height=\"138\" rx=\"14\" style=\"fill:var(--card);stroke:var(--bad);stroke-width:2\"/>\n    <text x=\"608\" y=\"84\" style=\"font-size:20px;font-weight:700;fill:var(--ink)\">Yes, POC-12 is still open.<\/text>\n    <text x=\"608\" y=\"114\" style=\"font-size:16px;fill:var(--ink)\">Vendor B hasn't answered<\/text>\n    <text x=\"608\" y=\"138\" style=\"font-size:16px;fill:var(--ink)\">on pricing yet.<\/text>\n  <\/g>\n  <g class=\"rv stage\">\n    <rect x=\"4\" y=\"22\" width=\"562\" height=\"76\" rx=\"8\" style=\"fill:none;stroke:var(--bad);stroke-width:3;stroke-dasharray:5 4\"/>\n    <circle cx=\"530\" cy=\"130\" r=\"22\" style=\"fill:var(--card);stroke:var(--bad);stroke-width:3\"/>\n    <line x1=\"530\" y1=\"130\" x2=\"530\" y2=\"116\" style=\"stroke:var(--bad);stroke-width:3\"/>\n    <line x1=\"530\" y1=\"130\" x2=\"541\" y2=\"136\" style=\"stroke:var(--bad);stroke-width:3\"/>\n    <text x=\"22\" y=\"128\" style=\"font-size:15px;font-weight:700;fill:var(--bad)\">Copied last night. Jira changes hourly.<\/text>\n    <text x=\"22\" y=\"152\" style=\"font-size:15px;font-weight:700;fill:var(--bad)\">POC-12 was closed yesterday.<\/text>\n  <\/g>\n  <g class=\"rv fix\">\n    <rect x=\"10\" y=\"182\" width=\"980\" height=\"64\" rx=\"8\" style=\"fill:var(--card);stroke:var(--good);stroke-width:2\"/>\n    <text x=\"24\" y=\"206\" style=\"font-size:14px;font-weight:700;fill:var(--good)\">LIVE TOOL, ASKED NOW<\/text>\n    <text x=\"24\" y=\"232\" style=\"font-size:15px;fill:var(--ink)\"><tspan style=\"font-family:var(--mono)\">jira_search(\"key = POC-12\")<\/tspan>  →  POC-12 <tspan style=\"font-weight:700\">Done<\/tspan> (yesterday). No, it's answered.<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal Stage | #case7 .stage\n**Data.** Jira was indexed like a document. The nightly copy says Open; it was closed yesterday.\n:::\n\n::: reveal Fix | #case7 .fix\n**Don't index fast-changing status.** Make Jira a live tool (flow 8).\n:::\n\n\n\n## Demo: the stale status\n\n<div class=\"diagram\"><iframe src=\"content/rag-assets/demos/search-lab.html?preset=stale\" style=\"width:100%;height:600px;border:0\" loading=\"lazy\"><\/iframe><\/div>\n\n\n\n## Close: seven cases on the map\n\n<div class=\"diagram\" id=\"tally\"><svg viewBox=\"0 0 1000 170\" role=\"img\" aria-label=\"Seven cases placed on six stages; only case 5 is generation\">\n  <g>\n    <rect x=\"10\" y=\"10\" width=\"155\" height=\"40\" rx=\"6\" style=\"fill:var(--navy)\"/>\n    <text x=\"87\" y=\"36\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:#fff\">Parsing<\/text>\n    <rect x=\"175\" y=\"10\" width=\"155\" height=\"40\" rx=\"6\" style=\"fill:var(--navy)\"/>\n    <text x=\"252\" y=\"36\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:#fff\">Chunking<\/text>\n    <rect x=\"340\" y=\"10\" width=\"155\" height=\"40\" rx=\"6\" style=\"fill:var(--navy)\"/>\n    <text x=\"417\" y=\"36\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:#fff\">Embedding<\/text>\n    <rect x=\"505\" y=\"10\" width=\"155\" height=\"40\" rx=\"6\" style=\"fill:var(--navy)\"/>\n    <text x=\"582\" y=\"36\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:#fff\">Retrieval<\/text>\n    <rect x=\"670\" y=\"10\" width=\"155\" height=\"40\" rx=\"6\" style=\"fill:var(--orange)\"/>\n    <text x=\"747\" y=\"36\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:#fff\">Generation<\/text>\n    <rect x=\"835\" y=\"10\" width=\"155\" height=\"40\" rx=\"6\" style=\"fill:var(--navy)\"/>\n    <text x=\"912\" y=\"36\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:#fff\">Data<\/text>\n    <rect x=\"25\" y=\"62\" width=\"125\" height=\"36\" rx=\"18\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"87\" y=\"86\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">3 · echo<\/text>\n    <rect x=\"190\" y=\"62\" width=\"125\" height=\"36\" rx=\"18\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"252\" y=\"86\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">1 · split row<\/text>\n    <rect x=\"355\" y=\"62\" width=\"125\" height=\"36\" rx=\"18\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"417\" y=\"86\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">2 · log IDs<\/text>\n    <rect x=\"520\" y=\"62\" width=\"125\" height=\"36\" rx=\"18\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"582\" y=\"86\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">4 · minutes<\/text>\n    <rect x=\"685\" y=\"62\" width=\"125\" height=\"36\" rx=\"18\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/>\n    <text x=\"747\" y=\"86\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">5 · ignored<\/text>\n    <rect x=\"850\" y=\"62\" width=\"125\" height=\"36\" rx=\"18\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"912\" y=\"86\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">6 · out of date<\/text>\n    <rect x=\"850\" y=\"106\" width=\"125\" height=\"36\" rx=\"18\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"912\" y=\"130\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">7 · stale status<\/text>\n  <\/g>\n<\/svg><\/div>\n\n**Ask:** how many of the seven would a bigger model have fixed?\n\n::: reveal Answer\n**At most one:** case 5. The other six broke before the model, or in the data.\n:::\n\n> *When RAG is wrong, find the stage before you blame the model.*\n\n\n\n---\n"}, "css": ["viewer/student.css", "viewer/theme.css"]};</script>
