<script>window.DECK = {"flow": [{"title": "A confident wrong answer", "file": "content/why-rag/opening.md"}, {"title": "Three ways to hand over knowledge", "file": "content/why-rag/three-ways.md"}, {"title": "Where RAG sits", "file": "content/why-rag/on-the-request.md"}], "files": {"content/why-rag/opening.md": "# A confident wrong answer\n\n*All examples: fictional Contoso Archive Services, modelled on everyday archive-team problems.*\n\n\n## Overview\n\n**Goal:** Tell apart what a model can know from training and what it can only know if we hand it our files.\n\n**Walk out with:** the three gaps (private, recent, specific) and a map of where Contoso's knowledge actually lives.\n\n<div class=\"diagram\" id=\"req-f1p\"><svg viewBox=\"0 0 1000 250\" font-family=\"system-ui,sans-serif\" style=\"max-height:320px\">\n<text x=\"405\" y=\"22\" text-anchor=\"middle\" font-size=\"17\" letter-spacing=\"2\" style=\"fill:var(--muted)\">THE REQUEST WE SEND<\/text>\n<rect x=\"8\" y=\"34\" width=\"794\" height=\"118\" rx=\"14\" style=\"fill:none;stroke:var(--navy);stroke-width:2;stroke-dasharray:7 6\"/>\n<path d=\"M806 93 L838 93\" style=\"stroke:var(--navy);stroke-width:3\"/><path d=\"M838 85 L852 93 L838 101 Z\" style=\"fill:var(--navy)\"/>\n<text x=\"925\" y=\"22\" text-anchor=\"middle\" font-size=\"17\" letter-spacing=\"2\" style=\"fill:var(--muted)\">BACK<\/text>\n<rect x=\"20\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"92\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">System<\/text>\n<text x=\"92\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">prompt<\/text>\n<rect x=\"176\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"248\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">Tool<\/text>\n<text x=\"248\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">definitions<\/text>\n<rect x=\"332\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"404\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">Conversation<\/text>\n<text x=\"404\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">so far<\/text>\n<rect x=\"488\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"560\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">Retrieved<\/text>\n<text x=\"560\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">context<\/text>\n<g class=\"rv n-ret\">\n<rect x=\"488\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:3\"/>\n<text x=\"560\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--ink)\">Retrieved<\/text>\n<text x=\"560\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--ink)\">context<\/text>\n<path d=\"M560 142 L560 166\" style=\"stroke:var(--orange);stroke-width:2\"/>\n<text x=\"560\" y=\"188\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">RAG fills<\/text>\n<text x=\"560\" y=\"211\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">this slot only<\/text>\n<\/g>\n<rect x=\"644\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"716\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">New<\/text>\n<text x=\"716\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">message<\/text>\n<rect x=\"858\" y=\"46\" width=\"134\" height=\"94\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"925\" y=\"100\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">Response<\/text>\n<\/svg><\/div>\n\n::: reveal RAG fills one slot | #req-f1p .n-ret\n:::\n\n\n## Sam asks Copilot\n\n> Sam is on call this week. Between two alert mails Sam asks Copilot: *\"Why did we drop vendor A from the log platform POC?\"*\n\n<div class=\"diagram\" id=\"chat-wrong\"><svg viewBox=\"0 0 1000 250\" font-family=\"system-ui,sans-serif\" style=\"max-height:300px\">\n<rect x=\"380\" y=\"16\" width=\"600\" height=\"56\" rx=\"16\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"400\" y=\"52\" font-size=\"20\" style=\"fill:var(--ink)\">Why did we drop vendor A from the log platform POC?<\/text>\n<text x=\"970\" y=\"94\" text-anchor=\"end\" font-size=\"16\" style=\"fill:var(--muted)\">Sam<\/text>\n<g class=\"rv a-wrong\">\n<rect x=\"20\" y=\"112\" width=\"640\" height=\"56\" rx=\"16\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"40\" y=\"148\" font-size=\"20\" style=\"fill:var(--ink)\">Vendor A was dropped because of high licence costs.<\/text>\n<text x=\"30\" y=\"190\" font-size=\"16\" style=\"fill:var(--muted)\">Copilot, no source shown<\/text>\n<\/g>\n<\/svg><\/div>\n\n::: reveal The answer | #chat-wrong .a-wrong\nConfident, fluent, one clean sentence.\n:::\n\n\n\n## Where did \"licence costs\" come from?\n\n**Ask:** The real reason is in the 2026-10-01 minutes. Where did \"licence costs\" come from? Write one line, then we compare.\n\n<div class=\"diagram\" id=\"no-minutes\"><svg viewBox=\"0 0 1000 260\" font-family=\"system-ui,sans-serif\" style=\"max-height:300px\">\n<rect x=\"30\" y=\"40\" width=\"300\" height=\"180\" rx=\"14\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"180\" y=\"90\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" style=\"fill:var(--navy)\">The model<\/text>\n<text x=\"180\" y=\"124\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">trained on public text<\/text>\n<text x=\"180\" y=\"150\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">\"vendors are often dropped<\/text>\n<text x=\"180\" y=\"174\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">because of cost\"<\/text>\n<rect x=\"660\" y=\"40\" width=\"300\" height=\"180\" rx=\"14\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"810\" y=\"84\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" style=\"fill:var(--ink)\">Minutes 2026-10-01<\/text>\n<text x=\"810\" y=\"118\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">Vendor A dropped: no<\/text>\n<text x=\"810\" y=\"142\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">on-premise parser before<\/text>\n<text x=\"810\" y=\"166\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">next year<\/text>\n<g class=\"rv a-gap\">\n<path d=\"M340 130 L650 130\" style=\"stroke:var(--bad);stroke-width:3;stroke-dasharray:10 8\"/>\n<text x=\"495\" y=\"118\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" style=\"fill:var(--bad)\">never seen<\/text>\n<text x=\"495\" y=\"160\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--muted)\">no path from the file to the model<\/text>\n<\/g>\n<\/svg><\/div>\n\n::: reveal Answer | #no-minutes .a-gap\n**Nowhere.** The model never saw the minutes. It produced the most likely-sounding reason: the one vendors get dropped for most often in what it was trained on.\n:::\n\n\n\n## What the model knows\n\n**Ask:** Sort these into two columns before I reveal: *what a log platform is · Contoso's minutes from 2026-10-01 · how SOPs are usually written · SOP-CH-03 · Priya's OneDrive note · public docs up to the cut-off*.\n\n<table id=\"knows\">\n<thead><tr><th>✅ The model knows<\/th><th>❌ The model can't know<\/th><\/tr><\/thead>\n<tbody>\n<tr class=\"rv k1\"><td>What a log platform is<\/td><td>Contoso's minutes from 2026-10-01<\/td><\/tr>\n<tr class=\"rv k2\"><td>How document archives work in general<\/td><td>Priya's OneDrive note<\/td><\/tr>\n<tr class=\"rv k3\"><td>Public docs up to its cut-off<\/td><td>Anything after its cut-off<\/td><\/tr>\n<tr class=\"rv k4\"><td>How SOPs are usually written<\/td><td>SOP-CH-03<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n::: reveal Pair 1 | #knows .k1\n:::\n::: reveal Pair 2 | #knows .k2\n:::\n::: reveal Pair 3 | #knows .k3\n:::\n::: reveal Pair 4 | #knows .k4\n:::\n\n\n## Three gaps\n\n<div class=\"diagram\" id=\"three-gaps\"><svg viewBox=\"0 0 1000 300\" font-family=\"system-ui,sans-serif\" style=\"max-height:340px\">\n<circle cx=\"500\" cy=\"150\" r=\"78\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"500\" y=\"146\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" style=\"fill:var(--navy)\">What the<\/text>\n<text x=\"500\" y=\"170\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" style=\"fill:var(--navy)\">model saw<\/text>\n<g class=\"rv g1\">\n<rect x=\"20\" y=\"40\" width=\"290\" height=\"110\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n<text x=\"165\" y=\"80\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" style=\"fill:var(--ink)\">Private<\/text>\n<text x=\"165\" y=\"110\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">our files: minutes,<\/text>\n<text x=\"165\" y=\"134\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">Priya's OneDrive note<\/text>\n<\/g>\n<g class=\"rv g2\">\n<rect x=\"690\" y=\"40\" width=\"290\" height=\"110\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n<text x=\"835\" y=\"80\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" style=\"fill:var(--ink)\">Recent<\/text>\n<text x=\"835\" y=\"110\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">after the cut-off:<\/text>\n<text x=\"835\" y=\"134\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">last week's decision<\/text>\n<\/g>\n<g class=\"rv g3\">\n<rect x=\"355\" y=\"236\" width=\"290\" height=\"60\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n<text x=\"500\" y=\"262\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" style=\"fill:var(--ink)\">Specific<\/text>\n<text x=\"500\" y=\"286\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">our names, IDs: KI-014, 7f3a-91c2<\/text>\n<\/g>\n<\/svg><\/div>\n\n::: reveal Private | #three-gaps .g1\n:::\n::: reveal Recent | #three-gaps .g2\n:::\n::: reveal Specific | #three-gaps .g3\n:::\n\n\n\n## Where Contoso's knowledge lives\n\n<div class=\"diagram\" id=\"sources\"><svg viewBox=\"0 0 1000 340\" font-family=\"system-ui,sans-serif\" style=\"max-height:380px\">\n<rect x=\"390\" y=\"140\" width=\"220\" height=\"64\" rx=\"32\" style=\"fill:var(--navy);stroke:var(--navy)\"/>\n<text x=\"500\" y=\"179\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" style=\"fill:#fff\">Sam's question<\/text>\n<g style=\"stroke:var(--line);stroke-width:2\"><path d=\"M420 150 L170 60\"/><path d=\"M500 140 L500 64\"/><path d=\"M580 150 L830 60\"/><path d=\"M390 172 L230 172\"/><path d=\"M610 172 L770 172\"/><path d=\"M430 204 L250 284\"/><path d=\"M570 204 L750 284\"/><\/g>\n<g style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"><rect x=\"40\" y=\"20\" width=\"250\" height=\"64\" rx=\"10\"/><rect x=\"375\" y=\"0\" width=\"250\" height=\"64\" rx=\"10\"/><rect x=\"710\" y=\"20\" width=\"250\" height=\"64\" rx=\"10\"/><rect x=\"0\" y=\"140\" width=\"230\" height=\"64\" rx=\"10\"/><rect x=\"770\" y=\"140\" width=\"230\" height=\"64\" rx=\"10\"/><rect x=\"120\" y=\"270\" width=\"250\" height=\"64\" rx=\"10\"/><rect x=\"630\" y=\"270\" width=\"250\" height=\"64\" rx=\"10\"/><\/g>\n<g font-size=\"19\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\"><text x=\"165\" y=\"48\">Email<\/text><text x=\"500\" y=\"28\">OneDrive<\/text><text x=\"835\" y=\"48\">Content Hub library<\/text><text x=\"115\" y=\"168\">SharePoint minutes<\/text><text x=\"885\" y=\"168\">known-issues.xlsx<\/text><text x=\"245\" y=\"298\">Jira<\/text><text x=\"755\" y=\"298\">Tickets<\/text><\/g>\n<g class=\"rv s-rate\" font-size=\"16\" text-anchor=\"middle\" style=\"fill:var(--orange)\"><text x=\"165\" y=\"72\">daily<\/text><text x=\"500\" y=\"52\">rarely, and unseen<\/text><text x=\"835\" y=\"72\">monthly<\/text><text x=\"115\" y=\"192\">weekly<\/text><text x=\"885\" y=\"192\">when someone remembers<\/text><text x=\"245\" y=\"322\">hourly<\/text><text x=\"755\" y=\"322\">hourly<\/text><\/g>\n<\/svg><\/div>\n\n::: reveal How often each changes | #sources .s-rate\n:::\n\n\n\n## Search it or ask it live?\n\n**Ask:** Of these seven, which would you **search** like a library, and which would you **ask live** like a colleague? Mark each with S or L on your sheet.\n\n| Source | What's in it | Changes |\n|---|---|---|\n| Email | Alert mails, vendor threads | Daily |\n| OneDrive | Personal notes, the only copy of fixes | Rarely, and unseen |\n| Content Hub library | SOPs, designs, policies | Monthly |\n| SharePoint stream folder | Approved minutes | Weekly |\n| `known-issues.xlsx` | One row per known problem | When someone remembers |\n| Jira | Status of asks, actions and decisions | Hourly |\n| Tickets | Past cases per tenant | Hourly |\n\n\n\n---\n", "content/why-rag/three-ways.md": "# Three ways to hand over knowledge\n\n\n## Overview\n\n**Goal:** Choose between pasting, fine-tuning and RAG for a given Contoso source, and walk the RAG loop on the vendor A question.\n\n**Walk out with:** question → retrieve → augment → generate, and why RAG is the one that shows its source by design.\n\n\n## Three options\n\n<div class=\"diagram\" id=\"three-opts\"><svg viewBox=\"0 0 1000 300\" font-family=\"system-ui,sans-serif\" style=\"max-height:360px\">\n<g class=\"rv o1\">\n<rect x=\"10\" y=\"20\" width=\"310\" height=\"260\" rx=\"14\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"165\" y=\"62\" text-anchor=\"middle\" font-size=\"23\" font-weight=\"700\" style=\"fill:var(--navy)\">Paste it<\/text>\n<rect x=\"60\" y=\"90\" width=\"210\" height=\"110\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--line)\"/>\n<text x=\"165\" y=\"130\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">chat window<\/text>\n<rect x=\"85\" y=\"146\" width=\"160\" height=\"40\" rx=\"6\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/>\n<text x=\"165\" y=\"172\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">SOP-CH-03, pasted<\/text>\n<text x=\"165\" y=\"245\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--muted)\">you pick the document<\/text>\n<\/g>\n<g class=\"rv o2\">\n<rect x=\"345\" y=\"20\" width=\"310\" height=\"260\" rx=\"14\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"500\" y=\"62\" text-anchor=\"middle\" font-size=\"23\" font-weight=\"700\" style=\"fill:var(--navy)\">Fine-tune<\/text>\n<rect x=\"395\" y=\"90\" width=\"90\" height=\"110\" rx=\"6\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/>\n<text x=\"440\" y=\"140\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--ink)\">5 years<\/text>\n<text x=\"440\" y=\"160\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--ink)\">of minutes<\/text>\n<path d=\"M490 145 L520 145\" style=\"stroke:var(--navy);stroke-width:3\"/><path d=\"M520 138 L532 145 L520 152 Z\" style=\"fill:var(--navy)\"/>\n<circle cx=\"570\" cy=\"145\" r=\"36\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"570\" y=\"151\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--navy)\">weights<\/text>\n<text x=\"500\" y=\"245\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--muted)\">baked into the model<\/text>\n<\/g>\n<g class=\"rv o3\">\n<rect x=\"680\" y=\"20\" width=\"310\" height=\"260\" rx=\"14\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:3\"/>\n<text x=\"835\" y=\"62\" text-anchor=\"middle\" font-size=\"23\" font-weight=\"700\" style=\"fill:var(--ink)\">RAG<\/text>\n<g style=\"fill:var(--card);stroke:var(--line)\"><rect x=\"710\" y=\"90\" width=\"60\" height=\"34\" rx=\"4\"/><rect x=\"710\" y=\"130\" width=\"60\" height=\"34\" rx=\"4\"/><rect x=\"710\" y=\"170\" width=\"60\" height=\"34\" rx=\"4\"/><\/g>\n<text x=\"740\" y=\"226\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--muted)\">all docs<\/text>\n<path d=\"M778 147 L828 147\" style=\"stroke:var(--orange);stroke-width:3\"/><path d=\"M828 140 L840 147 L828 154 Z\" style=\"fill:var(--orange)\"/>\n<rect x=\"850\" y=\"112\" width=\"110\" height=\"70\" rx=\"6\" style=\"fill:var(--card);stroke:var(--orange);stroke-width:2\"/>\n<text x=\"905\" y=\"143\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--ink)\">4 best<\/text>\n<text x=\"905\" y=\"163\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--ink)\">passages<\/text>\n<text x=\"835\" y=\"260\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">search, then paste the best<\/text>\n<\/g>\n<\/svg><\/div>\n\n::: reveal Paste it | #three-opts .o1\n:::\n::: reveal Fine-tune | #three-opts .o2\n:::\n::: reveal RAG | #three-opts .o3\n:::\n\n\n## How each one works\n\n| | Paste it into the prompt | Fine-tune | RAG |\n|---|---|---|---|\n| How | Copy the SOP into the chat | Train the model further on our documents | Search our documents and paste only the best passages |\n| Example | Paste SOP-CH-03 and ask | Train on 5 years of minutes | Search everything for \"vendor A\" and send 4 passages |\n\n**Ask:** Which of these have you already done this month without calling it anything?\n\n::: reveal Answer\n**Pasting.** Most of the room has pasted an SOP or a log into a chat. That's the manual version of the third column.\n:::\n\n\n## Where each one breaks\n\n<table id=\"breaks\">\n<thead><tr><th><\/th><th>Paste it<\/th><th>Fine-tune<\/th><th>RAG<\/th><\/tr><\/thead>\n<tbody>\n<tr class=\"rv b1\"><td><b>Breaks when<\/b><\/td><td>Docs don't fit, or you don't know which doc<\/td><td>Facts change weekly; it can't cite<\/td><td>Search finds the wrong passage<\/td><\/tr>\n<tr class=\"rv b2\"><td><b>Shows its source<\/b><\/td><td>Yes<\/td><td>No<\/td><td>Yes, by design<\/td><\/tr>\n<tr class=\"rv b3\"><td><b>Good for<\/b><\/td><td>One document, once<\/td><td>Style, format, vocabulary<\/td><td>Many changing documents<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n::: reveal Breaks when | #breaks .b1\n:::\n::: reveal Shows its source | #breaks .b2\n:::\n::: reveal Good for | #breaks .b3\n:::\n\n**Ask:** The minutes change after every meeting. Which one would you use?\n\n::: reveal Answer\n**RAG.** The minutes change weekly, there are many of them, and we need to see where the answer came from.\n:::\n\n\n## The loop\n\n<div class=\"diagram\" id=\"loop\"><svg viewBox=\"0 0 1000 250\" font-family=\"system-ui,sans-serif\" style=\"max-height:320px\">\n<rect x=\"10\" y=\"80\" width=\"170\" height=\"80\" rx=\"40\" style=\"fill:var(--navy);stroke:var(--navy)\"/>\n<text x=\"95\" y=\"127\" text-anchor=\"middle\" font-size=\"21\" font-weight=\"700\" style=\"fill:#fff\">Question<\/text>\n<g class=\"rv l1\">\n<path d=\"M184 120 L232 120\" style=\"stroke:var(--navy);stroke-width:3\"/><path d=\"M232 112 L246 120 L232 128 Z\" style=\"fill:var(--navy)\"/>\n<rect x=\"250\" y=\"70\" width=\"210\" height=\"100\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:3\"/>\n<text x=\"355\" y=\"112\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" style=\"fill:var(--ink)\">Retrieve<\/text>\n<text x=\"355\" y=\"142\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">search our documents<\/text>\n<g style=\"fill:var(--card);stroke:var(--line)\"><rect x=\"270\" y=\"196\" width=\"50\" height=\"40\" rx=\"4\"/><rect x=\"330\" y=\"196\" width=\"50\" height=\"40\" rx=\"4\"/><rect x=\"390\" y=\"196\" width=\"50\" height=\"40\" rx=\"4\"/><\/g>\n<path d=\"M355 172 L355 192\" style=\"stroke:var(--orange);stroke-width:2;stroke-dasharray:4 4\"/>\n<\/g>\n<g class=\"rv l2\">\n<path d=\"M464 120 L512 120\" style=\"stroke:var(--navy);stroke-width:3\"/><path d=\"M512 112 L526 120 L512 128 Z\" style=\"fill:var(--navy)\"/>\n<rect x=\"530\" y=\"70\" width=\"210\" height=\"100\" rx=\"12\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"635\" y=\"112\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" style=\"fill:var(--navy)\">Augment<\/text>\n<text x=\"635\" y=\"142\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">passages into the prompt<\/text>\n<\/g>\n<g class=\"rv l3\">\n<path d=\"M744 120 L792 120\" style=\"stroke:var(--navy);stroke-width:3\"/><path d=\"M792 112 L806 120 L792 128 Z\" style=\"fill:var(--navy)\"/>\n<rect x=\"810\" y=\"70\" width=\"180\" height=\"100\" rx=\"12\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"900\" y=\"112\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" style=\"fill:var(--navy)\">Generate<\/text>\n<text x=\"900\" y=\"142\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">answer + citations<\/text>\n<\/g>\n<\/svg><\/div>\n\n::: reveal Retrieve | #loop .l1\n:::\n::: reveal Augment | #loop .l2\n:::\n::: reveal Generate | #loop .l3\n:::\n\n\n## The loop on vendor A\n\n1. **Question:** \"Why did we drop vendor A?\"\n2. **Retrieve:** minutes 2026-10-01 §Decision, minutes 2026-09-17 §Vendor A demo, SD-LOG-01 §Requirements.\n\n::: reveal 3. Augment\nThe system prompt says *\"answer only from the passages and cite each claim\"*; the passages are added, then the question.\n:::\n\n::: reveal 4. Generate\n\"Vendor A was dropped on 2026-10-01 because its collector parses logs in vendor A's cloud and no on-premise parser exists before next year **[minutes 2026-10-01]**. Logs can carry user and document identifiers, so they must stay on-premise **[SD-LOG-01 §2]**.\"\n:::\n\n\n## Demo: the RAG loop\n\n<div class=\"diagram\"><iframe src=\"content/rag-assets/demos/rag-loop.html?preset=off\" style=\"width:100%;height:600px;border:0\" loading=\"lazy\"><\/iframe><\/div>\n\n\n---\n\n\n## Background and questions: three ways and the loop\n\n**In plain words:** RAG is an open-book exam. We don't change what the model learned; we search our files for the right pages and lay them on the desk next to the question, with a rule to answer from those pages and say which one.\n\n**An everyday picture:** paste is handing a colleague one printout. Fine-tuning is sending them on a year-long course: they come back fluent, but they can't tell you which lecture a fact came from, and the course was out of date by the time they finished. RAG is a good librarian who brings the three right pages and marks the lines.\n\n**Words they'll hear (and their slot on the request):**\n\n- *retrieve, top-k*: how the passages were picked (**retrieved context**)\n- *augment, prompt template*: where the passages sit (**retrieved context**, under a **system prompt** rule)\n- *grounded answer, citation*: the **response**\n\n**If they ask…**\n\n- *\"Why not fine-tune?\"* Because facts here change weekly, fine-tuning can't cite, and retraining for every meeting isn't realistic. Fine-tuning is for style, format and vocabulary.\n- *\"Isn't a long context window enough? Just paste everything.\"* Not once there are hundreds of documents, and long prompts get used worse in the middle (flow 5). You also pay for every token on every question.\n- *\"Is this what Copilot does?\"* Yes, over Microsoft Graph. Next topic.\n", "content/why-rag/on-the-request.md": "# Where RAG sits\n\n\n## Overview\n\n**Goal:** Place every RAG term on the six-part request, and say what Copilot already does for us and what it hides.\n\n**Walk out with:** RAG fills one slot, the retrieved context; and the question \"which passages were retrieved?\" is the one to ask when an answer is wrong.\n\n\n## Six slots on the request\n\n**Ask:** A request has six parts. RAG fills exactly one. Which?\n\n<div class=\"diagram\" id=\"req-f1\"><svg viewBox=\"0 0 1000 250\" font-family=\"system-ui,sans-serif\" style=\"max-height:320px\">\n<text x=\"405\" y=\"22\" text-anchor=\"middle\" font-size=\"17\" letter-spacing=\"2\" style=\"fill:var(--muted)\">THE REQUEST WE SEND<\/text>\n<rect x=\"8\" y=\"34\" width=\"794\" height=\"118\" rx=\"14\" style=\"fill:none;stroke:var(--navy);stroke-width:2;stroke-dasharray:7 6\"/>\n<path d=\"M806 93 L838 93\" style=\"stroke:var(--navy);stroke-width:3\"/><path d=\"M838 85 L852 93 L838 101 Z\" style=\"fill:var(--navy)\"/>\n<text x=\"925\" y=\"22\" text-anchor=\"middle\" font-size=\"17\" letter-spacing=\"2\" style=\"fill:var(--muted)\">BACK<\/text>\n<rect x=\"20\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"92\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">System<\/text>\n<text x=\"92\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">prompt<\/text>\n<g class=\"rv n-sys\">\n<path d=\"M92 142 L92 166\" style=\"stroke:var(--orange);stroke-width:2\"/>\n<text x=\"92\" y=\"188\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">grounding<\/text>\n<text x=\"92\" y=\"211\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">instruction<\/text>\n<\/g>\n<rect x=\"176\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"248\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">Tool<\/text>\n<text x=\"248\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">definitions<\/text>\n<g class=\"rv n-tools\">\n<path d=\"M248 142 L248 166\" style=\"stroke:var(--orange);stroke-width:2\"/>\n<text x=\"248\" y=\"188\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">retrieval tool,<\/text>\n<text x=\"248\" y=\"211\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">jira_search<\/text>\n<\/g>\n<rect x=\"332\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"404\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">Conversation<\/text>\n<text x=\"404\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">so far<\/text>\n<rect x=\"488\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"560\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">Retrieved<\/text>\n<text x=\"560\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">context<\/text>\n<g class=\"rv n-ret\">\n<rect x=\"488\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:3\"/>\n<text x=\"560\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--ink)\">Retrieved<\/text>\n<text x=\"560\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" style=\"fill:var(--ink)\">context<\/text>\n<path d=\"M560 142 L560 166\" style=\"stroke:var(--orange);stroke-width:2\"/>\n<text x=\"560\" y=\"188\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">chunk, embedding,<\/text>\n<text x=\"560\" y=\"211\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">top-k, rerank<\/text>\n<\/g>\n<rect x=\"644\" y=\"46\" width=\"144\" height=\"94\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"716\" y=\"88\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">New<\/text>\n<text x=\"716\" y=\"112\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">message<\/text>\n<g class=\"rv n-msg\">\n<path d=\"M716 142 L716 166\" style=\"stroke:var(--orange);stroke-width:2\"/>\n<text x=\"716\" y=\"188\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">query rewrite<\/text>\n<text x=\"716\" y=\"211\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">(before search)<\/text>\n<\/g>\n<rect x=\"858\" y=\"46\" width=\"134\" height=\"94\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n<text x=\"925\" y=\"100\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"400\" style=\"fill:var(--muted)\">Response<\/text>\n<g class=\"rv n-resp\">\n<path d=\"M925 142 L925 166\" style=\"stroke:var(--orange);stroke-width:2\"/>\n<text x=\"925\" y=\"188\" text-anchor=\"middle\" font-size=\"17\" style=\"fill:var(--ink)\">citation<\/text>\n<\/g>\n<\/svg><\/div>\n\n::: reveal Answer | #req-f1 .n-ret\n**Retrieved context.** That's the slot RAG fills: chunks chosen by embedding search, top-k, rerank.\n:::\n::: reveal Grounding instruction | #req-f1 .n-sys\n:::\n::: reveal Retrieval as a tool | #req-f1 .n-tools\n:::\n::: reveal Query rewrite | #req-f1 .n-msg\n:::\n::: reveal Citation | #req-f1 .n-resp\n:::\n\n\n## Each word, its slot\n\n| Term | Where it sits |\n|---|---|\n| chunk, embedding, top-k, rerank | retrieved context (how it was chosen) |\n| grounding instruction | system prompt |\n| query rewrite | new message (before search) |\n| citation | response |\n| retrieval as a tool, `jira_search` | tool definitions |\n\n**Ask:** \"Reranking\" will come up in flow 4. Without knowing what it is, which slot does it change?\n\n::: reveal Answer\n**Retrieved context.** It changes *which* passages go in, and in what order. Not the rules, not the question.\n:::\n\n\n## Copilot already does RAG\n\n<div class=\"diagram\" id=\"graph\"><svg viewBox=\"0 0 1000 300\" font-family=\"system-ui,sans-serif\" style=\"max-height:360px\">\n<rect x=\"10\" y=\"110\" width=\"130\" height=\"70\" rx=\"35\" style=\"fill:var(--navy);stroke:var(--navy)\"/>\n<text x=\"75\" y=\"152\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" style=\"fill:#fff\">Sam<\/text>\n<path d=\"M144 145 L186 145\" style=\"stroke:var(--navy);stroke-width:3\"/><path d=\"M186 138 L198 145 L186 152 Z\" style=\"fill:var(--navy)\"/>\n<rect x=\"200\" y=\"105\" width=\"180\" height=\"80\" rx=\"12\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"290\" y=\"152\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" style=\"fill:var(--navy)\">Copilot chat<\/text>\n<path d=\"M384 145 L426 145\" style=\"stroke:var(--navy);stroke-width:3\"/><path d=\"M426 138 L438 145 L426 152 Z\" style=\"fill:var(--navy)\"/>\n<rect x=\"440\" y=\"95\" width=\"200\" height=\"100\" rx=\"12\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"540\" y=\"136\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" style=\"fill:var(--navy)\">Microsoft Graph<\/text>\n<text x=\"540\" y=\"164\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--good)\">only what Sam may see<\/text>\n<g style=\"stroke:var(--line);stroke-width:2\"><path d=\"M644 120 L720 45\"/><path d=\"M644 135 L720 115\"/><path d=\"M644 155 L720 185\"/><path d=\"M644 170 L720 255\"/><\/g>\n<g style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"><rect x=\"720\" y=\"20\" width=\"270\" height=\"50\" rx=\"8\"/><rect x=\"720\" y=\"90\" width=\"270\" height=\"50\" rx=\"8\"/><rect x=\"720\" y=\"160\" width=\"270\" height=\"50\" rx=\"8\"/><rect x=\"720\" y=\"230\" width=\"270\" height=\"50\" rx=\"8\"/><\/g>\n<g font-size=\"18\" text-anchor=\"middle\" style=\"fill:var(--ink)\"><text x=\"855\" y=\"51\">Sam's mail<\/text><text x=\"855\" y=\"121\">Sam's OneDrive<\/text><text x=\"855\" y=\"191\">Teams<\/text><text x=\"855\" y=\"261\">SharePoint sites Sam can open<\/text><\/g>\n<g class=\"rv ab\">\n<rect x=\"700\" y=\"80\" width=\"300\" height=\"210\" rx=\"12\" style=\"fill:none;stroke:var(--orange);stroke-width:3;stroke-dasharray:9 6\"/>\n<text x=\"540\" y=\"240\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" style=\"fill:var(--orange)\">Agent builder:<\/text>\n<text x=\"540\" y=\"264\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">\"only the SOP library<\/text>\n<text x=\"540\" y=\"286\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">and the POC folder\"<\/text>\n<\/g>\n<\/svg><\/div>\n\n::: reveal Agent builder narrows it | #graph .ab\n:::\n\n\n\n## What you can't see\n\n**Ask:** When Copilot's answer is wrong, what would you want to see?\n\n<div class=\"diagram\" id=\"blackbox\"><svg viewBox=\"0 0 1000 200\" font-family=\"system-ui,sans-serif\" style=\"max-height:260px\">\n<rect x=\"10\" y=\"60\" width=\"170\" height=\"70\" rx=\"35\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n<text x=\"95\" y=\"102\" text-anchor=\"middle\" font-size=\"18\" style=\"fill:var(--navy)\">question<\/text>\n<rect x=\"230\" y=\"20\" width=\"540\" height=\"150\" rx=\"14\" style=\"fill:var(--ink);stroke:var(--ink)\"/>\n<g font-size=\"18\" text-anchor=\"middle\" style=\"fill:#fff\"><text x=\"320\" y=\"85\">how files<\/text><text x=\"320\" y=\"108\">were cut up?<\/text><text x=\"500\" y=\"85\">how they<\/text><text x=\"500\" y=\"108\">were searched?<\/text><text x=\"680\" y=\"85\">which passages<\/text><text x=\"680\" y=\"108\">went in?<\/text><\/g>\n<path d=\"M184 95 L226 95\" style=\"stroke:var(--navy);stroke-width:3\"/>\n<path d=\"M774 95 L816 95\" style=\"stroke:var(--navy);stroke-width:3\"/>\n<rect x=\"820\" y=\"60\" width=\"170\" height=\"70\" rx=\"35\" style=\"fill:var(--bad-tint);stroke:var(--bad);stroke-width:2\"/>\n<text x=\"905\" y=\"102\" text-anchor=\"middle\" font-size=\"18\" style=\"fill:var(--bad)\">wrong answer<\/text>\n<\/svg><\/div>\n\n::: reveal Answer\n**The passages that were retrieved.** How the files were cut up, how they were searched, which passages went in: that's the rest of the day.\n:::\n\n\n## The backbone\n\n<div class=\"diagram\" id=\"backbone\"><svg viewBox=\"0 0 1000 230\" font-family=\"system-ui,sans-serif\" style=\"max-height:320px\">\n<text x=\"500\" y=\"24\" text-anchor=\"middle\" font-size=\"18\" letter-spacing=\"2\" style=\"fill:var(--muted)\">THE TEAM ASSISTANT BACKBONE<\/text>\n<g><rect x=\"8\" y=\"60\" width=\"108\" height=\"80\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/><text x=\"62.0\" y=\"106\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"500\" style=\"fill:var(--navy)\">Channels<\/text><\/g>\n<path d=\"M118 100 L128 100\" style=\"stroke:var(--muted);stroke-width:2\"/><path d=\"M128 95 L133 100 L128 105 Z\" style=\"fill:var(--muted)\"/>\n<g><rect x=\"132\" y=\"60\" width=\"108\" height=\"80\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/><text x=\"186.0\" y=\"106\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"500\" style=\"fill:var(--navy)\">Intake<\/text><\/g>\n<path d=\"M242 100 L252 100\" style=\"stroke:var(--muted);stroke-width:2\"/><path d=\"M252 95 L257 100 L252 105 Z\" style=\"fill:var(--muted)\"/>\n<g><rect x=\"256\" y=\"60\" width=\"108\" height=\"80\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/><text x=\"310.0\" y=\"106\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"500\" style=\"fill:var(--navy)\">Memory<\/text><\/g>\n<path d=\"M366 100 L376 100\" style=\"stroke:var(--muted);stroke-width:2\"/><path d=\"M376 95 L381 100 L376 105 Z\" style=\"fill:var(--muted)\"/>\n<g class=\"rv b-new\"><rect x=\"380\" y=\"60\" width=\"108\" height=\"80\" rx=\"10\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:4\"/><text x=\"434.0\" y=\"106\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" style=\"fill:var(--ink)\">Retrieval<\/text><\/g>\n<path d=\"M490 100 L500 100\" style=\"stroke:var(--muted);stroke-width:2\"/><path d=\"M500 95 L505 100 L500 105 Z\" style=\"fill:var(--muted)\"/>\n<g><rect x=\"504\" y=\"60\" width=\"108\" height=\"80\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/><text x=\"558.0\" y=\"106\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"500\" style=\"fill:var(--navy)\">Reasoning<\/text><\/g>\n<path d=\"M614 100 L624 100\" style=\"stroke:var(--muted);stroke-width:2\"/><path d=\"M624 95 L629 100 L624 105 Z\" style=\"fill:var(--muted)\"/>\n<g><rect x=\"628\" y=\"60\" width=\"108\" height=\"80\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/><text x=\"682.0\" y=\"100\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"500\" style=\"fill:var(--navy)\">Tools<\/text><text x=\"682.0\" y=\"122\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--muted)\">read-only<\/text><\/g>\n<path d=\"M738 100 L748 100\" style=\"stroke:var(--muted);stroke-width:2\"/><path d=\"M748 95 L753 100 L748 105 Z\" style=\"fill:var(--muted)\"/>\n<g><rect x=\"752\" y=\"60\" width=\"108\" height=\"80\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/><text x=\"806.0\" y=\"106\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"500\" style=\"fill:var(--navy)\">Approval<\/text><\/g>\n<path d=\"M862 100 L872 100\" style=\"stroke:var(--muted);stroke-width:2\"/><path d=\"M872 95 L877 100 L872 105 Z\" style=\"fill:var(--muted)\"/>\n<g><rect x=\"876\" y=\"60\" width=\"108\" height=\"80\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/><text x=\"930.0\" y=\"106\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"500\" style=\"fill:var(--navy)\">Log<\/text><\/g>\n<g class=\"rv b-new\"><text x=\"434\" y=\"172\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" style=\"fill:var(--orange)\">new today<\/text><text x=\"434\" y=\"196\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">search our files, hand over the page<\/text><\/g>\n<g><text x=\"628\" y=\"172\" font-size=\"16\" style=\"fill:var(--muted)\">acting (write tools)<\/text><text x=\"628\" y=\"194\" font-size=\"16\" style=\"fill:var(--muted)\">comes in a later session<\/text><\/g>\n<\/svg><\/div>\n\n::: reveal Retrieval, new today | #backbone .b-new\n:::\n\n\n\n> *The model only knows what's on the page you hand it.*\n\n---\n"}, "css": ["viewer/student.css", "viewer/theme.css"]};</script>
