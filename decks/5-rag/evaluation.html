<script>window.DECK = {"flow": [{"title": "Is it better? The golden set", "file": "content/evaluation/golden-set.md"}, {"title": "Retrieval metrics", "file": "content/evaluation/retrieval-metrics.md"}, {"title": "Answer metrics: the RAG triad", "file": "content/evaluation/answer-metrics.md"}, {"title": "Tools, cost and the habit", "file": "content/evaluation/tools-and-close.md"}], "files": {"content/evaluation/golden-set.md": "# Is it better? The golden set\n\n## Overview\n\n**Goal:** Say whether a change to the pipeline made it better, with a fixed question set instead of a feeling.\n\n**Walk out with:** the golden set: question, what it must retrieve, what it must say, including one question with no answer.\n\n\n## Is it better?\n\n> After flow 6, Sam's team switched the known-issues sheet from fixed chunks to one row per chunk.\n\n<div class=\"diagram\" id=\"better\"><svg viewBox=\"0 0 1000 190\" role=\"img\" aria-label=\"The old pipeline with fixed chunks and the new one with one row per chunk; which is better?\">\n  <defs><marker id=\"gs-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--muted)\"/><\/marker><\/defs>\n  <g>\n    <rect x=\"20\" y=\"20\" width=\"360\" height=\"110\" rx=\"12\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n    <text x=\"200\" y=\"54\" text-anchor=\"middle\" style=\"font-size:18px;font-weight:700;fill:var(--muted)\">BEFORE<\/text>\n    <text x=\"200\" y=\"84\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--ink)\">fixed 500-token chunks<\/text>\n    <text x=\"200\" y=\"110\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--muted)\">KI-014 cut in half<\/text>\n    <rect x=\"620\" y=\"20\" width=\"360\" height=\"110\" rx=\"12\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"800\" y=\"54\" text-anchor=\"middle\" style=\"font-size:18px;font-weight:700;fill:var(--navy)\">AFTER<\/text>\n    <text x=\"800\" y=\"84\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--ink)\">one row per chunk<\/text>\n    <text x=\"800\" y=\"110\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--muted)\">KI-014 whole<\/text>\n    <line x1=\"390\" y1=\"75\" x2=\"610\" y2=\"75\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#gs-a)\"/>\n    <text x=\"500\" y=\"62\" text-anchor=\"middle\" style=\"font-size:34px;font-weight:700;fill:var(--orange)\">?<\/text>\n  <\/g>\n  <g class=\"rv loop\">\n    <rect x=\"250\" y=\"146\" width=\"500\" height=\"38\" rx=\"19\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"500\" y=\"171\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:var(--ink)\">same questions · numbers · on every change<\/text>\n  <\/g>\n<\/svg><\/div>\n\n**Ask:** is it better? How would you know without asking 50 questions by hand?\n\n::: reveal Answer | #better .loop\n**A fixed question set and numbers, run on every change.**\n:::\n\n\n\n## The golden set\n\n<div class=\"diagram\" id=\"golden\"><svg viewBox=\"0 0 1000 300\" role=\"img\" aria-label=\"Golden set: five questions with what they must retrieve and what they must say\">\n  <g>\n    <rect x=\"10\" y=\"4\" width=\"980\" height=\"40\" rx=\"6\" style=\"fill:var(--navy)\"/>\n    <text x=\"24\" y=\"31\" style=\"font-size:17px;font-weight:700;fill:#fff\">Question<\/text>\n    <text x=\"400\" y=\"31\" style=\"font-size:17px;font-weight:700;fill:#fff\">Must retrieve<\/text>\n    <text x=\"680\" y=\"31\" style=\"font-size:17px;font-weight:700;fill:#fff\">Must say<\/text>\n  <\/g>\n  <g class=\"rv g1\">\n    <rect x=\"10\" y=\"48\" width=\"980\" height=\"46\" rx=\"6\" style=\"fill:var(--navy-tint)\"/>\n    <text x=\"24\" y=\"76\" style=\"font-size:15px;fill:var(--ink)\">Why did we drop vendor A?<\/text>\n    <text x=\"400\" y=\"76\" style=\"font-size:15px;fill:var(--ink)\">minutes 2026-10-01<\/text>\n    <text x=\"680\" y=\"76\" style=\"font-size:15px;fill:var(--ink)\">no on-premise parser; the date<\/text>\n  <\/g>\n  <g class=\"rv g2\">\n    <rect x=\"10\" y=\"98\" width=\"980\" height=\"46\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/>\n    <text x=\"24\" y=\"117\" style=\"font-size:15px;fill:var(--ink)\">Search returns nothing for one tenant<\/text>\n    <text x=\"24\" y=\"137\" style=\"font-size:15px;fill:var(--ink)\">on Content Hub<\/text>\n    <text x=\"400\" y=\"126\" style=\"font-size:15px;fill:var(--ink)\">KI-014, SOP-CH-03 §3–4<\/text>\n    <text x=\"680\" y=\"126\" style=\"font-size:15px;fill:var(--ink)\">index queue; index worker<\/text>\n  <\/g>\n  <g class=\"rv g3\">\n    <rect x=\"10\" y=\"148\" width=\"980\" height=\"46\" rx=\"6\" style=\"fill:var(--navy-tint)\"/>\n    <text x=\"24\" y=\"176\" style=\"font-size:15px;fill:var(--ink)\">What happened with 7f3a-91c2?<\/text>\n    <text x=\"400\" y=\"176\" style=\"font-size:15px;fill:var(--ink)\">KI-022, the transfer.log line<\/text>\n    <text x=\"680\" y=\"176\" style=\"font-size:15px;fill:var(--ink)\">timeout; reprocess after 06:00<\/text>\n  <\/g>\n  <g class=\"rv g4\">\n    <rect x=\"10\" y=\"198\" width=\"980\" height=\"46\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/>\n    <text x=\"24\" y=\"226\" style=\"font-size:15px;fill:var(--ink)\">How long do we keep deleted mailboxes?<\/text>\n    <text x=\"400\" y=\"226\" style=\"font-size:15px;fill:var(--ink)\">POL-RET-01<\/text>\n    <text x=\"680\" y=\"226\" style=\"font-size:15px;fill:var(--ink)\">the period from the policy<\/text>\n  <\/g>\n  <g class=\"rv g5\">\n    <rect x=\"10\" y=\"248\" width=\"980\" height=\"46\" rx=\"6\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/>\n    <text x=\"24\" y=\"267\" style=\"font-size:15px;fill:var(--ink)\">What did vendor C say about<\/text>\n    <text x=\"24\" y=\"287\" style=\"font-size:15px;fill:var(--ink)\">Windows Server 2019?<\/text>\n    <text x=\"400\" y=\"276\" style=\"font-size:15px;font-style:italic;fill:var(--muted)\">(nothing)<\/text>\n    <text x=\"680\" y=\"276\" style=\"font-size:15px;font-weight:700;fill:var(--ink)\">says it doesn't know<\/text>\n  <\/g>\n<\/svg><\/div>\n\n**Ask:** for each question, what must come back, and what must the answer say?\n\n::: reveal Vendor A | #golden .g1\n:::\n::: reveal Empty search | #golden .g2\n:::\n::: reveal 7f3a-91c2 | #golden .g3\n:::\n::: reveal Deleted mailboxes | #golden .g4\n:::\n::: reveal Vendor C | #golden .g5\n:::\n\n\n\n## The row with no answer\n\n<div class=\"diagram\" id=\"nothing\"><svg viewBox=\"0 0 1000 220\" role=\"img\" aria-label=\"Two answers to the vendor C question: the invented one fails, the honest one passes\">\n  <g>\n    <rect x=\"10\" y=\"10\" width=\"470\" height=\"200\" rx=\"14\" style=\"fill:var(--card);stroke:var(--bad);stroke-width:2\"/>\n    <text x=\"30\" y=\"44\" style=\"font-size:15px;font-weight:700;fill:var(--bad)\">ANSWER A<\/text>\n    <text x=\"30\" y=\"90\" style=\"font-size:20px;fill:var(--ink)\">\"Vendor C supports<\/text>\n    <text x=\"30\" y=\"118\" style=\"font-size:20px;fill:var(--ink)\">Windows Server 2019.\"<\/text>\n  <\/g>\n  <g>\n    <rect x=\"520\" y=\"10\" width=\"470\" height=\"200\" rx=\"14\" style=\"fill:var(--card);stroke:var(--good);stroke-width:2\"/>\n    <text x=\"540\" y=\"44\" style=\"font-size:15px;font-weight:700;fill:var(--good)\">ANSWER B<\/text>\n    <text x=\"540\" y=\"78\" style=\"font-size:16px;fill:var(--ink)\">\"I don't find vendor C and Windows Server<\/text>\n    <text x=\"540\" y=\"102\" style=\"font-size:16px;fill:var(--ink)\">2019 in the POC minutes or mail. Vendor B<\/text>\n    <text x=\"540\" y=\"126\" style=\"font-size:16px;fill:var(--ink)\">asked about it on 2026-09-24 (POC-13).<\/text>\n    <text x=\"540\" y=\"150\" style=\"font-size:16px;fill:var(--ink)\">Should I add an ask for vendor C?\"<\/text>\n  <\/g>\n  <g class=\"rv verdict\">\n    <rect x=\"30\" y=\"160\" width=\"120\" height=\"36\" rx=\"18\" style=\"fill:var(--bad)\"/>\n    <text x=\"90\" y=\"184\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:#fff\">FAIL<\/text>\n    <rect x=\"850\" y=\"160\" width=\"120\" height=\"36\" rx=\"18\" style=\"fill:var(--good)\"/>\n    <text x=\"910\" y=\"184\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:#fff\">PASS<\/text>\n  <\/g>\n<\/svg><\/div>\n\n**Ask:** why put a question with no answer in the set?\n\n::: reveal Answer | #nothing .verdict\n**To catch the invented answer.** A pipeline that always answers can score well on the other four and still make up A.\n:::\n\n\n", "content/evaluation/retrieval-metrics.md": "# Retrieval metrics\n\n## Overview\n\n**Goal:** Score one search result list with Recall@k, MRR and nDCG, and say what each number rewards.\n\n**Walk out with:** three numbers for \"did the right passage come back, and how high?\", worked on the vendor A question.\n\n\n## Five results for vendor A\n\nSam's pipeline returns five passages for **\"Why did we drop vendor A?\"**. Which ones are relevant?\n\n<div class=\"diagram\" id=\"five\"><svg viewBox=\"0 0 1000 230\" role=\"img\" aria-label=\"Five ranked results for the vendor A question; ranks 2 and 3 are relevant\">\n  <g>\n    <rect x=\"160\" y=\"10\" width=\"680\" height=\"38\" rx=\"6\" style=\"fill:var(--navy-tint)\"/>\n    <text x=\"180\" y=\"36\" style=\"font-size:18px;font-weight:700;fill:var(--navy)\">1<\/text>\n    <text x=\"220\" y=\"36\" style=\"font-size:18px;fill:var(--ink)\">minutes 2026-09-17 · vendor A demo<\/text>\n    <rect x=\"160\" y=\"54\" width=\"680\" height=\"38\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/>\n    <text x=\"180\" y=\"80\" style=\"font-size:18px;font-weight:700;fill:var(--navy)\">2<\/text>\n    <text x=\"220\" y=\"80\" style=\"font-size:18px;fill:var(--ink)\">minutes 2026-10-01 · decision<\/text>\n    <rect x=\"160\" y=\"98\" width=\"680\" height=\"38\" rx=\"6\" style=\"fill:var(--navy-tint)\"/>\n    <text x=\"180\" y=\"124\" style=\"font-size:18px;font-weight:700;fill:var(--navy)\">3<\/text>\n    <text x=\"220\" y=\"124\" style=\"font-size:18px;fill:var(--ink)\">minutes 2026-09-03 · kick-off<\/text>\n    <rect x=\"160\" y=\"142\" width=\"680\" height=\"38\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/>\n    <text x=\"180\" y=\"168\" style=\"font-size:18px;font-weight:700;fill:var(--navy)\">4<\/text>\n    <text x=\"220\" y=\"168\" style=\"font-size:18px;fill:var(--ink)\">minutes 2026-09-24 · vendor B demo<\/text>\n    <rect x=\"160\" y=\"186\" width=\"680\" height=\"38\" rx=\"6\" style=\"fill:var(--navy-tint)\"/>\n    <text x=\"180\" y=\"212\" style=\"font-size:18px;font-weight:700;fill:var(--navy)\">5<\/text>\n    <text x=\"220\" y=\"212\" style=\"font-size:18px;fill:var(--ink)\">SD-LOG-01 · solution design draft<\/text>\n  <\/g>\n  <g class=\"rv rel\">\n    <text x=\"800\" y=\"81\" text-anchor=\"end\" style=\"font-size:20px;font-weight:700;fill:var(--good)\">✓ the decision<\/text>\n    <text x=\"800\" y=\"125\" text-anchor=\"end\" style=\"font-size:20px;font-weight:700;fill:var(--good)\">✓ the criterion<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal Answer | #five .rel\n**Ranks 2 and 3.** The decision (2026-10-01) and the kick-off, where on-premise collection became a success criterion.\n:::\n\n\n\n## Recall@k\n\n**Recall@k:** the share of the relevant passages that are in the top k.\n\n<div class=\"diagram\" id=\"recall\"><svg viewBox=\"0 0 1000 230\" role=\"img\" aria-label=\"Recall at 1 is 0 of 2, recall at 3 is 2 of 2\">\n  <g>\n    <rect x=\"160\" y=\"10\" width=\"520\" height=\"38\" rx=\"6\" style=\"fill:var(--navy-tint)\"/>\n    <text x=\"180\" y=\"36\" style=\"font-size:18px;fill:var(--ink)\">1 · minutes 09-17<\/text>\n    <rect x=\"160\" y=\"54\" width=\"520\" height=\"38\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/>\n    <text x=\"180\" y=\"80\" style=\"font-size:18px;fill:var(--ink)\">2 · minutes 10-01  <tspan style=\"fill:var(--good);font-weight:700\">✓<\/tspan><\/text>\n    <rect x=\"160\" y=\"98\" width=\"520\" height=\"38\" rx=\"6\" style=\"fill:var(--navy-tint)\"/>\n    <text x=\"180\" y=\"124\" style=\"font-size:18px;fill:var(--ink)\">3 · kick-off 09-03  <tspan style=\"fill:var(--good);font-weight:700\">✓<\/tspan><\/text>\n    <rect x=\"160\" y=\"142\" width=\"520\" height=\"38\" rx=\"6\" style=\"fill:var(--card);stroke:var(--line)\"/>\n    <text x=\"180\" y=\"168\" style=\"font-size:18px;fill:var(--ink)\">4 · vendor B 09-24<\/text>\n    <rect x=\"160\" y=\"186\" width=\"520\" height=\"38\" rx=\"6\" style=\"fill:var(--navy-tint)\"/>\n    <text x=\"180\" y=\"212\" style=\"font-size:18px;fill:var(--ink)\">5 · SD-LOG-01<\/text>\n  <\/g>\n  <g class=\"rv k1\">\n    <rect x=\"150\" y=\"4\" width=\"540\" height=\"50\" rx=\"8\" style=\"fill:none;stroke:var(--bad);stroke-width:3\"/>\n    <text x=\"710\" y=\"36\" style=\"font-size:20px;font-weight:700;fill:var(--bad)\">Recall@1 = 0/2<\/text>\n  <\/g>\n  <g class=\"rv k3\">\n    <rect x=\"144\" y=\"0\" width=\"552\" height=\"140\" rx=\"10\" style=\"fill:none;stroke:var(--good);stroke-width:3\"/>\n    <text x=\"710\" y=\"124\" style=\"font-size:20px;font-weight:700;fill:var(--good)\">Recall@3 = 2/2<\/text>\n  <\/g>\n<\/svg><\/div>\n\n**Ask:** write down Recall@1 and Recall@3.\n\n::: reveal Recall@1 | #recall .k1\n**0/2.** Neither relevant passage is in the top 1.\n:::\n\n::: reveal Recall@3 | #recall .k3\n**2/2.** Both are in the top 3. If we send 3 passages, the model gets everything it needs.\n:::\n\n\n## MRR\n\n**MRR (mean reciprocal rank):** 1 / the rank of the first relevant passage, averaged over all questions.\n\n<div class=\"diagram\" id=\"mrr\"><svg viewBox=\"0 0 1000 200\" role=\"img\" aria-label=\"The first relevant passage is at rank 2, so the reciprocal rank is one half\">\n  <defs><marker id=\"mrr-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--orange)\"/><\/marker><\/defs>\n  <g>\n    <rect x=\"60\" y=\"20\" width=\"360\" height=\"40\" rx=\"6\" style=\"fill:var(--navy-tint)\"/>\n    <text x=\"80\" y=\"47\" style=\"font-size:18px;fill:var(--ink)\">1 · minutes 09-17<\/text>\n    <rect x=\"60\" y=\"68\" width=\"360\" height=\"40\" rx=\"6\" style=\"fill:var(--card);stroke:var(--good);stroke-width:2\"/>\n    <text x=\"80\" y=\"95\" style=\"font-size:18px;font-weight:700;fill:var(--ink)\">2 · minutes 10-01 <tspan style=\"fill:var(--good)\">✓<\/tspan><\/text>\n    <rect x=\"60\" y=\"116\" width=\"360\" height=\"40\" rx=\"6\" style=\"fill:var(--navy-tint)\"/>\n    <text x=\"80\" y=\"143\" style=\"font-size:18px;fill:var(--ink)\">3 · kick-off 09-03 <tspan style=\"fill:var(--good)\">✓<\/tspan><\/text>\n    <text x=\"80\" y=\"186\" style=\"font-size:16px;fill:var(--muted)\">4 · 5 · …<\/text>\n  <\/g>\n  <g class=\"rv rr\">\n    <line x1=\"430\" y1=\"88\" x2=\"560\" y2=\"88\" style=\"stroke:var(--orange);stroke-width:3\" marker-end=\"url(#mrr-a)\"/>\n    <text x=\"580\" y=\"80\" style=\"font-size:20px;fill:var(--ink)\">first relevant at rank 2<\/text>\n    <text x=\"580\" y=\"116\" style=\"font-size:28px;font-weight:700;fill:var(--orange)\">1 / 2 = 0.5<\/text>\n  <\/g>\n  <g class=\"rv avg\">\n    <rect x=\"570\" y=\"140\" width=\"400\" height=\"48\" rx=\"8\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"770\" y=\"170\" text-anchor=\"middle\" style=\"font-size:16px;fill:var(--ink)\">MRR = the average over every golden question<\/text>\n  <\/g>\n<\/svg><\/div>\n\n**Ask:** what's the reciprocal rank for vendor A?\n\n::: reveal Answer | #mrr .rr\n**0.5.** The first relevant passage is at rank 2.\n:::\n\n::: reveal Over the golden set | #mrr .avg\n:::\n\n\n## nDCG\n\n**nDCG:** rewards relevant passages near the top, with graded relevance: **the decision = 3, the kick-off = 1.**\n\n<div class=\"diagram\" id=\"ndcg\"><svg viewBox=\"0 0 1000 260\" role=\"img\" aria-label=\"Bars of discounted gain for the actual order and the ideal order; the ratio is about 0.66\">\n  <g>\n    <line x1=\"40\" y1=\"200\" x2=\"460\" y2=\"200\" style=\"stroke:var(--ink);stroke-width:2\"/>\n    <line x1=\"540\" y1=\"200\" x2=\"960\" y2=\"200\" style=\"stroke:var(--ink);stroke-width:2\"/>\n    <text x=\"250\" y=\"20\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:var(--navy)\">OUR ORDER<\/text>\n    <text x=\"750\" y=\"20\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:var(--good)\">IDEAL ORDER<\/text>\n    <text x=\"80\" y=\"222\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--muted)\">1<\/text>\n    <text x=\"165\" y=\"222\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--muted)\">2<\/text>\n    <text x=\"250\" y=\"222\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--muted)\">3<\/text>\n    <text x=\"335\" y=\"222\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--muted)\">4<\/text>\n    <text x=\"420\" y=\"222\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--muted)\">5<\/text>\n    <text x=\"580\" y=\"222\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--muted)\">1<\/text>\n    <text x=\"665\" y=\"222\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--muted)\">2<\/text>\n    <text x=\"750\" y=\"222\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--muted)\">3<\/text>\n    <text x=\"835\" y=\"222\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--muted)\">4<\/text>\n    <text x=\"920\" y=\"222\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--muted)\">5<\/text>\n    <text x=\"250\" y=\"246\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--muted)\">rank · gain × 1/log₂(rank+1)<\/text>\n  <\/g>\n  <g class=\"rv act\">\n    <rect x=\"140\" y=\"105\" width=\"50\" height=\"95\" style=\"fill:var(--navy)\"/>\n    <text x=\"165\" y=\"97\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">3 × 0.63<\/text>\n    <rect x=\"225\" y=\"175\" width=\"50\" height=\"25\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"250\" y=\"167\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">1 × 0.5<\/text>\n    <text x=\"250\" y=\"60\" text-anchor=\"middle\" style=\"font-size:20px;font-weight:700;fill:var(--navy)\">DCG ≈ 2.39<\/text>\n  <\/g>\n  <g class=\"rv ideal\">\n    <rect x=\"555\" y=\"50\" width=\"50\" height=\"150\" style=\"fill:var(--good)\"/>\n    <text x=\"580\" y=\"42\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">3 × 1<\/text>\n    <rect x=\"640\" y=\"168\" width=\"50\" height=\"32\" style=\"fill:var(--good-tint);stroke:var(--good)\"/>\n    <text x=\"665\" y=\"160\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">1 × 0.63<\/text>\n    <text x=\"820\" y=\"60\" text-anchor=\"middle\" style=\"font-size:20px;font-weight:700;fill:var(--good)\">ideal ≈ 3.63<\/text>\n  <\/g>\n  <g class=\"rv ratio\">\n    <rect x=\"690\" y=\"90\" width=\"280\" height=\"50\" rx=\"10\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"830\" y=\"123\" text-anchor=\"middle\" style=\"font-size:22px;font-weight:700;fill:var(--ink)\">nDCG ≈ 2.39 / 3.63 ≈ 0.66<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal Our order | #ndcg .act\n:::\n::: reveal Ideal order | #ndcg .ideal\n:::\n::: reveal nDCG | #ndcg .ratio\n:::\n\n\n\n## Demo: eval-calc\n\n<div class=\"diagram\"><iframe src=\"content/rag-assets/demos/eval-calc.html\" style=\"width:100%;height:600px;border:0\" loading=\"lazy\"><\/iframe><\/div>\n\n\n", "content/evaluation/answer-metrics.md": "# Answer metrics: the RAG triad\n\n## Overview\n\n**Goal:** Check an answer on three sides (the passages fit the question, the answer sticks to the passages, the answer fits the question) and score faithfulness claim by claim.\n\n**Walk out with:** the RAG triad, and a faithfulness score you can work out by hand: 1.5 of 3 for the \"cloud-only and too expensive\" answer.\n\n\n## The RAG triad\n\nRetrieval can be perfect and the answer still wrong. Three checks, one per side:\n\n<div class=\"diagram\" id=\"triad\"><svg viewBox=\"0 0 1000 290\" role=\"img\" aria-label=\"The RAG triad: question, context and answer, joined by context relevance, faithfulness and answer relevance\">\n  <g>\n    <line x1=\"500\" y1=\"68\" x2=\"200\" y2=\"212\" style=\"stroke:var(--line);stroke-width:3\"/>\n    <line x1=\"290\" y1=\"240\" x2=\"710\" y2=\"240\" style=\"stroke:var(--line);stroke-width:3\"/>\n    <line x1=\"500\" y1=\"68\" x2=\"800\" y2=\"212\" style=\"stroke:var(--line);stroke-width:3\"/>\n    <rect x=\"410\" y=\"12\" width=\"180\" height=\"56\" rx=\"28\" style=\"fill:var(--navy);stroke:var(--navy)\"/>\n    <text x=\"500\" y=\"47\" text-anchor=\"middle\" style=\"font-size:20px;font-weight:700;fill:#fff\">Question<\/text>\n    <rect x=\"110\" y=\"212\" width=\"180\" height=\"56\" rx=\"28\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"200\" y=\"247\" text-anchor=\"middle\" style=\"font-size:20px;font-weight:700;fill:var(--navy)\">Context<\/text>\n    <rect x=\"710\" y=\"212\" width=\"180\" height=\"56\" rx=\"28\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"800\" y=\"247\" text-anchor=\"middle\" style=\"font-size:20px;font-weight:700;fill:var(--ink)\">Answer<\/text>\n  <\/g>\n  <g class=\"rv e1\">\n    <line x1=\"500\" y1=\"68\" x2=\"200\" y2=\"212\" style=\"stroke:var(--navy);stroke-width:5\"/>\n    <text x=\"330\" y=\"118\" text-anchor=\"end\" style=\"font-size:19px;font-weight:700;fill:var(--navy)\">context relevance<\/text>\n    <text x=\"330\" y=\"142\" text-anchor=\"end\" style=\"font-size:14px;fill:var(--muted)\">are the passages about why vendor A<\/text>\n    <text x=\"330\" y=\"160\" text-anchor=\"end\" style=\"font-size:14px;fill:var(--muted)\">was dropped?<\/text>\n  <\/g>\n  <g class=\"rv e2\">\n    <line x1=\"290\" y1=\"240\" x2=\"710\" y2=\"240\" style=\"stroke:var(--orange);stroke-width:5\"/>\n    <text x=\"500\" y=\"226\" text-anchor=\"middle\" style=\"font-size:19px;font-weight:700;fill:var(--orange)\">faithfulness<\/text>\n    <text x=\"500\" y=\"268\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">is every claim in the passages?<\/text>\n  <\/g>\n  <g class=\"rv e3\">\n    <line x1=\"500\" y1=\"68\" x2=\"800\" y2=\"212\" style=\"stroke:var(--good);stroke-width:5\"/>\n    <text x=\"670\" y=\"118\" style=\"font-size:19px;font-weight:700;fill:var(--good)\">answer relevance<\/text>\n    <text x=\"670\" y=\"142\" style=\"font-size:14px;fill:var(--muted)\">does it say why, not only when?<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal Context relevance | #triad .e1\n:::\n::: reveal Faithfulness | #triad .e2\n:::\n::: reveal Answer relevance | #triad .e3\n:::\n\n\n\n## Faithfulness, claim by claim\n\n**Ask:** \"Vendor A was dropped on 2026-10-01 because it is cloud-only and too expensive.\" Mark each claim: supported, partly, or unsupported by the passages.\n\n<div class=\"diagram\" id=\"claims\"><svg viewBox=\"0 0 1000 260\" role=\"img\" aria-label=\"Three claims scored: supported, partly supported, unsupported; 1.5 of 3\">\n  <g>\n    <rect x=\"10\" y=\"10\" width=\"320\" height=\"70\" rx=\"10\" style=\"fill:var(--card);stroke:var(--ink);stroke-width:2\"/>\n    <text x=\"170\" y=\"40\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--ink)\">Vendor A was dropped<\/text>\n    <text x=\"170\" y=\"64\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--ink)\">on 2026-10-01<\/text>\n    <rect x=\"340\" y=\"10\" width=\"320\" height=\"70\" rx=\"10\" style=\"fill:var(--card);stroke:var(--ink);stroke-width:2\"/>\n    <text x=\"500\" y=\"52\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--ink)\">because it is cloud-only<\/text>\n    <rect x=\"670\" y=\"10\" width=\"320\" height=\"70\" rx=\"10\" style=\"fill:var(--card);stroke:var(--ink);stroke-width:2\"/>\n    <text x=\"830\" y=\"52\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--ink)\">and too expensive<\/text>\n  <\/g>\n  <g class=\"rv c1\">\n    <rect x=\"10\" y=\"92\" width=\"320\" height=\"96\" rx=\"10\" style=\"fill:var(--good-tint);stroke:var(--good);stroke-width:2\"/>\n    <text x=\"170\" y=\"122\" text-anchor=\"middle\" style=\"font-size:18px;font-weight:700;fill:var(--good)\">supported · 1<\/text>\n    <text x=\"170\" y=\"150\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">minutes 2026-10-01<\/text>\n    <text x=\"170\" y=\"170\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">§Decision<\/text>\n  <\/g>\n  <g class=\"rv c2\">\n    <rect x=\"340\" y=\"92\" width=\"320\" height=\"96\" rx=\"10\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"500\" y=\"122\" text-anchor=\"middle\" style=\"font-size:18px;font-weight:700;fill:var(--orange)\">partly · 0.5<\/text>\n    <text x=\"500\" y=\"150\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">parsing runs in vendor A's cloud;<\/text>\n    <text x=\"500\" y=\"170\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">\"cloud-only\" says more than that<\/text>\n  <\/g>\n  <g class=\"rv c3\">\n    <rect x=\"670\" y=\"92\" width=\"320\" height=\"96\" rx=\"10\" style=\"fill:var(--bad-tint);stroke:var(--bad);stroke-width:2\"/>\n    <text x=\"830\" y=\"122\" text-anchor=\"middle\" style=\"font-size:18px;font-weight:700;fill:var(--bad)\">unsupported · 0<\/text>\n    <text x=\"830\" y=\"150\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">no passage mentions cost<\/text>\n  <\/g>\n  <g class=\"rv score\">\n    <rect x=\"300\" y=\"202\" width=\"400\" height=\"52\" rx=\"26\" style=\"fill:var(--navy)\"/>\n    <text x=\"500\" y=\"236\" text-anchor=\"middle\" style=\"font-size:22px;font-weight:700;fill:#fff\">faithfulness 1.5 of 3<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal Claim 1 | #claims .c1\n:::\n::: reveal Claim 2 | #claims .c2\n:::\n::: reveal Claim 3 | #claims .c3\n:::\n::: reveal Score | #claims .score\n:::\n\n\n\n## Demo: the claim checker\n\n<div class=\"diagram\"><iframe src=\"content/rag-assets/demos/eval-calc.html\" style=\"width:100%;height:600px;border:0\" loading=\"lazy\"><\/iframe><\/div>\n\n\n", "content/evaluation/tools-and-close.md": "# Tools, cost and the habit\n\n## Overview\n\n**Goal:** Pick a tool to run the golden set, add cost and latency to the scores, and make the run a habit on every change.\n\n**Walk out with:** the eval loop: change, run the golden set, compare, keep or revert.\n\n\n## Four tools\n\n<div class=\"diagram\" id=\"tools\"><svg viewBox=\"0 0 1000 200\" role=\"img\" aria-label=\"Four evaluation tools: RAGAS, TruLens, LangSmith, n8n\">\n  <g>\n    <rect x=\"10\" y=\"10\" width=\"235\" height=\"180\" rx=\"12\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"127\" y=\"46\" text-anchor=\"middle\" style=\"font-size:22px;font-weight:700;fill:var(--navy)\">RAGAS<\/text>\n    <text x=\"127\" y=\"80\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">RAG metrics library<\/text>\n    <text x=\"127\" y=\"104\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">faithfulness, context<\/text>\n    <text x=\"127\" y=\"124\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">precision/recall,<\/text>\n    <text x=\"127\" y=\"144\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">answer relevance<\/text>\n    <rect x=\"258\" y=\"10\" width=\"235\" height=\"180\" rx=\"12\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"375\" y=\"46\" text-anchor=\"middle\" style=\"font-size:22px;font-weight:700;fill:var(--navy)\">TruLens<\/text>\n    <text x=\"375\" y=\"80\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">the RAG triad as<\/text>\n    <text x=\"375\" y=\"104\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">feedback functions<\/text>\n    <text x=\"375\" y=\"128\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">with a dashboard<\/text>\n    <rect x=\"506\" y=\"10\" width=\"235\" height=\"180\" rx=\"12\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"623\" y=\"46\" text-anchor=\"middle\" style=\"font-size:22px;font-weight:700;fill:var(--navy)\">LangSmith<\/text>\n    <text x=\"623\" y=\"80\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">traces, datasets,<\/text>\n    <text x=\"623\" y=\"104\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">evaluators<\/text>\n    <rect x=\"754\" y=\"10\" width=\"235\" height=\"180\" rx=\"12\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"871\" y=\"46\" text-anchor=\"middle\" style=\"font-size:22px;font-weight:700;fill:var(--navy)\">n8n<\/text>\n    <text x=\"871\" y=\"80\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">execution log per run;<\/text>\n    <text x=\"871\" y=\"104\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">an eval workflow over<\/text>\n    <text x=\"871\" y=\"128\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">the golden set<\/text>\n  <\/g>\n  <g class=\"rv lab\">\n    <rect x=\"4\" y=\"4\" width=\"247\" height=\"192\" rx=\"14\" style=\"fill:none;stroke:var(--orange);stroke-width:4\"/>\n    <rect x=\"60\" y=\"160\" width=\"134\" height=\"28\" rx=\"14\" style=\"fill:var(--orange)\"/>\n    <text x=\"127\" y=\"180\" text-anchor=\"middle\" style=\"font-size:14px;font-weight:700;fill:#fff\">in the lab<\/text>\n  <\/g>\n<\/svg><\/div>\n\n**Ask:** which one do we use in this afternoon's lab?\n\n::: reveal Answer | #tools .lab\n**RAGAS.** It runs the metrics from this flow over the golden set.\n:::\n\n\n\n## Cost and latency\n\n**Ask:** the new pipeline sends 10 passages instead of 3 and scores higher. What else do you need to know before you keep it?\n\n<div class=\"diagram\" id=\"trace\"><svg viewBox=\"0 0 1000 230\" role=\"img\" aria-label=\"One answer traced: time spent in retrieve, rerank and generate, with cost, latency and passages sent\">\n  <g>\n    <text x=\"10\" y=\"22\" style=\"font-size:14px;font-weight:700;fill:var(--muted)\">ONE ANSWER, TRACED · \"Why did we drop vendor A?\"<\/text>\n    <rect x=\"10\" y=\"34\" width=\"250\" height=\"44\" style=\"fill:var(--navy)\"/>\n    <text x=\"135\" y=\"62\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:#fff\">retrieve<\/text>\n    <rect x=\"260\" y=\"34\" width=\"150\" height=\"44\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"335\" y=\"62\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:var(--navy)\">rerank<\/text>\n    <rect x=\"410\" y=\"34\" width=\"580\" height=\"44\" style=\"fill:var(--orange)\"/>\n    <text x=\"700\" y=\"62\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:#fff\">generate<\/text>\n    <text x=\"990\" y=\"96\" text-anchor=\"end\" style=\"font-size:13px;fill:var(--muted)\">time →  (bar lengths illustrative)<\/text>\n  <\/g>\n  <g class=\"rv m\">\n    <rect x=\"10\" y=\"110\" width=\"320\" height=\"112\" rx=\"10\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"26\" y=\"138\" style=\"font-size:17px;font-weight:700;fill:var(--navy)\">Cost<\/text>\n    <text x=\"26\" y=\"164\" style=\"font-size:15px;fill:var(--ink)\">tokens per answer<\/text>\n    <text x=\"26\" y=\"188\" style=\"font-size:14px;fill:var(--muted)\">10 passages in the prompt cost<\/text>\n    <text x=\"26\" y=\"208\" style=\"font-size:14px;fill:var(--muted)\">more than 3, on every question<\/text>\n    <rect x=\"340\" y=\"110\" width=\"320\" height=\"112\" rx=\"10\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"356\" y=\"138\" style=\"font-size:17px;font-weight:700;fill:var(--navy)\">Latency<\/text>\n    <text x=\"356\" y=\"164\" style=\"font-size:15px;fill:var(--ink)\">seconds per answer<\/text>\n    <text x=\"356\" y=\"188\" style=\"font-size:14px;fill:var(--muted)\">the reranker and a longer prompt<\/text>\n    <text x=\"356\" y=\"208\" style=\"font-size:14px;fill:var(--muted)\">both add seconds<\/text>\n    <rect x=\"670\" y=\"110\" width=\"320\" height=\"112\" rx=\"10\" style=\"fill:var(--card);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"686\" y=\"138\" style=\"font-size:17px;font-weight:700;fill:var(--orange)\">Why<\/text>\n    <text x=\"686\" y=\"164\" style=\"font-size:15px;fill:var(--ink)\">which passages were sent<\/text>\n    <text x=\"686\" y=\"188\" style=\"font-size:14px;fill:var(--muted)\">minutes 10-01 §Decision · vendor A<\/text>\n    <text x=\"686\" y=\"208\" style=\"font-size:14px;fill:var(--muted)\">mail 09-30 · SD-LOG-01 §2<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal Answer | #trace .m\n**Tokens and seconds per answer,** from the same run, plus the passages sent, to see why.\n:::\n\n\n\n## Back to the opening\n\n**Ask:** fixed chunks → one row per chunk. Is it better? Say how you'd find out, step by step.\n\n<div class=\"diagram\" id=\"loop\"><svg viewBox=\"0 0 1000 220\" role=\"img\" aria-label=\"The eval loop: change, run the golden set, score, compare with the last run, keep or revert\">\n  <defs><marker id=\"lp-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--muted)\"/><\/marker><\/defs>\n  <g>\n    <rect x=\"10\" y=\"20\" width=\"170\" height=\"86\" rx=\"12\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"95\" y=\"56\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--navy)\">Change<\/text>\n    <text x=\"95\" y=\"82\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">one row per chunk<\/text>\n    <line x1=\"180\" y1=\"63\" x2=\"206\" y2=\"63\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#lp-a)\"/>\n    <rect x=\"210\" y=\"20\" width=\"170\" height=\"86\" rx=\"12\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"295\" y=\"56\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--navy)\">Run<\/text>\n    <text x=\"295\" y=\"82\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">the golden set<\/text>\n  <\/g>\n  <g class=\"rv s1\">\n    <line x1=\"380\" y1=\"63\" x2=\"406\" y2=\"63\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#lp-a)\"/>\n    <rect x=\"410\" y=\"20\" width=\"190\" height=\"86\" rx=\"12\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"505\" y=\"48\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--navy)\">Score<\/text>\n    <text x=\"505\" y=\"72\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--ink)\">Recall@3 · MRR · nDCG<\/text>\n    <text x=\"505\" y=\"92\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--ink)\">faithfulness · tokens · s<\/text>\n  <\/g>\n  <g class=\"rv s2\">\n    <line x1=\"600\" y1=\"63\" x2=\"626\" y2=\"63\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#lp-a)\"/>\n    <rect x=\"630\" y=\"20\" width=\"170\" height=\"86\" rx=\"12\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"715\" y=\"56\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--navy)\">Compare<\/text>\n    <text x=\"715\" y=\"82\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">with the last run<\/text>\n  <\/g>\n  <g class=\"rv s3\">\n    <line x1=\"800\" y1=\"63\" x2=\"826\" y2=\"63\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#lp-a)\"/>\n    <rect x=\"830\" y=\"20\" width=\"160\" height=\"86\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"910\" y=\"56\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--ink)\">Keep<\/text>\n    <text x=\"910\" y=\"82\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">or revert<\/text>\n    <path d=\"M 910 106 L 910 170 L 95 170 L 95 110\" style=\"fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:6 4\" marker-end=\"url(#lp-a)\"/>\n    <text x=\"500\" y=\"200\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--muted)\">on every change: in CI (code) or an eval workflow (n8n)<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal Score | #loop .s1\n:::\n::: reveal Compare | #loop .s2\n:::\n::: reveal Keep or revert | #loop .s3\n**Run the golden set before and after, compare the numbers, keep the change only if they hold or rise.**\n:::\n\n\n\n## Close\n\n> *If you don't measure retrieval, you're tuning by feel.*\n\n\n---\n"}, "css": ["viewer/student.css", "viewer/theme.css"]};</script>
