<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h1 { font-size: 26px; font-weight: 700; }
    .sub { font-size: 15px; fill: #6b7280; }
    .t { font-size: 17px; font-weight: 700; }
    .s { font-size: 13.5px; fill: #4b5563; }
    .src { font-size: 14px; }
    .bar { font-size: 15px; font-weight: 600; }
    .note { font-size: 12.5px; fill: #6b7280; }
    .line { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>

  <text x="30" y="44" class="h1">What LoDA does: documents in, kept for years</text>
  <text x="30" y="70" class="sub">End-to-end document services for Mercedes' internal departments (Sure: LoDA slide)</text>

  <!-- sources -->
  <text x="30" y="108" class="note">SOURCES</text>
  <g>
    <rect x="30" y="118" width="160" height="34" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="44" y="140" class="src">Paper (scanned)</text>
    <rect x="30" y="160" width="160" height="34" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="44" y="182" class="src">File shares</text>
    <rect x="30" y="202" width="160" height="34" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="44" y="224" class="src">SharePoint</text>
    <rect x="30" y="244" width="160" height="34" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="44" y="266" class="src">Outlook mail (Told)</text>
  </g>
  <path d="M190,135 C215,135 215,190 238,195" class="line"/>
  <path d="M190,177 L238,195" class="line"/>
  <path d="M190,219 L238,198" class="line"/>
  <path d="M190,261 C215,261 215,205 238,200" class="line"/>

  <!-- stages -->
  <text x="240" y="108" class="note">THE PIPELINE</text>
  <g>
    <rect x="240" y="138" width="166" height="118" rx="10" fill="#eef2ff" stroke="#6366f1"/>
    <text x="256" y="166" class="t">1 Input</text>
    <text x="256" y="192" class="s">scan, migrate,</text><text x="256" y="210" class="s">import</text>

    <rect x="432" y="138" width="166" height="118" rx="10" fill="#eef2ff" stroke="#6366f1"/>
    <text x="448" y="166" class="t">2 Extract &amp;</text><text x="448" y="186" class="t">validate</text>
    <text x="448" y="210" class="s">OCR; a person checks</text><text x="448" y="228" class="s">what it is unsure of</text>

    <rect x="624" y="138" width="166" height="118" rx="10" fill="#eef2ff" stroke="#6366f1"/>
    <text x="640" y="166" class="t">3 Workflow</text>
    <text x="640" y="192" class="s">retention class,</text><text x="640" y="210" class="s">notifications</text>

    <rect x="816" y="138" width="166" height="118" rx="10" fill="#eef2ff" stroke="#6366f1"/>
    <text x="832" y="166" class="t">4 Manage</text>
    <text x="832" y="192" class="s">workspace, metadata,</text><text x="832" y="210" class="s">permissions</text>

    <rect x="1008" y="138" width="166" height="118" rx="10" fill="#eef2ff" stroke="#6366f1"/>
    <text x="1024" y="166" class="t">5 Archive</text>
    <text x="1024" y="192" class="s">locked for N years,</text><text x="1024" y="210" class="s">then deleted</text>
  </g>
  <path d="M406,197 L430,197" class="line"/>
  <path d="M598,197 L622,197" class="line"/>
  <path d="M790,197 L814,197" class="line"/>
  <path d="M982,197 L1006,197" class="line"/>

  <!-- products -->
  <text x="30" y="306" class="note">PRODUCTS</text>
  <text x="30" y="324" class="note">(which stages</text>
  <text x="30" y="340" class="note">each covers)</text>
  <rect x="240" y="292" width="550" height="38" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="256" y="317" class="bar">DIP (Kofax/Tungsten) · Document Automation (in-house)</text>

  <rect x="240" y="340" width="934" height="38" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="256" y="365" class="bar">Classic (Saperion) · legacy, many clients, high cost</text>

  <rect x="240" y="388" width="934" height="38" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="256" y="413" class="bar">CSP (OpenText Content Server) · default for new clients, the platform of choice</text>

  <!-- migration -->
  <text x="1160" y="365" class="s" text-anchor="end" font-weight="700" fill="#b45309">content migrating into CSP ↓</text>
  <text x="1174" y="450" class="s" text-anchor="end">Migrations into CSP from Classic, file shares and SharePoint are the biggest workload (rows 4, 5, 14; Inference, medium)</text>

  <!-- afterwards -->
  <rect x="30" y="498" width="1144" height="80" rx="10" fill="#fff7ed" stroke="#f97316"/>
  <text x="50" y="528" class="t">Afterwards: the questions never stop</text>
  <text x="50" y="555" class="s">"How many?" · "Who can see it?" · "I can't find invoice 4711" · "Did the migration finish, do the counts match?" · arriving by ServiceNow, email and Teams.</text>
  <text x="50" y="572" class="note">Recorded toil: 8,215 h/yr; the top four rows (reports, health checks, issues, export reruns) are 74% of it (Sure: activity CSV).</text>
</svg>
