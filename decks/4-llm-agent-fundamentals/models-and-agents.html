<script>window.DECK = {"flow": [{"title": "Model, app, agent", "file": "content/models-and-agents/opening.md"}, {"title": "Six kinds of model", "file": "content/models-and-agents/kinds-of-models.md"}, {"title": "Big or small, closed or open", "file": "content/models-and-agents/size-and-openness.md"}, {"title": "Not models: what's built on them", "file": "content/models-and-agents/built-on-models.md"}, {"title": "Sort it: model, app or agent?", "file": "content/models-and-agents/sort-it.md"}], "files": {"content/models-and-agents/opening.md": "# Model, app, agent\n\n## Overview\n\n**Goal:** Separate three words the room uses as one: the model, the app around it, and the agent.\n\n\n## Is ChatGPT a model?\n\n**Task for participants:** Hands up: is ChatGPT a model? Is Copilot? Is Claude?\n\n\n::: reveal Answer\nChatGPT is an **app**. Inside it runs a **model** from OpenAI's GPT family. Copilot is also an app, and Claude is both: the name of a model family *and* of an app.\n:::\n\n## Three layers\n\n<div class=\"diagram\" id=\"layers\"><svg viewBox=\"0 0 900 380\" role=\"img\" aria-label=\"An agent wraps an app, which wraps a model\">\n  <g class=\"rv l-agent\"><rect x=\"10\" y=\"10\" width=\"880\" height=\"360\" rx=\"18\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:3\"/>\n    <text x=\"34\" y=\"48\" style=\"font-weight:700;font-size:24px;fill:var(--orange)\">AGENT<\/text>\n    <text x=\"34\" y=\"76\" style=\"font-size:17px;fill:var(--ink)\">+ tools (look things up, send, save) + a loop until the job is done<\/text><\/g>\n  <g class=\"rv l-app\"><rect x=\"60\" y=\"100\" width=\"780\" height=\"240\" rx=\"14\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:3\"/>\n    <text x=\"84\" y=\"136\" style=\"font-weight:700;font-size:24px;fill:var(--navy)\">APP<\/text>\n    <text x=\"84\" y=\"164\" style=\"font-size:17px;fill:var(--ink)\">+ a chat window + the conversation list it resends every time<\/text><\/g>\n  <g><rect x=\"250\" y=\"190\" width=\"400\" height=\"120\" rx=\"12\" style=\"fill:var(--card);stroke:var(--ink);stroke-width:3\"/>\n    <text x=\"450\" y=\"236\" text-anchor=\"middle\" style=\"font-weight:700;font-size:26px;fill:var(--ink)\">MODEL<\/text>\n    <text x=\"450\" y=\"268\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--muted)\">text in → text out<\/text>\n    <text x=\"450\" y=\"292\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--muted)\">no memory, no tools<\/text><\/g>\n<\/svg><\/div>\n\nThe **model** is a file of numbers. You give it text, it predicts what comes next. That's all it does.\n\n::: reveal Add the app | #layers .l-app\nThe **app** puts a chat window around it and keeps the conversation list. That list is the memory: we build it this afternoon in R2.\n:::\n\n::: reveal Add the agent | #layers .l-agent\nThe **agent** gives the model tools and runs it in a loop until the job is done. We build that on Wednesday in R5 and R6.\n:::\n\n\n## The one sentence\n\n> The model is only the engine. Everything else, the memory, the tools and the loop, is code around it.\n\n", "content/models-and-agents/kinds-of-models.md": "# Six kinds of model\n\n## Overview\n\n**Goal:** Show that \"a model\" is a family of things, and most of them are not chat.\n\n\n\n## 1. Base models\n\n**Continues text.** It has read a lot of the internet and writes what is likely to come next. It does not answer questions.\n\n**Examples:** Llama 3.2 1B text, Mistral 7B base, Qwen base\n\n\n::: reveal Where you meet it\nIn R0 this morning, through Ollama. Almost nobody uses one directly: every chat model starts life as a base model.\n:::\n\n## 2. Chat models\n\n**Answers in turns.** A base model trained further on conversations, so it answers instead of continuing. Also called \"instruct\" models.\n\n**Examples:** Claude Sonnet 5.5, Claude Haiku 4.5, GPT-4o, GPT-4.1, Gemini Flash, Llama Instruct\n\n::: reveal Where you meet it\nInside ChatGPT, Copilot, Claude.ai and our R1 and R2 scripts. \"Draft a reply to this invoice query\" goes to a chat model.\n:::\n\n## 3. Reasoning models\n\n**Writes its thinking before the answer.** Still a model that predicts text: the \"thinking\" is just more text it writes first. Slower and dearer, and better on multi-step problems.\n\n**Examples:** Claude Opus 5.5, Claude Fable 5.1, GPT-5, OpenAI o3, Gemini Pro, DeepSeek R1\n\n\n::: reveal Where you meet it\n\"Think deeper\" or \"reasoning\" switches in ChatGPT and Copilot. Our R1 uses Claude Opus 5.5, with its thinking always on.\n:::\n\n## 4. Small and local models\n\n**Runs on your own laptop.** Fewer numbers, so it's cheaper, faster and private, but it makes more mistakes.\n\n**Examples:** Llama 3.2 3B, Microsoft Phi, Google Gemma, Qwen, Mistral 7B\n\n::: reveal Where you meet it\nOllama on a laptop, or inside a product that must not send data outside the company.\n:::\n\n## 5. Embedding models\n\n**Turns text into a list of numbers.** Texts that mean similar things get similar numbers. It writes no words at all.\n\n**Examples:** OpenAI text-embedding-3, Voyage, Cohere Embed, nomic-embed-text\n\n\n::: reveal Where you meet it\nSearch that understands meaning: \"find documents like this one\". Copilot uses it to find your files before the chat model reads them.\n:::\n\n## 6. Image and speech models\n\n**Makes pictures or sound, or turns speech into text.** Most chat models can *read* an image now. Only these *make* one.\n\n**Images:** GPT Image, Midjourney, Stable Diffusion, Google Imagen\n\n**Speech:** Whisper, ElevenLabs, OpenAI TTS\n\n::: reveal Where you meet it\nTeams meeting transcripts (speech to text), voice assistants (text to speech), \"create an image\" in Copilot.\n:::\n\n## All six on one page\n\n| Kind | Input → output | Example |\n|---|---|---|\n| Base | text → more text | Llama 3.2 1B text |\n| Chat | conversation → answer | Claude Sonnet 5.5, GPT-4o |\n| Reasoning | conversation → thinking + answer | Claude Opus 5.5, GPT-5 |\n| Small / local | same as chat, on your laptop | Phi, Gemma, Llama 3.2 3B |\n| Embedding | text → numbers | text-embedding-3 |\n| Image / speech | text ↔ picture or sound | GPT Image, Whisper |\n\n", "content/models-and-agents/size-and-openness.md": "# Big or small, closed or open\n\n## Overview\n\n**Goal:** Two more ways people sort models, so the names on a price list make sense.\n\n## Big and small in one family\n\nMost makers sell one family in several sizes. Bigger is more capable. Smaller is cheaper and faster.\n\n| Maker | Biggest | Middle | Smallest |\n|---|---|---|---|\n| Anthropic | Claude Opus | Claude Sonnet | Claude Haiku |\n| Google | Gemini Pro | Gemini Flash | Gemini Flash-Lite |\n| Meta | Llama 70B+ | Llama 8B | Llama 1B |\n\n\n## Closed or open\n\n| | Closed | Open weights |\n|---|---|---|\n| You get | an API: send text, get text back | the file of numbers itself |\n| Runs on | the maker's servers | your laptop or your own servers |\n| Examples | Claude, GPT, Gemini | Llama, Mistral, Qwen, Gemma, DeepSeek |\n\n::: reveal Which one did we use this morning?\nR0 used an **open** model (Llama, on the trainer's Mac). R1 and R2 use a **closed** one (Claude, through Anthropic's API, or the Nexus model in the room).\n:::\n\n## The names keep changing\n\n> Version numbers change every few months. The kinds don't.\n\n", "content/models-and-agents/built-on-models.md": "# Not models: what's built on them\n\n## Overview\n\n**Goal:** Put the names people use every day in the right layer.\n\n## Apps and agents, and the model inside\n\n| Name | What it is | The model inside |\n|---|---|---|\n| ChatGPT | app | OpenAI GPT models |\n| Claude.ai | app | Claude models |\n| Gemini app | app | Gemini models |\n| Microsoft 365 Copilot | app, with agents inside | mainly OpenAI GPT, Claude in some features |\n| Copilot Agent builder | a tool to make agents | whichever model Copilot uses |\n| n8n AI Agent node | agent | you pick the model |\n| Claude Code, OpenAI Codex | agents | Claude, GPT |\n\n\n## Same name, two things\n\n**Both a model and a product:** Claude, Gemini, Copilot\n\n\"Claude\" is a family of models *and* the app at claude.ai. \"Gemini\" is the same. \"Copilot\" is mostly the product, and people say it as if it were the model.\n\n> Ask: does it predict text, or is it wrapped around something that does?\n\n::: reveal What the wrapper adds\n- **Memory:** the conversation list, resent with every message (R2, today)\n- **Your files and data:** pasted into the request (R4, Tuesday)\n- **Tools and the loop:** look something up, act, look again (R5 and R6, Wednesday)\n:::\n", "content/models-and-agents/sort-it.md": "# Sort it: model, app or agent?\n\n## The cards\n\n**Task for participants:** In pairs, sort each name into model, app or agent. Two minutes. One of them is a trap.\n\n**Names:** GPT-4o, ChatGPT, Llama 3.2, Copilot, Claude Code, Whisper, n8n AI Agent, Gemini\n\n\n## The answers\n\n::: reveal GPT-4o\n**GPT-4o**: model (chat)\n:::\n\n::: reveal ChatGPT\n**ChatGPT**: app, with GPT models inside\n:::\n\n::: reveal Llama 3.2\n**Llama 3.2**: model (small, open weights)\n:::\n\n::: reveal Copilot\n**Copilot**: app. Its Agent builder makes agents\n:::\n\n::: reveal Claude Code\n**Claude Code**: agent (Claude model + tools + a loop)\n:::\n\n::: reveal Whisper\n**Whisper**: model (speech to text)\n:::\n\n::: reveal n8n AI Agent\n**n8n AI Agent**: agent. You choose the model\n:::\n\n::: reveal Gemini\n**Gemini**: the trap. A model family *and* an app\n:::\n\n## Back to the hands\n\n\n> The model predicts the next word. Everything else is code around it, and this week we write that code.\n"}, "css": ["viewer/student.css", "viewer/theme.css"]};</script>
