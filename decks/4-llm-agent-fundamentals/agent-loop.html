<script>window.DECK = {"flow": [{"title": "Priya can't find invoice 4711", "file": "content/agent-loop/opening.md"}, {"title": "Think, act, observe", "file": "content/agent-loop/the-loop.md"}, {"title": "Priya's run, pass by pass", "file": "content/agent-loop/the-run.md"}, {"title": "When does it stop?", "file": "content/agent-loop/stop-and-cost.md"}, {"title": "Loop or not?", "file": "content/agent-loop/close.md"}], "files": {"content/agent-loop/opening.md": "# Priya can't find invoice 4711\n\n## Overview\n\n**Goal:** Tell when one tool call is enough and when the next step depends on what came back. That second case is what the agent loop is for.\n\n**Walk out with:** the sentence \"the model decides the next step, our code takes it, and the loop goes round until the model stops asking.\"\n\n\n## Priya's message\n\n> Priya looks after invoices. She writes to the archive assistant: **\"I'm Priya. I can't find invoice 4711.\"**\n\n**Task for participants:** You are the archive helpdesk. In pairs, write down what you check, in order, before you can answer her.\n\n::: reveal What the room writes\n1. **Search** for invoice 4711. Is it in the archive at all?\n2. It's there, in Finance. **Can Priya open Finance?**\n3. She can't. **Who can give her access?**\n:::\n\n\n## Each step needs the last\n\n**Ask:** Could you do step 2 before step 1?\n\n::: reveal Answer\n**No.** You only know **which** workspace's access list to check after the search has told you where the invoice is.\n:::\n\n**Ask:** In R4, \"Is it warmer in Berlin or in Munich?\" Did the second weather call need the first one's result?\n\n::: reveal Answer\n**No.** The model knew both cities before it called anything, so it asked for both at once. Here it can't: the search result decides the next tool.\n:::\n\n", "content/agent-loop/the-loop.md": "# Think, act, observe\n\n## What an agent is\n\n**Ask:** From Monday's deck: model, app, agent. What does an agent add?\n\n::: reveal Answer\n**Model:** text in, text out.\n**App:** + the chat window + the list it resends every time.\n**Agent:** + tools + **a loop that keeps going until the job is done.**\n:::\n\n## Three steps\n\n**Ask:** The loop has three steps, repeated: THINK, ACT, OBSERVE. Which ones does the model do? Hands up for each.\n\n| Step | Who | What happens |\n|---|---|---|\n| THINK | <span class=\"rv w1\">the model<\/span> | <span class=\"rv w1\">reads everything in the list, then asks for a tool or answers<\/span> |\n| ACT | <span class=\"rv w2\">our code<\/span> | <span class=\"rv w2\">runs the tool the model asked for<\/span> |\n| OBSERVE | <span class=\"rv w3\">our code<\/span> | <span class=\"rv w3\">appends the result to the list, then calls the model again<\/span> |\n\n::: reveal THINK | .w1\n:::\n::: reveal ACT | .w2\n:::\n::: reveal OBSERVE | .w3\n**Only THINK is the model.** ACT and OBSERVE are lines of our code.\n:::\n\n\n## The loop in code\n\n```python\nchat_history.append({\"role\": \"user\", \"content\": question})\n\nfor pass_number in range(1, MAX_CALLS_PER_QUESTION + 1):     # THE LOOP\n    reply = llm.chat(chat_history, tools=TOOLS)              # THINK\n    chat_history.append(reply)\n    if not reply.tool_calls:\n        print(reply.text)                                    # done: it answered\n        break\n    for call in reply.tool_calls:\n        result = TOOL_FUNCTIONS[call[\"name\"]](**call[\"arguments\"])   # ACT\n        chat_history.append({\"role\": \"tool\", \"content\": result})     # OBSERVE\n```\n\n**Ask:** Where have you seen the OBSERVE line before?\n\n::: reveal Answer\n**R2, THE MEMORY.** It's the same `append`. A tool result is one more message in the list.\n:::\n\n\n## Where is \"reflect\"?\n\n**Ask:** You'll read \"think, act, observe, **reflect**\". Which line of the code is reflect?\n\n::: reveal Answer\n**None of them.** Reflect is THINK on the second pass and later: the result is now in the list, and the model decides whether it has enough. In Priya's run it even wrote it down:\n\n> \"The search tool ignores permissions, so check whether Priya has access.\"\n:::\n", "content/agent-loop/the-run.md": "# Priya's run, pass by pass\n\n## Predict\n\nThe model has three tools: `search_document`, `user_access_report`, `workspace_owner`.\n\n**Ask:** Priya's message goes in. Write down which tool the model asks for first, and what it asks for after the search comes back.\n\n\n## Pass by pass\n\n| Pass | THINK (model) | ACT (our code) | OBSERVE (appended) |\n|---|---|---|---|\n| 1 | <span class=\"rv p1\">needs to find it<\/span> | <span class=\"rv p1\">`search_document(\"invoice 4711\")`<\/span> | <span class=\"rv p1\">found · Finance · archived 2024-03-14<\/span> |\n| 2 | <span class=\"rv p2\">\"search ignores permissions, so check access\"<\/span> | <span class=\"rv p2\">`user_access_report(\"Finance\")`, `workspace_owner(\"Finance\")`<\/span> | <span class=\"rv p2\">Priya not on the list · owner Markus Weber<\/span> |\n| 3 | <span class=\"rv p3\">done<\/span> | <span class=\"rv p3\">none<\/span> | <span class=\"rv p3\">answer: archived in Finance, no access, ask Markus Weber<\/span> |\n\n::: reveal Pass 1 | .p1\n:::\n::: reveal Pass 2 | .p2\n**\"Finance\"** came from pass 1. The model couldn't have asked this first.\n:::\n::: reveal Pass 3 | .p3\n`loop ran 3 times · 3 model calls · 3 tool calls · 1 turn for you`\n:::\n\n\n## Two tools in one pass\n\n**Ask:** Your list had three checks, one after the other. The model needed only three passes, and one of them was the answer. Where did a pass go?\n\n::: reveal Answer\n**Pass 2 asked for both tools at once.** After the search, the model already had what both needed: the workspace name. It batches what it can and waits only where it has to.\n:::\n\n\n## Your turn\n\n**Task for participants:** In pairs, run `uv run r6_agent_loop.py --replay`. For each of the three questions:\n\n1. Count the passes (the last line tells you).\n2. For every pass after the first, point at the earlier result that made the model ask for what it asked.\n\n", "content/agent-loop/stop-and-cost.md": "# When does it stop?\n\n## Who is looping?\n\n**Ask:** In this code, who goes round the loop: the model or us?\n\n```python\nfor pass_number in range(1, MAX_CALLS_PER_QUESTION + 1):     # THE LOOP\n    reply = llm.chat(chat_history, tools=TOOLS)              # THINK\n```\n\n::: reveal Answer\n**Our code.** Each call to the model stands alone: it gets the list, writes one reply, and is done. Our `for` line calls it again.\n\n\"The agent\" isn't the model. It's the whole thing: **model + tools + this loop.**\n:::\n\n## Two ways out\n\n**Ask:** The loop went round three times for Priya, then stopped. Which lines can end it?\n\n::: reveal 1. The model stops asking\n```python\nif not reply.tool_calls:\n    print(reply.text)\n    break\n```\nEvery reply is one of two kinds: a **tool request** or **plain text**. Our code only checks which. Text means done. (In the API: `stop_reason` is `\"tool_use\"` or `\"end_turn\"`.)\n:::\n\n::: reveal 2. We stop it\n`range(1, MAX_CALLS_PER_QUESTION + 1)`: after 6 passes the loop ends, whatever the model wants. The model can't change that line.\n:::\n\n\n## Does the model know it's done?\n\n**Ask:** Does the model know it's in a loop?\n\n::: reveal Answer\n**No.** On every call it sees only the list and asks one thing: *is there enough in here to answer?* It's trained to write a tool request when something is missing and a tool can get it, and to answer otherwise.\n:::\n\n| Pass | What's in the list | The model's reply |\n|---|---|---|\n| 1 | <span class=\"rv k1\">only Priya's question<\/span> | <span class=\"rv k1\">missing: where is it? → search<\/span> |\n| 2 | <span class=\"rv k2\">+ \"it's in Finance\"<\/span> | <span class=\"rv k2\">missing: can she open it? → access, owner<\/span> |\n| 3 | <span class=\"rv k3\">+ access list + owner<\/span> | <span class=\"rv k3\">enough → **text**, so our `break`<\/span> |\n\n::: reveal Pass 1 | .k1\n:::\n::: reveal Pass 2 | .k2\n:::\n::: reveal Pass 3 | .k3\n:::\n\n\n## Same loop, different passes\n\n| Question | Passes | Why |\n|---|---|---|\n| \"I can't find invoice 4711.\" | <span class=\"rv c1\">3<\/span> | <span class=\"rv c1\">found, so check access and owner<\/span> |\n| \"Who owns the HR workspace?\" | <span class=\"rv c2\">2<\/span> | <span class=\"rv c2\">one tool is enough<\/span> |\n| \"I can't find invoice 9999.\" | <span class=\"rv c3\">2<\/span> | <span class=\"rv c3\">nothing found, so there's no workspace to check<\/span> |\n\n::: reveal 4711 | .c1\n:::\n::: reveal HR owner | .c2\n:::\n::: reveal 9999 | .c3\n**The code is the same. The tool results decide how often it goes round.**\n:::\n\n\n## Every pass resends the list\n\nInput tokens for Priya's one question:\n\n| Pass 1 | Pass 2 | Pass 3 | Total |\n|---|---|---|---|\n| 642 | 774 | 1,053 | **2,469** |\n\n**Ask:** Why does each pass cost more than the last?\n\n::: reveal Answer\nEvery pass sends **the whole list again**, as in R2, plus the tool descriptions. The list grows by the model's request and our results each time. More passes: more cost, more waiting.\n:::\n", "content/agent-loop/close.md": "# Loop or not?\n\n## Loop or chain?\n\n**Ask:** Each of these could be built as a loop or as fixed steps in code. Which is which? Hands up for \"loop\".\n\n1. Every new ticket: pull out the fields, then draft a reply.\n2. \"I can't find invoice 4711.\"\n3. The monthly doc-count report for Finance.\n\n::: reveal Answer\n- **1 and 3: fixed steps.** They're the same every time, so write them as plain code: that's chaining (R7). Cheaper, faster, and the same every run.\n- **2: loop.** The search result decides what comes next.\n\nUse a loop when **the next step depends on what came back**.\n:::\n\n\n## Back to your drawing\n\n**Ask:** Monday's Press Enter drawings are still on the wall. Where does the loop go? Who draws the arrow from the tool back to the model?\n\n::: reveal Answer\n**Our code.** It runs the tool, appends the result and calls the model again. The model never leaves its box.\n:::\n\n> The model decides the next step. Our code takes it, and the loop goes round until the model stops asking.\n"}, "css": ["viewer/student.css", "viewer/theme.css"]};</script>
