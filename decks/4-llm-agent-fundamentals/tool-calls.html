<script>window.DECK = {"flow": [{"title": "Priya asks for the date", "file": "content/tool-calls/opening.md"}, {"title": "One question, two calls", "file": "content/tool-calls/the-run.md"}, {"title": "Tokens, and two tools at once", "file": "content/tool-calls/cost-and-parallel.md"}, {"title": "The loop in code", "file": "content/tool-calls/the-loop.md"}], "files": {"content/tool-calls/opening.md": "# Priya asks for the date\n\n## Overview\n\n**Goal:** Tell who does what in a tool call: the model asks, our code runs the tool, the result goes back in the request.\n\n**Walk out with:** the sentence \"the model writes the request, our code does the work, and the result goes back in as text in the next call.\"\n\n\n## Priya's question\n\n> Priya is planning the team outing. She asks the assistant: **\"What's today's date?\"**\n\n**Ask:** R1 and R2 ended on this question, and the model couldn't answer. How would it ever know? Write down one idea.\n\n::: reveal What the room says\n- **\"Put it in.\"** Paste the date into the request, like the system prompt in R3.\n- **\"Let it look it up.\"** Give it a way to check. That's today: **tools**.\n:::\n\n\n## Without tools\n\nThe same question, with no tools offered:\n\n```\ntools offered   (none)\nconversation    1 message\n   [0] user       What's today's date?\n```\n\n::: reveal What Opus said\n\"I can't see today's date because I don't have access to real-time information like a clock or calendar.\"\n:::\n\n\n## What a tool is\n\n**Ask:** What do we have to hand the model so it can \"look up\" the date?\n\n::: reveal Answer\nTwo things:\n\n- **A plain Python function on our laptop.** `get_today()` reads the laptop's clock. `get_weather(city)` asks Open-Meteo (free, no key).\n- **A description the model reads.** A name, one sentence, the parameters. Sent with every call, like the system prompt.\n:::\n\n## The two parts in code\n\n```python\ndef get_today():\n    return date.today().strftime(\"%A, %d %B %Y\")\n\nTOOLS = [\n    {\"name\": \"get_today\",\n     \"description\": \"Returns today's date and weekday.\",\n     \"parameters\": {\"type\": \"object\", \"properties\": {}}},\n    {\"name\": \"get_weather\",\n     \"description\": \"Returns the current weather in a city: temperature in °C, conditions and wind.\",\n     \"parameters\": {\"type\": \"object\", \"properties\": {\"city\": {\"type\": \"string\"}}, \"required\": [\"city\"]}},\n]\n```\n\n", "content/tool-calls/the-run.md": "# One question, two calls\n\n## The run\n\n<div class=\"diagram\" id=\"run\"><svg viewBox=\"0 0 900 430\" role=\"img\" aria-label=\"One question, two calls: our code sends the question and tools, the model asks for get_today, our code runs it and sends the result back, the model answers\">\n  <defs><marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" style=\"fill:var(--ink)\"/><\/marker><\/defs>\n  <g><rect x=\"40\" y=\"10\" width=\"260\" height=\"56\" rx=\"12\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:3\"/>\n    <text x=\"170\" y=\"46\" text-anchor=\"middle\" style=\"font-weight:700;font-size:21px;fill:var(--navy)\">Our code (this laptop)<\/text>\n    <rect x=\"600\" y=\"10\" width=\"260\" height=\"56\" rx=\"12\" style=\"fill:var(--card);stroke:var(--ink);stroke-width:3\"/>\n    <text x=\"730\" y=\"46\" text-anchor=\"middle\" style=\"font-weight:700;font-size:21px;fill:var(--ink)\">The model<\/text>\n    <line x1=\"170\" y1=\"66\" x2=\"170\" y2=\"420\" style=\"stroke:var(--muted);stroke-width:2;stroke-dasharray:6 6\"/>\n    <line x1=\"730\" y1=\"66\" x2=\"730\" y2=\"420\" style=\"stroke:var(--muted);stroke-width:2;stroke-dasharray:6 6\"/><\/g>\n  <g class=\"rv s1\"><line x1=\"176\" y1=\"110\" x2=\"722\" y2=\"110\" marker-end=\"url(#arr)\" style=\"stroke:var(--ink);stroke-width:3\"/>\n    <text x=\"450\" y=\"98\" text-anchor=\"middle\" style=\"font-size:18px;fill:var(--ink)\"><tspan style=\"font-weight:700\">Call 1:<\/tspan> the question + the tool descriptions<\/text><\/g>\n  <g class=\"rv s2\"><line x1=\"724\" y1=\"170\" x2=\"178\" y2=\"170\" marker-end=\"url(#arr)\" style=\"stroke:var(--orange);stroke-width:3\"/>\n    <text x=\"450\" y=\"158\" text-anchor=\"middle\" style=\"font-size:18px;fill:var(--orange)\">\"please run get_today()\"  (a request, not an answer)<\/text><\/g>\n  <g class=\"rv s3\"><rect x=\"40\" y=\"200\" width=\"260\" height=\"76\" rx=\"10\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"170\" y=\"232\" text-anchor=\"middle\" style=\"font-weight:700;font-size:18px;fill:var(--ink)\">runs get_today()<\/text>\n    <text x=\"170\" y=\"258\" text-anchor=\"middle\" style=\"font-size:16px;fill:var(--ink)\">clock: Monday, 05 October 2026<\/text><\/g>\n  <g class=\"rv s4\"><line x1=\"176\" y1=\"320\" x2=\"722\" y2=\"320\" marker-end=\"url(#arr)\" style=\"stroke:var(--ink);stroke-width:3\"/>\n    <text x=\"450\" y=\"308\" text-anchor=\"middle\" style=\"font-size:18px;fill:var(--ink)\"><tspan style=\"font-weight:700\">Call 2:<\/tspan> question + its request + our result<\/text><\/g>\n  <g class=\"rv s5\"><line x1=\"724\" y1=\"380\" x2=\"178\" y2=\"380\" marker-end=\"url(#arr)\" style=\"stroke:var(--good);stroke-width:3\"/>\n    <text x=\"450\" y=\"368\" text-anchor=\"middle\" style=\"font-size:18px;fill:var(--good)\">\"Today's date is Monday, 05 October 2026.\"<\/text><\/g>\n<\/svg><\/div>\n\n**Ask:** Priya asks for the date. Before each arrow appears: what goes across next?\n\n::: reveal Call 1 | #run .s1\nOur code sends the question and the two tool descriptions.\n:::\n::: reveal The model asks | #run .s2\nThe model answers with a **request**, not text: \"please run `get_today()`\". It cannot run anything itself.\n:::\n::: reveal We run it | #run .s3\n**Our code** runs the function on this laptop. The laptop's clock gives the date.\n:::\n::: reveal Call 2 | #run .s4\nThe whole list goes again, now three messages: the question, the model's request, our result.\n:::\n::: reveal The answer | #run .s5\nNow the date is in the request, so the model answers with text.\n:::\n\n\n\n## Call 1 in the printout\n\n```\nYou: What's today's date?\n\nLLM asks us to run: get_today()\n--- what we sent to the model | call 1 | qwen3:8b ---\ntools offered   get_today, get_weather\nconversation    1 message\n   [0] user       What's today's date?\ninput tokens    193\n\nWe ran get_today on this laptop. It returned: Monday, 05 October 2026\n```\n\n**Ask:** The model asked for `get_today()`. Why isn't that request in the list?\n\n::: reveal Answer\nEach printout shows what we **sent** in that call. The model's \"please run\" came **back**, so it isn't listed here. It shows up in call 2, because by then we send it back.\n:::\n\n## Call 2 in the printout\n\n```\nLLM: Today's date is Monday, 05 October 2026.\n\n--- what we sent to the model | call 2 | qwen3:8b ---\ntools offered   get_today, get_weather\nconversation    3 messages\n   [0] user       What's today's date?\n   [1] assistant  -> please run get_today()\n   [2] tool       get_today returned Monday, 05 October 2026\ninput tokens    233\n```\n\n**Ask:** Find the date in call 2's printout. Who put it there?\n\n::: reveal Answer\nMessage **[2]**, and **our code** put it there. The model didn't remember it: it read it in the request.\n:::\n\n\n## What goes in call 2\n\n**Ask:** After the tool runs, what exactly do we send? Only the result, or more?\n\n::: reveal Answer\n**The whole list again**, as in R2, now three messages long, plus the tool descriptions again.\n:::\n\n\n## On the wire\n\nOn the wire to Anthropic, roughly:\n\n```json\n\"messages\": [\n  {\"role\": \"user\", \"content\": \"What's today's date?\"},\n  {\"role\": \"assistant\", \"content\": [\n     {\"type\": \"tool_use\", \"id\": \"toolu_01A\", \"name\": \"get_today\", \"input\": {}}]},\n  {\"role\": \"user\", \"content\": [\n     {\"type\": \"tool_result\", \"tool_use_id\": \"toolu_01A\", \"content\": \"Monday, 05 October 2026\"}]}\n]\n```\n\n::: reveal Why the id?\n**The id ties the result to the request.** When the model asks for two tools at once, the ids say which result belongs to which call.\n:::\n\n", "content/tool-calls/cost-and-parallel.md": "# Tokens, and two tools at once\n\n## Tools cost tokens\n\n**Ask:** \"What's today's date?\" is six words. How many input tokens did call 1 use? Write down a number.\n\n| Model | Call 1 | Call 2 |\n|---|---|---|\n| qwen3:8b (local) | <span class=\"rv t1\">193<\/span> | <span class=\"rv t2\">233<\/span> |\n| Opus (the recording you replay) | <span class=\"rv t1\">456<\/span> | <span class=\"rv t2\">498<\/span> |\n\n::: reveal Call 1 | .t1\nMost of it is the **tool descriptions**. Anthropic also adds its own instructions for using tools.\n:::\n::: reveal Call 2 | .t2\nBigger again: the two new messages, the request and the result.\n:::\n\n\n## Two tools at once\n\n> Priya can't decide where to hold the outing. **\"Is it warmer in Berlin or in Munich?\"**\n\n**Ask:** How many tool calls does that need? In one turn or two?\n\n```\nLLM asks us to run: get_weather(city='Berlin')\nLLM asks us to run: get_weather(city='Munich')\nWe ran get_weather ... {\"city\": \"Berlin\", ... \"temperature_c\": 11.7, \"conditions\": \"mainly clear\" ...}\nWe ran get_weather ... {\"city\": \"Munich\", ... \"temperature_c\": 14.1, \"conditions\": \"overcast\" ...}\nLLM: Munich is warmer, at 14.1 °C compared with 11.7 °C in Berlin.\n```\n\n::: reveal Answer\nTwo calls to the tool. **Opus asked for both in one turn**, so we ran both and sent both results back together. The ids keep them apart. qwen3:8b asked one at a time: Berlin, a new call, then Munich. Same answer, one more call.\n:::\n\n", "content/tool-calls/the-loop.md": "# The loop in code\n\n## The loop\n\n**Ask:** We don't know in advance how many tools the model will ask for. What does the code need?\n\n::: reveal Answer\n**A loop.** Call the model; while it asks for tools, run them and call again; stop when it answers with text.\n:::\n\n```python\nchat_history.append({\"role\": \"user\", \"content\": question})\n\nwhile True:                                     # THE LOOP\n    reply = llm.chat(chat_history, tools=TOOLS)\n    chat_history.append(reply)                  # the model's turn\n    if not reply.tool_calls:                    # plain text: done\n        print(reply.text)\n        break\n    for call in reply.tool_calls:               # it asked for tools: run them\n        result = TOOL_FUNCTIONS[call[\"name\"]](**call[\"arguments\"])\n        chat_history.append({\"role\": \"tool\", \"tool_call_id\": call[\"id\"], \"content\": result})\n```\n\n\n## Got it?\n\n**Ask:** Write your answers down, then compare with your neighbour.\n\n1. Who ran `get_weather`: the model or the laptop?\n2. Why two calls for one question?\n3. Where did the date in the answer come from?\n\n::: reveal 1\n**1.** The laptop. The model only asked.\n:::\n::: reveal 2\n**2.** Call 1 gets the request, call 2 gets the answer, with the result in the request.\n:::\n::: reveal 3\n**3.** Message [2], which our code put in the request.\n:::\n## Got it? (continued)\n\n4. Why 193 tokens for a six-word question?\n5. The weather service is down. What does the model get?\n\n::: reveal 4\n**4.** The tool descriptions go with every call.\n:::\n::: reveal 5\n**5.** Whatever our function returns. Here, an error text, which goes back like any other result.\n:::\n\n## Your turn\n\n**Task for participants:** In pairs, run `uv run r4_tool_call.py --replay` and stop at the weather question. In the printout, find the tool definitions, the model's \"please run get_weather(...)\" and the result we sent back. Count the calls to the model for that one question.\n\n\n\n::: reveal Back to Priya\nThe model never saw a clock. It asked; our code read the clock and put the date in the request.\n:::\n\n> The model writes the request, our code does the work, and the result goes back in as text in the next call.\n"}, "css": ["viewer/student.css", "viewer/theme.css"]};</script>
