<script>window.DECK = {"flow": [{"title": "What happens when you press Enter?", "file": "content/how-llms-work/opening.md"}, {"title": "Chatbots before LLMs", "file": "content/how-llms-work/chatbots.md"}, {"title": "A model is a file of numbers", "file": "content/how-llms-work/neural-nets.md"}, {"title": "From text to tokens", "file": "content/how-llms-work/tokens-bpe.md"}, {"title": "You shall know a word by the company it keeps", "file": "content/how-llms-work/embeddings.md"}, {"title": "The transformer", "file": "content/how-llms-work/transformer.md"}, {"title": "From scores to sentences", "file": "content/how-llms-work/generation.md"}, {"title": "From autocomplete to assistant", "file": "content/how-llms-work/after-pretraining.md"}], "files": {"content/how-llms-work/opening.md": "# What happens when you press Enter?\n\n## Overview\n\n**Goal:** Put the room's own picture of \"what happens after Enter\" on the wall, and see that language is predictable enough to guess.\n\n**Walk out with:** An LLM is a statistical model of language: it predicts what comes next.\n\n\n## Priya presses Enter\n\n> Priya pastes overdue invoice 4471 into Copilot and types: *\"Write a friendly reminder to the customer.\"* She presses Enter. Half a second later, words start to appear, one after another.\n\n**Task for participants:** In pairs, draw what happens between Priya pressing Enter and the first word appearing. Boxes and arrows. Two minutes.\n\n::: reveal Keep the drawings\nKeep them. We come back to them at the very end.\n:::\n\n\n\n## Shannon's guessing game\n\n![Claude and Betty Shannon with the sentence \"The next letter in this sentence is going t…\"](content/how-llms-work/img/0-42-shannon-next-letter.jpg)\n\n**Ask:** Write down the next word: *\"Invoice 4471 is now 30 days ___\"*\n\n::: reveal Answer\n**overdue.** Almost everyone writes the same word. Given enough context, the next piece of text is often nearly certain.\n:::\n\n\n\n## The road from here\n\nAn LLM is a **statistical model of language**: it takes patterns from huge amounts of text and predicts what comes next.\n\n\"It predicts the next token\" is true. But there's a lot of machinery before \"what comes next\". Today we open the box, one piece at a time:\n\n**Today's stops:** rules, neural nets, tokens, embeddings, the transformer, sampling, the assistant\n\n\n---\n", "content/how-llms-work/chatbots.md": "# Chatbots before LLMs\n\n## Overview\n\n**Goal:** Tell a rule-based chatbot from an LLM, even when the chat window looks the same.\n\n**Walk out with:** input → black box → output. Rules filled the box for 60 years; an LLM is a different mechanism in the same box.\n\n\n## ELIZA, 1966\n\n> Weizenbaum's secretary tried his new program, ELIZA, then asked him to leave the room so she could talk to it in private.\n\n**Ask:** ELIZA played a therapist. How much do you think it understood?\n\n::: reveal Answer\n**Nothing.** A list of if-statements: find a keyword, send back a prepared sentence. A **rule-based system**.\n:::\n\n\n## Demo: a chatbot made of if-statements\n\n**Ask:** This chatbot is about thirty lines of if-statements. Predict its answer to: *\"My boss gave me good remarks.\"*\n\n::: reveal Answer\n*\"Tell me more about your boss.\"* It found the word after \"my\" and dropped it into a sentence.\n:::\n\n\n## Inside the box\n\n```typescript\nif (greetings.some(greet => words.includes(greet))) {\n  return \"Hello! How can I help you today?\";\n}\nif (messageLower.startsWith(\"i feel\")) {\n  const feeling = messageLower.slice(7).replace(\" i \", \" you \");\n  return `Why do you feel ${feeling}?`;\n}\nconst subjectIndex = words.indexOf(\"my\") + 1;\nif (subjectIndex > 0 && subjectIndex < words.length) {\n  return `Tell me more about your ${words[subjectIndex]}.`;\n}\nreturn getRandomContinuation();   // \"Please go on.\"\n```\n\n\n## Sixty years of rules\n\n| Year | Chatbot | How it worked |\n|---|---|---|\n| 1966 | ELIZA (MIT) | Keyword rules, played a therapist |\n| 1972 | PARRY (Stanford) | Simulated a paranoid patient, with internal states for anger, fear and mistrust |\n| 1995 | ALICE | 41,000 hand-written patterns |\n| 2001 | SmarterChild (AOL Messenger) | Used daily by millions; a do-everything bot |\n\n**Ask:** What do all four have in common?\n\n::: reveal Answer\n**A human wrote every answer in advance:** rules, scripts, templates, decision trees. ChatGPT isn't a better ELIZA. It's a completely different mechanism.\n:::\n\n\n## The black box\n\n<div class=\"diagram\" id=\"bb\" style=\"display:flex;gap:12px\"><img style=\"width:49%;max-height:30vh\" src=\"content/how-llms-work/img/7-13-black-box-rules.jpg\" alt=\"'hello' goes into a box of if-statements, 'hi!' comes out\"><img class=\"rv llm\" style=\"width:49%;max-height:30vh\" src=\"content/how-llms-work/img/7-19-black-box-llm.jpg\" alt=\"'What is the meaning of life?' goes into a box marked LLM\"><\/div>\n\nInput → process → output. The box can be anything.\n\n::: reveal Swap the box | #bb .llm\nTake the if-statements out and put an **LLM** in. The window, the input and the streamed output stay the same.\n:::\n\n\n---\n", "content/how-llms-work/neural-nets.md": "# A model is a file of numbers\n\n## Overview\n\n**Goal:** Say what a model is (a neural network whose knowledge sits in its weights) and how training sets those weights.\n\n**Walk out with:** predict → measure how wrong → nudge every weight → repeat. The result is a file of numbers.\n\n\n## Neurons, layers, weights\n\n<div class=\"diagram\" id=\"nn\"><svg viewBox=\"0 0 960 470\" role=\"img\" aria-label=\"A neural network: three inputs (long? in bun? brown?), two hidden neurons with biases -7.5 and -2.5, and one output with bias -3.0; each connection carries a weight\"><rect x=\"180\" y=\"60\" width=\"100\" height=\"360\" rx=\"12\" style=\"fill:var(--zebra);stroke:var(--line);stroke-width:2\"/><text x=\"230.0\" y=\"46\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:18px;fill:var(--muted)\">input layer<\/text><rect x=\"440\" y=\"130\" width=\"120\" height=\"260\" rx=\"12\" style=\"fill:var(--zebra);stroke:var(--line);stroke-width:2\"/><text x=\"500.0\" y=\"116\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:18px;fill:var(--muted)\">hidden layer<\/text><rect x=\"700\" y=\"180\" width=\"120\" height=\"140\" rx=\"12\" style=\"fill:var(--zebra);stroke:var(--line);stroke-width:2\"/><text x=\"760.0\" y=\"166\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:18px;fill:var(--muted)\">output layer<\/text><line x1=\"230\" y1=\"140\" x2=\"500\" y2=\"190\" style=\"stroke:var(--muted);stroke-width:3\"/><line x1=\"230\" y1=\"140\" x2=\"500\" y2=\"310\" style=\"stroke:var(--muted);stroke-width:1.5\"/><line x1=\"230\" y1=\"250\" x2=\"500\" y2=\"190\" style=\"stroke:var(--muted);stroke-width:3\"/><line x1=\"230\" y1=\"250\" x2=\"500\" y2=\"310\" style=\"stroke:var(--muted);stroke-width:1.5\"/><line x1=\"230\" y1=\"360\" x2=\"500\" y2=\"190\" style=\"stroke:var(--muted);stroke-width:1.5\"/><line x1=\"230\" y1=\"360\" x2=\"500\" y2=\"310\" style=\"stroke:var(--muted);stroke-width:3\"/><line x1=\"500\" y1=\"190\" x2=\"760\" y2=\"250\" style=\"stroke:var(--muted);stroke-width:3\"/><line x1=\"500\" y1=\"310\" x2=\"760\" y2=\"250\" style=\"stroke:var(--muted);stroke-width:3\"/><rect x=\"287\" y=\"141\" width=\"48\" height=\"26\" rx=\"5\" style=\"fill:var(--card)\"/><text x=\"311\" y=\"161\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:17px;fill:var(--ink)\">5.0<\/text><rect x=\"373\" y=\"231\" width=\"48\" height=\"26\" rx=\"5\" style=\"fill:var(--card)\"/><text x=\"397\" y=\"251\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:17px;fill:var(--ink)\">0.0<\/text><rect x=\"287\" y=\"218\" width=\"48\" height=\"26\" rx=\"5\" style=\"fill:var(--card)\"/><text x=\"311\" y=\"238\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:17px;fill:var(--ink)\">5.0<\/text><rect x=\"373\" y=\"273\" width=\"48\" height=\"26\" rx=\"5\" style=\"fill:var(--card)\"/><text x=\"397\" y=\"293\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:17px;fill:var(--ink)\">0.0<\/text><rect x=\"287\" y=\"295\" width=\"48\" height=\"26\" rx=\"5\" style=\"fill:var(--card)\"/><text x=\"311\" y=\"315\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:17px;fill:var(--ink)\">0.0<\/text><rect x=\"373\" y=\"315\" width=\"48\" height=\"26\" rx=\"5\" style=\"fill:var(--card)\"/><text x=\"397\" y=\"335\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:17px;fill:var(--ink)\">5.0<\/text><rect x=\"606\" y=\"206\" width=\"48\" height=\"26\" rx=\"5\" style=\"fill:var(--card)\"/><text x=\"630\" y=\"226\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:17px;fill:var(--ink)\">12.0<\/text><rect x=\"606\" y=\"266\" width=\"48\" height=\"26\" rx=\"5\" style=\"fill:var(--card)\"/><text x=\"630\" y=\"286\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:17px;fill:var(--ink)\">-6.0<\/text><circle cx=\"230\" cy=\"140\" r=\"28\" style=\"fill:var(--navy)\"/><text x=\"164\" y=\"147\" text-anchor=\"end\" style=\"font-family:var(--mono);font-weight:700;font-size:20px;fill:var(--ink)\">long?<\/text><circle cx=\"230\" cy=\"250\" r=\"28\" style=\"fill:var(--navy)\"/><text x=\"164\" y=\"257\" text-anchor=\"end\" style=\"font-family:var(--mono);font-weight:700;font-size:20px;fill:var(--ink)\">in bun?<\/text><circle cx=\"230\" cy=\"360\" r=\"28\" style=\"fill:var(--navy)\"/><text x=\"164\" y=\"367\" text-anchor=\"end\" style=\"font-family:var(--mono);font-weight:700;font-size:20px;fill:var(--ink)\">brown?<\/text><circle cx=\"500\" cy=\"190\" r=\"28\" style=\"fill:var(--orange)\"/><text x=\"500\" y=\"246\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:18px;fill:var(--ink)\">b: -7.5<\/text><circle cx=\"500\" cy=\"310\" r=\"28\" style=\"fill:var(--orange)\"/><text x=\"500\" y=\"366\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:18px;fill:var(--ink)\">b: -2.5<\/text><circle cx=\"760\" cy=\"250\" r=\"28\" style=\"fill:var(--good)\"/><text x=\"760\" y=\"306\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:18px;fill:var(--ink)\">b: -3.0<\/text><text x=\"836\" y=\"257\" style=\"font-family:var(--mono);font-weight:700;font-size:20px;fill:var(--ink)\">hot dog?<\/text><\/svg><\/div>\n\n**Ask:** A **neural network** decides \"hot dog or not?\" from three questions: long? in a bun? brown? Which should count most?\n\n::: reveal Answer\nProbably \"in a bun?\". Every connection has a **weight**: a number for how much it counts. The weights are what the network learns.\n:::\n\n\n## The problem that killed the perceptron\n\n**XOR** (\"exclusive or\"): output 1 if **exactly one** input is 1.\n\n**Ask:** Fill in the last column.\n\n| Input 1 | Input 2 | XOR |\n|---|---|---|\n| 0 | 0 | ? |\n| 0 | 1 | ? |\n| 1 | 0 | ? |\n| 1 | 1 | ? |\n\n::: reveal Answer\n**0, 1, 1, 0.** Trivial for a person. In 1969 Minsky and Papert proved a **single-layer** network can never learn it. Networks with more layers could, but nobody knew how to train them.\n:::\n\n\n## Demo: teach a network XOR\n\n**Ask:** A single-layer network gets 5,000 tries at XOR. Will it learn it? And a network with one hidden layer?\n\n::: reveal Answer\n**Single layer: no.** After 5,000 tries its answers sit near 0.5: guessing. **Multi-layer: yes.** By about 800 tries the error is tiny, and its answers round to 0, 1, 1, 0.\n:::\n\n\n## Predict, measure, nudge, repeat\n\n<img style=\"max-height:28vh\" src=\"content/how-llms-work/img/10-09-backprop.jpg\" alt=\"A network with predict at the top, adjust at the left and loss at the bottom\">\n\n```typescript\nconst output = sigmoid(x1 * w1 + x2 * w2 + bias); // predict\nconst error = output - target;                      // measure how wrong\nconst delta = error * sigmoidDeriv(output);\nw1 -= lr * delta * x1;                              // nudge each weight\nw2 -= lr * delta * x2;                              // a little in the\nbias -= lr * delta;                                 // right direction\n```\n\n\n\n## The model is a file\n\nAfter training, the network is saved to a file. This is the single-layer one, from our run:\n\n```json\n{\n  \"type\": \"single-layer\",\n  \"w1\": -0.26539275477044666,\n  \"w2\": -0.13269637738522316,\n  \"bias\": 0.13269637738522308\n}\n```\n\n**Ask:** How many numbers is this \"model\"? And the multi-layer one: 2 inputs, 4 hidden neurons, 1 output. Count the connections, plus one bias per neuron.\n\n::: reveal Answer\n**3** for the single layer. **17** for the multi-layer one: 2×4 input weights + 4 hidden biases + 4 output weights + 1 output bias. Every model, up to Claude, is the same kind of file, with billions of numbers.\n:::\n\n## Same idea, more numbers\n\n![The multi-layer weights file beside its network: input 1 and 2, four hidden neurons, one output](content/how-llms-work/img/12-56-multi-layer-weights.jpg)\n\n\n---\n", "content/how-llms-work/tokens-bpe.md": "# From text to tokens\n\n## Overview\n\n**Goal:** Explain why text is cut into tokens before the network sees it, and how BPE decides the cuts.\n\n**Walk out with:** BPE merges the most frequent pair, again and again. Common words stay whole; rare words split.\n\n\n## Text has to become inputs\n\nA network takes numbers in. Priya's reminder is text. So first it's cut into **tokens**: not words, not letters, something in between.\n\n![English, Japanese, Python, TypeScript and emoji, each cut into coloured tokens](content/how-llms-work/img/17-32-bpe-any-language.jpg)\n\n\n## Merge the most common pair\n\n![A row of letters where the most frequent pair has been replaced by a new symbol Z, and the next pair is being counted](content/how-llms-work/img/16-49-bpe-merge-pair.jpg)\n\n**Ask:** Start from single letters in *\"the cat sat on the mat\"*. Which pair of letters appears most often?\n\n::: reveal Answer\n**\"a\" + \"t\": 3 times** (cat, sat, mat). Merge it into one token \"at\". Next come \"t\" + \"h\", then \"th\" + \"e\" → \"the\" (it appears twice). Repeat until you've done enough merges.\n:::\n\n\n## Demo: watch BPE build a vocabulary\n\n**Ask:** 22 characters go in. After the merges, how many tokens will *\"the cat sat on the mat\"* be?\n\n::: reveal Answer\n**11 tokens:** the · ␣ · cat · ␣ · sat · ␣ · on · ␣ · the · ␣ · mat. Every word became one token (spaces stay separate here); half as many pieces as letters.\n:::\n\n\n## Why you care\n\nEach token gets a number: its position in the vocabulary. That number says **nothing** about meaning. That's the next topic.\n\n**Tokens decide:** what a call costs, what fits in the window, what gets cut\n\n\n---\n", "content/how-llms-work/embeddings.md": "# You shall know a word by the company it keeps\n\n## Overview\n\n**Goal:** Explain how a token becomes a list of numbers whose position carries meaning, and why similar words end up close together.\n\n**Walk out with:** an embedding is a word's position in a space of meaning. Words used in similar company end up as neighbours.\n\n\n## A token number means nothing\n\n![A list of tokens with their numbers: sad, the, world, cat, run, king, dog, hello, walked, running, happy, queen](content/how-llms-work/img/21-46-token-ids.jpg)\n\n**Ask:** *king* is 7894 and *queen* is 41209. *cat* is 4344 and *run* is 6236. What do these numbers tell the model about meaning?\n\n::: reveal Answer\n**Nothing.** A token's number is just its position in the vocabulary list. We need numbers that carry **meaning**.\n:::\n\n## The company it keeps\n\n![The sentence \"You shall know a word by the company it keeps\" surrounded by the words it appears with](content/how-llms-work/img/22-36-company-it-keeps.jpg)\n\n**Ask:** Fill the gap with as many words as you can: *\"Priya sent the ___ to the customer on Friday.\"*\n\n::: reveal Answer\n**invoice, reminder, quote, contract…** Words that fit the same gaps keep the same company, and tend to mean related things.\n:::\n\n\n## A word becomes a list of numbers\n\n![The token \"king\" connected to a column of numbers labelled token vector](content/how-llms-work/img/23-06-token-vector.jpg)\n\nA **vector** is a list of numbers that marks a point in a space: **3** numbers for a point in a room, **300** per word in word2vec, **12,288** in GPT-3's largest model, **32** in our demo.\n\n\n\n## King − man + woman\n\n![The vectors of king, man and woman with a minus and a plus between them](content/how-llms-work/img/23-16-king-man-woman.jpg)\n\n**Ask:** Take the numbers for *king*. Subtract *man*, add *woman*. Which word is nearest to the result?\n\n::: reveal Answer\n**queen.** Nobody told the model about gender or royalty. It came out of nothing more than which words appear near which.\n:::\n\n\n## How close is close?\n\n![Two arrows from the same point with a small angle between them, labelled similarity 0.83](content/how-llms-work/img/24-25-cosine.jpg)\n\n**Cosine similarity** looks at the angle between two vectors.\n\n::: reveal Read the score\n**1** = pointing the same way (same meaning) · **0** = unrelated · **−1** = opposite. Small angle, high score.\n:::\n\n\n## Demo: train embeddings live\n\n**Ask:** We trained on about 100 plain sentences like *\"A king is a man who rules.\"* Which pair will score closest: king–queen, man–woman or woman–cat?\n\n::: reveal Answer\nIn our run: **king–queen 0.92**, man–woman 0.88, woman–cat 0.36. And the word maths works: king − man + woman = **queen**, prince − boy + girl = **princess**, kitten − cat + dog = **puppy**.\n:::\n\n\n## From words to whole sentences\n\nModern embeddings are word2vec's descendants, scaled up: trained on vastly more text, and embedding **whole sentences and paragraphs**, not single words.\n\n\n---\n", "content/how-llms-work/transformer.md": "# The transformer\n\n## Overview\n\n**Goal:** Describe what a transformer block does to each token (attention, then feed-forward) and why \"the same word, different meaning\" is solved by attention.\n\n**Walk out with:** tokens in → embedded → stacks of attention + feed-forward → a probability for every possible next token.\n\n\n## One word at a time\n\n![Six words, The cat sat on the mat, each passed through a box one after another](content/how-llms-work/img/31-20-lstm.jpg)\n\nBy 2016, Google Translate ran on **LSTMs**: they read one word at a time, with a running memory.\n\n**Ask:** What's the problem with reading one word at a time?\n\n::: reveal Answer\n**It's slow:** each word waits for the one before. And the start of a long sentence fades.\n:::\n\n## Attention, bolted on\n\n<div class=\"diagram\" id=\"att\" style=\"display:flex;gap:12px\"><img style=\"width:49%;max-height:30vh\" src=\"content/how-llms-work/img/31-26-lstm-attention.jpg\" alt=\"The same row of words with dotted arcs from one word back to earlier ones, labelled Attention\"><img class=\"rv al\" style=\"width:49%;max-height:30vh\" src=\"content/how-llms-work/img/31-49-alignment.jpg\" alt=\"French words le chat est assis linked to English words the cat is sitting\"><\/div>\n\n**Attention:** at each step, let the model look back at the whole input and **focus on the words that matter right now**.\n\n::: reveal Translating | #att .al\nTranslating French to English: when writing *cat*, look hardest at *chat*.\n:::\n\n\n## 2017: Attention Is All You Need\n\nIn 2017 Jakob Uszkoreit at Google proposed dropping the one-word-at-a-time part entirely and keeping **only attention**.\n\n- Eight researchers, all listed as equal contributors\n- Cited over 100,000 times\n- All eight have since left Google; several founded billion-dollar companies\n- **15 pages, free to read:** the blueprint of a trillion-dollar industry is a PDF\n\n\n## One block, two jobs\n\n![A transformer block: a row of tokens connected by arcs labelled Attention, then each token through its own small network labelled Feed Forward](content/how-llms-work/img/33-00-transformer-block.jpg)\n\n::: reveal The two jobs\n1. **Attention:** the tokens exchange information with each other.\n2. **Feed-forward:** each token is then processed on its own.\n:::\n\n\n## Query, key, value\n\n![Each token of The cat sat on the mat with three small dots underneath, Q, K and V, and arcs showing scores between them](content/how-llms-work/img/33-29-self-attention-qkv.jpg)\n\nFor each token, the model makes three vectors: a **query**, a **key** and a **value**. Every query is compared with every key.\n\n\n## Like searching the archive\n\n**Ask:** Priya searches the archive for \"unpaid invoices from March\". What does she compare her search with, and what does she take away?\n\n::: reveal Answer\nShe compares her search with the **labels** on the folders, and takes away the **contents** of the ones that match. Attention does the same for every token:\n\n| | In the archive | In attention |\n|---|---|---|\n| **Query** | Priya's search | what this token is looking for |\n| **Key** | the label on each folder | what each token offers |\n| **Value** | what's inside the folder | what gets passed on when they match |\n:::\n\n\n## Same word, different meaning\n\n<div class=\"diagram\" id=\"bank\" style=\"display:flex;gap:12px\"><img style=\"width:49%;max-height:30vh\" src=\"content/how-llms-work/img/33-46-river-bank.jpg\" alt=\"'the bank of the river was muddy' with arcs from bank to river and muddy\"><img class=\"rv b2\" style=\"width:49%;max-height:30vh\" src=\"content/how-llms-work/img/33-56-money-bank.jpg\" alt=\"'I went to the bank to deposit money' with arcs from bank to deposit and money\"><\/div>\n\n**Ask:** *\"The bank of the river was muddy.\"* Which words decide what \"bank\" means?\n\n::: reveal Answer | #bank .b2\n**river**, **muddy**. In *\"I went to the bank to deposit money\"*: **deposit**, **money**. Same word, different vector.\n:::\n\n\n## What is \"it\"?\n\n**Ask:** *\"The server rejected the file because **it** was too large.\"* What is \"it\"? And in *\"…because **it** was overloaded\"*?\n\n::: reveal Answer\n**The file**, then **the server**. One word changes, and \"it\" points at something else. That's the job attention does, for every token, in every layer.\n:::\n\n\n## Many heads\n\n![Four copies of the same sentence, each with different arcs between the words](content/how-llms-work/img/34-09-multi-head.jpg)\n\n**Multi-head attention:** the same operation many times side by side, each copy (a **head**) with its own weights.\n\n::: reveal Who tells each head what to look at?\n**Nobody.** The heads start random and specialise during training. One may end up tracking which pronoun points at which noun, another verb tense, another word order. It's emergent, not designed.\n:::\n\n\n## Stack the blocks\n\n![Three rows of five blocks each, linked one after another](content/how-llms-work/img/34-50-stacked-blocks.jpg)\n\nAttention + feed-forward = **one block**. Modern LLMs stack **dozens to hundreds**. One vector per token in, one out: they stack like bricks.\n\n::: reveal That's the whole architecture\nTokens → embedded → stacks of attention and feed-forward → a prediction. GPT, Claude, Gemini: the same recipe, scaled up. \"Deep\" learning = many stacked layers.\n:::\n\n\n## Demo: a transformer that writes stories\n\n**Ask:** The demo transformer was trained on about 30 short children's stories. How many numbers (parameters) do you think it has? And gpt-oss-120b, a model you can download?\n\n::: reveal Answer\n**About 52,000** for the demo's 6-layer model. **120 billion** for gpt-oss-120b: more than two million times as many. The hosted models from OpenAI and Anthropic are bigger again.\n:::\n\n\n---\n", "content/how-llms-work/generation.md": "# From scores to sentences\n\n## Overview\n\n**Goal:** Explain how the transformer's scores become words: softmax, temperature, top-p, and the loop that adds one token at a time. Know what the model actually receives, and what the context window limits.\n\n**Walk out with:** one token per pass, appended and fed back in. The model sees only what's in the context window, and remembers nothing between requests.\n\n\n## A score for every token\n\n![After \"once upon a time\", a bar for each possible next token: there, the, a, in, they…](content/how-llms-work/img/41-50-probabilities.jpg)\n\nThe transformer's output isn't a word. It's a **score for every token in the vocabulary** (the raw scores are called **logits**). **Softmax** turns them into probabilities that add up to 1.\n\n\n## Temperature\n\n<div class=\"diagram\" id=\"temp\" style=\"display:flex;gap:12px\"><img style=\"width:49%;max-height:30vh\" src=\"content/how-llms-work/img/42-10-temperature-low.jpg\" alt=\"At temperature 0.3, one tall bar for 'there' and almost nothing else\"><img class=\"rv hot\" style=\"width:49%;max-height:30vh\" src=\"content/how-llms-work/img/42-13-temperature-high.jpg\" alt=\"At temperature 1.5, the bars are much more even\"><\/div>\n\n**Ask:** A payment reminder for a customer: low or high temperature? Ten ideas for the team outing?\n\n::: reveal Answer | #temp .hot\n**Reminder: low:** the top token gets even more likely, so it's predictable. **Ideas: higher:** flatter bars, more surprise; at 1.5, sometimes nonsense.\n:::\n\n\n## Top-p\n\n![At top-p 0.2, only the top bar is kept; the rest are greyed out below a cut-off line](content/how-llms-work/img/42-49-top-p.jpg)\n\n**Top-p** is a cut-off: only the most likely tokens are kept, until their probabilities add up to *p*. The draw happens among those.\n\n::: reveal Read it\n**Top-p 1:** every token has a chance. **Top-p 0.2:** keep the most likely tokens until they add up to 20% of the probability, often just one or two. Together, temperature and top-p are how the same prompt gives different answers.\n:::\n\n\n## Demo: same start, different settings\n\n**Ask:** Same model, same start (\"once upon a time\"). We run it at temperature 0.2, then at 1.5. What will change?\n\n::: reveal Answer\nAt **0.2** the story is plain and repeats itself the same way each run. At **1.5** it wanders and breaks: rare words, odd jumps. Nothing about the model changed, only how we draw from its scores.\n:::\n\n\n## One token at a time\n\n![The words once upon a time there was a king who ruled fed into a box, which produces the next token](content/how-llms-work/img/43-20-autoregressive-long.jpg)\n\nEverything so far produces **one** token. To get the next, add it to the input and run the **whole thing again**: new attention, new scores, new token. Append, repeat. This is **autoregressive generation**.\n\n::: reveal Does the model know how its sentence will end?\n**No.** It has no plan. Every paragraph you've ever read from an LLM came out one blind step at a time.\n:::\n\n\n## What the model really receives\n\n![A stack of messages: system prompt, user Hi there, assistant Hello, user geography, assistant answer, user tallest mountain, assistant Mount Everest](content/how-llms-work/img/44-02-what-the-model-receives.jpg)\n\n**Ask:** Priya gets her reminder, then types *\"Make it shorter.\"* How does the model know what \"it\" is?\n\n::: reveal Answer\nBecause the app sends **the whole conversation again**: the **system prompt** (hidden instructions from whoever built the app), every earlier message, then \"Make it shorter\". The model has **no memory between requests**. The history *is* the memory.\n:::\n\n\n## The context window\n\nEverything sent (system prompt, history, the new message) must fit in a token limit: the **context window**. It's all the model can see when it predicts the next token.\n\n| Model | Context window |\n|---|---|\n| The demo model | 32 tokens |\n| Today's large models | ~100,000 to millions of tokens |\n\n::: reveal When conversations get long\nAnswers can get worse: there's more for attention to spread over, earlier instructions may get less weight than recent messages, and mistakes creep in. A fresh chat with a good summary often beats a very long one.\n:::\n\n## The full picture\n\n<div class=\"diagram\" id=\"full\"><svg style=\"max-height:40vh\" viewBox=\"0 0 900 560\" role=\"img\" aria-label=\"Prompt, tokenize, embed, transformer, probabilities, sample, append and repeat\">\n<g><rect x=\"250\" y=\"10\" width=\"400\" height=\"50\" rx=\"8\" style=\"fill:var(--card);stroke:var(--ink);stroke-width:3\"/><text x=\"450\" y=\"42\" text-anchor=\"middle\" style=\"font-weight:700;font-size:20px;fill:var(--ink)\">Priya's prompt + history<\/text><\/g>\n<g class=\"rv f1 s1\"><line x1=\"450\" y1=\"65\" x2=\"450\" y2=\"91\" style=\"stroke:var(--muted);stroke-width:2\"/><rect x=\"250\" y=\"95\" width=\"400\" height=\"64\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:3\"/><text x=\"450\" y=\"123\" text-anchor=\"middle\" style=\"font-weight:700;font-size:21px;fill:var(--navy)\">1 Tokenize<\/text><text x=\"450\" y=\"147\" text-anchor=\"middle\" style=\"font-size:16px;fill:var(--ink)\">text → token numbers<\/text><\/g>\n<g class=\"rv f2 s1\"><line x1=\"450\" y1=\"159\" x2=\"450\" y2=\"185\" style=\"stroke:var(--muted);stroke-width:2\"/><rect x=\"250\" y=\"189\" width=\"400\" height=\"64\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:3\"/><text x=\"450\" y=\"217\" text-anchor=\"middle\" style=\"font-weight:700;font-size:21px;fill:var(--navy)\">2 Embed<\/text><text x=\"450\" y=\"241\" text-anchor=\"middle\" style=\"font-size:16px;fill:var(--ink)\">numbers → vectors with meaning<\/text><\/g>\n<g class=\"rv f3 s2\"><line x1=\"450\" y1=\"253\" x2=\"450\" y2=\"279\" style=\"stroke:var(--muted);stroke-width:2\"/><rect x=\"250\" y=\"283\" width=\"400\" height=\"64\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:3\"/><text x=\"450\" y=\"311\" text-anchor=\"middle\" style=\"font-weight:700;font-size:21px;fill:var(--navy)\">3 Transformer<\/text><text x=\"450\" y=\"335\" text-anchor=\"middle\" style=\"font-size:16px;fill:var(--ink)\">attention + feed-forward, × many blocks<\/text><\/g>\n<g class=\"rv f4 s2\"><line x1=\"450\" y1=\"347\" x2=\"450\" y2=\"373\" style=\"stroke:var(--muted);stroke-width:2\"/><rect x=\"250\" y=\"377\" width=\"400\" height=\"64\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:3\"/><text x=\"450\" y=\"405\" text-anchor=\"middle\" style=\"font-weight:700;font-size:21px;fill:var(--navy)\">4 Probabilities<\/text><text x=\"450\" y=\"429\" text-anchor=\"middle\" style=\"font-size:16px;fill:var(--ink)\">a score for every token (softmax)<\/text><\/g>\n<g class=\"rv f5 s3\"><line x1=\"450\" y1=\"441\" x2=\"450\" y2=\"467\" style=\"stroke:var(--muted);stroke-width:2\"/><rect x=\"250\" y=\"471\" width=\"400\" height=\"64\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:3\"/><text x=\"450\" y=\"499\" text-anchor=\"middle\" style=\"font-weight:700;font-size:21px;fill:var(--navy)\">5 Sample<\/text><text x=\"450\" y=\"523\" text-anchor=\"middle\" style=\"font-size:16px;fill:var(--ink)\">temperature and top-p pick one<\/text><\/g>\n<g class=\"rv f6 s3\"><path d=\"M650 503 C 820 503, 820 42, 655 35\" style=\"fill:none;stroke:var(--orange);stroke-width:3;stroke-dasharray:8 6\"/><polygon points=\"655,35 670,27 668,44\" style=\"fill:var(--orange)\"/><text x=\"800\" y=\"300\" text-anchor=\"middle\" style=\"font-weight:700;font-size:20px;fill:var(--orange)\">6 Append<\/text><text x=\"800\" y=\"324\" text-anchor=\"middle\" style=\"font-weight:700;font-size:20px;fill:var(--orange)\">and repeat<\/text><\/g>\n<\/svg><\/div>\n\n::: reveal Text to vectors | #full .s1\n**Tokenize** the text, then **embed** each token as a vector.\n:::\n\n::: reveal Vectors to scores | #full .s2\nThe **transformer** gathers context; out comes a **probability** for every token.\n:::\n\n::: reveal Scores to text | #full .s3\n**Sample** one token, **append** it, and go round again.\n:::\n\n\n---\n", "content/how-llms-work/after-pretraining.md": "# From autocomplete to assistant\n\n## Overview\n\n**Goal:** Tell pre-training, fine-tuning and RLHF apart, and say who actually runs a tool when an assistant \"searches the web\".\n\n**Walk out with:** pre-training makes an autocomplete; fine-tuning and RLHF make it an assistant; a harness gives it tools.\n\n\n## Trained on the internet\n\nEverything so far is **pre-training**: a transformer trained on a huge share of the internet.\n\n**Sources:** Common Crawl, Wikipedia, Reddit, GitHub, books, research papers, news archives\n\n**Ask:** Train our story-writing recipe on all of that. What do you get?\n\n::: reveal Answer\n**A very good autocomplete.** Ask it *\"What is 2+2?\"* and it may continue with *\"What is 3+3? What is 4+4?\"*, because lists of questions are common text. It continues; it doesn't answer.\n:::\n\n\n## Fine-tuning\n\n![Before: \"What is 2+2?\" continues with more questions. After fine-tuning: \"2 + 2 equals 4.\"](content/how-llms-work/img/46-39-before-after-fine-tuning.jpg)\n\n**Fine-tuning:** train the finished model a bit more on a large, carefully written set of **question → answer pairs** in the style you want. The weights shift; now it answers instead of continuing.\n\n\n## RLHF\n\n**Reinforcement learning from human feedback:** people are hired to rate the model's answers. Good, assistant-like answers get ranked high, bad ones low, and the model is trained towards the high ones.\n\n**Ask:** Who decides what a \"good\" answer is?\n\n::: reveal Answer\n**The company that trains the model, and the judgement of the people doing the rating.** That's why different assistants have different manners, caution and tone.\n:::\n\n\n## Tools and the harness\n\n<div class=\"diagram\" id=\"tools\" style=\"display:flex;gap:12px\"><img style=\"width:49%;max-height:30vh\" src=\"content/how-llms-work/img/48-09-harness.jpg\" alt=\"A harness box around the LLM API, with tools: get weather, search web, read files, run command\"><img class=\"rv tc\" style=\"width:49%;max-height:30vh\" src=\"content/how-llms-work/img/48-19-tool-call-flow.jpg\" alt=\"User asks the weather in NYC, the model outputs a tool call as JSON, the tool result comes back, the assistant answers\"><\/div>\n\n**Ask:** Copilot \"searches the web\" for Priya. Who actually goes to the web: the model or something else?\n\n::: reveal Answer | #tools .tc\n**Something else.** The model only writes a small JSON message: *\"call get_weather for NYC\"*. The **harness** (the app, the code editor) runs the tool, adds the result to the conversation, and calls the model again. The model never leaves its server.\n:::\n\n\n## One summer in 1956\n\n> In the summer of 1956, John McCarthy, Marvin Minsky, Nathaniel Rochester and Claude Shannon gathered about ten people at Dartmouth College with a $7,500 grant and a plan for eight weeks of work. It was the first time anyone used the term *artificial intelligence*. They thought one summer would be enough.\n\n\n## Back to Priya's Enter\n\n**Task for participants:** Take out your drawings from the start. Pairs: fix them. Two minutes.\n\n::: reveal What happens after Enter\n1. Copilot sends a **package**: system prompt, the history, the invoice, the request.\n2. It's cut into **tokens** and turned into **vectors**.\n3. The **transformer** mixes context through many blocks and scores every possible next token.\n4. One token is **sampled**, appended, and the whole thing runs **again**, token after token, until the reminder is done.\n:::\n\n::: reveal The three beliefs\n**\"It looks it up\":** no, it predicts from numbers it learned. **\"It remembers me\":** no, the app resends the history. **\"It thinks about it\":** it runs one pass per token, with no plan.\n:::\n\n> It doesn't look anything up: it predicts one token at a time, from numbers it learned.\n\n\n---\n"}, "css": ["viewer/student.css", "viewer/theme.css"]};</script>
