<script>window.DECK = {"flow": [{"title": "Same words, different bill", "file": "content/tokens/opening.md"}, {"title": "Text in, numbers through", "file": "content/tokens/encode-decode.md"}, {"title": "Where the vocabulary comes from", "file": "content/tokens/vocabulary.md"}, {"title": "Rare words cost more", "file": "content/tokens/unusual-words.md"}], "files": {"content/tokens/opening.md": "# Same words, different bill\n\n## Overview\n\n**Goal:** See that a model is billed, and works, in tokens, and that the same words cost different amounts at different providers.\n\n**Walk out with:** the question \"how many tokens is that?\"\n\n\n## Priya's test message\n\n> Priya's team just got an API key. Her first test, like everyone's: she sends **\"Hello World!\"**.\n\n**Task for participants:** How many tokens is \"Hello World!\"? Write a number down before anyone says it.\n\n\n::: reveal Answer\n**3 tokens** for OpenAI: `Hello␣` · `World` · `!`. Not words, not letters: pieces.\n:::\n\n## Charged by token\n\nTokens are the currency of LLMs. You pay per token, and input and output have different prices.\n\n| | Text | Tokens | Price per 1K tokens |\n|---|---|---|---|\n| Input | \"Hello World!\" | 3 | $0.00125 |\n| Output | \"Hi!\" | 2 | $0.01 |\n\n::: reveal What the call cost\n**Input tokens ÷ 1000 × input price + output tokens ÷ 1000 × output price.** Output is about eight times dearer here: what the model writes costs more than what you send.\n:::\n\n\n## The mystery\n\nThe same \"Hello World\", sent to two models in the video:\n\n| Model | Input tokens | Output tokens |\n|---|---|---|\n| Claude 3.5 Haiku (Anthropic) | 11 | 20 |\n| Gemini 2.0 Flash-Lite (Google) | 4 | 11 |\n\n**Ask:** Same two words. Why does one bill 11 and the other 4?\n\n", "content/tokens/encode-decode.md": "# Text in, numbers through\n\n## Overview\n\n**Goal:** Follow \"Hello World!\" through the model and see that the model only ever handles numbers.\n\n**Walk out with:** split → encode → model → decode → join\n\n\n## The six steps\n\nEvery model has its own **token vocabulary**: all the words, pieces of words and characters it knows, each with a number. The number *is* the token.\n\n<div class=\"diagram\" id=\"pipe\"><svg viewBox=\"0 0 900 640\" role=\"img\" aria-label=\"Hello World! is split, encoded to numbers, processed, decoded and joined into Hi!\">\n<g><rect x=\"385\" y=\"10\" width=\"320\" height=\"44\" rx=\"8\" style=\"fill:var(--card);stroke:var(--ink);stroke-width:3\"/><text x=\"545\" y=\"39\" text-anchor=\"middle\" style=\"font-weight:700;font-size:20px;fill:var(--ink)\">\"Hello World!\"<\/text><\/g>\n<g class=\"rv p1\"><text x=\"40\" y=\"129\" style=\"font-weight:700;font-size:20px;fill:var(--navy)\">1 Split<\/text><line x1=\"150\" y1=\"122\" x2=\"280\" y2=\"122\" style=\"stroke:var(--line);stroke-width:2;stroke-dasharray:6 6\"/><rect x=\"300\" y=\"100\" width=\"150\" height=\"44\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:3\"/><text x=\"375.0\" y=\"129\" text-anchor=\"middle\" style=\"font-weight:700;font-size:20px;fill:var(--ink)\">Hello␣<\/text><rect x=\"470\" y=\"100\" width=\"150\" height=\"44\" rx=\"8\" style=\"fill:var(--card);stroke:var(--good);stroke-width:3\"/><text x=\"545.0\" y=\"129\" text-anchor=\"middle\" style=\"font-weight:700;font-size:20px;fill:var(--ink)\">World<\/text><rect x=\"640\" y=\"100\" width=\"150\" height=\"44\" rx=\"8\" style=\"fill:var(--card);stroke:var(--bad);stroke-width:3\"/><text x=\"715.0\" y=\"129\" text-anchor=\"middle\" style=\"font-weight:700;font-size:20px;fill:var(--ink)\">!<\/text><\/g>\n<g class=\"rv p2\"><text x=\"40\" y=\"219\" style=\"font-weight:700;font-size:20px;fill:var(--navy)\">2 Encode<\/text><line x1=\"150\" y1=\"212\" x2=\"280\" y2=\"212\" style=\"stroke:var(--line);stroke-width:2;stroke-dasharray:6 6\"/><rect x=\"300\" y=\"190\" width=\"150\" height=\"44\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:3\"/><text x=\"375.0\" y=\"219\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:20px;fill:var(--ink)\">13225<\/text><rect x=\"470\" y=\"190\" width=\"150\" height=\"44\" rx=\"8\" style=\"fill:var(--card);stroke:var(--good);stroke-width:3\"/><text x=\"545.0\" y=\"219\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:20px;fill:var(--ink)\">5922<\/text><rect x=\"640\" y=\"190\" width=\"150\" height=\"44\" rx=\"8\" style=\"fill:var(--card);stroke:var(--bad);stroke-width:3\"/><text x=\"715.0\" y=\"219\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:20px;fill:var(--ink)\">0<\/text><\/g>\n<g class=\"rv p3\"><text x=\"40\" y=\"309\" style=\"font-weight:700;font-size:20px;fill:var(--navy)\">3 LLM<\/text><text x=\"545\" y=\"309\" text-anchor=\"middle\" style=\"font-style:italic;font-size:20px;fill:var(--muted)\">works on numbers only…<\/text><\/g>\n<g class=\"rv p4\"><text x=\"40\" y=\"399\" style=\"font-weight:700;font-size:20px;fill:var(--navy)\">4 Output<\/text><line x1=\"150\" y1=\"392\" x2=\"280\" y2=\"392\" style=\"stroke:var(--line);stroke-width:2;stroke-dasharray:6 6\"/><rect x=\"385\" y=\"370\" width=\"150\" height=\"44\" rx=\"8\" style=\"fill:var(--card);stroke:var(--orange);stroke-width:3\"/><text x=\"460.0\" y=\"399\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:20px;fill:var(--ink)\">12194<\/text><rect x=\"555\" y=\"370\" width=\"150\" height=\"44\" rx=\"8\" style=\"fill:var(--card);stroke:var(--bad);stroke-width:3\"/><text x=\"630.0\" y=\"399\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:20px;fill:var(--ink)\">0<\/text><\/g>\n<g class=\"rv p5\"><text x=\"40\" y=\"489\" style=\"font-weight:700;font-size:20px;fill:var(--navy)\">5 Decode<\/text><line x1=\"150\" y1=\"482\" x2=\"280\" y2=\"482\" style=\"stroke:var(--line);stroke-width:2;stroke-dasharray:6 6\"/><rect x=\"385\" y=\"460\" width=\"150\" height=\"44\" rx=\"8\" style=\"fill:var(--card);stroke:var(--orange);stroke-width:3\"/><text x=\"460.0\" y=\"489\" text-anchor=\"middle\" style=\"font-weight:700;font-size:20px;fill:var(--ink)\">Hi<\/text><rect x=\"555\" y=\"460\" width=\"150\" height=\"44\" rx=\"8\" style=\"fill:var(--card);stroke:var(--bad);stroke-width:3\"/><text x=\"630.0\" y=\"489\" text-anchor=\"middle\" style=\"font-weight:700;font-size:20px;fill:var(--ink)\">!<\/text><\/g>\n<g class=\"rv p6\"><text x=\"40\" y=\"579\" style=\"font-weight:700;font-size:20px;fill:var(--navy)\">6 Join<\/text><line x1=\"150\" y1=\"572\" x2=\"280\" y2=\"572\" style=\"stroke:var(--line);stroke-width:2;stroke-dasharray:6 6\"/><rect x=\"470\" y=\"550\" width=\"150\" height=\"44\" rx=\"8\" style=\"fill:var(--card);stroke:var(--ink);stroke-width:3\"/><text x=\"545.0\" y=\"579\" text-anchor=\"middle\" style=\"font-weight:700;font-size:20px;fill:var(--ink)\">\"Hi!\"<\/text><\/g>\n<\/svg><\/div>\n\n::: reveal Split | #pipe .p1\n**Split:** cut the text into the largest pieces the vocabulary knows.\n:::\n\n::: reveal Encode | #pipe .p2\n**Encode:** swap each piece for its number in the vocabulary (here OpenAI's tokenizer for GPT-4o).\n:::\n\n::: reveal LLM | #pipe .p3\n**The model:** takes numbers in, predicts numbers out.\n:::\n\n::: reveal Output | #pipe .p4\n**Output:** two new numbers.\n:::\n\n::: reveal Decode | #pipe .p5\n**Decode:** look each number up again.\n:::\n\n::: reveal Join | #pipe .p6\n**Join:** glue the pieces back together. That's the answer you see.\n:::\n\n\n## Where are the letters?\n\n**Ask:** In this whole picture, where does the model see letters?\n\n::: reveal Answer\n**Nowhere.** The letters exist only at the two ends, in our code. A text of about 2,300 characters goes in as fewer than 500 numbers.\n:::\n\n## Back to R0\n\n**Ask:** In R0 we'll say \"the model predicts the next token\". What is it actually predicting?\n\n::: reveal Answer\n**The next number.** Then the next, then the next. The app decodes them as they arrive, which is why the answer appears word by word.\n:::\n\n", "content/tokens/vocabulary.md": "# Where the vocabulary comes from\n\n## Overview\n\n**Goal:** See how a vocabulary is built, and why its size is a trade-off.\n\n**Walk out with:** a bigger vocabulary means fewer tokens, and a bigger model\n\n\n## Characters only\n\nA tokenizer is trained on text, usually the same huge text the model learns from. Ours is one line.\n\n<div class=\"diagram\" id=\"vocab\"><svg viewBox=\"0 0 900 360\" role=\"img\" aria-label=\"Building a vocabulary from the cat sat on the mat\">\n<text x=\"40\" y=\"34\" style=\"font-weight:700;font-size:20px;fill:var(--navy)\">Corpus<\/text><text x=\"200\" y=\"34\" style=\"font-family:var(--mono);font-size:21px;fill:var(--ink)\">\"the cat sat on the mat\"<\/text>\n<g class=\"rv v1\"><text x=\"40\" y=\"100\" style=\"font-weight:700;font-size:20px;fill:var(--navy)\">1 Characters<\/text><text x=\"860\" y=\"100\" text-anchor=\"end\" style=\"font-size:17px;fill:var(--muted)\">10 tokens<\/text><rect x=\"40\" y=\"115\" width=\"44\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:3\"/><text x=\"62.0\" y=\"142\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">t<\/text><rect x=\"94\" y=\"115\" width=\"44\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:3\"/><text x=\"116.0\" y=\"142\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">h<\/text><rect x=\"148\" y=\"115\" width=\"44\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:3\"/><text x=\"170.0\" y=\"142\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">e<\/text><rect x=\"202\" y=\"115\" width=\"44\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:3\"/><text x=\"224.0\" y=\"142\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">␣<\/text><rect x=\"256\" y=\"115\" width=\"44\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:3\"/><text x=\"278.0\" y=\"142\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">c<\/text><rect x=\"310\" y=\"115\" width=\"44\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:3\"/><text x=\"332.0\" y=\"142\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">a<\/text><rect x=\"364\" y=\"115\" width=\"44\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:3\"/><text x=\"386.0\" y=\"142\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">s<\/text><rect x=\"418\" y=\"115\" width=\"44\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:3\"/><text x=\"440.0\" y=\"142\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">o<\/text><rect x=\"472\" y=\"115\" width=\"44\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:3\"/><text x=\"494.0\" y=\"142\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">n<\/text><rect x=\"526\" y=\"115\" width=\"44\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:3\"/><text x=\"548.0\" y=\"142\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">m<\/text><\/g>\n<g class=\"rv v2\"><text x=\"40\" y=\"200\" style=\"font-weight:700;font-size:20px;fill:var(--navy)\">2 Pairs that occur often<\/text><text x=\"860\" y=\"200\" text-anchor=\"end\" style=\"font-size:17px;fill:var(--muted)\">+5 → 15 tokens<\/text><rect x=\"40\" y=\"215\" width=\"56\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--good);stroke-width:3\"/><text x=\"68.0\" y=\"242\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">th<\/text><rect x=\"106\" y=\"215\" width=\"56\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--good);stroke-width:3\"/><text x=\"134.0\" y=\"242\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">he<\/text><rect x=\"172\" y=\"215\" width=\"56\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--good);stroke-width:3\"/><text x=\"200.0\" y=\"242\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">at<\/text><rect x=\"238\" y=\"215\" width=\"56\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--good);stroke-width:3\"/><text x=\"266.0\" y=\"242\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">e␣<\/text><rect x=\"304\" y=\"215\" width=\"56\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--good);stroke-width:3\"/><text x=\"332.0\" y=\"242\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">t␣<\/text><\/g>\n<g class=\"rv v3\"><text x=\"40\" y=\"300\" style=\"font-weight:700;font-size:20px;fill:var(--navy)\">3 Pairs of pairs<\/text><rect x=\"40\" y=\"315\" width=\"72\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--orange);stroke-width:3\"/><text x=\"76.0\" y=\"342\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">the<\/text><\/g>\n<\/svg><\/div>\n\n::: reveal Characters | #vocab .v1\nThe simplest vocabulary: every unique character. **10 tokens.**\n:::\n\n**Ask:** \"cats sat mat\" is 11 characters. With this vocabulary, how many tokens?\n\n::: reveal Answer\n**11.** One token per character, the most work the model can be given.\n:::\n\n## Find what occurs together\n\n**Ask:** Look at \"the cat sat on the mat\". Which letters keep turning up side by side?\n\n<div class=\"diagram\" id=\"vocab\"><svg viewBox=\"0 0 900 360\" role=\"img\" aria-label=\"Building a vocabulary from the cat sat on the mat\">\n<text x=\"40\" y=\"34\" style=\"font-weight:700;font-size:20px;fill:var(--navy)\">Corpus<\/text><text x=\"200\" y=\"34\" style=\"font-family:var(--mono);font-size:21px;fill:var(--ink)\">\"the cat sat on the mat\"<\/text>\n<g><text x=\"40\" y=\"100\" style=\"font-weight:700;font-size:20px;fill:var(--navy)\">1 Characters<\/text><text x=\"860\" y=\"100\" text-anchor=\"end\" style=\"font-size:17px;fill:var(--muted)\">10 tokens<\/text><rect x=\"40\" y=\"115\" width=\"44\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:3\"/><text x=\"62.0\" y=\"142\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">t<\/text><rect x=\"94\" y=\"115\" width=\"44\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:3\"/><text x=\"116.0\" y=\"142\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">h<\/text><rect x=\"148\" y=\"115\" width=\"44\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:3\"/><text x=\"170.0\" y=\"142\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">e<\/text><rect x=\"202\" y=\"115\" width=\"44\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:3\"/><text x=\"224.0\" y=\"142\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">␣<\/text><rect x=\"256\" y=\"115\" width=\"44\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:3\"/><text x=\"278.0\" y=\"142\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">c<\/text><rect x=\"310\" y=\"115\" width=\"44\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:3\"/><text x=\"332.0\" y=\"142\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">a<\/text><rect x=\"364\" y=\"115\" width=\"44\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:3\"/><text x=\"386.0\" y=\"142\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">s<\/text><rect x=\"418\" y=\"115\" width=\"44\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:3\"/><text x=\"440.0\" y=\"142\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">o<\/text><rect x=\"472\" y=\"115\" width=\"44\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:3\"/><text x=\"494.0\" y=\"142\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">n<\/text><rect x=\"526\" y=\"115\" width=\"44\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:3\"/><text x=\"548.0\" y=\"142\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">m<\/text><\/g>\n<g class=\"rv v2\"><text x=\"40\" y=\"200\" style=\"font-weight:700;font-size:20px;fill:var(--navy)\">2 Pairs that occur often<\/text><text x=\"860\" y=\"200\" text-anchor=\"end\" style=\"font-size:17px;fill:var(--muted)\">+5 → 15 tokens<\/text><rect x=\"40\" y=\"215\" width=\"56\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--good);stroke-width:3\"/><text x=\"68.0\" y=\"242\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">th<\/text><rect x=\"106\" y=\"215\" width=\"56\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--good);stroke-width:3\"/><text x=\"134.0\" y=\"242\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">he<\/text><rect x=\"172\" y=\"215\" width=\"56\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--good);stroke-width:3\"/><text x=\"200.0\" y=\"242\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">at<\/text><rect x=\"238\" y=\"215\" width=\"56\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--good);stroke-width:3\"/><text x=\"266.0\" y=\"242\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">e␣<\/text><rect x=\"304\" y=\"215\" width=\"56\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--good);stroke-width:3\"/><text x=\"332.0\" y=\"242\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">t␣<\/text><\/g>\n<g class=\"rv v3\"><text x=\"40\" y=\"300\" style=\"font-weight:700;font-size:20px;fill:var(--navy)\">3 Pairs of pairs<\/text><rect x=\"40\" y=\"315\" width=\"72\" height=\"40\" rx=\"8\" style=\"fill:var(--card);stroke:var(--orange);stroke-width:3\"/><text x=\"76.0\" y=\"342\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:19px;fill:var(--ink)\">the<\/text><\/g>\n<\/svg><\/div>\n\n::: reveal Pairs | #vocab .v2\n`th` and `he` (twice in \"the\"), `at` (cat, sat, mat), plus `e␣` and `t␣`. Add them: **15 tokens**, and \"cats sat mat\" drops from 11 tokens to **8**.\n:::\n\n::: reveal Pairs of pairs | #vocab .v3\nThen `th` + `he` → `the`. Real tokenizers keep merging pieces until the vocabulary is as big as they want.\n:::\n\n\n## Vocabulary size\n\n**Ask:** \"understanding\". With a big vocabulary, how many pieces? With a tiny one?\n\n<div class=\"tbl\"><table id=\"vsize\"><tr><th>Vocabulary size<\/th><th>\"understanding\" becomes<\/th><th>Tokens<\/th><\/tr><tr><td><b>1K<\/b><\/td><td class=\"rv z1\"><code>un · der · st · and · ing<\/code><\/td><td class=\"rv z1\"><b>5<\/b><\/td><\/tr><tr><td><b>50K<\/b><\/td><td class=\"rv z2\"><code>under · stand · ing<\/code><\/td><td class=\"rv z2\"><b>3<\/b><\/td><\/tr><tr><td><b>200K<\/b><\/td><td class=\"rv z3\"><code>under · standing<\/code><\/td><td class=\"rv z3\"><b>2<\/b><\/td><\/tr><\/table><\/div>\n\n::: reveal 1K vocabulary | #vsize .z1\nA small vocabulary: **5 tokens.**\n:::\n\n::: reveal 50K vocabulary | #vsize .z2\n**3 tokens.**\n:::\n\n::: reveal 200K vocabulary | #vsize .z3\n**2 tokens**: less than half the work of the 1K vocabulary.\n:::\n\n## Why not a million?\n\n**Ask:** If bigger vocabularies mean fewer tokens, why not a vocabulary of a million?\n\n::: reveal Answer\nEvery token in the vocabulary has to live inside the model. A bigger vocabulary means a **bigger model** that needs **more memory** to run. Each provider picks its own trade-off.\n:::\n\n", "content/tokens/unusual-words.md": "# Rare words cost more\n\n## Overview\n\n**Goal:** See that rare words, languages and formats cost more tokens, and solve the mystery from the start.\n\n**Walk out with:** tokens are what the model thinks in, and what you pay for\n\n\n## O frabjous day!\n\n*Frabjous* is a word Lewis Carroll made up. It almost never appears in any text.\n\n**Ask:** How many pieces will \"O frabjous day!\" become?\n\n<div class=\"diagram\" id=\"frab\"><svg viewBox=\"0 0 702 200\" role=\"img\" aria-label=\"O frabjous day! split into seven tokens\"><text x=\"40\" y=\"44\" style=\"font-family:var(--mono);font-size:24px;font-weight:700;fill:var(--ink)\">\"O frabjous day!\"<\/text><g class=\"rv f1\"><rect x=\"40\" y=\"90\" width=\"70\" height=\"44\" rx=\"8\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:3\"/><text x=\"75.0\" y=\"119\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:20px;fill:var(--ink)\">O<\/text><\/g><g class=\"rv f2\"><text x=\"75.0\" y=\"176\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:19px;fill:var(--muted)\">46<\/text><\/g><g class=\"rv f1\"><rect x=\"122\" y=\"90\" width=\"84\" height=\"44\" rx=\"8\" style=\"fill:var(--card);stroke:var(--orange);stroke-width:3\"/><text x=\"164.0\" y=\"119\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:20px;fill:var(--ink)\">␣fr<\/text><\/g><g class=\"rv f2\"><text x=\"164.0\" y=\"176\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:19px;fill:var(--muted)\">1441<\/text><\/g><g class=\"rv f1\"><rect x=\"218\" y=\"90\" width=\"70\" height=\"44\" rx=\"8\" style=\"fill:var(--card);stroke:var(--orange);stroke-width:3\"/><text x=\"253.0\" y=\"119\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:20px;fill:var(--ink)\">ab<\/text><\/g><g class=\"rv f2\"><text x=\"253.0\" y=\"176\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:19px;fill:var(--muted)\">378<\/text><\/g><g class=\"rv f1\"><rect x=\"300\" y=\"90\" width=\"70\" height=\"44\" rx=\"8\" style=\"fill:var(--card);stroke:var(--orange);stroke-width:3\"/><text x=\"335.0\" y=\"119\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:20px;fill:var(--ink)\">j<\/text><\/g><g class=\"rv f2\"><text x=\"335.0\" y=\"176\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:19px;fill:var(--muted)\">73<\/text><\/g><g class=\"rv f1\"><rect x=\"382\" y=\"90\" width=\"84\" height=\"44\" rx=\"8\" style=\"fill:var(--card);stroke:var(--orange);stroke-width:3\"/><text x=\"424.0\" y=\"119\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:20px;fill:var(--ink)\">ous<\/text><\/g><g class=\"rv f2\"><text x=\"424.0\" y=\"176\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:19px;fill:var(--muted)\">784<\/text><\/g><g class=\"rv f1\"><rect x=\"478\" y=\"90\" width=\"102\" height=\"44\" rx=\"8\" style=\"fill:var(--card);stroke:var(--good);stroke-width:3\"/><text x=\"529.0\" y=\"119\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:20px;fill:var(--ink)\">␣day<\/text><\/g><g class=\"rv f2\"><text x=\"529.0\" y=\"176\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:19px;fill:var(--muted)\">2163<\/text><\/g><g class=\"rv f1\"><rect x=\"592\" y=\"90\" width=\"70\" height=\"44\" rx=\"8\" style=\"fill:var(--card);stroke:var(--bad);stroke-width:3\"/><text x=\"627.0\" y=\"119\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-weight:700;font-size:20px;fill:var(--ink)\">!<\/text><\/g><g class=\"rv f2\"><text x=\"627.0\" y=\"176\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:19px;fill:var(--muted)\">0<\/text><\/g><\/svg><\/div>\n\n::: reveal Split | #frab .f1\n**7 pieces**, and the made-up word alone takes **4**: `␣fr` · `ab` · `j` · `ous`.\n:::\n\n::: reveal Encode | #frab .f2\nEach piece is still a number. Because single characters stay in the vocabulary, any word can be encoded, just in more pieces.\n:::\n\n## Test it live\n\n**Task for participants:** Predict first, then paste each into a browser tokeniser and compare the counts:\n\n1. An English sentence: \"Please check this invoice before Friday.\"\n2. A German one with a long compound: *Rechnungsprüfungsverfahren*\n3. A log line with a timestamp and an ID\n\n\n::: reveal What to look for\n**Tokens are not words.** Text that's rare in the training data splits into more pieces: long German compounds, ids and timestamps in log lines. The same holds for programming languages: 20 lines of JavaScript cost fewer tokens than 20 lines of Haskell. Price and the context window are both counted in tokens.\n:::\n\n\n## The mystery, solved\n\nBack to the board: \"Hello World\" was **11** input tokens at Anthropic and **4** at Google.\n\n**Ask:** Now, why?\n\n::: reveal Answer\n**Each provider trained its own vocabulary,** so each cuts the same text into different pieces. (The rest of Anthropic's 11 is whatever its API wraps around your message.) Token counts and prices can only be compared within one provider.\n:::\n\n\n## One sentence\n\n> Tokens are what the model thinks in, and what you pay for.\n\n"}, "css": ["viewer/student.css", "viewer/theme.css"]};</script>
