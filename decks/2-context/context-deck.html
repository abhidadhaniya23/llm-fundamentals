&lt;html lang=&quot;en&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;utf-8&quot;&gt;
&lt;title&gt;The double diamond&lt;/title&gt;
&lt;style&gt;
  :root {
    --bg: #fbfaf7; --ink: #1f2328; --muted: #5c6470; --line: #d9d5cc;
    --user: #6d9be8; --user-bg: #dbe6fa;
    --file: #7fbf7a; --file-bg: #dff0dc;
    --ai: #a985d6; --ai-bg: #e8ddf5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: -apple-system, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif; }
  .page { position: relative; width: 1920px; height: 1080px; padding: 44px 80px 40px; }
  h1 { margin: 0 0 8px; font-size: 56px; font-weight: 700; letter-spacing: -0.5px; }
  .sub { margin: 0 0 22px; font-size: 28px; color: var(--muted); }

  /* the diagram: two spaces, two diamonds, three chips, one loop */
  .diagram { position: relative; width: 1760px; height: 372px; }
  .diagram svg.shape { position: absolute; left: 0; top: 0; width: 1760px; height: 372px; }
  .diagram .space { position: absolute; top: 0; width: 600px; text-align: center; font-size: 24px; font-weight: 700; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; }
  .diagram .phase { position: absolute; top: 148px; width: 300px; text-align: center; }
  .diagram .phase b { display: block; font-size: 32px; font-weight: 700; }
  .diagram .phase small { display: block; margin-top: 4px; font-size: 22px; color: var(--muted); }
  .diagram .loop { position: absolute; top: 328px; left: 0; width: 1760px; text-align: center; font-size: 22px; color: var(--muted); }
  .diagram .loop span { background: var(--bg); padding: 0 14px; }
  .chip { position: absolute; top: 157px; display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px;
    font-size: 24px; font-weight: 600; white-space: nowrap; }
  .chip svg { width: 26px; height: 26px; fill: none; stroke: #1f2328; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .chip.challenge { left: 0; background: var(--user-bg); border: 2px solid var(--user); }
  .chip.brief { left: 792px; background: var(--file-bg); border: 2px solid var(--file); }
  .chip.outcome { right: 0; background: var(--ai-bg); border: 2px solid var(--ai); }

  /* under each half: question, what you do, what comes out */
  .cards { position: relative; width: 1760px; height: 270px; margin-top: 18px; }
  .card { position: absolute; top: 0; width: 284px; height: 270px; padding: 18px 20px 16px; border-radius: 12px; display: flex; flex-direction: column; }
  .card .q { font-size: 27px; font-weight: 700; line-height: 1.25; margin-bottom: 10px; }
  .card .do { font-size: 24px; line-height: 1.35; }
  .card .out { margin-top: auto; padding-top: 12px; font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .card .out svg { width: 22px; height: 22px; fill: none; stroke: #1f2328; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .card.problem { background: var(--user-bg); }
  .card.solution { background: var(--ai-bg); }

  .caption { margin-top: 26px; font-size: 26px; line-height: 1.35; text-align: center; }
  .caption b { display: block; font-size: 28px; margin-bottom: 4px; }
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div class=&quot;page&quot;&gt;
  &lt;h1&gt;The double diamond&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;Design Council, 2005. Understand the problem before you answer it, and explore both before you choose either.&lt;/p&gt;

  &lt;div class=&quot;diagram&quot;&gt;
    &lt;svg class=&quot;shape&quot; viewBox=&quot;0 0 1760 372&quot;&gt;
      &lt;!-- space brackets --&gt;
      &lt;path d=&quot;M162 50 v-10 h600 v10&quot; fill=&quot;none&quot; stroke=&quot;#8a8f99&quot; stroke-width=&quot;2.5&quot;/&gt;
      &lt;path d=&quot;M998 50 v-10 h600 v10&quot; fill=&quot;none&quot; stroke=&quot;#8a8f99&quot; stroke-width=&quot;2.5&quot;/&gt;
      &lt;!-- diamond 1: discover / define --&gt;
      &lt;polygon points=&quot;162,187 462,62 462,312&quot; fill=&quot;#dbe6fa&quot; stroke=&quot;#6d9be8&quot; stroke-width=&quot;3&quot; stroke-linejoin=&quot;round&quot;/&gt;
      &lt;polygon points=&quot;462,62 762,187 462,312&quot; fill=&quot;#dbe6fa&quot; stroke=&quot;#6d9be8&quot; stroke-width=&quot;3&quot; stroke-linejoin=&quot;round&quot;/&gt;
      &lt;line x1=&quot;462&quot; y1=&quot;62&quot; x2=&quot;462&quot; y2=&quot;312&quot; stroke=&quot;#6d9be8&quot; stroke-width=&quot;3&quot; stroke-dasharray=&quot;10 10&quot;/&gt;
      &lt;!-- diamond 2: develop / deliver --&gt;
      &lt;polygon points=&quot;998,187 1298,62 1298,312&quot; fill=&quot;#e8ddf5&quot; stroke=&quot;#a985d6&quot; stroke-width=&quot;3&quot; stroke-linejoin=&quot;round&quot;/&gt;
      &lt;polygon points=&quot;1298,62 1598,187 1298,312&quot; fill=&quot;#e8ddf5&quot; stroke=&quot;#a985d6&quot; stroke-width=&quot;3&quot; stroke-linejoin=&quot;round&quot;/&gt;
      &lt;line x1=&quot;1298&quot; y1=&quot;62&quot; x2=&quot;1298&quot; y2=&quot;312&quot; stroke=&quot;#a985d6&quot; stroke-width=&quot;3&quot; stroke-dasharray=&quot;10 10&quot;/&gt;
      &lt;!-- iterate loop: from deliver back to discover --&gt;
      &lt;path d=&quot;M1298 314 v28 H462 v-16&quot; fill=&quot;none&quot; stroke=&quot;#8a8f99&quot; stroke-width=&quot;2.5&quot; stroke-dasharray=&quot;8 8&quot;/&gt;
      &lt;path d=&quot;M452 336 l10 -12 l10 12&quot; fill=&quot;none&quot; stroke=&quot;#8a8f99&quot; stroke-width=&quot;2.5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;
    &lt;/svg&gt;

    &lt;div class=&quot;space&quot; style=&quot;left:162px&quot;&gt;Problem space&lt;/div&gt;
    &lt;div class=&quot;space&quot; style=&quot;left:998px&quot;&gt;Solution space&lt;/div&gt;

    &lt;div class=&quot;chip challenge&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot;/&gt;&lt;path d=&quot;M12 8v5M12 16h.01&quot;/&gt;&lt;/svg&gt;the challenge&lt;/div&gt;

    &lt;div class=&quot;phase&quot; style=&quot;left:162px&quot;&gt;&lt;b&gt;Discover&lt;/b&gt;&lt;small&gt;diverge&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;phase&quot; style=&quot;left:462px&quot;&gt;&lt;b&gt;Define&lt;/b&gt;&lt;small&gt;converge&lt;/small&gt;&lt;/div&gt;

    &lt;div class=&quot;chip brief&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M6 3h8l5 5v13H6z&quot;/&gt;&lt;path d=&quot;M14 3v5h5&quot;/&gt;&lt;path d=&quot;M9 13h7M9 17h7&quot;/&gt;&lt;/svg&gt;the brief&lt;/div&gt;

    &lt;div class=&quot;phase&quot; style=&quot;left:998px&quot;&gt;&lt;b&gt;Develop&lt;/b&gt;&lt;small&gt;diverge&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;phase&quot; style=&quot;left:1298px&quot;&gt;&lt;b&gt;Deliver&lt;/b&gt;&lt;small&gt;converge&lt;/small&gt;&lt;/div&gt;

    &lt;div class=&quot;chip outcome&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M5 12l4 4 10-10&quot;/&gt;&lt;/svg&gt;the outcome&lt;/div&gt;

    &lt;div class=&quot;loop&quot;&gt;&lt;span&gt;iterate&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card problem&quot; style=&quot;left:170px&quot;&gt;
      &lt;div class=&quot;q&quot;&gt;What&amp;rsquo;s really going on?&lt;/div&gt;
      &lt;div class=&quot;do&quot;&gt;Talk to the people affected. Look at what&amp;rsquo;s there. Don&amp;rsquo;t assume.&lt;/div&gt;
      &lt;div class=&quot;out&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M4 12h14M13 6l6 6-6 6&quot;/&gt;&lt;/svg&gt;insights&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card problem&quot; style=&quot;left:470px&quot;&gt;
      &lt;div class=&quot;q&quot;&gt;Which problem, exactly?&lt;/div&gt;
      &lt;div class=&quot;do&quot;&gt;Sort the insights. Choose one problem. Write it down.&lt;/div&gt;
      &lt;div class=&quot;out&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M4 12h14M13 6l6 6-6 6&quot;/&gt;&lt;/svg&gt;the brief&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card solution&quot; style=&quot;left:1006px&quot;&gt;
      &lt;div class=&quot;q&quot;&gt;What could we do?&lt;/div&gt;
      &lt;div class=&quot;do&quot;&gt;Many options, rough versions. Try them with people.&lt;/div&gt;
      &lt;div class=&quot;out&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M4 12h14M13 6l6 6-6 6&quot;/&gt;&lt;/svg&gt;prototypes&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card solution&quot; style=&quot;left:1306px&quot;&gt;
      &lt;div class=&quot;q&quot;&gt;What actually works?&lt;/div&gt;
      &lt;div class=&quot;do&quot;&gt;Test small. Drop what fails, improve what works. Roll out.&lt;/div&gt;
      &lt;div class=&quot;out&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M4 12h14M13 6l6 6-6 6&quot;/&gt;&lt;/svg&gt;the outcome&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;caption&quot;&gt;
    &lt;b&gt;Two spaces, two decisions: which problem, then which answer.&lt;/b&gt;
    The diamond exists to stop one move: from the challenge straight to an answer.
  &lt;/div&gt;
&lt;/div&gt;
&lt;/body&gt;
&lt;/html&gt;

&lt;head&gt;

&lt;title&gt;The double diamond, with AI&lt;/title&gt;
&lt;style&gt;
  :root {
    --bg: #fbfaf7; --ink: #1f2328; --muted: #5c6470; --line: #d9d5cc;
    --tell: #f3d36b; --tell-bg: #fbf1c9;
    --user: #6d9be8; --user-bg: #dbe6fa;

  .page { position: relative; width: 1920px; height: 1080px; padding: 44px 80px 40px; }
  h1 { margin: 0 0 8px; font-size: 56px; font-weight: 700; letter-spacing: -0.5px; }
  .sub { margin: 0 0 26px; font-size: 28px; color: var(--muted); }

  /* the diagram: two diamonds, three chips */
  .diagram { position: relative; width: 1760px; height: 270px; }
  .diagram svg.shape { position: absolute; left: 0; top: 0; width: 1760px; height: 270px; }
  .diagram .phase { position: absolute; top: 96px; width: 300px; text-align: center; }
  .diagram .phase b { display: block; font-size: 32px; font-weight: 700; }
  .diagram .phase small { display: block; margin-top: 4px; font-size: 22px; color: var(--muted); }

    font-size: 24px; font-weight: 600; white-space: nowrap; background: #fff; }
  .chip svg { width: 26px; height: 26px; fill: none; stroke: #1f2328; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .chip.ask { left: 0; background: var(--user-bg); border: 2px solid var(--user); }
  .chip.plan { left: 792px; background: var(--file-bg); border: 2px solid var(--file); }
  .chip.answer { right: 0; background: var(--ai-bg); border: 2px solid var(--ai); }

  /* below: the two ways of working */
  .cols { display: grid; grid-template-columns: 840px 840px; column-gap: 80px; margin-top: 26px; }
  .col h2 { margin: 0 0 18px; font-size: 34px; font-weight: 700; }
  .col h2 small { font-weight: 400; color: var(--muted); font-size: 24px; margin-left: 12px; }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .row { display: grid; grid-template-columns: 72px 1fr; column-gap: 20px; align-items: start; }
  .row .icon { width: 64px; height: 64px; border-radius: 14px; display: grid; place-items: center; }
  .row .icon svg { width: 36px; height: 36px; fill: none; stroke: #1f2328; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .row .label { font-size: 29px; font-weight: 700; margin: 4px 0 8px; }
  .row .body { font-size: 26px; line-height: 1.35; padding: 14px 20px; border-radius: 10px; }
  .tell .icon { background: var(--tell); } .tell .body { background: var(--tell-bg); }

  .caption b { display: block; font-size: 28px; margin-bottom: 4px; }

&lt;/style&gt;

&lt;body&gt;
&lt;div class=&quot;page&quot;&gt;
  &lt;h1&gt;The double diamond, with AI&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;Working out what to ask and getting it made are different jobs &amp;mdash; they need different instructions, and a different way of working.&lt;/p&gt;

  &lt;div class=&quot;diagram&quot;&gt;
    &lt;svg class=&quot;shape&quot; viewBox=&quot;0 0 1760 270&quot;&gt;
      &lt;!-- diamond 1: discover / define --&gt;
      &lt;polygon points=&quot;162,135 462,10 462,260&quot; fill=&quot;#dbe6fa&quot; stroke=&quot;#6d9be8&quot; stroke-width=&quot;3&quot; stroke-linejoin=&quot;round&quot;/&gt;
      &lt;polygon points=&quot;462,10 762,135 462,260&quot; fill=&quot;#dbe6fa&quot; stroke=&quot;#6d9be8&quot; stroke-width=&quot;3&quot; stroke-linejoin=&quot;round&quot;/&gt;
      &lt;line x1=&quot;462&quot; y1=&quot;10&quot; x2=&quot;462&quot; y2=&quot;260&quot; stroke=&quot;#6d9be8&quot; stroke-width=&quot;3&quot; stroke-dasharray=&quot;10 10&quot;/&gt;
      &lt;!-- diamond 2: develop / deliver --&gt;
      &lt;polygon points=&quot;998,135 1298,10 1298,260&quot; fill=&quot;#e8ddf5&quot; stroke=&quot;#a985d6&quot; stroke-width=&quot;3&quot; stroke-linejoin=&quot;round&quot;/&gt;
      &lt;polygon points=&quot;1298,10 1598,135 1298,260&quot; fill=&quot;#e8ddf5&quot; stroke=&quot;#a985d6&quot; stroke-width=&quot;3&quot; stroke-linejoin=&quot;round&quot;/&gt;
      &lt;line x1=&quot;1298&quot; y1=&quot;10&quot; x2=&quot;1298&quot; y2=&quot;260&quot; stroke=&quot;#a985d6&quot; stroke-width=&quot;3&quot; stroke-dasharray=&quot;10 10&quot;/&gt;
    &lt;/svg&gt;

    &lt;div class=&quot;chip ask&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;8&quot; r=&quot;4&quot;/&gt;&lt;path d=&quot;M4 21c0-4 3.6-7 8-7s8 3 8 7&quot;/&gt;&lt;/svg&gt;a fuzzy ask&lt;/div&gt;

    &lt;div class=&quot;phase&quot; style=&quot;left:162px&quot;&gt;&lt;b&gt;Discover&lt;/b&gt;&lt;small&gt;diverge&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;phase&quot; style=&quot;left:462px&quot;&gt;&lt;b&gt;Define&lt;/b&gt;&lt;small&gt;converge&lt;/small&gt;&lt;/div&gt;

    &lt;div class=&quot;chip plan&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M6 3h8l5 5v13H6z&quot;/&gt;&lt;path d=&quot;M14 3v5h5&quot;/&gt;&lt;path d=&quot;M9 13h7M9 17h7&quot;/&gt;&lt;/svg&gt;the plan&lt;/div&gt;

    &lt;div class=&quot;phase&quot; style=&quot;left:998px&quot;&gt;&lt;b&gt;Develop&lt;/b&gt;&lt;small&gt;diverge&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;phase&quot; style=&quot;left:1298px&quot;&gt;&lt;b&gt;Deliver&lt;/b&gt;&lt;small&gt;converge&lt;/small&gt;&lt;/div&gt;

    &lt;div class=&quot;chip answer&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M4 5h16v11H9l-5 4z&quot;/&gt;&lt;path d=&quot;M8 9h8M8 12h5&quot;/&gt;&lt;/svg&gt;the answer&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;cols&quot;&gt;
    &lt;div class=&quot;col&quot;&gt;
      &lt;h2&gt;Before the plan: think with it&lt;/h2&gt;
      &lt;div class=&quot;stack&quot;&gt;
        &lt;div class=&quot;row tell&quot;&gt;
          &lt;div class=&quot;icon&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M4 5h16v11H9l-5 4z&quot;/&gt;&lt;path d=&quot;M10 9.2a2 2 0 1 1 2.9 1.8c-.6.3-.9.7-.9 1.3&quot;/&gt;&lt;path d=&quot;M12 14.6h.01&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;
          &lt;div&gt;
            &lt;div class=&quot;label&quot;&gt;What you tell it&lt;/div&gt;
            &lt;div class=&quot;body&quot;&gt;Open asks, few rules: &amp;ldquo;give me five ways to&amp;hellip;&amp;rdquo;, &amp;ldquo;what would you need to know?&amp;rdquo;, &amp;ldquo;what am I assuming?&amp;rdquo; Ask for options, and for questions back.&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;row work&quot;&gt;
          &lt;div class=&quot;icon&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M4 8h13l-3-3&quot;/&gt;&lt;path d=&quot;M20 16H7l3 3&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;
          &lt;div&gt;
            &lt;div class=&quot;label&quot;&gt;How you work with it&lt;/div&gt;
            &lt;div class=&quot;body&quot;&gt;Many short turns, one chat. React to options instead of specifying up front &amp;mdash; your reaction is the context it was missing. End by writing the plan down.&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;col&quot;&gt;
      &lt;h2&gt;After the plan: build with it&lt;/h2&gt;
      &lt;div class=&quot;stack&quot;&gt;
        &lt;div class=&quot;row tell&quot;&gt;
          &lt;div class=&quot;icon&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M4 6l2 2 3-3M4 12l2 2 3-3M4 18l2 2 3-3&quot;/&gt;&lt;path d=&quot;M12 7h8M12 13h8M12 19h8&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;
          &lt;div&gt;
            &lt;div class=&quot;label&quot;&gt;What you tell it&lt;/div&gt;
            &lt;div class=&quot;body&quot;&gt;The plan, as written: one task, the context it needs, the labels defined, the constraints, one example of the shape. Nothing extra.&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;row work&quot;&gt;
          &lt;div class=&quot;icon&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M7 4l13 8-13 8z&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;
          &lt;div&gt;
            &lt;div class=&quot;label&quot;&gt;How you work with it&lt;/div&gt;
            &lt;div class=&quot;body&quot;&gt;New chat, one ask &amp;mdash; three drafts if you like. Judge them against the plan, not the chat; fix the plan, run again. Same plan, same shape: that is what a skill saves.&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;caption&quot;&gt;
    &lt;b&gt;The plan is the hinge: the first diamond writes it, the second runs on it.&lt;/b&gt;
    Skip the first and you build a guess. Never leave it and nothing ships.
  &lt;/div&gt;

&lt;/div&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe></div>

  :root {

&lt;div class=&quot;page&quot;&gt;
  &lt;h1&gt;Four ways context breaks&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;Curate, don&amp;rsquo;t dump &amp;mdash; the model can&amp;rsquo;t tell what matters to you.&lt;/p&gt;

  &lt;div class=&quot;cols&quot;&gt;
    &lt;div class=&quot;stack&quot;&gt;

      &lt;div class=&quot;row clash&quot;&gt;
        &lt;div class=&quot;icon&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M6 3h7l4 4v14H6z&quot;/&gt;&lt;path d=&quot;M13 3v4h4&quot;/&gt;&lt;path d=&quot;M17 3h4v4l-1.5 1.5&quot;/&gt;&lt;path d=&quot;M17 3l4 4&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;
        &lt;div&gt;
          &lt;div class=&quot;label&quot;&gt;Clash&lt;/div&gt;
          &lt;div class=&quot;body&quot;&gt;Two sources quietly contradict each other; it trusts one. Fixed by evidence in the pile &amp;mdash; dates, versions, a second document &amp;mdash; not by asking.&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;row confusion&quot;&gt;
        &lt;div class=&quot;icon&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M3 12h3l2-6 3 12 2-9 2 5h6&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;
        &lt;div&gt;
          &lt;div class=&quot;label&quot;&gt;Confusion&lt;/div&gt;
          &lt;div class=&quot;body&quot;&gt;Noise nudges the output. A runbook pasted into the prompt gets absorbed into the answer; the same runbook read from a folder gets ignored.&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;row distraction&quot;&gt;
        &lt;div class=&quot;icon&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M4 6h11a4 4 0 0 1 0 8H9&quot;/&gt;&lt;path d=&quot;M12 10l-4 4 4 4&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;
        &lt;div&gt;
          &lt;div class=&quot;label&quot;&gt;Distraction&lt;/div&gt;
          &lt;div class=&quot;body&quot;&gt;Trailing context that isn&amp;rsquo;t about this task bleeds in. Fix: new topic, new chat.&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;row poisoning&quot;&gt;
        &lt;div class=&quot;icon&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M9 3h6l1 5-4 4-4-4z&quot;/&gt;&lt;path d=&quot;M8 12l-3 7a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-3-7&quot;/&gt;&lt;path d=&quot;M9.5 17h5&quot;/&gt;&lt;/svg&gt;&lt;/div&gt;
        &lt;div&gt;
          &lt;div class=&quot;label&quot;&gt;Poisoning&lt;/div&gt;
          &lt;div class=&quot;body&quot;&gt;A wrong fact planted early gets trusted later, turn after turn. Fix: new chat, or name the stale source out of scope.&lt;/div&gt;
        &lt;/div&gt;

<script>
  const pages = [...document.querySelectorAll('.page')];
  let i = 0;
  const go = n => { i = Math.max(0, Math.min(pages.length - 1, n)); pages[i].scrollIntoView({block: 'start'}); };
  document.addEventListener('keydown', e => {
    if (['ArrowRight','PageDown',' '].includes(e.key)) { e.preventDefault(); go(i + 1); }
    else if (['ArrowLeft','PageUp'].includes(e.key)) { e.preventDefault(); go(i - 1); }
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(pages.length - 1);
    else if (e.key.toLowerCase() === 'f') document.documentElement.requestFullscreen();
  });
