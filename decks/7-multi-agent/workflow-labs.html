<script>window.DECK = {"flow": [{"title": "Before you run", "file": "content/workflow-labs/how-labs-run.md"}, {"title": "00 Augmented LLM", "file": "content/workflow-labs/wf00-augmented-llm.md"}, {"title": "01 Prompt chaining", "file": "content/workflow-labs/wf01-prompt-chaining.md"}, {"title": "02 Parallelization", "file": "content/workflow-labs/wf02-parallelization.md"}, {"title": "03 Routing", "file": "content/workflow-labs/wf03-routing.md"}, {"title": "04 Orchestrator–workers", "file": "content/workflow-labs/wf04-orchestrator-worker.md"}, {"title": "05 Evaluator–optimizer", "file": "content/workflow-labs/wf05-evaluator-optimizer.md"}, {"title": "06 Agent", "file": "content/workflow-labs/wf06-agent.md"}], "files": {"content/workflow-labs/how-labs-run.md": "# Before you run\n\n## Overview\n\n**Goal:** Get the labs running on your own machine, and read any lab's trace: who is the agent, which tool it called, and where code stepped in.\n\n**Walk out with:** one working command, and the habit \"every step is an agent, code checks every handoff\".\n\n\n## Seven exercises, one world\n\n> The team moves from Station Road to Riverside House, 14 Canal Street. First working day there: Monday 7 December 2026.\n\n| # | Pattern | The job |\n|---|---|---|\n| 00 | Augmented LLM | answer a health question from sources it read |\n| 01 | Prompt chaining | jargon memo → staff notice, at most 150 words |\n| 02 | Parallelization | email, chat post and FAQ, written at the same time |\n| 03 | Routing | employee questions → IT, Facilities or HR desk |\n| 04 | Orchestrator–workers | a cited report on LLM scaling laws |\n| 05 | Evaluator–optimizer | fire-drill notice, rewritten until approved |\n| 06 | Agent | price a café order in EUR |\n\n\n## Set up once\n\n```bash\ncd multi-agent-architecture-patterns\ncp .env.example .env\n```\n\nOpen `.env` and fill in **one** provider:\n\n```bash\nLLM_PROVIDER=nexus            # or anthropic\nNEXUS_BASE_URL=...            # for nexus\nNEXUS_API_KEY=...\nNEXUS_MODEL=...\nANTHROPIC_API_KEY=...         # for anthropic (model: claude-opus-5-5 unless ANTHROPIC_MODEL is set)\n```\n\nThen check the tools. No model is called, so this works before the key does:\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf_tools.py<\/span>\n<span class=\"t-ok\">exit 0<\/span><span class=\"t-dim\"> · 0 s<\/span><\/pre>\n\n\n\n## If the first lab stops at once\n\n<pre class=\"term\"><span class=\"t-dim\">LLM_PROVIDER=nexus, NEXUS_BASE_URL=, NEXUS_API_KEY=<\/span>\n<span class=\"t-cmd\">uv run labs/wf01_prompt_chaining.py<\/span>\n<span class=\"rv s1\">LLM_PROVIDER=nexus needs NEXUS_BASE_URL, NEXUS_API_KEY. Set them in .env (see .env.example) or export them before running a lab.<\/span>\n<span class=\"t-bad\">exit 1<\/span><span class=\"t-dim\"> · 0 s<\/span><\/pre>\n\n::: reveal It stops before the first model call | .s1\n:::\n\n**Ask:** What do you check?\n\n::: reveal Answer\n`.env` is in `multi-agent-architecture-patterns/` (not in `labs/`), `LLM_PROVIDER` names the provider you filled in, and its key line has no quotes or spaces around `=`. A wrong model name gets further: it fails on the first call, with the gateway's error.\n:::\n\n## How to read a trace\n\n```mermaid\nflowchart LR\n  T[task] --> M[model]\n  M -- \"tool call\" --> X[tool, plain Python]\n  X -- result --> M\n  M -- \"final answer\" --> V{validate in code}\n  V -- rejected, with the error --> M\n  V -- ok --> N[next step]\n  classDef model fill:#fff1e7,stroke:#F47421,stroke-width:2px\n  classDef code fill:#eaf1f7,stroke:#134F7C,stroke-width:2px\n  class M model\n  class X,V,N code\n```\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf03_routing.py --mode agentic<\/span>\n<span class=\"t-dim\">⋯<\/span>\n<span class=\"rv s1\"><span class=\"t-who\">[IT Desk]<\/span> search_kb({&#x27;query&#x27;: &#x27;second monitor move Station Road&#x27;})\n<span class=\"t-who\">[IT Desk]<\/span> read_article({&#x27;article_id&#x27;: &#x27;IT-01&#x27;})<\/span>\n<span class=\"rv s2\"><span class=\"t-who\">[IT Desk]<\/span> search_kb({&#x27;query&#x27;: &#x27;fixed desk hot desk hybrid Zone B&#x27;})\n<span class=\"t-who\">[IT Desk]<\/span> read_article({&#x27;article_id&#x27;: &#x27;IT-05&#x27;})\n<span class=\"t-who\">[IT Desk]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span><\/span>\n<span class=\"t-dim\">⋯<\/span>\n<span class=\"rv s3\"><span class=\"t-who\">[Facilities Desk]<\/span> <span class=\"t-bad\">handoff rejected:<\/span> sentence over 25 words: &quot;My articles don&#x27;t cover car park barrier access, a step-free…&quot; (+1 more)<\/span><\/pre>\n\n::: reveal [Agent] tool(args): the model asked, our code ran it | .s1\n:::\n::: reveal done (handoff validated): code checked the final answer | .s2\n:::\n::: reveal handoff rejected: the error goes back to the same agent | .s3\n:::\n\n\n## Two ways to run labs 01–05\n\n| | `--mode workflow` (default) | `--mode agentic` |\n|---|---|---|\n| Who decides the path | our code: `if`, `while`, a thread pool | an agent that calls the other agents as tools |\n| Each step | an agent | an agent |\n| Final answer | checked in code | checked in code |\n\n**Ask:** Which one would you put in production first? Hands up: workflow / agentic.\n\n::: reveal Answer\n**Workflow**, when the path is known in advance: it is cheaper, repeatable and easy to debug. Agentic earns its cost when the path depends on what comes back (send a weak piece back, add a section). Each lab shows both, with the bill.\n:::\n\n\n<!-- Generated by recordings/build_slides.py from content-src/workflow-labs/how-labs-run.md. Edit the source. -->\n", "content/workflow-labs/wf00-augmented-llm.md": "# 00 Augmented LLM\n\n## Overview\n\n**Goal:** Tell one augmented call (structured output, one tool) from an agent that searches, reads and decides when it knows enough.\n\n**Walk out with:** \"one search is rarely enough\": the step from augmented LLM to agent.\n\n\n## The problem\n\n> \"How does Calcium CT score relate to high cholesterol?\"\n\n**Part 1, one call each:** the model turns the question into `{search_query, justification}`. \"What is 2 times 3?\" becomes `{\"tool\": \"multiply\", \"args\": {\"a\": 2, \"b\": 3}}`, and code runs it once.\n\n**Part 2, an agent:** search, read, refine, then return the same JSON plus `answer` and `sources`, checked in code.\n\n**Ask:** Part 1 gives a good search query. Why isn't that enough to answer the question?\n\n::: reveal Answer\nA query is not an answer. Someone still has to run it, open the results, notice what's missing and search again. In part 2, the model does that loop itself.\n:::\n\n## Run it\n\nIn `multi-agent-architecture-patterns/`:\n\n```bash\nuv run labs/wf00_augmented_llm.py\n```\n\n**Look for:** part 1 prints a query and one tool result · part 2 prints one line per tool call, then an answer with sources · the cost table\n\n## The run, part 1: one call each\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf00_augmented_llm.py<\/span>\n<span class=\"rv s1\">── Part 1: augmented LLM, one call each ──\nsearch_query:  coronary artery calcium CT score relationship with high cholesterol LDL statin decisions\njustification: The user wants to know how a coronary artery calcium (CAC) score relates to high cholesterol. This query should find sources explaining how cholesterol contributes to calcified plaque, how CAC scores refine cardiovascular risk for people with high LDL, and how CAC results guide statin treatment.<\/span>\n<span class=\"rv s2\"><span class=\"t-who\">[Tool LLM]<\/span> asked for multiply({&#x27;a&#x27;: 2, &#x27;b&#x27;: 3})\nmultiply result: 6<\/span><\/pre>\n\n::: reveal Structured output: a query and why | .s1\nOne model call, no tools. It returns JSON with exactly the fields we asked for.\n:::\n::: reveal One tool call, run by code | .s2\nThe model only *asks* for `multiply`. Our code runs it, once, and stops.\n:::\n\n## The run, part 2: the research agent\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf00_augmented_llm.py<\/span>\n<span class=\"t-dim\">⋯<\/span>\n── Part 2: research agent ──\n<span class=\"rv s1\"><span class=\"t-who\">[Research Agent]<\/span> web_search({&#x27;query&#x27;: &#x27;coronary artery calcium score and high cholesterol relationship&#x27;<span class=\"t-dim\">…<\/span><\/span>\n<span class=\"rv s2\"><span class=\"t-who\">[Research Agent]<\/span> read_result({&#x27;result_id&#x27;: &#x27;W01&#x27;})\n<span class=\"t-dim\">⋯ 2 more read_result calls by Research Agent<\/span>\n<span class=\"t-who\">[Research Agent]<\/span> read_result({&#x27;result_id&#x27;: &#x27;W11&#x27;})<\/span>\n<span class=\"rv s3\"><span class=\"t-who\">[Research Agent]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span><\/span><\/pre>\n\n::: reveal It searches | .s1\n:::\n::: reveal It chooses what to read | .s2\nFour of the results, not all of them.\n:::\n::: reveal It answers, code checks | .s3\n\"handoff validated\": code checked that every source it cites was really read.\n:::\n\n## What came out\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf00_augmented_llm.py<\/span>\n<span class=\"t-dim\">⋯<\/span>\nanswer:        A coronary artery calcium (CAC) score and cholesterol measure different stages of the same disease.\n​\n**What a CAC score is.** It comes from a non-contrast CT scan of the heart. It measures calcified plaque in the coronary arteries and is usually reported as an Agatston score. A score of 0 means no detectable calcium; higher numbers mean more calcified plaque [W01].\n​\n**How cholesterol fits in.** High LDL cholesterol over many years contributes to atherosclerosis, which is plaque building up in artery walls. Over time some of that plaque calcifies, and this calcium is what the scan detects. Cholesterol is a cause of plaque, and calcium is a later sign that plaque ⋯\n<span class=\"t-dim\">⋯<\/span>\nsources:       W01, W02, W04, W11\n<span class=\"rv s1\">\nAgent              calls  tokens in  tokens out  seconds\nStructured LLM         1        128         141        3\nTool LLM               1         62          95        2\nResearch Agent         6      5,329         923       14\nTotal                  8      5,519       1,159       19<\/span>\n<span class=\"t-ok\">exit 0<\/span><span class=\"t-dim\"> · 25 s<\/span><\/pre>\n\n::: reveal What it cost | .s1\n:::\n\n\n## Where else you see this\n\n**Ask:** Name one tool you'd give a single model call at work, and one task where one call isn't enough.\n\n\n<!-- Generated by recordings/build_slides.py from content-src/workflow-labs/wf00-augmented-llm.md. Edit the source. -->\n", "content/workflow-labs/wf01-prompt-chaining.md": "# 01 Prompt chaining\n\n## Overview\n\n**Goal:** Run a fixed chain of agents with a code gate between them, and read in the trace what each link adds.\n\n**Walk out with:** \"each link has one job and its own tools; the gate is code\".\n\n\n## The problem\n\n> The move team's memo: \"Going forward, in order to facilitate a seamless relocation, all stakeholders are kindly requested to utilise the crates provided…\"\n\nTurn it into a staff notice: **real facts, plain words, sentences ≤ 25 words, the essentials (what, when, where, contact), at most 150 words.**\n\n```mermaid\nflowchart LR\n  A[memo] --> D[Drafter]\n  D --> G{check_essentials}\n  G -- fail --> S[stop]\n  G -- pass --> P[Plain-language]\n  P --> F[Final editor]\n  F --> V{final checks}\n  classDef model fill:#fff1e7,stroke:#F47421,stroke-width:2px\n  classDef code fill:#eaf1f7,stroke:#134F7C,stroke-width:2px\n  class D,P,F model\n  class G,V,S code\n```\n\n**Ask:** Why is the gate code and not a fourth agent?\n\n::: reveal Answer\n\"Does it have a date, a place and a contact?\" has one right answer. Code checks it the same way every time, for free. Use a model where judgement is needed.\n:::\n\n## Run it\n\nIn `multi-agent-architecture-patterns/`:\n\n```bash\nuv run labs/wf01_prompt_chaining.py\n```\n\n**Look for:** one line per tool call, `[Agent]` in front · the draft printed after each link · the cost table at the end\n\n**Commit:** Which of the three agents will make the most model calls? Write it down.\n\n::: reveal Answer\nThe **Final editor**: 18 of the 24 calls in our run. The last link did the most work.\n:::\n\n## The run: drafter, then plain language\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf01_prompt_chaining.py --mode workflow<\/span>\n<span class=\"rv s1\"><span class=\"t-who\">[Drafter]<\/span> lookup_facts({&#x27;topic&#x27;: &#x27;&#x27;})\n<span class=\"t-who\">[Drafter]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span><\/span>\n<span class=\"rv s2\">\nDraft:\nInternal memo from the move team. Going forward, in order to facilitate a seamless relocation from Station Road to Riverside House, 14 Canal Street, all stakeholders are kindly requested to utilise the two crates provided (delivered to Station Road on Monday 3 ⋯<\/span>\n<span class=\"rv s3\"><span class=\"t-who\">[Plain-language]<\/span> check_jargon({&#x27;text&#x27;: &quot;Internal memo from the move team. Going forward, in order to fa<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Plain-language]<\/span> check_sentences({&#x27;text&#x27;: &quot;Internal memo from the move team. From now on, to help make <span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Plain-language]<\/span> check_sentences({&#x27;text&#x27;: &quot;Internal memo from the move team. From now on, please help m<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Plain-language]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span><\/span>\n<span class=\"rv s4\">\n&#45;&#45;&#45; --- ---\nPlain language:\nInternal memo from the move team. From now on, please help make our move from Station Road to Riverside House, 14 Canal Street, smooth. We ask all the people involved to do the following. Use the two crates we delivered to Station Road on Monday 30 November. P ⋯<\/span><\/pre>\n\n::: reveal Drafter: reads the facts, writes a draft | .s1\n:::\n::: reveal The draft: real facts, still a memo | .s2\n:::\n::: reveal Plain-language: checks jargon, checks sentences, fixes | .s3\nIt ran `check_sentences` twice: the first fix still had a long sentence.\n:::\n::: reveal The result: plain words, still \"Internal memo from the move team…\" | .s4\n:::\n\n\n## The run: the final editor\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf01_prompt_chaining.py --mode workflow<\/span>\n<span class=\"t-dim\">⋯<\/span>\n<span class=\"rv s1\"><span class=\"t-who\">[Final editor]<\/span> lookup_facts({&#x27;topic&#x27;: &#x27;&#x27;})\n<span class=\"t-who\">[Final editor]<\/span> get_fact({&#x27;fact_id&#x27;: &#x27;O01&#x27;})\n<span class=\"t-dim\">⋯ 8 more get_fact calls by Final editor<\/span>\n<span class=\"t-who\">[Final editor]<\/span> get_fact({&#x27;fact_id&#x27;: &#x27;O18&#x27;})<\/span>\n<span class=\"rv s2\"><span class=\"t-who\">[Final editor]<\/span> count_words({&#x27;text&#x27;: &quot;Office move: Station Road to Riverside House\\n\\nWe are moving from<span class=\"t-dim\">…<\/span>\n<span class=\"t-dim\">⋯ 1 more count_words call by Final editor<\/span>\n<span class=\"t-who\">[Final editor]<\/span> count_words({&#x27;text&#x27;: &quot;Office move\\n\\nWe are moving from Station Road to Riverside House,<span class=\"t-dim\">…<\/span><\/span>\n<span class=\"rv s3\"><span class=\"t-who\">[Final editor]<\/span> check_essentials({&#x27;text&#x27;: &quot;Office move\\n\\nWe are moving from Station Road to Riverside H<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Final editor]<\/span> check_jargon({&#x27;text&#x27;: &quot;Office move\\n\\nWe are moving from Station Road to Riverside House<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Final editor]<\/span> check_sentences({&#x27;text&#x27;: &quot;Office move\\n\\nWe are moving from Station Road to Riverside Ho<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Final editor]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span><\/span><\/pre>\n\n::: reveal It checks every fact it will use | .s1\n`get_fact` ten times: each date and place in the notice is checked against the fact list.\n:::\n::: reveal It rewrites, counting words | .s2\nThree versions, counted each time, until it fit.\n:::\n::: reveal The last checks, then code accepts it | .s3\n:::\n\n## What came out\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf01_prompt_chaining.py --mode workflow<\/span>\n<span class=\"t-dim\">⋯<\/span>\nFinal notice:\nOffice move\n​\nWe are moving from Station Road to Riverside House, 14 Canal Street. Wednesday 2 December 2026 is your last day at Station Road. The office closes at 16:00. You start at Riverside House on Monday 7 December 2026.\n​\nWhat you need to do:\n- Pack your personal items in the two crates delivered on Monday 30 November, by 16:00 on Wednesday 2 December.\n- Label your crates with your name and your team&#x27;s zone.\n- Do not pack monitors, docking stations or keyboards. IT packs and moves them.\n- Take your laptop and charger home on Wednesday 2 December.\n- Book a desk in your team&#x27;s zone (A to D) on floor 2 in the DeskBook app. Booking opens on Monday 30 November.\n- Collect your new access badge at reception from 08:00 on Monday 7 December. Bring photo ID.\n​\nQuestions? Email the move team at move-team@example.com.\n<span class=\"rv s1\">\nAgent              calls  tokens in  tokens out  seconds\nDrafter                2      2,382       1,003       11\nPlain-language         4      6,089       2,426       21\nFinal editor          18     58,322       4,832       71\nTotal                 24     66,793       8,261      102\n​\ntranscript: runs/wf/wf01_workflow.json<\/span>\n<span class=\"t-ok\">exit 0<\/span><span class=\"t-dim\"> · 104 s<\/span><\/pre>\n\n::: reveal What it cost | .s1\n:::\n\n\n## Agentic: an editor-in-chief runs the chain\n\n```bash\nuv run labs/wf01_prompt_chaining.py --mode agentic\n```\n\nThe three agents become **tools** of a fourth: `draft_notice`, `make_plain`, `polish_notice`. The Editor-in-chief decides what to call, and when.\n\n**Commit:** Will it call each link once, in order, like our code did? Yes / no.\n\n::: reveal Answer\n**No.** In our run it drafted and simplified **twice** before polishing. Nobody told it to.\n:::\n\n## The agentic run: draft, simplify, and again\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf01_prompt_chaining.py --mode agentic<\/span>\n<span class=\"rv s1\"><span class=\"t-who\">[Editor-in-chief]<\/span> lookup_facts({&#x27;topic&#x27;: &#x27;&#x27;})\n<span class=\"t-who\">[Editor-in-chief]<\/span> draft_notice({&#x27;memo&#x27;: &quot;Internal memo from the move team. Going forward, in order to f<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Drafter]<\/span> lookup_facts({&#x27;topic&#x27;: &#x27;&#x27;})\n<span class=\"t-who\">[Drafter]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span>\n<span class=\"t-who\">[Editor-in-chief]<\/span> make_plain({&#x27;notice&#x27;: &quot;Internal memo from the move team. Going forward, in order to f<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Plain-language]<\/span> check_jargon({&#x27;text&#x27;: &quot;Internal memo from the move team. Going forward, in order to fa<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Plain-language]<\/span> check_sentences({&#x27;text&#x27;: &quot;Internal memo from the move team. From now on, to help make <span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Plain-language]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span><\/span>\n<span class=\"rv s2\"><span class=\"t-who\">[Editor-in-chief]<\/span> count_words({&#x27;text&#x27;: &quot;Internal memo from the move team. From now on, to help make the<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Editor-in-chief]<\/span> draft_notice({&#x27;memo&#x27;: &#x27;Internal memo from the move team. Going forward, in order to f<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Drafter]<\/span> lookup_facts({&#x27;topic&#x27;: &#x27;&#x27;})\n<span class=\"t-who\">[Drafter]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span>\n<span class=\"t-who\">[Editor-in-chief]<\/span> make_plain({&#x27;notice&#x27;: &#x27;Internal memo from the move team. Going forward, in order to f<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Plain-language]<\/span> check_jargon({&#x27;text&#x27;: &#x27;Internal memo from the move team. Going forward, in order to fa<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Plain-language]<\/span> check_sentences({&#x27;text&#x27;: &#x27;Internal memo from the move team. From now on, to help make <span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Plain-language]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span><\/span><\/pre>\n\n::: reveal It reads the facts, then calls the drafter and plain-language | .s1\n:::\n::: reveal It counts the words, and starts over | .s2\n`count_words`, then `draft_notice` again: it decided the first round wasn't good enough.\n:::\n\n## The agentic run: polish, then check\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf01_prompt_chaining.py --mode agentic<\/span>\n<span class=\"t-dim\">⋯<\/span>\n<span class=\"rv s1\"><span class=\"t-who\">[Editor-in-chief]<\/span> polish_notice({&#x27;notice&#x27;: &#x27;Internal memo from the move team. From now on, to help make<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Final editor]<\/span> lookup_facts({&#x27;topic&#x27;: &#x27;&#x27;})\n<span class=\"t-who\">[Final editor]<\/span> get_fact({&#x27;fact_id&#x27;: &#x27;O01&#x27;})\n<span class=\"t-dim\">⋯ 6 more get_fact calls by Final editor<\/span>\n<span class=\"t-who\">[Final editor]<\/span> get_fact({&#x27;fact_id&#x27;: &#x27;O18&#x27;})\n<span class=\"t-who\">[Final editor]<\/span> check_jargon({&#x27;text&#x27;: &quot;Office move to Riverside House\\n\\nWe are moving from Station Road<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Final editor]<\/span> count_words({&#x27;text&#x27;: &quot;Office move to Riverside House\\n\\nWe are moving from Station Road <span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Final editor]<\/span> check_essentials({&#x27;text&#x27;: &quot;Office move to Riverside House\\n\\nWe are moving from Station <span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Final editor]<\/span> check_sentences({&#x27;text&#x27;: &quot;Office move to Riverside House\\n\\nWe are moving from Station R<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Final editor]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span><\/span>\n<span class=\"rv s2\"><span class=\"t-who\">[Editor-in-chief]<\/span> check_essentials({&#x27;text&#x27;: &quot;Office move to Riverside House\\n\\nWe are moving from Stati<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Editor-in-chief]<\/span> check_jargon({&#x27;text&#x27;: &quot;Office move to Riverside House\\n\\nWe are moving from Station R<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Editor-in-chief]<\/span> check_sentences({&#x27;text&#x27;: &quot;Office move to Riverside House\\n\\nWe are moving from Statio<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Editor-in-chief]<\/span> count_words({&#x27;text&#x27;: &quot;Office move to Riverside House\\n\\nWe are moving from Station Ro<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Editor-in-chief]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span><\/span>\n<span class=\"t-dim\">⋯<\/span>\n<span class=\"rv s3\">Agent              calls  tokens in  tokens out  seconds\nEditor-in-chief       12     59,852       4,250       38\nDrafter                4      5,841       1,966       19\nPlain-language         6      6,998       3,343       29\nFinal editor          14     38,536       3,728       59\nTotal                 36    111,227      13,287      146<\/span>\n<span class=\"t-ok\">exit 0<\/span><span class=\"t-dim\"> · 148 s<\/span><\/pre>\n\n::: reveal Then the final editor | .s1\n:::\n::: reveal It checks the result itself | .s2\n:::\n::: reveal What it cost | .s3\n:::\n\n\n## Where else you see this\n\n**Ask:** Name a job at work that is always the same three steps in the same order.\n\n\n<!-- Generated by recordings/build_slides.py from content-src/workflow-labs/wf01-prompt-chaining.md. Edit the source. -->\n", "content/workflow-labs/wf02-parallelization.md": "# 02 Parallelization\n\n## Overview\n\n**Goal:** Run independent agents side by side and join their work with an agent that checks it.\n\n**Walk out with:** \"parallel when the pieces don't need each other; the join is where the checking happens\".\n\n\n\n## The problem\n\n> The communications team needs three pieces about the move, today.\n\n**Email:** 120–200 words, 3+ facts, a contact · **Chat post:** ≤ 280 characters, the key date · **FAQ:** 3–5 Q&As, each citing its fact\n\n```mermaid\nflowchart LR\n  T[topic] --> E[Email Writer]\n  T --> C[Chat Writer]\n  T --> Q[FAQ Writer]\n  E --> A[Aggregator]\n  C --> A\n  Q --> A\n  classDef model fill:#fff1e7,stroke:#F47421,stroke-width:2px\n  class E,C,Q,A model\n```\n\n**Ask:** The three writers all read the same fact list. What can still go wrong when they write at the same time?\n\n::: reveal Answer\nThey can **disagree**: one says the office closes at 16:00, another says \"end of the day\". None of them sees the others' work, so the join has to check.\n:::\n\n## Run it\n\nIn `multi-agent-architecture-patterns/`:\n\n```bash\nuv run labs/wf02_parallelization.py\n```\n\n**Look for:** `[Email Writer]`, `[Chat Writer]` and `[FAQ Writer]` lines mixed together: they run at the same time · the Aggregator after all three · the pack: EMAIL, CHAT, FAQ, ISSUES\n\n## The run: three writers, then the join\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf02_parallelization.py --mode workflow<\/span>\n<span class=\"rv s1\"><span class=\"t- bject: Our move to Riverside House\\n\\nHello everyone,\\n\\nWe <span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Email Writer]<\/span> check_essentials({&#x27;text&#x27;: &quot;Subject: Our move to Riverside House\\n\\nHello everyone,\\n\\nWe<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Email Writer]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span><\/span>\n<span class=\"rv s3\"><span class=\"t-who\">[Aggregator]<\/span> get_fact({&#x27;fact_id&#x27;: &#x27;O01&#x27;})\n<span class=\"t-dim\">⋯ 9 more get_fact calls by Aggregator<\/span>\n<span class=\"t-who\">[Aggregator]<\/span> get_fact({&#x27;fact_id&#x27;: &#x27;O18&#x27;})\n<span class=\"t-who\">[Aggregator]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span><\/span><\/pre>\n\n::: reveal Three writers start together | .s1\n:::\n::: reveal Each one reads the facts and checks its own piece | .s2\nThe lines interleave: that's the thread pool. Chat is done first, email last.\n:::\n::: reveal The aggregator checks every fact they cited | .s3\n:::\n\n\n## What came out\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf02_parallelization.py --mode workflow<\/span>\n<span class=\"t-dim\">⋯<\/span>\nCommunications pack for the office move to Riverside House: an email, a chat post and an FAQ, all checked against the move facts.\n​\nEMAIL:\nSubject: Our move to Riverside House\n​\nHello everyone,\n<span class=\"t-dim\">⋯<\/span>\nCHAT:\nWe&#x27;re moving to Riverside House, 14 Canal Street! Our first day there is Monday 7 December 2026. Station Road closes at 16:00 on Wednesday 2 December. Work from home on 3 and 4 December. Take your laptop home on 2 December. Questions: move-team@example.com\n<span class=\"t-dim\">⋯<\/span>\nISSUES:\nnone\n<span class=\"rv s1\">\nAgent              calls  tokens in  tokens out  seconds\nFAQ Writer             4      7,361       1,564       15\nChat Writer            4      6,343         801       10\nEmail Writer           6     14,397       2,513       26\nAggregator            12     22,795       1,737       35\nTotal                 26     50,896       6,615       85<\/span>\n<span class=\"t-ok\">exit 0<\/span><span class=\"t-dim\"> · 62 s<\/span><\/pre>\n\n::: reveal What it cost | .s1\n:::\n\n## Agentic: a coordinator dispatches\n\n```bash\nuv run labs/wf02_parallelization.py --mode agentic\n```\n\nThe writers become jobs the **Coordinator** sends with one tool, `dispatch`. It reads what comes back, can send a weak piece back, and writes the pack. It has a budget: **15 steps**.\n\n**Commit:** The Coordinator wants to check each fact the writers cited, one `get_fact` call each. How many facts did they cite in the workflow run?\n\n::: reveal Answer\n**11** (O01–O10 and O18), and the agentic writers cite even more. 1 dispatch + 14 checks = 15 steps. Look at the next slide.\n:::\n\n## The agentic run: it crashes\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf02_parallelization.py --mode agentic<\/span>\n<span class=\"rv s1\"><span class=\"t-who\">[Coordinator]<\/span> dispatch({&#x27;jobs&#x27;: [{&#x27;kind&#x27;: &#x27;email&#x27;, &#x27;brief&#x27;: &#x27;Write a staff email announcing the office <span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Email Writer]<\/span> Write a staff email announcing the office move to Riverside House: key dates, what staff<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Chat Writer]<\/span> Write a short, friendly team-chat post about the office move to Riverside House with the <span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[FAQ Writer]<\/span> Write an FAQ about the office move to Riverside House covering dates, packing, access, par<span class=\"t-dim\">…<\/span><\/span>\n<span class=\"t-dim\">⋯<\/span>\n<span class=\"rv s2\"><span class=\"t-who\">[Chat Writer]<\/span> count_chars({&#x27;text&#x27;: &quot;We&#x27;re moving to Riverside House, 14 Canal Street! Our first day the<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Email Writer]<\/span> count_words({&#x27;text&#x27;: &quot;Subject: Our office move to Riverside House\\n\\nHello everyone,\\n\\n<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Chat Writer]<\/span> check_jargon({&#x27;text&#x27;: &quot;We&#x27;re moving to Riverside House, 14 Canal Street! Our first day th<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Email Writer]<\/span> check_jargon({&#x27;text&#x27;: &quot;Subject: Our office move to Riverside House\\n\\nHello everyone,\\n\\<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Chat Writer]<\/span> <span class=\"t-bad\">handoff rejected:<\/span> missing a date<\/span>\n<span class=\"rv s3\"><span class=\"t-who\">[FAQ Writer]<\/span> check_jargon({&#x27;text&#x27;: &quot;Q: When do we move to Riverside House?\\nA: Our first working day at<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Email Writer]<\/span> check_sentences({&#x27;text&#x27;: &quot;Subject: Our office move to Riverside House\\n\\nHello everyone,<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Chat Writer]<\/span> count_chars({&#x27;text&#x27;: &#x27;Moving day! From Monday 7 December 2026 we work at Riverside House,<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Email Writer]<\/span> check_essentials({&#x27;text&#x27;: &quot;Subject: Our office move to Riverside House\\n\\nHello everyone<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[FAQ Writer]<\/span> check_sentences({&#x27;text&#x27;: &quot;Q: When do we move to Riverside House?\\nA: Our first working day<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Chat Writer]<\/span> check_jargon({&#x27;text&#x27;: &#x27;Moving day! From Monday 7 December 2026 we work at Riverside House<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Email Writer]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span>\n<span class=\"t-who\">[Chat Writer]<\/span> count_chars({&#x27;text&#x27;: &#x27;Big news! From Monday 7 December 2026 we work at Riverside House, 1<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Chat Writer]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span>\n<span class=\"t-who\">[FAQ Writer]<\/span> check_jargon({&#x27;text&#x27;: &quot;Q: When do we move to Riverside House?\\nA: Our last working day at <span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[FAQ Writer]<\/span> check_sentences({&#x27;text&#x27;: &quot;Q: When do we move to Riverside House?\\nA: Our last working day <span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[FAQ Writer]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span><\/span>\n<span class=\"rv s4\"><span class=\"t-who\">[Coordinator]<\/span> get_fact({&#x27;fact_id&#x27;: &#x27;O11&#x27;})\n<span class=\"t-dim\">⋯ 12 more get_fact calls by Coordinator<\/span>\n<span class=\"t-who\">[Coordinator]<\/span> get_fact({&#x27;fact_id&#x27;: &#x27;O19&#x27;})<\/span>\n<span class=\"rv s5\"><span class=\"t-bad\">RuntimeError: Coordinator did not finish within 15 steps<\/span><\/span><\/pre>\n\n::: reveal The coordinator dispatches all three at once | .s1\n:::\n::: reveal The writers work; code rejects one chat post | .s2\n\"missing a date\": the Chat Writer gets the error back and fixes it.\n:::\n::: reveal All three hand in | .s3\n:::\n::: reveal It checks the facts, one call each | .s4\n:::\n::: reveal Out of steps: exit 1 | .s5\n:::\n\n\n\n## Where else you see this\n\n**Ask:** Where at work do you ask three people the same question, or three people for three different parts?\n\n\n<!-- Generated by recordings/build_slides.py from content-src/workflow-labs/wf02-parallelization.md. Edit the source. -->\n", "content/workflow-labs/wf03-routing.md": "# 03 Routing\n\n## Overview\n\n**Goal:** Let an agent classify a request, and let code send it to the one specialist that should answer.\n\n**Walk out with:** \"the router writes a brief, not just a label\".\n\n\n## The problem\n\n> Elif (Marketing) asks: \"I only work Monday to Wednesday. Can I still work from home two days a week?\"\n\n```mermaid\nflowchart LR\n  Q[question] --> R[Router]\n  R --> B{dept}\n  B -- it --> I[IT Desk]\n  B -- facilities --> F[Facilities Desk]\n  B -- hr --> H[HR Desk]\n  classDef model fill:#fff1e7,stroke:#F47421,stroke-width:2px\n  classDef code fill:#eaf1f7,stroke:#134F7C,stroke-width:2px\n  class R,I,F,H model\n  class B code\n```\n\nEach desk searches only its own help articles and must cite one it read.\n\n**Commit:** Which desk? And what does the desk need to know about Elif? Write it down.\n\n::: reveal Answer\n**HR**: it's a home-working policy question. The desk needs to know she is **part time, three days a week**, or it will answer \"yes, two days\" for full-time staff.\n:::\n\n## Run it\n\nIn `multi-agent-architecture-patterns/`:\n\n```bash\nuv run labs/wf03_routing.py\n```\n\n**Look for:** `══` and the question · `[Router] -> hr:` and the brief it wrote · the desk's search and reads · its answer with `[article-id]` citations\n\n## The run: Elif's question\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf03_routing.py --mode workflow<\/span>\n<span class=\"t-dim\">⋯<\/span>\n══ e5: &#x27;I only work Monday to Wednesday. Can I still work from home two days a week?&#x27;\n<span class=\"rv s1\"><span class=\"t-who\">[Router]<\/span> get_employee({&#x27;employee_id&#x27;: &#x27;e5&#x27;})<\/span>\n<span class=\"rv s2\"><span class=\"t-who\">[Router]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span>\n<span class=\"t-who\">[Router]<\/span> -&gt; hr: Elif Yilmaz (e5), Marketing specialist on the Marketing team, zone C, asks whether she can still work from home two days a week after the office move. She works part time, Monday to Wednesday, so two remote days would leave her only one day a week in the office. Please confirm how the hybrid/WFH policy applies to part-time staff: whether the remote-day allowance is fixed or pro-rated to working days, and whether there is a minimum number of office days. If any of this depends on zone C desk arrangements or team in-office days, say so. No other notes on file.<\/span>\n<span class=\"rv s3\"><span class=\"t-who\">[HR Desk]<\/span> Elif Yilmaz (e5), Marketing specialist on the Marketing team, zone C, asks whether she can st<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[HR Desk]<\/span> search_kb({&#x27;query&#x27;: &#x27;hybrid work from home policy part-time&#x27;})\n<span class=\"t-who\">[HR Desk]<\/span> read_article({&#x27;article_id&#x27;: &#x27;HR-03&#x27;})\n<span class=\"t-who\">[HR Desk]<\/span> read_article({&#x27;article_id&#x27;: &#x27;HR-01&#x27;})\n<span class=\"t-who\">[HR Desk]<\/span> search_kb({&#x27;query&#x27;: &#x27;zone C desks team in-office days minimum office days&#x27;})\n<span class=\"t-who\">[HR Desk]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span><\/span>\n<span class=\"rv s4\">\n<span class=\"t-who\">[hr]<\/span>\nHi Elif, unfortunately two home days a week wouldn&#x27;t fit the policy for your pattern. Part-time staff can work from home for up to 40% of their working days each week, rounded down. Working Monday to Wednesday, that&#x27;s 1 day from home [HR-03]. So the allowance is pro-rated rather than fixed. The 2-days-a-week allowance applies to full-time staff, agreed with their manager [HR-01]. The move doesn&#x27;t change the hybrid rule [HR-01]. Our articles don&#x27;t set a separate minimum number of office days. Under the 40% rule, though, you&#x27;d work from home 1 day and be in the office the other 2. Our HR articles also don&#x27;t cover zone C desk arrangements or team in-office days. For desks, please check with the desk that handles office space after the move. For any set team days, please check with your manager.<\/span><\/pre>\n\n::: reveal The router looks her up | .s1\n:::\n::: reveal It picks a desk and writes a brief | .s2\nNot just \"hr\": it tells the desk she works part time, Monday to Wednesday.\n:::\n::: reveal The HR desk searches and reads its own articles | .s3\n:::\n::: reveal The answer, with citations | .s4\n:::\n\n\n## The other four questions\n\n**Ask:** Route these. Hands up for each: IT / Facilities / HR.\n\n- Ana: \"My second monitor is still at Station Road. Do I need to bring it over myself?\"\n- Chloe: \"Where can I park on my first day, and how do I get out of the building if there's a fire?\"\n- Ben: \"I start on 7 December. What do I need to bring and where do I go?\"\n- Femi: \"Is there somewhere safe to leave my bike?\"\n\n::: reveal What the run did\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf03_routing.py --mode workflow<\/span>\n<span class=\"t-who\">[Router]<\/span> -&gt; it: Ana Silva (e1), Finance analyst on the Finance team, zone B, works full time and hybrid. Her second monitor was left at Station Road.  ⋯\n<span class=\"t-who\">[Router]<\/span> -&gt; facilities: Question: Chloe Martin (e3) asks where she can park on her first day at the new office and how to get out of the building in a ⋯\n<span class=\"t-who\">[Router]<\/span> -&gt; hr: Elif Yilmaz (e5), Marketing specialist on the Marketing team, zone C, asks whether she can still work from home two days a week after  ⋯\n<span class=\"t-who\">[Router]<\/span> -&gt; hr: Question: New starter asking what to bring and where to go on their first day (7 December). Asker: Ben Okafor (e2), Sales coordinator, ⋯\n<span class=\"t-who\">[Router]<\/span> -&gt; facilities: Question: Femi Adeyemi asks whether there is somewhere safe to leave their bike at the new office. Who is asking: Femi Adeyemi ⋯<\/pre>\n\n\n:::\n\n\n## Agentic: the router calls the desks\n\n```bash\nuv run labs/wf03_routing.py --mode agentic\n```\n\nThe desks become **tools** of the router: `ask_it`, `ask_facilities`, `ask_hr`. It can ask more than one.\n\n**Commit:** Ben asks what to bring and where to go. One desk or two?\n\n::: reveal Answer\n**Two** in our run: HR for the first day, then Facilities for the building and the badge.\n:::\n\n## The agentic run: Ben's question\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf03_routing.py --mode agentic<\/span>\n<span class=\"t-dim\">⋯<\/span>\n══ e2: &#x27;I start on 7 December. What do I need to bring and where do I go?&#x27;\n<span class=\"rv s1\"><span class=\"t-who\">[Router]<\/span> get_employee({&#x27;employee_id&#x27;: &#x27;e2&#x27;})\n<span class=\"t-who\">[Router]<\/span> ask_hr({&#x27;brief&#x27;: &quot;Question from Ben Okafor (employee e2), a new starter joining as Sales coord<span class=\"t-dim\">…<\/span><\/span>\n<span class=\"rv s2\"><span class=\"t-who\">[HR Desk]<\/span> Question from Ben Okafor (employee e2), a new starter joining as Sales coordinator in the Sal<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[HR Desk]<\/span> search_kb({&#x27;query&#x27;: &#x27;first day onboarding documents to bring&#x27;})\n<span class=\"t-who\">[HR Desk]<\/span> read_article({&#x27;article_id&#x27;: &#x27;HR-02&#x27;})\n<span class=\"t-who\">[HR Desk]<\/span> search_kb({&#x27;query&#x27;: &#x27;right to work bank details payroll new starter&#x27;})\n<span class=\"t-who\">[HR Desk]<\/span> search_kb({&#x27;query&#x27;: &#x27;office move location zone reception address&#x27;})\n<span class=\"t-who\">[HR Desk]<\/span> read_article({&#x27;article_id&#x27;: &#x27;HR-01&#x27;})\n<span class=\"t-who\">[HR Desk]<\/span> read_article({&#x27;article_id&#x27;: &#x27;HR-04&#x27;})\n<span class=\"t-who\">[HR Desk]<\/span> <span class=\"t-bad\">handoff rejected:<\/span> sentence over 25 words: &quot;I don&#x27;t want to guess on these, so please check your welcome…&quot; (+1 more)<\/span>\n<span class=\"rv s3\"><span class=\"t-who\">[HR Desk]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span><\/span>\n<span class=\"rv s4\"><span class=\"t-who\">[Router]<\/span> ask_facilities({&#x27;brief&#x27;: &quot;Question from Ben Okafor (employee e2), a new starter joining as Sal<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Facilities Desk]<\/span> Question from Ben Okafor (employee e2), a new starter joining as Sales coordinator in<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Facilities Desk]<\/span> search_kb({&#x27;query&#x27;: &#x27;office move Station Road Riverside House reception&#x27;})\n<span class=\"t-who\">[Facilities Desk]<\/span> search_kb({&#x27;query&#x27;: &#x27;office move zone C relocation dates&#x27;})\n<span class=\"t-who\">[Facilities Desk]<\/span> read_article({&#x27;article_id&#x27;: &#x27;FAC-03&#x27;})\n<span class=\"t-who\">[Facilities Desk]<\/span> read_article({&#x27;article_id&#x27;: &#x27;FAC-01&#x27;})\n<span class=\"t-who\">[Facilities Desk]<\/span> search_kb({&#x27;query&#x27;: &#x27;zone C location floor&#x27;})\n<span class=\"t-who\">[Facilities Desk]<\/span> read_article({&#x27;article_id&#x27;: &#x27;FAC-05&#x27;})\n<span class=\"t-who\">[Facilities Desk]<\/span> search_kb({&#x27;query&#x27;: &#x27;Station Road site move&#x27;})\n<span class=\"t-who\">[Facilities Desk]<\/span> search_kb({&#x27;query&#x27;: &#x27;seating zones new building move date&#x27;})\n<span class=\"t-who\">[Facilities Desk]<\/span> read_article({&#x27;article_id&#x27;: &#x27;FAC-02&#x27;})\n<span class=\"t-who\">[Facilities Desk]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span>\n<span class=\"t-who\">[Router]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span><\/span><\/pre>\n\n::: reveal The router asks HR | .s1\n:::\n::: reveal HR's first answer is rejected by code | .s2\nA sentence over 25 words. The error goes back to the HR desk.\n:::\n::: reveal It fixes it; code accepts | .s3\n:::\n::: reveal Then the router asks Facilities too | .s4\n:::\n\n\n## Where else you see this\n\n**Ask:** Where at work does a request land in one inbox and get passed to the right team?\n\n\n<!-- Generated by recordings/build_slides.py from content-src/workflow-labs/wf03-routing.md. Edit the source. -->\n", "content/workflow-labs/wf04-orchestrator-worker.md": "# 04 Orchestrator–workers\n\n## Overview\n\n**Goal:** Let one agent plan the parts of a job at run time, give each part to a worker, and check the joined result in code.\n\n**Walk out with:** \"the plan is made at run time; that's the difference from parallelization\".\n\n\n## The problem\n\n> \"Create a report on LLM scaling laws.\" Every claim cited as `[paper-id]` from a paper in the library, and only from papers a worker actually read.\n\n```mermaid\nflowchart LR\n  T[topic] --> O[Orchestrator]\n  O -- plan --> W1[Worker]\n  O --> W2[Worker]\n  O --> W3[Worker]\n  W1 --> S[join + check citations]\n  W2 --> S\n  W3 --> S\n  classDef model fill:#fff1e7,stroke:#F47421,stroke-width:2px\n  classDef code fill:#eaf1f7,stroke:#134F7C,stroke-width:2px\n  class O,W1,W2,W3 model\n  class S code\n```\n\n**Ask:** In 02 we knew there would be three pieces. How many workers here?\n\n::: reveal Answer\n**Nobody knows until the orchestrator has seen the library.** It reads the paper list and decides the sections. Another library, another plan.\n:::\n\n## Run it\n\nIn `multi-agent-architecture-patterns/`:\n\n```bash\nuv run labs/wf04_orchestrator_worker.py\n```\n\n**Look for:** the plan: a list of section titles · `[Worker: …]` lines mixed together: they run at the same time · a report with `[paper-id]` citations and a reference list\n\n## The run: plan, then workers\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf04_orchestrator_worker.py --mode workflow<\/span>\n<span class=\"rv s1\"><span class=\"t-who\">[Orchestrator]<\/span> list_papers({})\n<span class=\"t-who\">[Orchestrator]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span>\n<span class=\"t-who\">[Orchestrator]<\/span> planned [&#x27;Foundations: Power-Law Scaling of Loss&#x27;, &#x27;Compute-Optimal Training and the Chinchilla Revision&#x27;, &#x27;Beyond Training Compute: Data Limits and Inference Costs&#x27;, &#x27;Emergent Abilities and the Predictability of Capabilities&#x27;]<\/span>\n<span class=\"rv s2\"><span class=\"t-who\">[Worker: Beyond Tr]<\/span> read_paper({&#x27;paper_id&#x27;: &#x27;muennighoff2023&#x27;})\n<span class=\"t-who\">[Worker: Emergent ]<\/span> read_paper({&#x27;paper_id&#x27;: &#x27;wei2022&#x27;})\n<span class=\"t-who\">[Worker: Foundatio]<\/span> read_paper({&#x27;paper_id&#x27;: &#x27;hestness2017&#x27;})\n<span class=\"t-who\">[Worker: Compute-O]<\/span> read_paper({&#x27;paper_id&#x27;: &#x27;hoffmann2022&#x27;})\n<span class=\"t-who\">[Worker: Beyond Tr]<\/span> read_paper({&#x27;paper_id&#x27;: &#x27;sardana2023&#x27;})\n<span class=\"t-who\">[Worker: Emergent ]<\/span> read_paper({&#x27;paper_id&#x27;: &#x27;schaeffer2023&#x27;})\n<span class=\"t-who\">[Worker: Foundatio]<\/span> read_paper({&#x27;paper_id&#x27;: &#x27;kaplan2020&#x27;})\n<span class=\"t-who\">[Worker: Compute-O]<\/span> read_paper({&#x27;paper_id&#x27;: &#x27;kaplan2020&#x27;})\n<span class=\"t-who\">[Worker: Beyond Tr]<\/span> read_paper({&#x27;paper_id&#x27;: &#x27;snell2024&#x27;})\n<span class=\"t-who\">[Worker: Emergent ]<\/span> read_paper({&#x27;paper_id&#x27;: &#x27;openai2023&#x27;})\n<span class=\"t-who\">[Worker: Foundatio]<\/span> read_paper({&#x27;paper_id&#x27;: &#x27;openai2023&#x27;})<\/span>\n<span class=\"rv s3\"><span class=\"t-who\">[Worker: Beyond Tr]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span>\n<span class=\"t-who\">[Worker: Compute-O]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span>\n<span class=\"t-who\">[Worker: Emergent ]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span>\n<span class=\"t-who\">[Worker: Foundatio]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span><\/span><\/pre>\n\n::: reveal The orchestrator lists the papers and plans | .s1\nFour sections, each with the papers its worker should read.\n:::\n::: reveal Four workers read, at the same time | .s2\nThe lines interleave: that's the thread pool.\n:::\n::: reveal Each hands in a section, checked in code | .s3\n:::\n\n\n## What came out\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf04_orchestrator_worker.py --mode workflow<\/span>\n<span class=\"t-dim\">⋯<\/span>\n&#35;# Emergent Abilities and the Predictability of Capabilities\n​\nScaling laws predict loss well, but whether downstream capabilities improve just as smoothly is disputed. Wei et al. call an ability emergent if it is absent in smaller models but present in larger ones [wei2022]. On thi ⋯\n​\nSchaeffer et al. argue that much of this apparent emergence comes from the choice of metric [schaeffer2023]. All-or-nothing metrics such as exact-match accuracy can turn smooth underlying improvement into a sudden jump.  ⋯\n<span class=\"t-dim\">⋯<\/span>\n<span class=\"rv s1\">&#35;# References\n- [hestness2017] Hestness et al. (2017). Deep Learning Scaling is Predictable, Empirically\n- [hoffmann2022] Hoffmann et al. (DeepMind) (2022). Training Compute-Optimal Large Language Models (Chinchilla)\n- [kaplan2020] Kaplan et al. (OpenAI) (2020). Scaling Laws for Neural Language Models\n- [muennighoff2023] Muennighoff et al. (2023). Scaling Data-Constrained Language Models\n- [openai2023] OpenAI (2023). GPT-4 Technical Report\n- [sardana2023] Sardana and Frankle (2023). Beyond Chinchilla-Optimal: Accounting for Inference in Language Model Scaling Laws\n- [schaeffer2023] Schaeffer, Miranda, Koyejo (2023). Are Emergent Abilities of Large Language Models a Mirage?\n- [snell2024] Snell et al. (2024). Scaling LLM Test-Time Compute Optimally can be More Effective than Scaling Model Parameters\n- [wei2022] Wei et al. (2022). Emergent Abilities of Large Language Models<\/span>\n<span class=\"rv s2\">\nAgent              calls  tokens in  tokens out  seconds\nOrchestrator           2      1,404         593        8\nWorker: Beyond Tr      4      3,711         685       10\nWorker: Emergent       4      3,744         705       10\nWorker: Foundatio      4      3,592         628       11\nWorker: Compute-O      3      2,327         614       10\nTotal                 17     14,778       3,225       48<\/span>\n<span class=\"t-ok\">exit 0<\/span><span class=\"t-dim\"> · 20 s<\/span><\/pre>\n\n::: reveal Only papers a worker read | .s1\n:::\n::: reveal What it cost | .s2\n:::\n\n\n## Agentic: the orchestrator runs the workers\n\n```bash\nuv run labs/wf04_orchestrator_worker.py --mode agentic\n```\n\nThe orchestrator gets an `assign_workers` tool. It sees the sections come back and writes the report itself.\n\n**Commit:** Will it plan the same four sections? Yes / no.\n\n::: reveal Answer\n**No.** Same library, different plan: it merged two sections and gave test-time compute one of its own. And it wrote an introduction and a conclusion.\n:::\n\n## The agentic run\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf04_orchestrator_worker.py --mode agentic<\/span>\n<span class=\"rv s1\"><span class=\"t-who\">[Orchestrator]<\/span> list_papers({})\n<span class=\"t-who\">[Orchestrator]<\/span> assign_workers({&#x27;sections&#x27;: [{&#x27;name&#x27;: &#x27;Foundations: Power-Law Scaling and Predictability<span class=\"t-dim\">…<\/span><\/span>\n<span class=\"rv s2\"><span class=\"t-who\">[Worker: Scaling T]<\/span> read_paper({&#x27;paper_id&#x27;: &#x27;snell2024&#x27;})\n<span class=\"t-who\">[Worker: Compute-O]<\/span> read_paper({&#x27;paper_id&#x27;: &#x27;hoffmann2022&#x27;})\n<span class=\"t-who\">[Worker: Foundatio]<\/span> read_paper({&#x27;paper_id&#x27;: &#x27;hestness2017&#x27;})\n<span class=\"t-who\">[Worker: Emergent ]<\/span> read_paper({&#x27;paper_id&#x27;: &#x27;wei2022&#x27;})\n<span class=\"t-who\">[Worker: Scaling T]<\/span> read_paper({&#x27;paper_id&#x27;: &#x27;sardana2023&#x27;})\n<span class=\"t-who\">[Worker: Compute-O]<\/span> read_paper({&#x27;paper_id&#x27;: &#x27;kaplan2020&#x27;})\n<span class=\"t-who\">[Worker: Foundatio]<\/span> read_paper({&#x27;paper_id&#x27;: &#x27;kaplan2020&#x27;})\n<span class=\"t-who\">[Worker: Emergent ]<\/span> read_paper({&#x27;paper_id&#x27;: &#x27;schaeffer2023&#x27;})\n<span class=\"t-who\">[Worker: Compute-O]<\/span> read_paper({&#x27;paper_id&#x27;: &#x27;muennighoff2023&#x27;})\n<span class=\"t-who\">[Worker: Foundatio]<\/span> read_paper({&#x27;paper_id&#x27;: &#x27;openai2023&#x27;})\n<span class=\"t-who\">[Worker: Emergent ]<\/span> read_paper({&#x27;paper_id&#x27;: &#x27;openai2023&#x27;})\n<span class=\"t-who\">[Worker: Compute-O]<\/span> read_paper({&#x27;paper_id&#x27;: &#x27;sardana2023&#x27;})\n<span class=\"t-who\">[Worker: Scaling T]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span>\n<span class=\"t-who\">[Worker: Foundatio]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span>\n<span class=\"t-who\">[Worker: Emergent ]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span>\n<span class=\"t-who\">[Worker: Compute-O]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span><\/span>\n<span class=\"rv s3\"><span class=\"t-who\">[Orchestrator]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span><\/span><\/pre>\n\n::: reveal It lists the papers and assigns workers | .s1\n:::\n::: reveal Four workers, in parallel | .s2\n:::\n::: reveal It writes the report around their sections | .s3\n:::\n\n## What the agentic run wrote\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf04_orchestrator_worker.py --mode agentic<\/span>\n<span class=\"t-dim\">⋯<\/span>\n<span class=\"rv s1\">&#35; LLM Scaling Laws: A Review\n&#35;# Introduction\n&#35;# Foundations: Power-Law Scaling and Predictability\n&#35;# Compute-Optimal Training, Data Constraints, and Inference Costs\n&#35;# Emergent Abilities and the Measurement Debate\n&#35;# Scaling Test-Time Compute\n&#35;# Conclusion\n&#35;# References<\/span>\n<span class=\"t-dim\">⋯<\/span>\n<span class=\"rv s2\">Agent              calls  tokens in  tokens out  seconds\nOrchestrator           3      5,880       3,602       30\nWorker: Scaling T      3      2,265         635        9\nWorker: Compute-O      5      5,711         778       12\nWorker: Foundatio      4      3,612         646       11\nWorker: Emergent       4      3,756         677       12\nTotal                 19     21,224       6,338       74<\/span>\n<span class=\"t-ok\">exit 0<\/span><span class=\"t-dim\"> · 44 s<\/span><\/pre>\n\n::: reveal The report's headings: it added an introduction and a conclusion | .s1\n:::\n::: reveal What it cost | .s2\n:::\n\n\n## Where else you see this\n\n**Ask:** Name a job where you only know the parts once you've looked at it.\n\n\n<!-- Generated by recordings/build_slides.py from content-src/workflow-labs/wf04-orchestrator-worker.md. Edit the source. -->\n", "content/workflow-labs/wf05-evaluator-optimizer.md": "# 05 Evaluator–optimizer\n\n## Overview\n\n**Goal:** Loop a writer and a reviewer until the reviewer approves, with a rubric the reviewer checks using tools.\n\n**Walk out with:** \"feedback names the rule that failed and how to fix it, and the loop has a limit\".\n\n\n## The problem\n\n> \"Write the staff notice for the first fire drill at Riverside House.\"\n\n**Rubric:** facts right · plain language · says what, when, where and what to do · an accessibility note · **at most 120 words**.\n\n```mermaid\nflowchart LR\n  T[task] --> W[Writer]\n  W --> R[Reviewer]\n  R -- approved --> D[done]\n  R -- \"needs changes + feedback\" --> W\n  classDef model fill:#fff1e7,stroke:#F47421,stroke-width:2px\n  class W,R model\n```\n\n**Ask:** Why give the reviewer `count_words` and `lookup_facts`? It's a model, it can read.\n\n::: reveal Answer\nModels count words badly and \"remember\" facts that aren't there. With tools, the reviewer's verdict is based on a real count and the real fact list, not its impression. The loop stops after 4 rounds whatever happens.\n:::\n\n## Run it\n\nIn `multi-agent-architecture-patterns/`:\n\n```bash\nuv run labs/wf05_evaluator_optimizer.py\n```\n\n**Look for:** `[Loop] round 1`, `round 2`, … · the reviewer's verdict after each round · the notice that was approved\n\n**Commit:** How many rounds until it's approved? Write a number.\n\n::: reveal Answer\n**2** in our run. The first draft was 132 words.\n:::\n\n## The run: two rounds\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf05_evaluator_optimizer.py --mode workflow<\/span>\n<span class=\"rv s1\"><span class=\"t-who\">[Loop]<\/span> round 1\n<span class=\"t-who\">[Writer]<\/span> lookup_facts({&#x27;topic&#x27;: &#x27;fire&#x27;})\n<span class=\"t-who\">[Writer]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span><\/span>\n<span class=\"rv s2\"><span class=\"t-who\">[Reviewer]<\/span> lookup_facts({&#x27;topic&#x27;: &#x27;fire&#x27;})\n<span class=\"t-who\">[Reviewer]<\/span> check_jargon({&#x27;text&#x27;: &quot;First fire drill at Riverside House\\n\\nOur first fire drill at Rivers<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Reviewer]<\/span> check_sentences({&#x27;text&#x27;: &quot;First fire drill at Riverside House\\n\\nOur first fire drill at Riv<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Reviewer]<\/span> count_words({&#x27;text&#x27;: &quot;First fire drill at Riverside House\\n\\nOur first fire drill at Riversi<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Reviewer]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span><\/span>\n<span class=\"rv s3\"><span class=\"t-who\">[Reviewer]<\/span> <span class=\"t-bad\">needs changes:<\/span> Rule 5 (Short) fails. The notice is 132 words and the limit is 120, so it needs to lose at least 12 words. All other rules pass. (1) Correct: every date, time and place matches the facts: drill on Wednesday 9 Decem ⋯<\/span>\n<span class=\"rv s4\"><span class=\"t-who\">[Loop]<\/span> round 2\n<span class=\"t-who\">[Writer]<\/span> lookup_facts({&#x27;topic&#x27;: &#x27;&#x27;})\n<span class=\"t-who\">[Writer]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span><\/span>\n<span class=\"rv s5\"><span class=\"t-who\">[Reviewer]<\/span> lookup_facts({&#x27;topic&#x27;: &#x27;fire&#x27;})\n<span class=\"t-who\">[Reviewer]<\/span> check_jargon({&#x27;text&#x27;: &quot;First fire drill at Riverside House\\n\\nThe drill is on Wednesday 9 De<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Reviewer]<\/span> check_sentences({&#x27;text&#x27;: &quot;First fire drill at Riverside House\\n\\nThe drill is on Wednesday 9<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Reviewer]<\/span> count_words({&#x27;text&#x27;: &quot;First fire drill at Riverside House\\n\\nThe drill is on Wednesday 9 Dec<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Reviewer]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span>\n<span class=\"t-who\">[Reviewer]<\/span> <span class=\"t-ok\">approved:<\/span> The notice passes all five rules. 1. Correct: every date, time and place matches the facts. The drill is on Wednesday 9 December 2026 at 10:30 and takes about 15 minutes (O22). Th ⋯<\/span><\/pre>\n\n::: reveal Round 1: the writer drafts from the facts | .s1\n:::\n::: reveal The reviewer checks, with tools | .s2\n:::\n::: reveal Verdict: needs changes | .s3\nThe rule, the number, the limit, and how much to cut.\n:::\n::: reveal Round 2: the writer fixes it | .s4\n:::\n::: reveal The reviewer checks again | .s5\n:::\n\n\n## What came out\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf05_evaluator_optimizer.py --mode workflow<\/span>\n<span class=\"t-dim\">⋯<\/span>\nFirst fire drill at Riverside House\n​\nThe drill is on Wednesday 9 December 2026 at 10:30. It will take about 15 minutes.\n​\nDuring the drill:\n- Leave by the nearest stairs. Do not use the lift.\n- Do not stop to collect your belongings.\n- Follow the fire wardens: two per floor, in yellow vests.\n- Go to the assembly point: the car park on the Canal Street side, marked &#x27;Assembly point B&#x27;.\n​\nIf you may need help to leave the building in an emergency, please ask facilities (facilities@example.com) for a personal evacuation plan before Monday 7 December. Evacuation chairs are kept at every stairwell, and trained fire wardens will help anyone with a personal evacuation plan.\n<span class=\"rv s1\">\nAgent              calls  tokens in  tokens out  seconds\nWriter                 4      4,558       1,335       15\nReviewer              10     16,499       3,448       42\nTotal                 14     21,057       4,783       58<\/span>\n<span class=\"t-ok\">exit 0<\/span><span class=\"t-dim\"> · 59 s<\/span><\/pre>\n\n::: reveal What it cost | .s1\n:::\n\n## Agentic: the writer owns the loop\n\n```bash\nuv run labs/wf05_evaluator_optimizer.py --mode agentic\n```\n\nThe reviewer becomes a **tool** of the writer: `review_notice`. The writer decides when to ask for a review and when it's done.\n\n**Ask:** The writer can stop whenever it likes. What stops it handing in a notice the reviewer never approved?\n\n::: reveal Answer\n**Code.** After the writer says it's done, code checks that the notice it hands in is one the reviewer actually approved. Trust, but verify.\n:::\n\n## The agentic run\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf05_evaluator_optimizer.py --mode agentic<\/span>\n<span class=\"rv s1\"><span class=\"t-who\">[Writer]<\/span> lookup_facts({&#x27;topic&#x27;: &#x27;fire&#x27;})\n<span class=\"t-who\">[Writer]<\/span> review_notice({&#x27;notice&#x27;: &quot;First fire drill at Riverside House\\n\\nOur first fire drill at River<span class=\"t-dim\">…<\/span><\/span>\n<span class=\"rv s2\"><span class=\"t-who\">[Reviewer]<\/span> lookup_facts({&#x27;topic&#x27;: &#x27;fire&#x27;})\n<span class=\"t-who\">[Reviewer]<\/span> check_jargon({&#x27;text&#x27;: &quot;First fire drill at Riverside House\\n\\nOur first fire drill at Rivers<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Reviewer]<\/span> check_sentences({&#x27;text&#x27;: &quot;First fire drill at Riverside House\\n\\nOur first fire drill at Riv<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Reviewer]<\/span> count_words({&#x27;text&#x27;: &quot;First fire drill at Riverside House\\n\\nOur first fire drill at Riversi<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Reviewer]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span>\n<span class=\"t-who\">[Reviewer]<\/span> <span class=\"t-bad\">needs changes:<\/span> Rule 5 (Short) failed. The notice is 130 words, and the limit is 120, so cut at least 10 words. All other rules pass. Correct: every date, time and place matches facts O21 to O26. Complete: it says what, when, wher ⋯<\/span>\n<span class=\"rv s3\"><span class=\"t-who\">[Writer]<\/span> review_notice({&#x27;notice&#x27;: &quot;First fire drill at Riverside House\\n\\nThe drill is on Wednesday 9 D<span class=\"t-dim\">…<\/span><\/span>\n<span class=\"rv s4\"><span class=\"t-who\">[Reviewer]<\/span> lookup_facts({&#x27;topic&#x27;: &#x27;fire&#x27;})\n<span class=\"t-who\">[Reviewer]<\/span> check_jargon({&#x27;text&#x27;: &quot;First fire drill at Riverside House\\n\\nThe drill is on Wednesday 9 De<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Reviewer]<\/span> check_sentences({&#x27;text&#x27;: &quot;First fire drill at Riverside House\\n\\nThe drill is on Wednesday 9<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Reviewer]<\/span> count_words({&#x27;text&#x27;: &quot;First fire drill at Riverside House\\n\\nThe drill is on Wednesday 9 Dec<span class=\"t-dim\">…<\/span>\n<span class=\"t-who\">[Reviewer]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span>\n<span class=\"t-who\">[Reviewer]<\/span> <span class=\"t-ok\">approved:<\/span> The notice meets all five rules. 1. Correct: the date, time, length, route, warden details, assembly point, personal evacuation plan deadline and evacuation chairs all match facts ⋯\n<span class=\"t-who\">[Writer]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span><\/span>\n<span class=\"t-dim\">⋯<\/span>\nAgent              calls  tokens in  tokens out  seconds\nWriter                 4      4,645       1,667       19\nReviewer              10     16,444       3,011       34\nTotal                 14     21,089       4,678       53\n<span class=\"t-ok\">exit 0<\/span><span class=\"t-dim\"> · 54 s<\/span><\/pre>\n\n::: reveal The writer drafts and asks for a review | .s1\n:::\n::: reveal The reviewer, as a tool: needs changes | .s2\n:::\n::: reveal The writer fixes it and asks again | .s3\n:::\n::: reveal Approved, and the writer hands in | .s4\n:::\n\n\n## Where else you see this\n\n**Ask:** Where at work does something go back and forth until someone says \"OK\"?\n\n\n<!-- Generated by recordings/build_slides.py from content-src/workflow-labs/wf05-evaluator-optimizer.md. Edit the source. -->\n", "content/workflow-labs/wf06-agent.md": "# 06 Agent\n\n## Overview\n\n**Goal:** See an agent decide every next step itself, from tool results it can't predict, and check its answer in code.\n\n**Walk out with:** \"an agent is a model in a loop with tools; code still checks the answer\".\n\n\n## The problem\n\n> \"Our cat café in Bergen is ordering 3 bags of salmon kibble and 2 scratching posts, with discount code WHISKERS10. What do we pay in total, in EUR?\"\n\n**Tools:** `get_rules`, `get_price`, `get_discount`, `get_shipping`, `get_tax_rate`, `exchange_rate`, and `add`, `subtract`, `multiply`, `divide`.\n\n**Commit:** How many tool calls will it need? Write a number.\n\n::: reveal Answer\n**16** in our run. Nobody wrote that path down: the agent read the rules, collected every number, then did the sums one at a time.\n:::\n\n## Run it\n\nIn `multi-agent-architecture-patterns/`:\n\n```bash\nuv run labs/wf06_agent.py\n```\n\n**Look for:** a two-step warm-up · the café order, one line per tool call · the agent's total next to the one code works out itself\n\n## The run: warm-up, then the look-ups\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf06_agent.py<\/span>\n<span class=\"rv s1\"><span class=\"t-who\">[Calculator]<\/span> add({&#x27;a&#x27;: 3, &#x27;b&#x27;: 4})\n<span class=\"t-who\">[Calculator]<\/span> multiply({&#x27;a&#x27;: 7, &#x27;b&#x27;: 4})\n<span class=\"t-who\">[Calculator]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span>\n​\nWarm-up answer: 28.0  (tool results along the way: [7, 28])<\/span>\n<span class=\"rv s2\"><span class=\"t-who\">[Café Agent]<\/span> get_rules({})<\/span>\n<span class=\"rv s3\"><span class=\"t-who\">[Café Agent]<\/span> get_price({&#x27;item&#x27;: &#x27;salmon kibble&#x27;})\n<span class=\"t-who\">[Café Agent]<\/span> get_price({&#x27;item&#x27;: &#x27;scratching post&#x27;})\n<span class=\"t-who\">[Café Agent]<\/span> get_discount({&#x27;code&#x27;: &#x27;WHISKERS10&#x27;})\n<span class=\"t-who\">[Café Agent]<\/span> get_shipping({&#x27;city&#x27;: &#x27;Bergen&#x27;})\n<span class=\"t-who\">[Café Agent]<\/span> get_tax_rate({&#x27;city&#x27;: &#x27;Bergen&#x27;})\n<span class=\"t-who\">[Café Agent]<\/span> exchange_rate({&#x27;currency&#x27;: &#x27;EUR&#x27;})<\/span><\/pre>\n\n::: reveal Warm-up: \"Add 3 and 4, then multiply by 4\" | .s1\n:::\n::: reveal First it reads the rules | .s2\n:::\n::: reveal Then it collects every number | .s3\nPrices, discount, shipping, tax, rate: six look-ups before any sum.\n:::\n\n## The run: the sums, and the check\n\n<pre class=\"term\"><span class=\"t-cmd\">uv run labs/wf06_agent.py<\/span>\n<span class=\"t-dim\">⋯<\/span>\n<span class=\"rv s1\"><span class=\"t-who\">[Café Agent]<\/span> multiply({&#x27;a&#x27;: 389, &#x27;b&#x27;: 3})\n<span class=\"t-who\">[Café Agent]<\/span> multiply({&#x27;a&#x27;: 549, &#x27;b&#x27;: 2})\n<span class=\"t-who\">[Café Agent]<\/span> add({&#x27;a&#x27;: 1167, &#x27;b&#x27;: 1098})\n<span class=\"t-who\">[Café Agent]<\/span> multiply({&#x27;a&#x27;: 2265, &#x27;b&#x27;: 0.1})\n<span class=\"t-who\">[Café Agent]<\/span> subtract({&#x27;a&#x27;: 2265, &#x27;b&#x27;: 226.5})\n<span class=\"t-who\">[Café Agent]<\/span> add({&#x27;a&#x27;: 2038.5, &#x27;b&#x27;: 149})\n<span class=\"t-who\">[Café Agent]<\/span> multiply({&#x27;a&#x27;: 2187.5, &#x27;b&#x27;: 0.25})\n<span class=\"t-who\">[Café Agent]<\/span> add({&#x27;a&#x27;: 2187.5, &#x27;b&#x27;: 546.875})\n<span class=\"t-who\">[Café Agent]<\/span> multiply({&#x27;a&#x27;: 2734.375, &#x27;b&#x27;: 0.085})\n<span class=\"t-who\">[Café Agent]<\/span> <span class=\"t-ok\">done (handoff validated)<\/span><\/span>\n<span class=\"rv s2\">\nCafé order total: 232.42 EUR  (code&#x27;s own total: 232.42)<\/span>\n<span class=\"rv s3\">\nAgent              calls  tokens in  tokens out  seconds\nCalculator             3      1,031          70        4\nCafé Agent            17     18,854         774       24\nTotal                 20     19,885         844       29<\/span>\n<span class=\"t-ok\">exit 0<\/span><span class=\"t-dim\"> · 30 s<\/span><\/pre>\n\n::: reveal The sums, one tool call each | .s1\n389 × 3 + 549 × 2 = 2265 · −10% → 2038.5 · +149 shipping → 2187.5 · +25% tax → 2734.375 · × 0.085 → EUR\n:::\n::: reveal Code checks the total | .s2\n:::\n::: reveal What it cost | .s3\n:::\n\n\n## Where else you see this\n\n**Ask:** Which of the seven would you build first for your own team, and why that one?\n\n::: reveal The test\nUse an **agent** when you can't write the steps down in advance. When you can, use the workflow: cheaper, repeatable, easier to debug.\n:::\n\n\n> Start with the simplest thing that works. Add a step, an agent or a loop only when the run shows you need it.\n\n<!-- Generated by recordings/build_slides.py from content-src/workflow-labs/wf06-agent.md. Edit the source. -->\n"}, "css": ["viewer/flows/architectures.css", "viewer/flows/frameworks-and-close.css", "viewer/flows/need-more-agents.css", "viewer/flows/production.css", "viewer/flows/talk-and-state.css", "viewer/flows/the-brief.css", "viewer/flows/why-they-fail.css", "viewer/flows/workflow-labs.css", "viewer/flows/workflow-patterns.css", "viewer/student.css", "viewer/theme.css"]};</script>
