<script>window.DECK = {"flow": [{"title": "What survives the summary", "file": "content/talk-and-state/what-survives.md"}, {"title": "Tools vs agents: MCP", "file": "content/talk-and-state/mcp.md"}, {"title": "When two agents disagree", "file": "content/talk-and-state/disagree.md"}], "files": {"content/talk-and-state/what-survives.md": "# What survives the summary\n\n## Overview\n\n**Goal:** Tell passing messages (the orchestrator sees only summaries) from a shared scratchpad (workers write full findings, pass back a reference), and say what each one loses.\n\n**Walk out with:** the rule \"the output format decides what survives\", and one file per worker.\n\n\n## The mail worker's summary\n\n> Friday, 2026-10-09. The mail worker read Marek's mail of 2026-10-07 and sends the orchestrator one line: **\"B: 0.85 EUR/GB/day.\"**\n\n**Ask:** The orchestrator only ever sees that line. Write down what the Friday report **can't** say now.\n\n<div class=\"diagram\" id=\"f5-tel\"><svg style=\"max-height:34vh\" viewBox=\"0 0 1000 300\" role=\"img\" aria-label=\"Marek's mail with five facts, the mail worker, a one-line summary, and the orchestrator that only sees the summary\">\n  <defs><marker id=\"f5-tel-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--muted)\"/><\/marker><\/defs>\n  <rect x=\"10\" y=\"20\" width=\"330\" height=\"260\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n  <text x=\"26\" y=\"48\" style=\"font-size:15px;font-weight:700;fill:var(--navy)\">Marek (vendor B), 2026-10-07<\/text>\n  <text x=\"26\" y=\"84\" style=\"font-size:15px;fill:var(--ink)\">0.85 EUR per GB per day<\/text>\n  <text x=\"26\" y=\"118\" style=\"font-size:15px;fill:var(--ink)\">200 GB per day = 170 EUR per day<\/text>\n  <text x=\"26\" y=\"152\" style=\"font-size:15px;fill:var(--ink)\">volume discount from 300 GB/day<\/text>\n  <text x=\"26\" y=\"186\" style=\"font-size:15px;fill:var(--ink)\">offer valid until 2026-12-31<\/text>\n  <text x=\"26\" y=\"220\" style=\"font-size:13px;fill:var(--muted)\">(Lee: ~180 GB per day today)<\/text>\n  <line x1=\"340\" y1=\"150\" x2=\"398\" y2=\"150\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#f5-tel-a)\"/>\n  <rect x=\"402\" y=\"110\" width=\"150\" height=\"80\" rx=\"12\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n  <text x=\"477\" y=\"146\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:var(--ink)\">mail worker<\/text>\n  <text x=\"477\" y=\"168\" text-anchor=\"middle\" style=\"font-size:12px;fill:var(--muted)\">summarises<\/text>\n  <line x1=\"552\" y1=\"150\" x2=\"610\" y2=\"150\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#f5-tel-a)\"/>\n  <rect x=\"614\" y=\"124\" width=\"190\" height=\"52\" rx=\"8\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n  <text x=\"709\" y=\"156\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:14px;fill:var(--ink)\">B: 0.85 EUR/GB/day<\/text>\n  <line x1=\"804\" y1=\"150\" x2=\"842\" y2=\"150\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#f5-tel-a)\"/>\n  <rect x=\"846\" y=\"110\" width=\"144\" height=\"80\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:3\"/>\n  <text x=\"918\" y=\"146\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:var(--ink)\">orchestrator<\/text>\n  <text x=\"918\" y=\"168\" text-anchor=\"middle\" style=\"font-size:12px;fill:var(--muted)\">sees only this<\/text>\n<\/svg><\/div>\n\n\n## What got dropped\n\n<div class=\"diagram\" id=\"f5-drop\"><svg viewBox=\"0 0 1000 250\" role=\"img\" aria-label=\"The five facts of Marek's mail, three of them struck out on the way to the orchestrator\">\n  <rect x=\"10\" y=\"10\" width=\"980\" height=\"230\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n  <text x=\"30\" y=\"44\" style=\"font-size:15px;font-weight:700;fill:var(--navy)\">Marek's mail → the orchestrator<\/text>\n  <text x=\"30\" y=\"84\" style=\"font-size:17px;fill:var(--good)\">✓ 0.85 EUR per GB per day<\/text>\n  <text x=\"30\" y=\"118\" style=\"font-size:17px;fill:var(--muted)\">· 170 EUR per day at 200 GB (can be recomputed)<\/text>\n  <g class=\"rv d1\"><text x=\"30\" y=\"152\" style=\"font-size:17px;fill:var(--bad)\">✗ offer valid until 2026-12-31<\/text><text x=\"520\" y=\"152\" style=\"font-size:14px;fill:var(--muted)\">→ no deadline in the report<\/text><\/g>\n  <g class=\"rv d2\"><text x=\"30\" y=\"186\" style=\"font-size:17px;fill:var(--bad)\">✗ volume discount from 300 GB per day<\/text><text x=\"520\" y=\"186\" style=\"font-size:14px;fill:var(--muted)\">→ we're at ~180 GB: no discount, unsaid<\/text><\/g>\n  <g class=\"rv d3\"><text x=\"30\" y=\"220\" style=\"font-size:17px;font-weight:700;fill:var(--orange)\">The output format decides what survives.<\/text><\/g>\n<\/svg><\/div>\n\n::: reveal Dropped: the deadline | #f5-drop .d1\n:::\n::: reveal Dropped: the discount | #f5-drop .d2\n:::\n::: reveal The rule | #f5-drop .d3\nAsk for it in the brief: \"each bullet: date, sender, fact; then **Open questions:**\" (flow 4).\n:::\n\n\n## Write it down, pass a pointer\n\n**Ask:** The orchestrator needs a short summary *and* the detail when it matters. Where can the detail live?\n\n<div class=\"diagram\" id=\"f5-pad\"><svg viewBox=\"0 0 1000 320\" role=\"img\" aria-label=\"Four workers write their own files in a poc-status folder and return a short summary plus the file name to the orchestrator\">\n  <defs><marker id=\"f5-pad-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--muted)\"/><\/marker><marker id=\"f5-pad-o\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--orange)\"/><\/marker><\/defs>\n  <rect x=\"400\" y=\"10\" width=\"200\" height=\"60\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:3\"/>\n  <text x=\"500\" y=\"46\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--ink)\">orchestrator<\/text>\n  <rect x=\"20\" y=\"130\" width=\"200\" height=\"50\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n  <text x=\"120\" y=\"161\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">minutes worker<\/text>\n  <rect x=\"270\" y=\"130\" width=\"200\" height=\"50\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n  <text x=\"370\" y=\"161\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">mail worker<\/text>\n  <rect x=\"530\" y=\"130\" width=\"200\" height=\"50\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n  <text x=\"630\" y=\"161\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">Jira worker<\/text>\n  <rect x=\"780\" y=\"130\" width=\"200\" height=\"50\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n  <text x=\"880\" y=\"161\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">SD-LOG-01 worker<\/text>\n  <g class=\"rv p1\">\n    <rect x=\"20\" y=\"230\" width=\"960\" height=\"80\" rx=\"10\" style=\"fill:var(--good-tint);stroke:var(--good);stroke-width:2\"/>\n    <text x=\"40\" y=\"256\" style=\"font-size:14px;font-weight:700;fill:var(--good)\">poc-status/<\/text>\n    <text x=\"120\" y=\"290\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:13px;fill:var(--ink)\">minutes.md<\/text>\n    <text x=\"370\" y=\"290\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:13px;fill:var(--ink)\">mail.md<\/text>\n    <text x=\"630\" y=\"290\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:13px;fill:var(--ink)\">jira.md<\/text>\n    <text x=\"880\" y=\"290\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:13px;fill:var(--ink)\">sd-log-01.md<\/text>\n    <line x1=\"120\" y1=\"180\" x2=\"120\" y2=\"272\" style=\"stroke:var(--good);stroke-width:2\" marker-end=\"url(#f5-pad-a)\"/>\n    <line x1=\"370\" y1=\"180\" x2=\"370\" y2=\"272\" style=\"stroke:var(--good);stroke-width:2\" marker-end=\"url(#f5-pad-a)\"/>\n    <line x1=\"630\" y1=\"180\" x2=\"630\" y2=\"272\" style=\"stroke:var(--good);stroke-width:2\" marker-end=\"url(#f5-pad-a)\"/>\n    <line x1=\"880\" y1=\"180\" x2=\"880\" y2=\"272\" style=\"stroke:var(--good);stroke-width:2\" marker-end=\"url(#f5-pad-a)\"/>\n  <\/g>\n  <g class=\"rv p2\">\n    <line x1=\"370\" y1=\"130\" x2=\"470\" y2=\"72\" style=\"stroke:var(--orange);stroke-width:2;stroke-dasharray:6 4\" marker-end=\"url(#f5-pad-o)\"/>\n    <rect x=\"200\" y=\"82\" width=\"230\" height=\"30\" rx=\"6\" style=\"fill:var(--card);stroke:var(--orange)\"/>\n    <text x=\"315\" y=\"102\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">\"B: 0.85/GB/day · see mail.md\"<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal Full findings go to a file | #f5-pad .p1\n:::\n::: reveal Back: a short summary + a pointer | #f5-pad .p2\nThe orchestrator's context stays small. When it writes the price paragraph, it opens `mail.md` and finds the deadline.\n:::\n\n\n## Who writes where\n\n**Ask:** The mail worker and the Jira worker both found vendor B's price. Both write to `poc-status/status.md`. What happens? Hands up when you see it.\n\n::: reveal Answer\n**The last one to write wins.** The other worker's finding is gone, or the two are interleaved line by line.\n\n**Rule:** one file per worker, one merger that reads them all. Nobody writes another worker's file.\n:::\n\n", "content/talk-and-state/mcp.md": "# Tools vs agents: MCP\n\n## Overview\n\n**Goal:** Tell an agent reaching a system (MCP, tools) from agents talking to each other (a function call inside one program, or an agent-to-agent protocol across programs).\n\n**Walk out with:** \"MCP is the tool layer. A sub-agent is usually just a function call.\"\n\n\n## Two kinds of line\n\n**Ask:** In this picture, which lines are MCP? Point at them.\n\n<div class=\"diagram\" id=\"f5-mcp\"><svg viewBox=\"0 0 1000 340\" role=\"img\" aria-label=\"The orchestrator calls the Jira worker and the mail worker as functions; both workers reach systems through MCP servers for Jira and mail; a dashed line to an agent in another program is labelled agent-to-agent protocol\">\n  <defs><marker id=\"f5-mcp-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--muted)\"/><\/marker><marker id=\"f5-mcp-o\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--orange)\"/><\/marker><marker id=\"f5-mcp-g\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--good)\"/><\/marker><\/defs>\n  <rect x=\"20\" y=\"10\" width=\"620\" height=\"180\" rx=\"12\" style=\"fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:8 6\"/>\n  <text x=\"36\" y=\"34\" style=\"font-size:13px;fill:var(--muted)\">one program: Sam's Friday status<\/text>\n  <rect x=\"230\" y=\"44\" width=\"200\" height=\"54\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:3\"/>\n  <text x=\"330\" y=\"77\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:var(--ink)\">orchestrator<\/text>\n  <rect x=\"60\" y=\"130\" width=\"180\" height=\"48\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n  <text x=\"150\" y=\"160\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">Jira worker<\/text>\n  <rect x=\"420\" y=\"130\" width=\"180\" height=\"48\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n  <text x=\"510\" y=\"160\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">mail worker<\/text>\n  <line x1=\"290\" y1=\"98\" x2=\"180\" y2=\"128\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#f5-mcp-a)\"/>\n  <line x1=\"370\" y1=\"98\" x2=\"480\" y2=\"128\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#f5-mcp-a)\"/>\n  <rect x=\"60\" y=\"270\" width=\"180\" height=\"54\" rx=\"8\" style=\"fill:var(--card);stroke:var(--ink);stroke-width:2\"/>\n  <text x=\"150\" y=\"302\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">Jira<\/text>\n  <rect x=\"420\" y=\"270\" width=\"180\" height=\"54\" rx=\"8\" style=\"fill:var(--card);stroke:var(--ink);stroke-width:2\"/>\n  <text x=\"510\" y=\"302\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">Mailbox (POC)<\/text>\n  <line x1=\"150\" y1=\"178\" x2=\"150\" y2=\"266\" style=\"stroke:var(--good);stroke-width:3\" marker-end=\"url(#f5-mcp-g)\"/>\n  <line x1=\"510\" y1=\"178\" x2=\"510\" y2=\"266\" style=\"stroke:var(--good);stroke-width:3\" marker-end=\"url(#f5-mcp-g)\"/>\n  <rect x=\"740\" y=\"44\" width=\"230\" height=\"54\" rx=\"12\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n  <text x=\"855\" y=\"70\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">an agent in<\/text>\n  <text x=\"855\" y=\"89\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">another program<\/text>\n  <line x1=\"430\" y1=\"66\" x2=\"736\" y2=\"66\" style=\"stroke:var(--orange);stroke-width:2;stroke-dasharray:8 5\" marker-end=\"url(#f5-mcp-o)\"/>\n  <g class=\"rv m1\">\n    <rect x=\"70\" y=\"208\" width=\"160\" height=\"30\" rx=\"6\" style=\"fill:var(--good-tint);stroke:var(--good)\"/>\n    <text x=\"150\" y=\"228\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:700;fill:var(--good)\">MCP: jira_search<\/text>\n    <rect x=\"430\" y=\"208\" width=\"160\" height=\"30\" rx=\"6\" style=\"fill:var(--good-tint);stroke:var(--good)\"/>\n    <text x=\"510\" y=\"228\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:700;fill:var(--good)\">MCP: mail_search<\/text>\n    <text x=\"760\" y=\"226\" style=\"font-size:15px;fill:var(--good)\">agent → system<\/text>\n  <\/g>\n  <g class=\"rv m2\">\n    <rect x=\"215\" y=\"102\" width=\"230\" height=\"22\" rx=\"4\" style=\"fill:var(--card)\"/>\n    <text x=\"330\" y=\"118\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:13px;fill:var(--muted)\">a function call<\/text>\n    <text x=\"760\" y=\"256\" style=\"font-size:15px;fill:var(--muted)\">agent → agent, same program<\/text>\n  <\/g>\n  <g class=\"rv m3\">\n    <text x=\"583\" y=\"58\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:700;fill:var(--orange)\">agent-to-agent (e.g. A2A)<\/text>\n    <text x=\"760\" y=\"286\" style=\"font-size:15px;fill:var(--orange)\">agent → agent, across programs<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal The green lines are MCP | #f5-mcp .m1\n:::\n::: reveal Orchestrator → worker: a function call | #f5-mcp .m2\n:::\n::: reveal Across programs: an agent-to-agent protocol | #f5-mcp .m3\n**MCP is how an agent reaches a system.** It is not how agents talk to each other.\n:::\n\n\n\n## One tool, two agents\n\n**Ask:** The Jira worker and the on-call supervisor both need `jira_search`. Write it twice, or once? What do you gain?\n\n::: reveal Answer\n**Once, behind one Jira MCP server.** Both agents call the same tool.\n\n- **Access rights in one place:** the server decides which projects (POC only) and whether it may write (no).\n- **One fix for everyone:** change the tool description once, and every agent picks it up.\n:::\n\n", "content/talk-and-state/disagree.md": "# When two agents disagree\n\n## Overview\n\n**Goal:** Decide between two workers that report different facts, using rules written down beforehand rather than whatever the merger picks.\n\n**Walk out with:** the four merge rules, in order.\n\n\n## POC-12: Done or Open?\n\n> Friday's merger gets two answers about the same Jira issue.\n\n<div class=\"diagram\" id=\"f5-dis\"><svg style=\"max-height:30vh\" viewBox=\"0 0 1000 290\" role=\"img\" aria-label=\"The Jira worker, using the live API, says POC-12 Done on 2026-10-07; the search worker, using the index from 2026-10-06, says POC-12 Open; both arrive at the merger\">\n  <defs><marker id=\"f5-dis-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--muted)\"/><\/marker><\/defs>\n  <rect x=\"20\" y=\"20\" width=\"300\" height=\"100\" rx=\"12\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n  <text x=\"170\" y=\"52\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:var(--ink)\">Jira worker<\/text>\n  <text x=\"170\" y=\"76\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--muted)\">jira_search, live API<\/text>\n  <rect x=\"20\" y=\"170\" width=\"300\" height=\"100\" rx=\"12\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n  <text x=\"170\" y=\"202\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:var(--ink)\">search worker<\/text>\n  <text x=\"170\" y=\"226\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--muted)\">search_docs, index<\/text>\n  <rect x=\"360\" y=\"45\" width=\"300\" height=\"50\" rx=\"8\" style=\"fill:var(--good-tint);stroke:var(--good);stroke-width:2\"/>\n  <text x=\"510\" y=\"76\" text-anchor=\"middle\" style=\"font-size:16px;fill:var(--ink)\">POC-12 <tspan style=\"font-weight:700;fill:var(--good)\">Done<\/tspan><\/text>\n  <rect x=\"360\" y=\"195\" width=\"300\" height=\"50\" rx=\"8\" style=\"fill:var(--bad-tint);stroke:var(--bad);stroke-width:2\"/>\n  <text x=\"510\" y=\"226\" text-anchor=\"middle\" style=\"font-size:16px;fill:var(--ink)\">POC-12 <tspan style=\"font-weight:700;fill:var(--bad)\">Open<\/tspan><\/text>\n  <line x1=\"320\" y1=\"70\" x2=\"356\" y2=\"70\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#f5-dis-a)\"/>\n  <line x1=\"320\" y1=\"220\" x2=\"356\" y2=\"220\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#f5-dis-a)\"/>\n  <rect x=\"780\" y=\"110\" width=\"200\" height=\"70\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:3\"/>\n  <text x=\"880\" y=\"152\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--ink)\">merger<\/text>\n  <line x1=\"660\" y1=\"70\" x2=\"776\" y2=\"130\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#f5-dis-a)\"/>\n  <line x1=\"660\" y1=\"220\" x2=\"776\" y2=\"162\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#f5-dis-a)\"/>\n  <g class=\"rv t1\">\n    <text x=\"510\" y=\"114\" text-anchor=\"middle\" style=\"font-size:14px;font-weight:700;fill:var(--good)\">as of 2026-10-07 10:41<\/text>\n    <text x=\"510\" y=\"264\" text-anchor=\"middle\" style=\"font-size:14px;font-weight:700;fill:var(--bad)\">snapshot of 2026-10-06<\/text>\n  <\/g>\n<\/svg><\/div>\n\n**Commit:** Which one goes into the report? Write it down with one reason. Hands up: Done / Open / \"it depends\".\n\n::: reveal Look at the dates | #f5-dis .t1\n**Done.** The index is from the 6th; Marek's price and the close came on the 7th.\n:::\n\n\n## The merge rules\n\n**Ask:** Write the rule the merger should have followed, so that it works next Friday too, on a different issue.\n\n| # | Rule | POC-12 |\n|---|---|---|\n| 1 | <span class=\"rv r1\">A fresher timestamp beats an older one<\/span> | <span class=\"rv r1\">10-07 beats 10-06<\/span> |\n| 2 | <span class=\"rv r2\">A live source beats an index<\/span> | <span class=\"rv r2\">the Jira API beats the search index<\/span> |\n| 3 | <span class=\"rv r3\">A primary source beats a summary<\/span> | <span class=\"rv r3\">Marek's mail beats a worker's line<\/span> |\n| 4 | <span class=\"rv r4\">Still in conflict? Say so in the report and ask a human<\/span> | <span class=\"rv r4\">\"POC-12: sources disagree, Sam to confirm\"<\/span> |\n\n::: reveal Rule 1 | .r1\n:::\n::: reveal Rule 2 | .r2\n:::\n::: reveal Rule 3 | .r3\n:::\n::: reveal Rule 4 | .r4\n**Rules are applied in order.** Rule 4 is not a failure. A report that says \"I don't know\" beats a confident wrong one.\n:::\n\n\n## A judge agent?\n\n**Ask:** Could a third agent, a judge, decide instead of rules?\n\n::: reveal Answer\n**Yes, but it applies the rules. It doesn't invent them.** Give the judge the four rules in its prompt and both findings with their timestamps and sources. It returns the winner *and* which rule decided.\n\n**The rules are written by people.**\n:::\n\n"}, "css": ["viewer/flows/architectures.css", "viewer/flows/frameworks-and-close.css", "viewer/flows/need-more-agents.css", "viewer/flows/production.css", "viewer/flows/talk-and-state.css", "viewer/flows/the-brief.css", "viewer/flows/why-they-fail.css", "viewer/flows/workflow-labs.css", "viewer/flows/workflow-patterns.css", "viewer/student.css", "viewer/theme.css"]};</script>
