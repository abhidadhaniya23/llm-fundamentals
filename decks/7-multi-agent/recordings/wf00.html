<script>document.getElementById('md').innerHTML = marked.parse("# 00 Augmented LLM\n\n\nRecorded 2026-11-04 00:49 on macOS, model `anthropic` (claude-opus-5-5), labs at 1616e30. The model's wording changes run to run; the steps and checks don't.\n\n## 1. uv run labs/wf00_augmented_llm.py\n\nIn `multi-agent-architecture-patterns/`:\n\n```\nuv run labs/wf00_augmented_llm.py\n```\n\nLook for: First a one-shot answer from what the model knows, then a research agent that reads sources.\n\nExit code 0, 25.1 s.\n\n```text\n── Part 1: augmented LLM, one call each ──\nsearch_query:  coronary artery calcium CT score relationship with high cholesterol LDL statin decisions\njustification: The user wants to know how a coronary artery calcium (CAC) score relates to high cholesterol. This query should find sources explaining how cholesterol contributes to calcified plaque, how CAC scores refine cardiovascular risk for people with high LDL, and how CAC results guide statin treatment.\n[Tool LLM] asked for multiply({'a': 2, 'b': 3})\nmultiply result: 6\n\n── Part 2: research agent ──\n[Research Agent] web_search({'query': 'coronary artery calcium score and high cholesterol relationship'})\n[Research Agent] read_result({'result_id': 'W01'})\n[Research Agent] read_result({'result_id': 'W02'})\n[Research Agent] read_result({'result_id': 'W04'})\n[Research Agent] read_result({'result_id': 'W11'})\n[Research Agent] done (handoff validated)\n\nsearch_query:  coronary artery calcium score and high cholesterol relationship\njustification: All four results I read addressed the question directly. W01 explains what a CAC score measures. W02 links LDL cholesterol to plaque that later calcifies. W04 explains why cholesterol and CAC do not always match. W11 describes what a CAC scan cannot see.\nanswer:        A coronary artery calcium (CAC) score and cholesterol measure different stages of the same disease.\n\n**What a CAC score is.** It comes from a non-contrast CT scan of the heart. It measures calcified plaque in the coronary arteries and is usually reported as an Agatston score. A score of 0 means no detectable calcium; higher numbers mean more calcified plaque [W01].\n\n**How cholesterol fits in.** High LDL cholesterol over many years contributes to atherosclerosis, which is plaque building up in artery walls. Over time some of that plaque calcifies, and this calcium is what the scan detects. Cholesterol is a cause of plaque, and calcium is a later sign that plaque has already formed [W02].\n\n**Why they don't always match.** Two people with the same cholesterol level can have very different CAC scores. Plaque also depends on age, blood pressure, smoking, diabetes and genetics. Because CAC shows the plaque that is actually present, it can refine a risk estimate that is based on cholesterol alone [W04].\n\n**Limits.** The scan detects only calcified plaque. Younger people can have soft, non-calcified plaque that the scan misses. So a score of 0 does not rule out risk, especially in smokers, people with diabetes, or people with very high LDL [W11].\n\nThis is general information, not medical advice. How to interpret your own CAC score or cholesterol results is a question for your doctor.\nsources:       W01, W02, W04, W11\n\nAgent              calls  tokens in  tokens out  seconds\nStructured LLM         1        128         141        3\nTool LLM               1         62          95        2\nResearch Agent         6      5,329         923       14\nTotal                  8      5,519       1,159       19\n\ntranscript: runs/wf/wf00_agent.json\n```\n\n**Observed:** Part 1: a query and one multiply call. Part 2: one search, four reads (W01, W02, W04, W11), an answer citing all four; 6 agent calls, 14 s.\n");</script>
