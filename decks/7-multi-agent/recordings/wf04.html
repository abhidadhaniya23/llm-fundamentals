<script>document.getElementById('md').innerHTML = marked.parse("# 04 Orchestrator-workers\n\n\nRecorded 2026-11-04 00:49 on macOS, model `anthropic` (claude-opus-5-5), labs at 1616e30. The model's wording changes run to run; the steps and checks don't.\n\n## 1. uv run labs/wf04_orchestrator_worker.py --mode workflow\n\nIn `multi-agent-architecture-patterns/`:\n\n```\nuv run labs/wf04_orchestrator_worker.py --mode workflow\n```\n\nLook for: The orchestrator plans sections; one worker per section; a cited report.\n\nExit code 0, 20.2 s.\n\n```text\n[Orchestrator] list_papers({})\n[Orchestrator] done (handoff validated)\n[Orchestrator] planned ['Foundations: Power-Law Scaling of Loss', 'Compute-Optimal Training and the Chinchilla Revision', 'Beyond Training Compute: Data Limits and Inference Costs', 'Emergent Abilities and the Predictability of Capabilities']\n[Worker: Beyond Tr] read_paper({'paper_id': 'muennighoff2023'})\n[Worker: Emergent ] read_paper({'paper_id': 'wei2022'})\n[Worker: Foundatio] read_paper({'paper_id': 'hestness2017'})\n[Worker: Compute-O] read_paper({'paper_id': 'hoffmann2022'})\n[Worker: Beyond Tr] read_paper({'paper_id': 'sardana2023'})\n[Worker: Emergent ] read_paper({'paper_id': 'schaeffer2023'})\n[Worker: Foundatio] read_paper({'paper_id': 'kaplan2020'})\n[Worker: Compute-O] read_paper({'paper_id': 'kaplan2020'})\n[Worker: Beyond Tr] read_paper({'paper_id': 'snell2024'})\n[Worker: Emergent ] read_paper({'paper_id': 'openai2023'})\n[Worker: Foundatio] read_paper({'paper_id': 'openai2023'})\n[Worker: Beyond Tr] done (handoff validated)\n[Worker: Compute-O] done (handoff validated)\n[Worker: Emergent ] done (handoff validated)\n[Worker: Foundatio] done (handoff validated)\n\n## Foundations: Power-Law Scaling of Loss\n\nThe empirical claim that deep learning performance improves predictably with scale predates large language models. Hestness et al. found that generalization error falls as a power law in training-set size across machine translation, language modelling, image classification and speech recognition [hestness2017]. They also reported that the model size needed to fit the data grows as a power law of data size. The exponent depended mainly on the task domain and was less sensitive to model architecture. Learning curves showed three regimes: a small-data region, a power-law region, and an irreducible-error region [hestness2017].\n\nKaplan et al. extended this picture to language models. They showed that cross-entropy loss follows smooth power laws in non-embedding parameters, dataset size and training compute across more than seven orders of magnitude, provided the other two factors are not a bottleneck [kaplan2020]. Within a wide range, architectural details such as depth versus width mattered little. Larger models were more sample-efficient, reaching the same loss with fewer tokens. For a fixed compute budget, the authors therefore recommended growing model size faster than dataset size and stopping training before convergence [kaplan2020].\n\nThese regularities later supported forecasting. For GPT-4, final training loss was predicted in advance with a power law fitted to runs that used 1,000 to 10,000 times less compute [openai2023]. Pass rate on a subset of HumanEval was also forecast in this way. The report cautions, however, that not every capability was predictable, and some tasks showed unexpected trends [openai2023].\n\n---\n\n## Compute-Optimal Training and the Chinchilla Revision\n\nA central question in scaling is how to divide a fixed training compute budget between model size and the number of training tokens. Kaplan et al. showed that language-model cross-entropy loss follows smooth power laws in non-embedding parameters, dataset size and compute across more than seven orders of magnitude, provided the other factors are not a bottleneck [kaplan2020]. They also found that larger models are more sample-efficient, reaching a given loss with fewer tokens [kaplan2020]. From this, they recommended that, for a fixed compute budget, model size should grow faster than dataset size, and that training should stop before convergence [kaplan2020].\n\nHoffmann et al. revised this allocation. They concluded that model size and training tokens should be scaled in roughly equal proportion as compute increases [hoffmann2022]. A rule of thumb follows: about 20 training tokens per parameter [hoffmann2022]. On this view, many large models of the time, including Gopher and GPT-3, were undertrained for their size [hoffmann2022]. The authors supported this with Chinchilla, a 70B-parameter model trained on about 1.4 trillion tokens. Using the same compute, it outperformed the 280B-parameter Gopher [hoffmann2022].\n\nThe two recommendations therefore point in different directions. Kaplan's allocation favors putting additional compute mostly into parameters [kaplan2020]. Chinchilla's calls for balanced growth, which means smaller models trained on substantially more data for a given budget [hoffmann2022].\n\n---\n\n## Beyond Training Compute: Data Limits and Inference Costs\n\nClassic compute-optimal scaling takes two things for granted: unique data never runs out, and the only cost is training. Recent work relaxes both, and also adds a third axis to scale.\n\n**Repeating data.** When unique text is scarce, repeating it is a workable fallback within limits. Training for up to about four epochs on repeated data is nearly as good as training on unique data. Beyond that point, the value of extra repeated tokens decays toward zero, and adding compute eventually stops helping [muennighoff2023]. Mixing in code data or relaxing quality filters are other ways to stretch a limited text budget [muennighoff2023].\n\n**Accounting for inference.** Chinchilla-optimal training ignores the cost of serving a model. Once total lifetime cost counts both training and inference compute, high expected inference demand favors smaller models trained on more tokens than the Chinchilla ratio suggests [sardana2023]. This helps explain why recent models are often trained far past 20 tokens per parameter [sardana2023].\n\n**Scaling test-time compute.** Compute spent at inference time, for example on sequential revisions or verifier-guided search, is a second scaling axis alongside parameters and training data [snell2024]. Allocating this compute adaptively by question difficulty was more than four times more efficient than a best-of-N baseline. On easy and medium questions, a smaller model given extra test-time compute could beat a much larger model [snell2024]. For the hardest questions, however, scaling pretraining remained more effective [snell2024]. Together, these results show that the best allocation depends on data availability, deployment volume and task difficulty, not on training compute alone.\n\n---\n\n## Emergent Abilities and the Predictability of Capabilities\n\nScaling laws predict loss well, but whether downstream capabilities improve just as smoothly is disputed. Wei et al. call an ability emergent if it is absent in smaller models but present in larger ones [wei2022]. On this view, performance on such tasks stays near random at small scale and then rises sharply, so it cannot be predicted by extrapolating from smaller models [wei2022]. Their examples include multi-step arithmetic under few-shot prompting, and they argue that techniques such as chain-of-thought prompting only help beyond a certain model scale [wei2022].\n\nSchaeffer et al. argue that much of this apparent emergence comes from the choice of metric [schaeffer2023]. All-or-nothing metrics such as exact-match accuracy can turn smooth underlying improvement into a sudden jump. When the same results are scored with continuous metrics such as token edit distance, performance improves smoothly and predictably with scale [schaeffer2023]. They recommend checking any claim of emergence against the metric used and the number of models evaluated [schaeffer2023].\n\nThe practical stakes concern forecasting. The GPT-4 report predicted final training loss from small runs with a fitted power law, using up to 1,000 to 10,000 times less compute [openai2023]. It also forecast some capability metrics in advance, including the pass rate on a subset of HumanEval [openai2023]. However, not every capability was predictable, and some tasks showed unexpected trends [openai2023]. Taken together, these results suggest that loss is reliably forecastable. Forecasting capabilities is possible in some cases, but how reliable it is depends partly on how the capabilities are measured.\n\n---\n\n## References\n- [hestness2017] Hestness et al. (2017). Deep Learning Scaling is Predictable, Empirically\n- [hoffmann2022] Hoffmann et al. (DeepMind) (2022). Training Compute-Optimal Large Language Models (Chinchilla)\n- [kaplan2020] Kaplan et al. (OpenAI) (2020). Scaling Laws for Neural Language Models\n- [muennighoff2023] Muennighoff et al. (2023). Scaling Data-Constrained Language Models\n- [openai2023] OpenAI (2023). GPT-4 Technical Report\n- [sardana2023] Sardana and Frankle (2023). Beyond Chinchilla-Optimal: Accounting for Inference in Language Model Scaling Laws\n- [schaeffer2023] Schaeffer, Miranda, Koyejo (2023). Are Emergent Abilities of Large Language Models a Mirage?\n- [snell2024] Snell et al. (2024). Scaling LLM Test-Time Compute Optimally can be More Effective than Scaling Model Parameters\n- [wei2022] Wei et al. (2022). Emergent Abilities of Large Language Models\n\nAgent              calls  tokens in  tokens out  seconds\nOrchestrator           2      1,404         593        8\nWorker: Beyond Tr      4      3,711         685       10\nWorker: Emergent       4      3,744         705       10\nWorker: Foundatio      4      3,592         628       11\nWorker: Compute-O      3      2,327         614       10\nTotal                 17     14,778       3,225       48\n\ntranscript: runs/wf/wf04_workflow.json\n```\n\n**Observed:** Four sections planned at run time, four workers in parallel, every [paper-id] checked; 20 s wall time.\n\n## 2. uv run labs/wf04_orchestrator_worker.py --mode agentic\n\nIn `multi-agent-architecture-patterns/`:\n\n```\nuv run labs/wf04_orchestrator_worker.py --mode agentic\n```\n\nLook for: The orchestrator plans sections; one worker per section; a cited report.\n\nExit code 0, 44.3 s.\n\n```text\n[Orchestrator] list_papers({})\n[Orchestrator] assign_workers({'sections': [{'name': 'Foundations: Power-Law Scaling and Predictability', 'description': 'Trace the origins of empirical scaling laws, from early evidence that generalization error follows power laws in data and model size, to the power-law relations between loss and parameters, data and compute for neural language models, and how these laws were used to forecast large-model performance before training.', 'paper_ids': ['hestness2017', 'kaplan2020', 'openai2023']}, {'name': 'Compute-Optimal Training, Data Constraints, and Inference Costs', 'description': 'Cover how to split a fixed compute budget between model size and training tokens (the Chinchilla result and how it differs from earlier prescriptions), what happens when unique data is limited (repetition, epochs, code), and how adding inference cost changes the optimum toward smaller models trained on more tokens.', 'paper_ids': ['hoffmann2022', 'muennighoff2023', 'sardana2023', 'kaplan2020']}, {'name': 'Emergent Abilities and the Measurement Debate', 'description': 'Discuss claims that some capabilities appear abruptly at scale and are not predictable from smaller models, and the counter-argument that such emergence is largely an artifact of the evaluation metrics chosen. Relate this to whether downstream capabilities are as predictable as loss.', 'paper_ids': ['wei2022', 'schaeffer2023', 'openai2023']}, {'name': 'Scaling Test-Time Compute', 'description': 'Explain the newer axis of scaling compute at inference time (search, verifiers, revisions) and when spending compute at test time beats scaling model parameters. Connect to the inference-aware view of scaling.', 'paper_ids': ['snell2024', 'sardana2023']}]})\n[Worker: Scaling T] read_paper({'paper_id': 'snell2024'})\n[Worker: Compute-O] read_paper({'paper_id': 'hoffmann2022'})\n[Worker: Foundatio] read_paper({'paper_id': 'hestness2017'})\n[Worker: Emergent ] read_paper({'paper_id': 'wei2022'})\n[Worker: Scaling T] read_paper({'paper_id': 'sardana2023'})\n[Worker: Compute-O] read_paper({'paper_id': 'kaplan2020'})\n[Worker: Foundatio] read_paper({'paper_id': 'kaplan2020'})\n[Worker: Emergent ] read_paper({'paper_id': 'schaeffer2023'})\n[Worker: Compute-O] read_paper({'paper_id': 'muennighoff2023'})\n[Worker: Foundatio] read_paper({'paper_id': 'openai2023'})\n[Worker: Emergent ] read_paper({'paper_id': 'openai2023'})\n[Worker: Compute-O] read_paper({'paper_id': 'sardana2023'})\n[Worker: Scaling T] done (handoff validated)\n[Worker: Foundatio] done (handoff validated)\n[Worker: Emergent ] done (handoff validated)\n[Worker: Compute-O] done (handoff validated)\n[Orchestrator] done (handoff validated)\n\n# LLM Scaling Laws: A Review\n\n## Introduction\n\nScaling laws are empirical relationships that predict how language-model performance changes with model size, training data and compute. They have shaped how large language models are designed, trained and deployed. This report covers four strands of the literature. It begins with the original power-law findings and their use for forecasting. It then covers the debate over how to split compute between parameters and data, including what happens when data is limited and when inference costs are counted. Next it turns to whether downstream abilities emerge unpredictably. It ends with the newer practice of scaling compute at test time.\n\n## Foundations: Power-Law Scaling and Predictability\n\nThe empirical study of scaling began with evidence that deep learning improves predictably as data grows. Across machine translation, language modelling, image classification and speech recognition, generalization error falls as a power law of training-set size, and the model size needed to fit the data also grows as a power law of data size [hestness2017]. The exponent depends mainly on the task domain and less on model architecture. Learning curves pass through three regions: a small-data region, a power-law region, and an irreducible-error region [hestness2017].\n\nKaplan et al. extended this picture to neural language models. They showed that cross-entropy loss follows smooth power laws in non-embedding parameters, dataset size and training compute, spanning more than seven orders of magnitude, provided the other two factors are not a bottleneck [kaplan2020]. Within a wide range, architectural details such as depth versus width mattered little. Larger models were also more sample-efficient, reaching a given loss with fewer tokens. For a fixed compute budget, the authors therefore recommended growing model size faster than dataset size and stopping training before convergence [kaplan2020].\n\nThese relations became tools for forecasting. The GPT-4 report describes infrastructure built to scale predictably. GPT-4's final training loss was predicted in advance by fitting a power law to runs using 1,000 to 10,000 times less compute, and its pass rate on a subset of HumanEval was forecast in the same way [openai2023]. Predictability had limits, however: not every capability could be forecast, and some tasks showed unexpected trends [openai2023].\n\n## Compute-Optimal Training, Data Constraints, and Inference Costs\n\nEarly scaling work found that language-model loss follows smooth power laws in parameters, data and compute, and that larger models are more sample-efficient [kaplan2020]. From this, Kaplan et al. recommended that, for a fixed compute budget, model size should grow faster than dataset size, with training stopped before convergence [kaplan2020]. The Chinchilla study revised this advice. It found that parameters and training tokens should be scaled in roughly equal proportion, which gives a rule of thumb of about 20 tokens per parameter [hoffmann2022]. By this measure, many large models of the time, including Gopher and GPT-3, were undertrained. Chinchilla (70B parameters, about 1.4T tokens) outperformed the 280B-parameter Gopher trained with the same compute [hoffmann2022].\n\nThe equal-scaling prescription assumes enough unique data is available. When unique text runs out, repeating data for up to about four epochs is nearly as good as using fresh data. Beyond that, the value of extra repeated tokens decays towards zero, and adding compute eventually stops helping [muennighoff2023]. Mixing in code or relaxing quality filters can stretch a limited text budget [muennighoff2023].\n\nChinchilla-optimal training also leaves out the cost of serving the model. Once lifetime inference compute is counted alongside training compute, high expected inference demand makes it cheaper overall to train a smaller model on more tokens than the Chinchilla ratio suggests [sardana2023]. This helps explain why recent models are often trained far past 20 tokens per parameter [sardana2023].\n\n## Emergent Abilities and the Measurement Debate\n\nScaling laws make language modeling loss look predictable. Whether downstream capabilities behave the same way is contested. Wei et al. define an ability as emergent if it is absent in smaller models but present in larger ones [wei2022]. On this view, performance on such tasks sits near random in small models and then rises sharply at larger scales, so it cannot be predicted by extrapolating from smaller models [wei2022]. Their examples include multi-step arithmetic under few-shot prompting, and chain-of-thought prompting, which only helps beyond a certain model scale [wei2022].\n\nSchaeffer et al. argue that much of this apparent emergence comes from the evaluation metric rather than from sudden changes inside the model [schaeffer2023]. All-or-nothing metrics such as exact-match accuracy can turn smooth underlying improvement into a jump. When continuous metrics such as token edit distance are used instead, performance improves smoothly and predictably with scale [schaeffer2023]. They recommend checking any claim of emergence against both the metric used and the number of models evaluated [schaeffer2023].\n\nThe GPT-4 report sits between these positions. OpenAI predicted GPT-4's final loss in advance by fitting a power law to runs that used up to 1,000 to 10,000 times less compute. It also forecast the pass rate on a subset of HumanEval [openai2023]. However, the report notes that not every capability was predictable and that some tasks showed unexpected trends [openai2023]. Taken together, these papers suggest that downstream capabilities can sometimes be forecast like loss, but how predictable they look depends heavily on how they are measured.\n\n## Scaling Test-Time Compute\n\nClassical scaling laws describe two axes, model parameters and training data. Recent work argues that compute spent at inference is a third axis that can be traded off against them [snell2024]. Test-time compute can be spent in several ways. One is sequential revision, where the model refines its own earlier answers. Another is search guided by a verifier, which scores candidate outputs [snell2024].\n\nHow well this works depends on how the compute is allocated. Snell et al. found that the best strategy depends on question difficulty. Assigning test-time compute adaptively per question was more than four times more efficient than a best-of-N baseline [snell2024]. On easier and medium-difficulty questions, a smaller model given extra test-time compute could outperform a much larger model. On the hardest questions, scaling pretraining remained more effective [snell2024]. Test-time compute therefore complements parameter scaling rather than replacing it.\n\nThis finding connects to the inference-aware view of scaling. Sardana and Frankle argue that Chinchilla-optimal training ignores serving costs, and that a model's total lifetime cost includes both training and inference compute [sardana2023]. When expected inference demand is high, smaller models trained on more tokens than the Chinchilla ratio prescribes are cheaper overall. This helps explain why recent models are often trained far beyond 20 tokens per parameter [sardana2023].\n\nTaken together, the two papers move the optimization target away from training compute alone and toward total compute across training and deployment. Under that target, smaller models plus well-allocated test-time compute can be a strong choice, except on the hardest problems [snell2024, sardana2023].\n\n## Conclusion\n\nThe field has moved from finding that loss falls as a power law [hestness2017, kaplan2020] to using those laws as engineering tools. They now guide how compute is split between parameters and tokens [hoffmann2022], how scarce data is reused [muennighoff2023], and how inference cost is factored in [sardana2023]. Loss can now be forecast reliably enough to plan frontier training runs [openai2023]. Whether downstream abilities are equally predictable is still debated, and the answer depends heavily on the evaluation metric [wei2022, schaeffer2023]. Test-time compute adds a further axis [snell2024]. As a result, the question is no longer only how large to train a model, but how to spend compute across the whole lifecycle of training and deployment.\n\n---\n\n## References\n- [hestness2017] Hestness et al. (2017). Deep Learning Scaling is Predictable, Empirically\n- [hoffmann2022] Hoffmann et al. (DeepMind) (2022). Training Compute-Optimal Large Language Models (Chinchilla)\n- [kaplan2020] Kaplan et al. (OpenAI) (2020). Scaling Laws for Neural Language Models\n- [muennighoff2023] Muennighoff et al. (2023). Scaling Data-Constrained Language Models\n- [openai2023] OpenAI (2023). GPT-4 Technical Report\n- [sardana2023] Sardana and Frankle (2023). Beyond Chinchilla-Optimal: Accounting for Inference in Language Model Scaling Laws\n- [schaeffer2023] Schaeffer, Miranda, Koyejo (2023). Are Emergent Abilities of Large Language Models a Mirage?\n- [snell2024] Snell et al. (2024). Scaling LLM Test-Time Compute Optimally can be More Effective than Scaling Model Parameters\n- [wei2022] Wei et al. (2022). Emergent Abilities of Large Language Models\n\nAgent              calls  tokens in  tokens out  seconds\nOrchestrator           3      5,880       3,602       30\nWorker: Scaling T      3      2,265         635        9\nWorker: Compute-O      5      5,711         778       12\nWorker: Foundatio      4      3,612         646       11\nWorker: Emergent       4      3,756         677       12\nTotal                 19     21,224       6,338       74\n\ntranscript: runs/wf/wf04_agentic.json\n```\n\n**Observed:** A different plan from the same library (test-time compute gets its own section); the orchestrator adds an introduction and a conclusion. 74 agent-seconds vs 48.\n");</script>
