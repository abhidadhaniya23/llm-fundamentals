<script>window.DECK = {"flow": [{"title": "Did it still work next Friday?", "file": "content/production/evals.md"}, {"title": "The trace", "file": "content/production/tracing.md"}, {"title": "Caps, retries and the human", "file": "content/production/caps-and-humans.md"}], "files": {"content/production/evals.md": "# Did it still work next Friday?\n\n## Overview\n\n**Goal:** Test a multi-agent system on its final result: a small golden set, scored by an LLM judge on three metrics, with people still reading raw runs.\n\n**Walk out with:** one golden question with its answer key, and the three metrics the judge scores.\n\n\n## It worked on Friday\n\n> Sam's team lead: \"It worked on Friday. How do we know it still works **next** Friday, after someone edits a prompt?\"\n\n**Ask:** Write down how you would check, in one line. Then hands up: (a) run it once and read the report, (b) a fixed list of test questions, (c) ask the agents whether they're sure.\n\n::: reveal Answer\n**(b), a fixed list with answer keys,** plus a person who still reads some raw runs. (a) catches nothing next week. (c) is the agents grading their own homework.\n:::\n\n\n\n## Start with 20 questions\n\n**Ask:** How many test questions do you need before you start? Write a number.\n\n::: reveal Answer\n**About 20.** Anthropic started with about 20 queries. Early changes have big effects, so a small set already shows them. Grow the set later.\n:::\n\n<div class=\"diagram\" id=\"f7-grow\"><svg viewBox=\"0 0 1000 200\" role=\"img\" aria-label=\"A golden set grows from 20 to more questions over time; early on, changes have large effects\">\n  <g>\n    <rect x=\"20\" y=\"60\" width=\"200\" height=\"80\" rx=\"10\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"120\" y=\"96\" text-anchor=\"middle\" style=\"font-size:22px;font-weight:700;fill:var(--ink)\">20 questions<\/text>\n    <text x=\"120\" y=\"122\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">week 1<\/text>\n  <\/g>\n  <g class=\"rv f7-g2\">\n    <line x1=\"230\" y1=\"100\" x2=\"300\" y2=\"100\" style=\"stroke:var(--muted);stroke-width:2\"/>\n    <rect x=\"310\" y=\"50\" width=\"240\" height=\"100\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"430\" y=\"94\" text-anchor=\"middle\" style=\"font-size:20px;font-weight:700;fill:var(--ink)\">+ every bad run<\/text>\n    <text x=\"430\" y=\"120\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">becomes a new question<\/text>\n    <line x1=\"560\" y1=\"100\" x2=\"630\" y2=\"100\" style=\"stroke:var(--muted);stroke-width:2\"/>\n    <rect x=\"640\" y=\"40\" width=\"300\" height=\"120\" rx=\"10\" style=\"fill:var(--good-tint);stroke:var(--good);stroke-width:2\"/>\n    <text x=\"790\" y=\"94\" text-anchor=\"middle\" style=\"font-size:20px;font-weight:700;fill:var(--ink)\">runs before every change<\/text>\n    <text x=\"790\" y=\"122\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">prompt, model, tool, brief<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal How it grows | #f7-grow .f7-g2\n:::\n\n\n## One golden question\n\n**Golden question g-07:** \"Friday's POC status: what did vendor B tell us since 2026-09-24?\"\n\n**Ask:** Before I show the key: which facts must the report contain? Pairs, list them.\n\n| Must say | Source |\n|---|---|\n| <span class=\"rv f7-k1\">0.85 EUR per GB per day, 170 EUR per day at 200 GB<\/span> | <span class=\"rv f7-k1\">Marek's mail, 2026-10-07<\/span> |\n| <span class=\"rv f7-k2\">offer valid until 2026-12-31<\/span> | <span class=\"rv f7-k2\">same mail<\/span> |\n| <span class=\"rv f7-k3\">vendor B asked: Windows Server 2019?<\/span> | <span class=\"rv f7-k3\">POC-13 (Open)<\/span> |\n| <span class=\"rv f7-k4\">four servers on 2019, two on 2022, ~180 GB/day<\/span> | <span class=\"rv f7-k4\">Lee's mail 2026-10-02, POC-14<\/span> |\n\n::: reveal Price | .f7-k1\n:::\n::: reveal Deadline | .f7-k2\n:::\n::: reveal The open question | .f7-k3\n:::\n::: reveal Lee's answer | .f7-k4\n**This is the answer key.** It lists facts and where they come from, not a model answer to compare word for word.\n:::\n\n\n## The judge's three scores\n\n**Ask:** A second model reads the report and the key. What should it score? Name three things.\n\n<div class=\"diagram\" id=\"f7-judge\"><svg style=\"max-height:32vh\" viewBox=\"0 0 1000 300\" role=\"img\" aria-label=\"An LLM judge scores one report on factual accuracy 1.0, citation accuracy 0.75, completeness 0.5; result fail\">\n  <g>\n    <rect x=\"20\" y=\"30\" width=\"220\" height=\"230\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n    <text x=\"130\" y=\"60\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:var(--navy)\">report for g-07<\/text>\n    <text x=\"40\" y=\"95\" style=\"font-size:13px;fill:var(--ink)\">B: 0.85 EUR/GB/day [mail 10-07]<\/text>\n    <text x=\"40\" y=\"120\" style=\"font-size:13px;fill:var(--ink)\">= 170 EUR/day at 200 GB [mail]<\/text>\n    <text x=\"40\" y=\"145\" style=\"font-size:13px;fill:var(--ink)\">Servers: 4× 2019, 2× 2022 [POC-13]<\/text>\n    <text x=\"40\" y=\"180\" style=\"font-size:13px;fill:var(--muted)\">(no deadline)<\/text>\n    <text x=\"40\" y=\"205\" style=\"font-size:13px;fill:var(--muted)\">(no open question)<\/text>\n    <line x1=\"245\" y1=\"145\" x2=\"300\" y2=\"145\" style=\"stroke:var(--muted);stroke-width:2\"/>\n    <rect x=\"300\" y=\"110\" width=\"110\" height=\"70\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"355\" y=\"142\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:var(--ink)\">LLM judge<\/text>\n    <text x=\"355\" y=\"162\" text-anchor=\"middle\" style=\"font-size:12px;fill:var(--muted)\">+ answer key<\/text>\n  <\/g>\n  <g class=\"rv f7-m1\">\n    <text x=\"440\" y=\"80\" style=\"font-size:16px;fill:var(--ink)\">factual accuracy<\/text>\n    <rect x=\"640\" y=\"64\" width=\"240\" height=\"22\" rx=\"6\" style=\"fill:var(--line)\"/>\n    <rect x=\"640\" y=\"64\" width=\"240\" height=\"22\" rx=\"6\" style=\"fill:var(--good)\"/>\n    <text x=\"895\" y=\"81\" style=\"font-size:16px;font-weight:700;fill:var(--good)\">1.0<\/text>\n  <\/g>\n  <g class=\"rv f7-m2\">\n    <text x=\"440\" y=\"140\" style=\"font-size:16px;fill:var(--ink)\">citation accuracy<\/text>\n    <rect x=\"640\" y=\"124\" width=\"240\" height=\"22\" rx=\"6\" style=\"fill:var(--line)\"/>\n    <rect x=\"640\" y=\"124\" width=\"180\" height=\"22\" rx=\"6\" style=\"fill:var(--orange)\"/>\n    <text x=\"895\" y=\"141\" style=\"font-size:16px;font-weight:700;fill:var(--orange)\">0.75<\/text>\n    <text x=\"440\" y=\"162\" style=\"font-size:12px;fill:var(--muted)\">server versions cited to POC-13; they're in Lee's mail / POC-14<\/text>\n  <\/g>\n  <g class=\"rv f7-m3\">\n    <text x=\"440\" y=\"210\" style=\"font-size:16px;fill:var(--ink)\">completeness<\/text>\n    <rect x=\"640\" y=\"194\" width=\"240\" height=\"22\" rx=\"6\" style=\"fill:var(--line)\"/>\n    <rect x=\"640\" y=\"194\" width=\"120\" height=\"22\" rx=\"6\" style=\"fill:var(--bad)\"/>\n    <text x=\"895\" y=\"211\" style=\"font-size:16px;font-weight:700;fill:var(--bad)\">0.5<\/text>\n    <rect x=\"640\" y=\"240\" width=\"120\" height=\"36\" rx=\"8\" style=\"fill:var(--bad-tint);stroke:var(--bad);stroke-width:2\"/>\n    <text x=\"700\" y=\"264\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--bad)\">FAIL<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal Factual accuracy | #f7-judge .f7-m1\nIs every claim true?\n:::\n::: reveal Citation accuracy | #f7-judge .f7-m2\nDoes each claim point at the source it really came from?\n:::\n::: reveal Completeness | #f7-judge .f7-m3\nIs every fact in the key there? Two of four. **Fail.**\n:::\n\n\n", "content/production/tracing.md": "# The trace\n\n## Overview\n\n**Goal:** Read a multi-agent trace and find the slow or costly agent from it.\n\n**Walk out with:** the list of what to log for every agent call: prompt, tool calls, results, tokens, duration.\n\n\n## Sam's Friday run as a timeline\n\n**Ask:** The Friday report took over 3 minutes instead of the usual 90 seconds. Look at the timeline. Which bar do you point at?\n\n<div class=\"diagram\" id=\"f7-trace\"><svg style=\"max-height:32vh\" viewBox=\"0 0 1000 360\" role=\"img\" aria-label=\"Trace timeline: orchestrator plans, four workers run in parallel, the mail worker takes three times longer than the others, then merger and reviewer\">\n  <g>\n    <line x1=\"200\" y1=\"30\" x2=\"200\" y2=\"320\" style=\"stroke:var(--line);stroke-width:1\"/>\n    <line x1=\"440\" y1=\"30\" x2=\"440\" y2=\"320\" style=\"stroke:var(--line);stroke-width:1\"/>\n    <line x1=\"680\" y1=\"30\" x2=\"680\" y2=\"320\" style=\"stroke:var(--line);stroke-width:1\"/>\n    <line x1=\"920\" y1=\"30\" x2=\"920\" y2=\"320\" style=\"stroke:var(--line);stroke-width:1\"/>\n    <text x=\"200\" y=\"345\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--muted)\">0 s<\/text>\n    <text x=\"440\" y=\"345\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--muted)\">80 s<\/text>\n    <text x=\"680\" y=\"345\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--muted)\">160 s<\/text>\n    <text x=\"920\" y=\"345\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--muted)\">240 s<\/text>\n    <text x=\"20\" y=\"54\" style=\"font-size:16px;fill:var(--ink)\">orchestrator: plan<\/text>\n    <rect x=\"200\" y=\"38\" width=\"30\" height=\"24\" rx=\"4\" style=\"fill:var(--orange)\"/>\n    <text x=\"20\" y=\"94\" style=\"font-size:16px;fill:var(--ink)\">minutes worker<\/text>\n    <rect x=\"230\" y=\"78\" width=\"150\" height=\"24\" rx=\"4\" style=\"fill:var(--navy)\"/>\n    <text x=\"20\" y=\"134\" style=\"font-size:16px;fill:var(--ink)\">mail worker<\/text>\n    <rect x=\"230\" y=\"118\" width=\"450\" height=\"24\" rx=\"4\" style=\"fill:var(--navy)\"/>\n    <text x=\"20\" y=\"174\" style=\"font-size:16px;fill:var(--ink)\">Jira worker<\/text>\n    <rect x=\"230\" y=\"158\" width=\"135\" height=\"24\" rx=\"4\" style=\"fill:var(--navy)\"/>\n    <text x=\"20\" y=\"214\" style=\"font-size:16px;fill:var(--ink)\">SD-LOG-01 worker<\/text>\n    <rect x=\"230\" y=\"198\" width=\"165\" height=\"24\" rx=\"4\" style=\"fill:var(--navy)\"/>\n    <text x=\"20\" y=\"254\" style=\"font-size:16px;fill:var(--ink)\">merger<\/text>\n    <rect x=\"680\" y=\"238\" width=\"50\" height=\"24\" rx=\"4\" style=\"fill:var(--orange)\"/>\n    <text x=\"20\" y=\"294\" style=\"font-size:16px;fill:var(--ink)\">reviewer<\/text>\n    <rect x=\"730\" y=\"278\" width=\"40\" height=\"24\" rx=\"4\" style=\"fill:var(--orange)\"/>\n  <\/g>\n  <g class=\"rv f7-hot\">\n    <rect x=\"226\" y=\"112\" width=\"458\" height=\"36\" rx=\"6\" style=\"fill:none;stroke:var(--bad);stroke-width:3\"/>\n    <text x=\"694\" y=\"135\" style=\"font-size:14px;font-weight:700;fill:var(--bad)\">31 calls · 92k tokens · alert mails<\/text>\n  <\/g>\n  <g class=\"rv f7-fix\">\n    <rect x=\"230\" y=\"118\" width=\"150\" height=\"24\" rx=\"4\" style=\"fill:var(--good)\"/>\n    <text x=\"230\" y=\"325\" style=\"font-size:14px;font-weight:700;fill:var(--good)\">after the brief fix: \"Folder POC. Ignore alert mails.\"<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal The slow bar | #f7-trace .f7-hot\n**The mail worker:** 3× longer. It read the night-alert mails.\n:::\n::: reveal The fix | #f7-trace .f7-fix\nThe fix is one line in its **brief** (flow 4), not a bigger model.\n:::\n\n\n\n## What to log\n\n**Ask:** The report came out wrong. Which of these do you need to find out why? Hands up for each: final answer only · every agent's prompt · tool calls and their results · tokens and duration.\n\n<div class=\"diagram\" id=\"f7-log\"><svg viewBox=\"0 0 1000 250\" role=\"img\" aria-label=\"One span per agent call with prompt, tool calls, results, tokens and duration\">\n  <g>\n    <rect x=\"20\" y=\"20\" width=\"300\" height=\"200\" rx=\"10\" style=\"fill:var(--bad-tint);stroke:var(--bad);stroke-width:2\"/>\n    <text x=\"170\" y=\"56\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--bad)\">only the final answer<\/text>\n    <text x=\"170\" y=\"110\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">\"B's price is still open.\"<\/text>\n    <text x=\"170\" y=\"160\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--muted)\">Which agent said that?<\/text>\n    <text x=\"170\" y=\"184\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--muted)\">From which source?<\/text>\n  <\/g>\n  <g class=\"rv f7-span\">\n    <rect x=\"360\" y=\"20\" width=\"620\" height=\"200\" rx=\"10\" style=\"fill:var(--good-tint);stroke:var(--good);stroke-width:2\"/>\n    <text x=\"670\" y=\"56\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--good)\">one record per agent call<\/text>\n    <text x=\"390\" y=\"92\" style=\"font-size:15px;fill:var(--ink)\">agent: search worker · brief: \"POC-12 status\"<\/text>\n    <text x=\"390\" y=\"122\" style=\"font-family:var(--mono);font-size:14px;fill:var(--ink)\">tool: index_search(\"POC-12\") → Open (snapshot 10-06)<\/text>\n    <text x=\"390\" y=\"152\" style=\"font-size:15px;fill:var(--ink)\">returned: \"POC-12 Open\" · 6.1k tokens · 9 s<\/text>\n    <text x=\"390\" y=\"190\" style=\"font-size:15px;font-weight:700;fill:var(--good)\">→ stale index, not a wrong model<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal Answer | #f7-log .f7-span\n**All except \"final answer only\".** Log every agent's prompt, tool calls, results, tokens and duration. The final answer alone can't tell you which agent went wrong.\n:::\n\n\n", "content/production/caps-and-humans.md": "# Caps, retries and the human\n\n## Overview\n\n**Goal:** Put limits on a multi-agent run, decide what happens when a part fails, and name the points where a person approves.\n\n**Walk out with:** four caps, the rule \"continue and say what's missing\", and three places a human steps in.\n\n\n## Four caps\n\n**Ask:** What could run away in Sam's Friday run? Pairs: name as many limits as you can in one minute.\n\n<div class=\"diagram\" id=\"f7-caps\"><svg viewBox=\"0 0 1000 260\" role=\"img\" aria-label=\"Four caps around a run: max sub-agents, max tool calls per worker, token budget per run, timeout\">\n  <g>\n    <rect x=\"380\" y=\"90\" width=\"240\" height=\"80\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:3\"/>\n    <text x=\"500\" y=\"126\" text-anchor=\"middle\" style=\"font-size:19px;font-weight:700;fill:var(--ink)\">Friday run<\/text>\n    <text x=\"500\" y=\"150\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">orchestrator + workers<\/text>\n  <\/g>\n  <g class=\"rv f7-c1\">\n    <rect x=\"20\" y=\"20\" width=\"300\" height=\"80\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"170\" y=\"54\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--ink)\">max sub-agents<\/text>\n    <text x=\"170\" y=\"80\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">e.g. 4 (not 50 for one question)<\/text>\n    <line x1=\"320\" y1=\"70\" x2=\"378\" y2=\"110\" style=\"stroke:var(--navy);stroke-width:2\"/>\n  <\/g>\n  <g class=\"rv f7-c2\">\n    <rect x=\"680\" y=\"20\" width=\"300\" height=\"80\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"830\" y=\"54\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--ink)\">max tool calls per worker<\/text>\n    <text x=\"830\" y=\"80\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">e.g. 8 for the mail worker<\/text>\n    <line x1=\"680\" y1=\"70\" x2=\"622\" y2=\"110\" style=\"stroke:var(--navy);stroke-width:2\"/>\n  <\/g>\n  <g class=\"rv f7-c3\">\n    <rect x=\"20\" y=\"160\" width=\"300\" height=\"80\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"170\" y=\"194\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--ink)\">token budget per run<\/text>\n    <text x=\"170\" y=\"220\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">stop and report when reached<\/text>\n    <line x1=\"320\" y1=\"190\" x2=\"378\" y2=\"150\" style=\"stroke:var(--navy);stroke-width:2\"/>\n  <\/g>\n  <g class=\"rv f7-c4\">\n    <rect x=\"680\" y=\"160\" width=\"300\" height=\"80\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"830\" y=\"194\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--ink)\">timeout<\/text>\n    <text x=\"830\" y=\"220\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">per worker and per run<\/text>\n    <line x1=\"680\" y1=\"190\" x2=\"622\" y2=\"150\" style=\"stroke:var(--navy);stroke-width:2\"/>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal Sub-agents | #f7-caps .f7-c1\n:::\n::: reveal Tool calls | #f7-caps .f7-c2\n:::\n::: reveal Tokens | #f7-caps .f7-c3\n:::\n::: reveal Time | #f7-caps .f7-c4\n**The brief asks for a budget (flow 4). The cap enforces it in code.** A model can ignore a sentence in its prompt. It can't ignore a loop that stops.\n:::\n\n\n## When a worker fails\n\n> The Jira API is down for maintenance on Friday morning. The Jira worker fails.\n\n**Ask:** What should the orchestrator do? (a) start the whole run again, (b) stop with an error, (c) continue and write the report without Jira.\n\n::: reveal Answer\n**First retry the tool call.** If Jira stays down: **(c), and say what's missing.** \"Jira not reached; POC-12 to POC-15 status from Wednesday's snapshot.\" Long runs resume from a checkpoint rather than starting again: Anthropic does this, because restarting a long run is expensive and frustrating.\n:::\n\n\n## The prompt edit nobody noticed\n\n> Tuesday: someone tidies the supervisor's prompt and drops the line \"ask before reprocessing\".\n\n**Ask:** Who notices first? Write it down: the supervisor, Sam, the golden set, or the team lead.\n\n<div class=\"diagram\" id=\"f7-regr\"><svg viewBox=\"0 0 1000 200\" role=\"img\" aria-label=\"Prompt edit on Tuesday, golden set runs, red on the reprocess question, caught before Friday\">\n  <g>\n    <rect x=\"20\" y=\"60\" width=\"200\" height=\"80\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n    <text x=\"120\" y=\"96\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:var(--ink)\">Tue: prompt edit<\/text>\n    <text x=\"120\" y=\"120\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--bad)\">− ask before reprocessing<\/text>\n  <\/g>\n  <g class=\"rv f7-r1\">\n    <line x1=\"220\" y1=\"100\" x2=\"280\" y2=\"100\" style=\"stroke:var(--muted);stroke-width:2\"/>\n    <rect x=\"280\" y=\"60\" width=\"240\" height=\"80\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"400\" y=\"96\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:var(--ink)\">golden set runs<\/text>\n    <text x=\"400\" y=\"120\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--muted)\">19 green · 1 red<\/text>\n    <line x1=\"520\" y1=\"100\" x2=\"580\" y2=\"100\" style=\"stroke:var(--muted);stroke-width:2\"/>\n    <rect x=\"580\" y=\"50\" width=\"400\" height=\"100\" rx=\"10\" style=\"fill:var(--bad-tint);stroke:var(--bad);stroke-width:2\"/>\n    <text x=\"780\" y=\"86\" text-anchor=\"middle\" style=\"font-size:15px;font-weight:700;fill:var(--bad)\">\"Night alerts 2026-10-06\"<\/text>\n    <text x=\"780\" y=\"110\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">supervisor reprocesses 4 IDs without asking<\/text>\n    <text x=\"780\" y=\"134\" text-anchor=\"middle\" style=\"font-size:14px;font-weight:700;fill:var(--good)\">caught Tuesday, not Friday<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal Answer | #f7-regr .f7-r1\n**The golden set,** if it has a question that checks for the approval step. That's why it runs before every prompt change.\n:::\n\n\n## Where a human steps in\n\n**Ask:** Mark the points in Sam's day where a person must approve. Hands up as I point.\n\n<div class=\"diagram\" id=\"f7-human\"><svg viewBox=\"0 0 1000 280\" role=\"img\" aria-label=\"Three points where a human steps in: before anything leaves the team, before an action in a live system, when agents still disagree\">\n  <g>\n    <rect x=\"20\" y=\"110\" width=\"160\" height=\"60\" rx=\"10\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"100\" y=\"146\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:var(--ink)\">agents<\/text>\n    <line x1=\"180\" y1=\"140\" x2=\"340\" y2=\"60\" style=\"stroke:var(--muted);stroke-width:2\"/>\n    <line x1=\"180\" y1=\"140\" x2=\"340\" y2=\"140\" style=\"stroke:var(--muted);stroke-width:2\"/>\n    <line x1=\"180\" y1=\"140\" x2=\"340\" y2=\"220\" style=\"stroke:var(--muted);stroke-width:2\"/>\n  <\/g>\n  <g class=\"rv f7-h1\">\n    <circle cx=\"370\" cy=\"60\" r=\"24\" style=\"fill:var(--good-tint);stroke:var(--good);stroke-width:3\"/>\n    <text x=\"370\" y=\"67\" text-anchor=\"middle\" style=\"font-size:20px;font-weight:700;fill:var(--good)\">✓<\/text>\n    <text x=\"410\" y=\"54\" style=\"font-size:17px;font-weight:700;fill:var(--ink)\">before anything leaves the team<\/text>\n    <text x=\"410\" y=\"78\" style=\"font-size:14px;fill:var(--muted)\">the report to the team lead · a mail to vendor B<\/text>\n  <\/g>\n  <g class=\"rv f7-h2\">\n    <circle cx=\"370\" cy=\"140\" r=\"24\" style=\"fill:var(--good-tint);stroke:var(--good);stroke-width:3\"/>\n    <text x=\"370\" y=\"147\" text-anchor=\"middle\" style=\"font-size:20px;font-weight:700;fill:var(--good)\">✓<\/text>\n    <text x=\"410\" y=\"134\" style=\"font-size:17px;font-weight:700;fill:var(--ink)\">before any action in a live system<\/text>\n    <text x=\"410\" y=\"158\" style=\"font-size:14px;fill:var(--muted)\">reprocessing documents · restarting the index worker<\/text>\n  <\/g>\n  <g class=\"rv f7-h3\">\n    <circle cx=\"370\" cy=\"220\" r=\"24\" style=\"fill:var(--good-tint);stroke:var(--good);stroke-width:3\"/>\n    <text x=\"370\" y=\"227\" text-anchor=\"middle\" style=\"font-size:20px;font-weight:700;fill:var(--good)\">✓<\/text>\n    <text x=\"410\" y=\"214\" style=\"font-size:17px;font-weight:700;fill:var(--ink)\">when agents still disagree<\/text>\n    <text x=\"410\" y=\"238\" style=\"font-size:14px;fill:var(--muted)\">after the merge rules from flow 5<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal Leaves the team | #f7-human .f7-h1\n:::\n::: reveal Live systems | #f7-human .f7-h2\n:::\n::: reveal Still disagree | #f7-human .f7-h3\n:::\n\n\n## Sam approves\n\n> 06:05. The supervisor has the five night alerts. KI-022 says target busy during the night batch, reprocess after 06:00.\n\n**Ask:** What does the supervisor send Sam, and what does it do on its own?\n\n::: reveal Answer\n**On its own:** reads the alerts, matches four TIMEOUTs to KI-022, drafts the plan.\n\n**Sent to Sam:** \"Reprocess 9d41-6a0e, b2e0-17f4, 7f3a-91c2, e7c3-58b1 after 06:00? 41aa-0c9d is an index failure, different issue.\" **Sam approves.** Then it reprocesses.\n:::\n\n"}, "css": ["viewer/flows/architectures.css", "viewer/flows/frameworks-and-close.css", "viewer/flows/need-more-agents.css", "viewer/flows/production.css", "viewer/flows/talk-and-state.css", "viewer/flows/the-brief.css", "viewer/flows/why-they-fail.css", "viewer/flows/workflow-labs.css", "viewer/flows/workflow-patterns.css", "viewer/student.css", "viewer/theme.css"]};</script>
