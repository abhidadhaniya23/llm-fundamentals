<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Pattern playground</title>
<link rel="stylesheet" href="demo.css">
<style>
  .top { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .top h1 { margin: 0 8px 0 0; }
  .top .sp { flex: 1; }
  .top .ex { font-size: 13px; color: var(--muted); }
  .pats { display: flex; gap: 4px; flex-wrap: wrap; row-gap: 4px; margin-bottom: 6px; align-items: center; }
  .pats button { font-size: 13px; padding: 3px 8px; white-space: nowrap; }
  .pats .div { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  .pats .grp { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-right: 2px; }
  button:disabled { opacity: .35; cursor: default; background: var(--card); color: var(--navy); }
  .stage { border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
  svg { display: block; width: 100%; height: 340px; }
  .cap { margin-top: 8px; min-height: 66px; font-size: 16px; line-height: 1.45; background: var(--card); border-left: 6px solid var(--orange); border-radius: 10px; padding: 7px 14px; box-shadow: 0 0 0 1px var(--line) inset; }
  .cap .n { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; display: block; }
  .cap.end { border-left-color: var(--good); }
  .cap.bad { border-left-color: var(--bad); }
  .lab { position: fixed; right: 10px; bottom: 6px; font-size: 13px; color: var(--muted); }
  .fail.on { background: var(--bad); border-color: var(--bad); color: #fff; }
  .fail { border-color: var(--bad); color: var(--bad); }
</style>
</head>

<div class="top">
  <h1>Pattern playground</h1>
  <button data-task="A" title="Friday's POC status: vendor B vs C">Task A · Friday status</button>
  <button data-task="B" title="Night alerts 2026-10-06">Task B · night alerts</button>
  <span class="ex" id="ex"></span>
  <span class="sp"></span>
  <button class="fail" id="fail" title="Show the ping-pong failure">Show failure</button>
  <button id="play">▶ Play</button>
  <button id="step">Step ›</button>
  <button id="reset">Reset</button>
</div>
<div class="pats" id="pats"></div>
<div class="stage"><svg id="svg" viewBox="0 0 1000 360"></svg></div>
<div class="cap" id="cap"></div>
<div class="lab">Fictional Contoso data · illustrative</div>

const ORDER = [['workflow', ['chain', 'parallel', 'routing', 'orchestrator', 'evaluator']], ['agents', ['pipeline', 'fanout', 'supervisor', 'handoff']]];
const $ = s => document.querySelector(s);
const svg = $('#svg');
const W = 168, H = 60;
$('#pats').innerHTML = ORDER.map(([g, ks], i) => (i ? '<span class="div"></span>' : '') + `<span class="grp">${g === 'workflow' ? 'Workflows' : 'Agents'}</span>` + ks.map(k => `<button data-p="${k}">${P[k].name}</button>`).join('')).join('');

function scenario(s) {
  const p = P[s.pattern];
  const sc = p.X || p[s.task] || p.A;
  return { p, sc, steps: (s.fail && sc.fail) ? sc.fail : sc.steps };
}
function border(a, b) {
  // point on the box border of a, towards b
  const dx = b.x - a.x, dy = b.y - a.y;
  if (!dx && !dy) return { x: a.x, y: a.y };
  const t = Math.min((W / 2 + 4) / Math.abs(dx || 1e-9), (H / 2 + 4) / Math.abs(dy || 1e-9));
  return { x: a.x + dx * t, y: a.y + dy * t };
}
function seg(N, f, t) {
  const a = N[f], b = N[t];
  return [border(a, b), border(b, a)];
}
let last = { key: '', step: -1 };
let anim = null;
function render(s) {
  const { p, sc, steps } = scenario(s);
  document.querySelectorAll('[data-p]').forEach(b => b.classList.toggle('on', b.dataset.p === s.pattern));
  document.querySelectorAll('[data-task]').forEach(b => { b.disabled = !!p.X; b.classList.toggle('on', !p.X && b.dataset.task === s.task); });
  $('#ex').textContent = p.fixed || '';
  $('#fail').style.display = sc.fail ? '' : 'none';
  $('#fail').classList.toggle('on', !!s.fail);
  const N = {};
  sc.nodes.forEach(([id, x, y, label, kind, extra]) => N[id] = { id, x, y, label, kind, extra });
  const cur = steps[s.step - 1];
  const active = new Set();
  if (cur) cur.m.forEach(([f, t]) => { active.add(f); active.add(t); });
  if (cur && cur.end) active.add(cur.end);
  // edges: every pair that any step uses (both scripts)
  const pairs = new Map();
  [...sc.steps, ...(sc.fail || [])].forEach(st => st.m.forEach(([f, t]) => { const k = [f, t].sort().join('|'); if (!pairs.has(k)) pairs.set(k, [f, t]); }));
  if (N.w4) pairs.set('or|w4', ['or', 'w4']);
  const curPairs = new Set(cur ? cur.m.map(([f, t]) => [f, t].sort().join('|')) : []);
  let h = `<defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:#b9b4a8"/></marker>
    <marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" style="fill:var(--orange)"/></marker></defs>`;
  pairs.forEach(([f, t], k) => {
    const [a, b] = seg(N, f, t);
    const ghost = N[f].kind === 'ghost' || N[t].kind === 'ghost';
    h += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" style="stroke:${ghost ? '#d6d2c8' : '#c9c4b8'};stroke-width:2;${ghost ? 'stroke-dasharray:5 5' : ''}"/>`;
  });
  if (cur) cur.m.forEach(([f, t]) => {
    const [a, b] = seg(N, f, t);
    h += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" style="stroke:var(--orange);stroke-width:3.5" marker-end="url(#aho)"/>`;
  });
  sc.nodes.forEach(([id]) => {
    const n = N[id];
    const st = {
      in: ['var(--navy-tint)', 'var(--navy)', ''], out: ['var(--good-tint)', 'var(--good)', ''],
      model: ['#f4f0fb', '#7d4cc2', ''], code: ['#f1f1ef', '#8a8578', ''], agent: ['var(--orange-tint)', 'var(--orange)', ''],
      ghost: ['#fbfaf7', '#c9c4b8', 'stroke-dasharray:6 4;'],
    }[n.kind];
    const on = active.has(id);
    const bad = cur && cur.bad && cur.end === id;
    const sub = n.extra || KIND_SUB[n.kind] || '';
    h += `<g><rect x="${n.x - W / 2}" y="${n.y - H / 2}" width="${W}" height="${H}" rx="10" style="fill:${bad ? 'var(--bad-tint)' : st[0]};stroke:${bad ? 'var(--bad)' : st[1]};stroke-width:${on ? 3.5 : 1.8};${st[2]}"/>
      <text x="${n.x}" y="${n.y + (sub ? -3 : 5)}" text-anchor="middle" style="font-size:15px;font-weight:700;fill:${n.kind === 'ghost' ? '#a9a49a' : 'var(--ink)'}">${Demo.esc(n.label)}</text>
      ${sub ? `<text x="${n.x}" y="${n.y + 16}" text-anchor="middle" style="font-size:11.5px;fill:var(--muted)">${Demo.esc(sub)}</text>` : ''}</g>`;
  });
  // message pills at the edge midpoints
  if (cur) cur.m.forEach(([f, t, msg]) => {
    const [a, b] = seg(N, f, t);
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const w = Math.min(260, msg.length * 6.6 + 16);
    const x = Math.max(4, Math.min(1000 - w - 4, mx - w / 2));
    h += `<g class="pill"><rect x="${x}" y="${my - 12}" width="${w}" height="22" rx="11" style="fill:#fff;stroke:var(--orange);stroke-width:1.5"/>
      <text x="${x + w / 2}" y="${my + 4}" text-anchor="middle" style="font-family:var(--mono);font-size:11.5px;fill:#8a3d0b">${Demo.esc(msg)}</text></g>`;
  });
  h += '<g id="dots"></g>';
  svg.innerHTML = h;
  // caption
  const cap = $('#cap');
  cap.classList.toggle('end', !!(cur && cur.end && !cur.bad));
  cap.classList.toggle('bad', !!(cur && cur.bad));
  cap.innerHTML = s.step === 0
    ? `<span class="n">${p.kind === 'workflow' ? 'Workflow pattern: the code fixes the path' : 'Multi-agent architecture: an agent decides who works next'}</span>${p.desc} Press <b>Play</b> or <b>Step</b>.`
    : `<span class="n">Step ${s.step} of ${steps.length}</span>${cur.c}`;
  $('#step').disabled = s.step >= steps.length;
  // animate dots when moving forward one step
  const key = s.pattern + s.task + s.fail;
  if (cur && cur.m.length && last.key === key && s.step === last.step + 1) animate(N, cur.m);
  last = { key, step: s.step };
  if (s.step >= steps.length) stopPlay();
}
function animate(N, moves) {
  if (anim) cancelAnimationFrame(anim);
  const g = svg.querySelector('#dots');
  const segs = moves.map(([f, t]) => seg(N, f, t));
  g.innerHTML = segs.map(() => '<circle r="9" style="fill:var(--orange);stroke:#fff;stroke-width:2.5"/>').join('');
  const cs = [...g.querySelectorAll('circle')];
  svg.querySelectorAll('.pill').forEach(p => p.style.opacity = 0);
  const t0 = performance.now(), D = 750;
  const tick = now => {
    const k = Math.min(1, (now - t0) / D), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    segs.forEach(([a, b], i) => { cs[i].setAttribute('cx', a.x + (b.x - a.x) * e); cs[i].setAttribute('cy', a.y + (b.y - a.y) * e); });
    if (k < 1) anim = requestAnimationFrame(tick);
    else { g.innerHTML = ''; svg.querySelectorAll('.pill').forEach(p => p.style.opacity = 1); anim = null; }
  };
  anim = requestAnimationFrame(tick);
}
const init = { pattern: P[Demo.param('pattern', 'orchestrator')] ? Demo.param('pattern', 'orchestrator') : 'orchestrator', task: Demo.param('task', 'A') === 'B' ? 'B' : 'A', step: 0, fail: false };
const set = Demo.sync('patterns', init, render);
let timer = null;
function stopPlay() { if (timer) { clearInterval(timer); timer = null; } $('#play').textContent = '▶ Play'; }
// Demo.sync mutates `init` in place (also on messages from the other window), so it is the live state.
const curState = init;
const setS = patch => set(patch);
document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { stopPlay(); setS({ pattern: b.dataset.p, step: 0, fail: false }); });
document.querySelectorAll('[data-task]').forEach(b => b.onclick = () => { stopPlay(); setS({ task: b.dataset.task, step: 0 }); });
$('#fail').onclick = () => { stopPlay(); setS({ fail: !curState.fail, step: 0 }); };
$('#reset').onclick = () => { stopPlay(); setS({ step: 0 }); };
$('#step').onclick = () => { stopPlay(); nextStep(); };
function nextStep() { const { steps } = scenario(curState); if (curState.step < steps.length) setS({ step: curState.step + 1 }); else stopPlay(); }
$('#play').onclick = () => {
  if (timer) return stopPlay();
  const { steps } = scenario(curState);
  if (curState.step >= steps.length) setS({ step: 0 });
  $('#play').textContent = '❚❚ Pause';
  nextStep();
  timer = setInterval(nextStep, 1900);
};
</script>
</body>
