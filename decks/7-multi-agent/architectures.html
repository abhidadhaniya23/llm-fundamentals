<script>window.DECK = {"flow": [{"title": "Pipeline and fan-out", "file": "content/architectures/pipeline-and-fanout.md"}, {"title": "Supervisor and handoff", "file": "content/architectures/supervisor-and-handoff.md"}, {"title": "Compare, then choose", "file": "content/architectures/compare-and-choose.md"}], "files": {"content/architectures/pipeline-and-fanout.md": "# Pipeline and fan-out\n\n## Overview\n\n**Goal:** Tell a workflow pattern (the code picks the path) from a multi-agent architecture (agents decide who works next), and draw a pipeline and a fan-out/fan-in on a Contoso task.\n\n**Walk out with:** two drawings: the monthly tenant report as a pipeline, and Friday's POC status as a fan-out, each with its smell.\n\n\n## From pattern to architecture\n\n**Ask:** In the chain this morning, who decided which step came next?\n\n::: reveal Answer\n**Our code.** The model only filled the steps in.\n\nFrom here on, every box is an **agent** with its own loop and tools. Each one decides how long it works and what it passes on.\n:::\n\n\n## Pipeline\n\n> Once a month Sam's team lead wants a report: tickets per tenant, and what's trending.\n\n<div class=\"diagram\" id=\"f3-pipe\"><svg style=\"max-height:26vh\" viewBox=\"0 0 1000 250\" role=\"img\" aria-label=\"Pipeline: collector agent, analyst agent, writer agent, report\">\n  <defs><marker id=\"f3-pa\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--muted)\"/><\/marker><\/defs>\n  <g>\n    <rect x=\"20\" y=\"60\" width=\"200\" height=\"90\" rx=\"12\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"120\" y=\"98\" text-anchor=\"middle\" style=\"font-size:19px;font-weight:700;fill:var(--ink)\">collector<\/text>\n    <text x=\"120\" y=\"124\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:13px;fill:var(--muted)\">jira_search, tickets<\/text>\n    <line x1=\"220\" y1=\"105\" x2=\"276\" y2=\"105\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#f3-pa)\"/>\n    <rect x=\"280\" y=\"60\" width=\"200\" height=\"90\" rx=\"12\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"380\" y=\"98\" text-anchor=\"middle\" style=\"font-size:19px;font-weight:700;fill:var(--ink)\">analyst<\/text>\n    <text x=\"380\" y=\"124\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--muted)\">groups by tenant, trends<\/text>\n    <line x1=\"480\" y1=\"105\" x2=\"536\" y2=\"105\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#f3-pa)\"/>\n    <rect x=\"540\" y=\"60\" width=\"200\" height=\"90\" rx=\"12\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"640\" y=\"98\" text-anchor=\"middle\" style=\"font-size:19px;font-weight:700;fill:var(--ink)\">writer<\/text>\n    <text x=\"640\" y=\"124\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--muted)\">the report<\/text>\n    <line x1=\"740\" y1=\"105\" x2=\"796\" y2=\"105\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#f3-pa)\"/>\n    <rect x=\"800\" y=\"70\" width=\"170\" height=\"70\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"885\" y=\"112\" text-anchor=\"middle\" style=\"font-size:19px;font-weight:700;fill:var(--ink)\">report<\/text>\n  <\/g>\n  <g class=\"rv smell\">\n    <rect x=\"290\" y=\"168\" width=\"40\" height=\"30\" rx=\"6\" style=\"fill:var(--bad-tint);stroke:var(--bad);stroke-width:2\"/>\n    <text x=\"310\" y=\"189\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--bad)\">✗<\/text>\n    <path d=\"M 330 183 L 900 183 L 900 142\" style=\"fill:none;stroke:var(--bad);stroke-width:2;stroke-dasharray:6 4\" marker-end=\"url(#f3-pa)\"/>\n    <text x=\"600\" y=\"225\" text-anchor=\"middle\" style=\"font-size:16px;fill:var(--bad)\">the analyst miscounts one tenant: the writer polishes the wrong number<\/text>\n  <\/g>\n<\/svg><\/div>\n\n**Ask:** We drew a chain this morning. What's different here?\n\n::: reveal Answer\nEach stage is an **agent** with its own loop and its own tools. The order stays fixed.\n:::\n\n::: reveal The smell | #f3-pipe .smell\n**A mistake early on flows downstream unchecked.** No stage looks back.\n:::\n\n\n## Fan-out / fan-in\n\n> Friday, 15:00. Sam needs the POC status: vendor B vs C.\n\n<div class=\"diagram\" id=\"f3-fan\"><svg style=\"max-height:30vh\" viewBox=\"0 0 1000 320\" role=\"img\" aria-label=\"Fan-out: a splitter sends work to four readers (minutes, mail, Jira, SD-LOG-01) and a merger joins their results\">\n  <defs><marker id=\"f3-fa\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--muted)\"/><\/marker><\/defs>\n  <g>\n    <rect x=\"20\" y=\"125\" width=\"170\" height=\"70\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"105\" y=\"157\" text-anchor=\"middle\" style=\"font-size:18px;font-weight:700;fill:var(--ink)\">splitter<\/text>\n    <text x=\"105\" y=\"179\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--muted)\">\"B vs C\"<\/text>\n  <\/g>\n  <g class=\"rv out\">\n    <rect x=\"370\" y=\"20\" width=\"230\" height=\"56\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"485\" y=\"54\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--ink)\">minutes reader<\/text>\n    <rect x=\"370\" y=\"95\" width=\"230\" height=\"56\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"485\" y=\"129\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--ink)\">mail reader<\/text>\n    <rect x=\"370\" y=\"170\" width=\"230\" height=\"56\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"485\" y=\"204\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--ink)\">Jira reader<\/text>\n    <rect x=\"370\" y=\"245\" width=\"230\" height=\"56\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"485\" y=\"279\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--ink)\">SD-LOG-01 reader<\/text>\n    <line x1=\"190\" y1=\"150\" x2=\"366\" y2=\"48\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#f3-fa)\"/>\n    <line x1=\"190\" y1=\"155\" x2=\"366\" y2=\"123\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#f3-fa)\"/>\n    <line x1=\"190\" y1=\"165\" x2=\"366\" y2=\"198\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#f3-fa)\"/>\n    <line x1=\"190\" y1=\"170\" x2=\"366\" y2=\"273\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#f3-fa)\"/>\n    <text x=\"280\" y=\"310\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--orange)\">at the same time<\/text>\n  <\/g>\n  <g class=\"rv in\">\n    <rect x=\"790\" y=\"125\" width=\"180\" height=\"70\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"880\" y=\"157\" text-anchor=\"middle\" style=\"font-size:18px;font-weight:700;fill:var(--ink)\">merger<\/text>\n    <text x=\"880\" y=\"179\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--muted)\">Friday status<\/text>\n    <line x1=\"600\" y1=\"48\" x2=\"786\" y2=\"148\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#f3-fa)\"/>\n    <line x1=\"600\" y1=\"123\" x2=\"786\" y2=\"155\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#f3-fa)\"/>\n    <line x1=\"600\" y1=\"198\" x2=\"786\" y2=\"165\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#f3-fa)\"/>\n    <line x1=\"600\" y1=\"273\" x2=\"786\" y2=\"172\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#f3-fa)\"/>\n  <\/g>\n<\/svg><\/div>\n\n**Ask:** Four sources. Which of them need to wait for another?\n\n::: reveal Fan out | #f3-fan .out\n**None.** The minutes, the mail, Jira and SD-LOG-01 are read at the same time.\n:::\n\n::: reveal Fan in | #f3-fan .in\n**The smell:** the merger trusts every branch equally. POC-12: Done or Open? (Flow 5.)\n:::\n\n## Anthropic's fan-out\n\n**Ask:** Guess: how much faster did Anthropic's research system get on complex questions by fanning out?\n\n::: reveal Answer\n**Up to 90% less time.** The lead agent spawns **3–5 sub-agents in parallel**, and each sub-agent uses **3+ tools in parallel**.\n:::\n\n::: reveal The catch\nFast, but not cheap: about **15×** the tokens of a chat (flow 1). Fan out when the task is broad, like Sam's four sources, not for \"when is the vendor C demo?\".\n:::\n\n", "content/architectures/supervisor-and-handoff.md": "# Supervisor and handoff\n\n## Overview\n\n**Goal:** Tell a supervisor (one lead agent delegates and keeps control) from a peer handoff (the conversation moves to the next agent, and there's no boss), and name each one's smell.\n\n**Walk out with:** the night-alerts supervisor and the Noor-ticket handoff drawn, and two words for what goes wrong: *bottleneck* and *ping-pong*.\n\n\n## Supervisor\n\n> Tuesday 2026-10-06, 07:00. Five alert mails from the night.\n\n<div class=\"diagram\" id=\"f3-sup\"><svg style=\"max-height:24vh\" viewBox=\"0 0 1000 300\" role=\"img\" aria-label=\"A supervisor sends the four TIMEOUTs to the Content Hub agent and the index failure to the index agent, collects results and writes Sam's morning mail\">\n  <defs><marker id=\"f3-sa\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--muted)\"/><\/marker><marker id=\"f3-so\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--orange)\"/><\/marker><\/defs>\n  <g>\n    <rect x=\"20\" y=\"20\" width=\"200\" height=\"60\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n    <text x=\"120\" y=\"47\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">5 alert mails<\/text>\n    <text x=\"120\" y=\"68\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--muted)\">night of 2026-10-06<\/text>\n    <line x1=\"220\" y1=\"50\" x2=\"376\" y2=\"50\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#f3-sa)\"/>\n    <rect x=\"380\" y=\"15\" width=\"240\" height=\"72\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:3\"/>\n    <text x=\"500\" y=\"47\" text-anchor=\"middle\" style=\"font-size:19px;font-weight:700;fill:var(--ink)\">on-call supervisor<\/text>\n    <text x=\"500\" y=\"70\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--muted)\">delegates, collects, decides<\/text>\n  <\/g>\n  <g class=\"rv del\">\n    <rect x=\"200\" y=\"170\" width=\"260\" height=\"70\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"330\" y=\"200\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--ink)\">Content Hub agent<\/text>\n    <text x=\"330\" y=\"223\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--muted)\">9d41 · b2e0 · 7f3a · e7c3<\/text>\n    <rect x=\"540\" y=\"170\" width=\"260\" height=\"70\" rx=\"10\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"670\" y=\"200\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--ink)\">index agent<\/text>\n    <text x=\"670\" y=\"223\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:12px;fill:var(--muted)\">41aa-0c9d, 03:02<\/text>\n    <line x1=\"460\" y1=\"87\" x2=\"350\" y2=\"166\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#f3-sa)\"/>\n    <line x1=\"540\" y1=\"87\" x2=\"650\" y2=\"166\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#f3-sa)\"/>\n  <\/g>\n  <g class=\"rv col\">\n    <path d=\"M 290 170 C 260 120 330 100 400 88\" style=\"fill:none;stroke:var(--orange);stroke-width:2;stroke-dasharray:6 4\" marker-end=\"url(#f3-so)\"/>\n    <path d=\"M 710 170 C 740 120 670 100 600 88\" style=\"fill:none;stroke:var(--orange);stroke-width:2;stroke-dasharray:6 4\" marker-end=\"url(#f3-so)\"/>\n    <line x1=\"620\" y1=\"50\" x2=\"776\" y2=\"50\" style=\"stroke:var(--orange);stroke-width:2\" marker-end=\"url(#f3-so)\"/>\n    <rect x=\"780\" y=\"20\" width=\"200\" height=\"60\" rx=\"10\" style=\"fill:var(--good-tint);stroke:var(--good);stroke-width:2\"/>\n    <text x=\"880\" y=\"47\" text-anchor=\"middle\" style=\"font-size:15px;font-weight:700;fill:var(--ink)\">Sam's morning mail<\/text>\n    <text x=\"880\" y=\"68\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--muted)\">KI-022: reprocess after 06:00<\/text>\n    <text x=\"500\" y=\"280\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">Control stays in one place: the supervisor decides if more work is needed.<\/text>\n  <\/g>\n<\/svg><\/div>\n\n**Ask:** You're the supervisor. Five mails. Who gets which?\n\n::: reveal Delegate | #f3-sup .del\nThe **four TIMEOUTs** go to the Content Hub agent, and the **03:02 index failure** goes to the index agent.\n:::\n\n::: reveal Collect | #f3-sup .col\nBoth report back. The supervisor writes Sam's morning mail: KI-022, reprocess after 06:00.\n:::\n\n\n## The supervisor's smell\n\n**Ask:** Next week there are 40 alert mails, and four specialists report back in full. What happens to the supervisor?\n\n<div class=\"diagram\" id=\"f3-bott\"><svg viewBox=\"0 0 1000 220\" role=\"img\" aria-label=\"Many reports pour into the supervisor; its context bucket overflows\">\n  <g>\n    <rect x=\"390\" y=\"30\" width=\"220\" height=\"160\" rx=\"10\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:3\"/>\n    <text x=\"500\" y=\"22\" text-anchor=\"middle\" style=\"font-size:15px;font-weight:700;fill:var(--navy)\">supervisor's context<\/text>\n    <rect x=\"392\" y=\"150\" width=\"216\" height=\"38\" style=\"fill:var(--navy-tint)\"/>\n    <text x=\"500\" y=\"175\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">its own prompt + tools<\/text>\n  <\/g>\n  <g class=\"rv fill\">\n    <rect x=\"392\" y=\"70\" width=\"216\" height=\"80\" style=\"fill:var(--orange-tint)\"/>\n    <text x=\"500\" y=\"105\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">report 1 · report 2<\/text>\n    <text x=\"500\" y=\"128\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--ink)\">report 3 · report 4 …<\/text>\n    <rect x=\"392\" y=\"32\" width=\"216\" height=\"38\" style=\"fill:var(--bad-tint)\"/>\n    <text x=\"500\" y=\"57\" text-anchor=\"middle\" style=\"font-size:14px;font-weight:700;fill:var(--bad)\">overflowing<\/text>\n    <text x=\"180\" y=\"100\" text-anchor=\"middle\" style=\"font-size:16px;fill:var(--bad)\">slower: everyone waits<\/text>\n    <text x=\"180\" y=\"124\" text-anchor=\"middle\" style=\"font-size:16px;fill:var(--bad)\">for the one lead<\/text>\n    <text x=\"820\" y=\"100\" text-anchor=\"middle\" style=\"font-size:16px;fill:var(--bad)\">details drop out<\/text>\n    <text x=\"820\" y=\"124\" text-anchor=\"middle\" style=\"font-size:16px;fill:var(--bad)\">of a full context<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal Bottleneck | #f3-bott .fill\n**It becomes the bottleneck, and its context fills with every report.** The fix is short reports: the brief (flow 4) and files instead of full text (flow 5).\n:::\n\n## Handoff\n\n> Noor opens a ticket: \"Fabrikam Legal can't find yesterday's scanned contracts.\"\n\n<div class=\"diagram\" id=\"f3-hand\"><svg style=\"max-height:27vh\" viewBox=\"0 0 1000 250\" role=\"img\" aria-label=\"Handoff: Noor's ticket goes to the intake agent, which hands the conversation to the Content Hub agent, which hands it to the Capture agent\">\n  <defs><marker id=\"f3-ha\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--orange)\"/><\/marker><\/defs>\n  <g>\n    <circle cx=\"70\" cy=\"110\" r=\"40\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n    <text x=\"70\" y=\"116\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--ink)\">Noor<\/text>\n    <line x1=\"110\" y1=\"110\" x2=\"176\" y2=\"110\" style=\"stroke:var(--orange);stroke-width:2\" marker-end=\"url(#f3-ha)\"/>\n    <rect x=\"180\" y=\"75\" width=\"190\" height=\"70\" rx=\"12\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"275\" y=\"117\" text-anchor=\"middle\" style=\"font-size:18px;font-weight:700;fill:var(--ink)\">intake agent<\/text>\n  <\/g>\n  <g class=\"rv h1\">\n    <line x1=\"370\" y1=\"110\" x2=\"456\" y2=\"110\" style=\"stroke:var(--orange);stroke-width:3\" marker-end=\"url(#f3-ha)\"/>\n    <text x=\"413\" y=\"98\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--orange)\">hands over<\/text>\n    <rect x=\"460\" y=\"75\" width=\"220\" height=\"70\" rx=\"12\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"570\" y=\"106\" text-anchor=\"middle\" style=\"font-size:18px;font-weight:700;fill:var(--ink)\">Content Hub agent<\/text>\n    <text x=\"570\" y=\"129\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--muted)\">\"search is fine; never arrived\"<\/text>\n  <\/g>\n  <g class=\"rv h2\">\n    <line x1=\"680\" y1=\"110\" x2=\"766\" y2=\"110\" style=\"stroke:var(--orange);stroke-width:3\" marker-end=\"url(#f3-ha)\"/>\n    <text x=\"723\" y=\"98\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--orange)\">hands over<\/text>\n    <rect x=\"770\" y=\"75\" width=\"210\" height=\"70\" rx=\"12\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"875\" y=\"106\" text-anchor=\"middle\" style=\"font-size:18px;font-weight:700;fill:var(--ink)\">Capture agent<\/text>\n    <text x=\"875\" y=\"129\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--muted)\">batch stuck at remote site<\/text>\n    <text x=\"500\" y=\"210\" text-anchor=\"middle\" style=\"font-size:16px;fill:var(--ink)\">No boss. The whole conversation moves to the agent that answers next.<\/text>\n  <\/g>\n<\/svg><\/div>\n\n**Ask:** Where does the conversation with Noor go after the intake agent?\n\n::: reveal First handoff | #f3-hand .h1\nTo the **Content Hub agent**. That's where search lives.\n:::\n\n::: reveal Second handoff | #f3-hand .h2\nThe documents never arrived: a **Capture batch stuck at the remote site** (KI-047). The Capture agent talks to Noor from now on.\n:::\n\n\n## Ping-pong\n\n<div class=\"diagram\" id=\"f3-ping\"><svg viewBox=\"0 0 1000 220\" role=\"img\" aria-label=\"The Content Hub agent and the Capture agent hand the same ticket back and forth\">\n  <defs><marker id=\"f3-pp\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--bad)\"/><\/marker><\/defs>\n  <g>\n    <rect x=\"120\" y=\"70\" width=\"250\" height=\"80\" rx=\"12\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"245\" y=\"117\" text-anchor=\"middle\" style=\"font-size:19px;font-weight:700;fill:var(--ink)\">Content Hub agent<\/text>\n    <rect x=\"630\" y=\"70\" width=\"250\" height=\"80\" rx=\"12\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"755\" y=\"117\" text-anchor=\"middle\" style=\"font-size:19px;font-weight:700;fill:var(--ink)\">Capture agent<\/text>\n  <\/g>\n  <g class=\"rv pp\">\n    <path d=\"M 370 90 C 450 40 550 40 626 90\" style=\"fill:none;stroke:var(--bad);stroke-width:3\" marker-end=\"url(#f3-pp)\"/>\n    <text x=\"500\" y=\"45\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--bad)\">\"not Content Hub, it's a batch\"<\/text>\n    <path d=\"M 630 130 C 550 180 450 180 374 130\" style=\"fill:none;stroke:var(--bad);stroke-width:3\" marker-end=\"url(#f3-pp)\"/>\n    <text x=\"500\" y=\"190\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--bad)\">\"batch exported fine, it's search\"<\/text>\n    <text x=\"500\" y=\"117\" text-anchor=\"middle\" style=\"font-size:22px;font-weight:700;fill:var(--bad)\">× 6<\/text>\n  <\/g>\n<\/svg><\/div>\n\n**Ask:** Each agent is sure it's the other's problem. What stops this?\n\n::: reveal The smell | #f3-ping .pp\n**Ping-pong: nobody owns the end.** Fixes: a handoff limit in code (for example, at most 3 handoffs, then hand to Sam), or one agent that owns the ticket until it's closed.\n:::\n\n", "content/architectures/compare-and-choose.md": "# Compare, then choose\n\n## Overview\n\n**Goal:** Pick an architecture for a task by asking who decides next, where the state lives and what breaks.\n\n**Walk out with:** the four-row comparison table, and an architecture for Task A (Friday status) and Task B (night alerts).\n\n\n## The four side by side\n\n**Ask:** For each architecture, who decides which agent works next? Call it out row by row.\n\n| | Who decides next | Where the state lives | Good for | Breaks when |\n|---|---|---|---|---|\n| **Pipeline** | <span class=\"rv r1\">the order in code<\/span> | <span class=\"rv r1\">passed down the line<\/span> | <span class=\"rv r1\">stable multi-stage jobs<\/span> | <span class=\"rv r1\">an early stage is wrong<\/span> |\n| **Fan-out/fan-in** | <span class=\"rv r2\">the splitter<\/span> | <span class=\"rv r2\">each branch, then the merger<\/span> | <span class=\"rv r2\">breadth<\/span> | <span class=\"rv r2\">branches overlap or contradict<\/span> |\n| **Supervisor** | <span class=\"rv r3\">the lead agent<\/span> | <span class=\"rv r3\">the lead's context<\/span> | <span class=\"rv r3\">dynamic tasks, one owner<\/span> | <span class=\"rv r3\">the lead's context overflows<\/span> |\n| **Handoff** | <span class=\"rv r4\">the current agent<\/span> | <span class=\"rv r4\">the conversation moves along<\/span> | <span class=\"rv r4\">conversations across specialties<\/span> | <span class=\"rv r4\">no one owns the end<\/span> |\n\n::: reveal Pipeline | .r1\n:::\n::: reveal Fan-out/fan-in | .r2\n:::\n::: reveal Supervisor | .r3\n:::\n::: reveal Handoff | .r4\nThe table to photograph.\n:::\n\n\n## Choose for Task A and Task B\n\n<div class=\"diagram\" id=\"f3-pick\"><svg style=\"max-height:25vh\" viewBox=\"0 0 1000 260\" role=\"img\" aria-label=\"Task A, Friday status: fan-out under a supervisor. Task B, night alerts: supervisor, or handoff when it's a conversation with Noor\">\n  <g>\n    <rect x=\"20\" y=\"20\" width=\"460\" height=\"70\" rx=\"12\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"250\" y=\"50\" text-anchor=\"middle\" style=\"font-size:18px;font-weight:700;fill:var(--navy)\">Task A: Friday status, B vs C<\/text>\n    <text x=\"250\" y=\"74\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">4 sources, lots to read, independent<\/text>\n    <rect x=\"520\" y=\"20\" width=\"460\" height=\"70\" rx=\"12\" style=\"fill:var(--card);stroke:var(--navy);stroke-width:2\"/>\n    <text x=\"750\" y=\"50\" text-anchor=\"middle\" style=\"font-size:18px;font-weight:700;fill:var(--navy)\">Task B: the night alerts<\/text>\n    <text x=\"750\" y=\"74\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">5 mails, 3 platforms, 1 known issue<\/text>\n  <\/g>\n  <g class=\"rv pa\">\n    <rect x=\"20\" y=\"120\" width=\"460\" height=\"120\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"250\" y=\"160\" text-anchor=\"middle\" style=\"font-size:20px;font-weight:700;fill:var(--ink)\">fan-out under a supervisor<\/text>\n    <text x=\"250\" y=\"192\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">the lead picks the readers, they run at once,<\/text>\n    <text x=\"250\" y=\"216\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">the lead merges and can send one out again<\/text>\n  <\/g>\n  <g class=\"rv pb\">\n    <rect x=\"520\" y=\"120\" width=\"460\" height=\"120\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"750\" y=\"160\" text-anchor=\"middle\" style=\"font-size:20px;font-weight:700;fill:var(--ink)\">supervisor<\/text>\n    <text x=\"750\" y=\"192\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">one owner for Sam's morning mail;<\/text>\n    <text x=\"750\" y=\"216\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">handoff if it's a conversation with Noor<\/text>\n  <\/g>\n<\/svg><\/div>\n\n**Task for participants:** In pairs, write down one architecture for Task A and one for Task B, with one reason each. 2 minutes.\n\n::: reveal Task A | #f3-pick .pa\n**Fan-out under a supervisor.** The sources are independent, so fan out. A lead decides which ones this week and can send a reader out again.\n:::\n\n::: reveal Task B | #f3-pick .pb\n**A supervisor:** one owner, one morning mail for Sam. **Handoff** if Noor is in the conversation, so the right specialist talks to her.\n:::\n\n\n## Playground\n\n<div class=\"diagram\"><iframe src=\"content/ma-assets/demos/pattern-playground.html?pattern=fanout&task=A\" style=\"width:100%;height:600px;border:0\" loading=\"lazy\"><\/iframe><\/div>\n\n"}, "css": ["viewer/flows/architectures.css", "viewer/flows/frameworks-and-close.css", "viewer/flows/need-more-agents.css", "viewer/flows/production.css", "viewer/flows/talk-and-state.css", "viewer/flows/the-brief.css", "viewer/flows/why-they-fail.css", "viewer/flows/workflow-labs.css", "viewer/flows/workflow-patterns.css", "viewer/student.css", "viewer/theme.css"]};</script>
