<script>window.DECK = {"flow": [{"title": "Sam's Friday report goes wrong", "file": "content/need-more-agents/friday-report.md"}, {"title": "Three reasons to split", "file": "content/need-more-agents/three-reasons.md"}, {"title": "The bill", "file": "content/need-more-agents/the-bill.md"}, {"title": "One agent, a workflow, or several?", "file": "content/need-more-agents/sort-the-tasks.md"}], "files": {"content/need-more-agents/friday-report.md": "# Sam's Friday report goes wrong\n\n## Overview\n\n**Goal:** Tell a problem that a better prompt fixes from one that needs a second agent.\n\n**Walk out with:** the habit \"fix the prompt and the tools first, then count what's left\".\n\n\n## Friday, 16:00\n\n> Sam has to send the POC status to the team lead by five. The agent from Wednesday gets every tool: mail, minutes, Jira, Content Hub, logs. The prompt: **\"Write Friday's POC status: vendor B vs C.\"**\n\n**Ask:** One agent, every tool, one sentence of prompt. What do you expect in the report? Write down one thing that will go wrong.\n\n\n## The report\n\n<div class=\"diagram\" id=\"f1-report\"><svg style=\"max-height:34vh\" viewBox=\"0 0 1000 300\" role=\"img\" aria-label=\"Five tools feed one agent, which writes a report with three marked problems\">\n  <defs><marker id=\"f1r-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--muted)\"/><\/marker><\/defs>\n  <g>\n    <rect x=\"10\" y=\"20\" width=\"150\" height=\"40\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><text x=\"85\" y=\"46\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">mail (30)<\/text>\n    <rect x=\"10\" y=\"70\" width=\"150\" height=\"40\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><text x=\"85\" y=\"96\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">minutes (4)<\/text>\n    <rect x=\"10\" y=\"120\" width=\"150\" height=\"40\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><text x=\"85\" y=\"146\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">Jira (18)<\/text>\n    <rect x=\"10\" y=\"170\" width=\"150\" height=\"40\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><text x=\"85\" y=\"196\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">Content Hub<\/text>\n    <rect x=\"10\" y=\"220\" width=\"150\" height=\"40\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><text x=\"85\" y=\"246\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">logs<\/text>\n    <line x1=\"160\" y1=\"40\" x2=\"268\" y2=\"130\" style=\"stroke:var(--muted);stroke-width:2\"/>\n    <line x1=\"160\" y1=\"90\" x2=\"268\" y2=\"135\" style=\"stroke:var(--muted);stroke-width:2\"/>\n    <line x1=\"160\" y1=\"140\" x2=\"268\" y2=\"140\" style=\"stroke:var(--muted);stroke-width:2\"/>\n    <line x1=\"160\" y1=\"190\" x2=\"268\" y2=\"145\" style=\"stroke:var(--muted);stroke-width:2\"/>\n    <line x1=\"160\" y1=\"240\" x2=\"268\" y2=\"150\" style=\"stroke:var(--muted);stroke-width:2\"/>\n    <rect x=\"270\" y=\"100\" width=\"150\" height=\"80\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:3\"/>\n    <text x=\"345\" y=\"138\" text-anchor=\"middle\" style=\"font-size:18px;font-weight:700;fill:var(--ink)\">one agent<\/text>\n    <text x=\"345\" y=\"160\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--muted)\">every tool<\/text>\n    <line x1=\"420\" y1=\"140\" x2=\"478\" y2=\"140\" style=\"stroke:var(--muted);stroke-width:2\" marker-end=\"url(#f1r-a)\"/>\n    <rect x=\"480\" y=\"10\" width=\"500\" height=\"280\" rx=\"10\" style=\"fill:var(--card);stroke:var(--line);stroke-width:2\"/>\n    <text x=\"500\" y=\"40\" style=\"font-size:17px;font-weight:700;fill:var(--navy)\">POC status, Friday 2026-10-09<\/text>\n  <\/g>\n  <g class=\"rv p1\">\n    <rect x=\"495\" y=\"56\" width=\"470\" height=\"70\" rx=\"6\" style=\"fill:var(--bad-tint);stroke:var(--bad)\"/>\n    <text x=\"510\" y=\"82\" style=\"font-size:15px;fill:var(--ink)\">Night of 2026-10-06: four transfer TIMEOUTs,<\/text>\n    <text x=\"510\" y=\"104\" style=\"font-size:15px;fill:var(--ink)\">one index failure, KI-022, reprocessed at 06:20 …<\/text>\n    <text x=\"950\" y=\"118\" text-anchor=\"end\" style=\"font-size:13px;font-weight:700;fill:var(--bad)\">half the report<\/text>\n  <\/g>\n  <g class=\"rv p2\">\n    <rect x=\"495\" y=\"136\" width=\"470\" height=\"44\" rx=\"6\" style=\"fill:var(--bad-tint);stroke:var(--bad)\"/>\n    <text x=\"510\" y=\"164\" style=\"font-size:15px;fill:var(--ink)\">Vendor B: price <tspan style=\"font-weight:700\">still open<\/tspan> (POC-12)<\/text>\n    <text x=\"950\" y=\"164\" text-anchor=\"end\" style=\"font-size:13px;font-weight:700;fill:var(--bad)\">06 snapshot<\/text>\n  <\/g>\n  <g class=\"rv p3\">\n    <rect x=\"495\" y=\"190\" width=\"470\" height=\"44\" rx=\"6\" style=\"fill:var(--bad-tint);stroke:var(--bad);stroke-dasharray:6 4\"/>\n    <text x=\"510\" y=\"218\" style=\"font-size:15px;fill:var(--muted);font-style:italic\">(missing) vendor B asked: Windows Server 2019?<\/text>\n  <\/g>\n  <g>\n    <text x=\"510\" y=\"268\" style=\"font-size:15px;fill:var(--ink)\">Vendor C: demo on 2026-10-15.<\/text>\n  <\/g>\n<\/svg><\/div>\n\n**Ask:** Read the report. What's wrong with it? Three things.\n\n::: reveal Problem 1 | #f1-report .p1\n**Half of it is the night alerts:** same mailbox as the vendor mails.\n:::\n::: reveal Problem 2 | #f1-report .p2\n**\"Price still open\":** from the Jira snapshot of 2026-10-06. Marek's price came on 2026-10-07.\n:::\n::: reveal Problem 3 | #f1-report .p3\n**Missing:** vendor B's Windows Server 2019 question (POC-13, Open).\n:::\n\n\n## Which fix?\n\n**Ask:** Hands up. What do you try first?\n\n- **(a)** more agents\n- **(b)** a better prompt and fewer tools\n- **(c)** a bigger model\n\n::: reveal Answer\n**(b) first.** Give the agent only the POC sources (minutes, mail folder POC, Jira project POC) and say \"vendor B and C only\". The alert noise is gone.\n\nAnthropic: teams spent **months** on multi-agent architectures, then found that better prompting on one agent did as well.\n\n**Only what's left over justifies more agents.**\n:::\n\n\n\n## Inside one agent's context\n\n**Ask:** Everything the agent reads stays in its list and is resent on every pass. What share of that list is about vendors B and C? Write down a percentage.\n\n<div class=\"diagram\" id=\"f1-bucket\"><svg viewBox=\"0 0 1000 330\" role=\"img\" aria-label=\"The context window as a bucket filling with layers; the useful part is a thin orange layer\">\n  <g>\n    <path d=\"M150 20 L150 310 L450 310 L450 20\" style=\"fill:none;stroke:var(--ink);stroke-width:3\"/>\n    <text x=\"300\" y=\"14\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">context window<\/text>\n    <rect x=\"152\" y=\"288\" width=\"296\" height=\"20\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"470\" y=\"303\" style=\"font-size:15px;fill:var(--ink)\">system prompt<\/text>\n    <rect x=\"152\" y=\"258\" width=\"296\" height=\"30\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"470\" y=\"278\" style=\"font-size:15px;fill:var(--ink)\">tool definitions (12 tools)<\/text>\n  <\/g>\n  <g class=\"rv b1\">\n    <rect x=\"152\" y=\"228\" width=\"296\" height=\"30\" style=\"fill:#eef3f8;stroke:var(--navy)\"/>\n    <text x=\"470\" y=\"248\" style=\"font-size:15px;fill:var(--ink)\">4 minutes<\/text>\n    <rect x=\"152\" y=\"178\" width=\"296\" height=\"50\" style=\"fill:#e6f0ff;stroke:var(--navy)\"/>\n    <text x=\"470\" y=\"208\" style=\"font-size:15px;fill:var(--ink)\">18 Jira issues<\/text>\n    <rect x=\"152\" y=\"88\" width=\"296\" height=\"90\" style=\"fill:#efe7fb;stroke:var(--navy)\"/>\n    <text x=\"470\" y=\"138\" style=\"font-size:15px;fill:var(--ink)\">30 mails (alerts included)<\/text>\n  <\/g>\n  <g class=\"rv b2\">\n    <rect x=\"152\" y=\"48\" width=\"296\" height=\"40\" style=\"fill:#eeeeee;stroke:var(--navy)\"/>\n    <text x=\"470\" y=\"73\" style=\"font-size:15px;fill:var(--ink)\">log lines from the night<\/text>\n    <rect x=\"152\" y=\"26\" width=\"296\" height=\"22\" style=\"fill:var(--card);stroke:var(--navy)\"/>\n    <text x=\"470\" y=\"42\" style=\"font-size:15px;fill:var(--ink)\">the draft so far<\/text>\n    <text x=\"300\" y=\"24\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:700;fill:var(--bad)\">full<\/text>\n  <\/g>\n  <g class=\"rv b3\">\n    <rect x=\"160\" y=\"234\" width=\"40\" height=\"18\" style=\"fill:var(--orange);opacity:.85\"/>\n    <rect x=\"160\" y=\"190\" width=\"30\" height=\"14\" style=\"fill:var(--orange);opacity:.85\"/>\n    <rect x=\"160\" y=\"100\" width=\"22\" height=\"12\" style=\"fill:var(--orange);opacity:.85\"/>\n    <rect x=\"160\" y=\"140\" width=\"22\" height=\"12\" style=\"fill:var(--orange);opacity:.85\"/>\n    <rect x=\"700\" y=\"110\" width=\"280\" height=\"100\" rx=\"10\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"840\" y=\"146\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--ink)\">the useful part<\/text>\n    <text x=\"840\" y=\"172\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">about 12 lines<\/text>\n    <text x=\"840\" y=\"194\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">on vendors B and C<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal What it reads | #f1-bucket .b1\n:::\n::: reveal What piles up | #f1-bucket .b2\n:::\n::: reveal What it needed | #f1-bucket .b3\n**A thin layer.** Everything else is noise the model has to read past on every pass, and it pays for those tokens every time.\n:::\n\n\n", "content/need-more-agents/three-reasons.md": "# Three reasons to split\n\n## Overview\n\n**Goal:** Name the three situations where a second agent pays off, and one where it doesn't.\n\n**Walk out with:** context, parallel, specialization. If it's none of the three, use one agent.\n\n\n\n## Reason 1: context isolation\n\n**Ask:** The night alerts polluted Sam's report. Where could the 30 mails be read, so that the writer never sees them?\n\n<div class=\"diagram\" id=\"f1-iso\"><svg viewBox=\"0 0 1000 280\" role=\"img\" aria-label=\"A mail agent reads 30 mails in its own context and passes six lines to the writer\">\n  <defs><marker id=\"f1i-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" style=\"fill:var(--orange)\"/><\/marker><\/defs>\n  <g>\n    <rect x=\"10\" y=\"40\" width=\"200\" height=\"200\" rx=\"10\" style=\"fill:#efe7fb;stroke:var(--navy)\"/>\n    <text x=\"110\" y=\"70\" text-anchor=\"middle\" style=\"font-size:16px;font-weight:700;fill:var(--ink)\">30 mails<\/text>\n    <text x=\"110\" y=\"100\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">vendor B, vendor C,<\/text>\n    <text x=\"110\" y=\"120\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">alerts 02:09–03:02,<\/text>\n    <text x=\"110\" y=\"140\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--muted)\">Noor, Lee, Jonas …<\/text>\n  <\/g>\n  <g class=\"rv i1\">\n    <rect x=\"260\" y=\"20\" width=\"300\" height=\"240\" rx=\"14\" style=\"fill:none;stroke:var(--navy);stroke-width:2;stroke-dasharray:8 5\"/>\n    <text x=\"410\" y=\"44\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--navy)\">its own context window<\/text>\n    <rect x=\"320\" y=\"100\" width=\"180\" height=\"70\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:3\"/>\n    <text x=\"410\" y=\"132\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--ink)\">mail agent<\/text>\n    <text x=\"410\" y=\"154\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--muted)\">reads everything<\/text>\n    <line x1=\"210\" y1=\"140\" x2=\"318\" y2=\"135\" style=\"stroke:var(--muted);stroke-width:2\"/>\n    <text x=\"410\" y=\"220\" text-anchor=\"middle\" style=\"font-size:14px;fill:var(--bad)\">the alerts stay in here<\/text>\n  <\/g>\n  <g class=\"rv i2\">\n    <line x1=\"500\" y1=\"135\" x2=\"628\" y2=\"135\" style=\"stroke:var(--orange);stroke-width:3\" marker-end=\"url(#f1i-a)\"/>\n    <rect x=\"630\" y=\"60\" width=\"160\" height=\"150\" rx=\"8\" style=\"fill:var(--card);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"710\" y=\"88\" text-anchor=\"middle\" style=\"font-size:15px;font-weight:700;fill:var(--ink)\">6 lines<\/text>\n    <text x=\"645\" y=\"114\" style=\"font-size:12px;fill:var(--ink)\">B: 0.85 EUR/GB/day<\/text>\n    <text x=\"645\" y=\"134\" style=\"font-size:12px;fill:var(--ink)\">B: asked Win 2019?<\/text>\n    <text x=\"645\" y=\"154\" style=\"font-size:12px;fill:var(--ink)\">Lee: 4× 2019, 2× 2022<\/text>\n    <text x=\"645\" y=\"174\" style=\"font-size:12px;fill:var(--ink)\">C: demo 10-15 10:00<\/text>\n    <text x=\"645\" y=\"194\" style=\"font-size:12px;fill:var(--ink)\">…<\/text>\n    <line x1=\"790\" y1=\"135\" x2=\"838\" y2=\"135\" style=\"stroke:var(--orange);stroke-width:3\" marker-end=\"url(#f1i-a)\"/>\n    <rect x=\"840\" y=\"100\" width=\"150\" height=\"70\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:3\"/>\n    <text x=\"915\" y=\"140\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--ink)\">writer<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal A separate context | #f1-iso .i1\n:::\n::: reveal Only the summary travels | #f1-iso .i2\n**Context isolation.** The subtask reads a lot, and most of it doesn't matter to the main task. Anthropic's rule of thumb: more than about **1,000 tokens** of material, mostly irrelevant.\n:::\n\n\n## Reason 2: parallel work\n\n**Ask:** Minutes, mail, Jira, SD-LOG-01. Does reading one depend on another?\n\n<div class=\"diagram\" id=\"f1-par\"><svg viewBox=\"0 0 1000 250\" role=\"img\" aria-label=\"Timeline: one agent reads four sources one after another; four workers read them at the same time\">\n  <g>\n    <text x=\"10\" y=\"30\" style=\"font-size:15px;font-weight:700;fill:var(--navy)\">ONE AGENT<\/text>\n    <rect x=\"160\" y=\"14\" width=\"180\" height=\"26\" rx=\"4\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><text x=\"250\" y=\"32\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--ink)\">minutes<\/text>\n    <rect x=\"340\" y=\"14\" width=\"200\" height=\"26\" rx=\"4\" style=\"fill:#efe7fb;stroke:var(--navy)\"/><text x=\"440\" y=\"32\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--ink)\">mail<\/text>\n    <rect x=\"540\" y=\"14\" width=\"180\" height=\"26\" rx=\"4\" style=\"fill:#e6f0ff;stroke:var(--navy)\"/><text x=\"630\" y=\"32\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--ink)\">Jira<\/text>\n    <rect x=\"720\" y=\"14\" width=\"160\" height=\"26\" rx=\"4\" style=\"fill:var(--good-tint);stroke:var(--navy)\"/><text x=\"800\" y=\"32\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--ink)\">SD-LOG-01<\/text>\n    <line x1=\"160\" y1=\"230\" x2=\"980\" y2=\"230\" style=\"stroke:var(--line);stroke-width:2\"/>\n    <text x=\"970\" y=\"248\" text-anchor=\"end\" style=\"font-size:13px;fill:var(--muted)\">time →<\/text>\n  <\/g>\n  <g class=\"rv q1\">\n    <text x=\"10\" y=\"90\" style=\"font-size:15px;font-weight:700;fill:var(--orange)\">4 WORKERS<\/text>\n    <rect x=\"160\" y=\"74\" width=\"180\" height=\"26\" rx=\"4\" style=\"fill:var(--navy-tint);stroke:var(--orange)\"/><text x=\"250\" y=\"92\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--ink)\">minutes<\/text>\n    <rect x=\"160\" y=\"106\" width=\"200\" height=\"26\" rx=\"4\" style=\"fill:#efe7fb;stroke:var(--orange)\"/><text x=\"260\" y=\"124\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--ink)\">mail<\/text>\n    <rect x=\"160\" y=\"138\" width=\"180\" height=\"26\" rx=\"4\" style=\"fill:#e6f0ff;stroke:var(--orange)\"/><text x=\"250\" y=\"156\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--ink)\">Jira<\/text>\n    <rect x=\"160\" y=\"170\" width=\"160\" height=\"26\" rx=\"4\" style=\"fill:var(--good-tint);stroke:var(--orange)\"/><text x=\"240\" y=\"188\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--ink)\">SD-LOG-01<\/text>\n    <rect x=\"360\" y=\"122\" width=\"80\" height=\"26\" rx=\"4\" style=\"fill:var(--orange-tint);stroke:var(--orange)\"/><text x=\"400\" y=\"140\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--ink)\">merge<\/text>\n    <line x1=\"440\" y1=\"214\" x2=\"880\" y2=\"214\" style=\"stroke:var(--good);stroke-width:3\"/>\n    <text x=\"660\" y=\"206\" text-anchor=\"middle\" style=\"font-size:14px;font-weight:700;fill:var(--good)\">time saved<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal Read at the same time | #f1-par .q1\n**Parallel work:** independent directions run at once.\n:::\n\n::: reveal Anthropic's example\n\"Board members of every IT company in the S&P 500.\" A single agent searched one company after another, slowly, and failed. Sub-agents split the list.\n:::\n\n\n## Reason 3: specialization\n\n**Ask:** One agent has 12 tools. Another has one. Which one picks the right tool more often?\n\n<div class=\"diagram\" id=\"f1-spec\"><svg viewBox=\"0 0 1000 250\" role=\"img\" aria-label=\"Left: one agent with 12 tool chips. Right: a Jira agent with one tool\">\n  <g>\n    <rect x=\"170\" y=\"90\" width=\"160\" height=\"70\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:3\"/>\n    <text x=\"250\" y=\"130\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--ink)\">one agent<\/text>\n    <g style=\"font-family:var(--mono);font-size:12px;fill:var(--ink)\">\n      <rect x=\"10\" y=\"10\" width=\"130\" height=\"26\" rx=\"13\" style=\"fill:var(--navy-tint)\"/><text x=\"75\" y=\"28\" text-anchor=\"middle\">mail_search<\/text>\n      <rect x=\"150\" y=\"10\" width=\"110\" height=\"26\" rx=\"13\" style=\"fill:var(--navy-tint)\"/><text x=\"205\" y=\"28\" text-anchor=\"middle\">mail_open<\/text>\n      <rect x=\"270\" y=\"10\" width=\"120\" height=\"26\" rx=\"13\" style=\"fill:var(--navy-tint)\"/><text x=\"330\" y=\"28\" text-anchor=\"middle\">jira_search<\/text>\n      <rect x=\"400\" y=\"10\" width=\"100\" height=\"26\" rx=\"13\" style=\"fill:var(--navy-tint)\"/><text x=\"450\" y=\"28\" text-anchor=\"middle\">jira_get<\/text>\n      <rect x=\"10\" y=\"46\" width=\"130\" height=\"26\" rx=\"13\" style=\"fill:var(--navy-tint)\"/><text x=\"75\" y=\"64\" text-anchor=\"middle\">search_docs<\/text>\n      <rect x=\"370\" y=\"60\" width=\"130\" height=\"26\" rx=\"13\" style=\"fill:var(--navy-tint)\"/><text x=\"435\" y=\"78\" text-anchor=\"middle\">read_minutes<\/text>\n      <rect x=\"10\" y=\"180\" width=\"110\" height=\"26\" rx=\"13\" style=\"fill:var(--navy-tint)\"/><text x=\"65\" y=\"198\" text-anchor=\"middle\">read_log<\/text>\n      <rect x=\"130\" y=\"190\" width=\"120\" height=\"26\" rx=\"13\" style=\"fill:var(--navy-tint)\"/><text x=\"190\" y=\"208\" text-anchor=\"middle\">find_tickets<\/text>\n      <rect x=\"260\" y=\"190\" width=\"120\" height=\"26\" rx=\"13\" style=\"fill:var(--navy-tint)\"/><text x=\"320\" y=\"208\" text-anchor=\"middle\">ki_lookup<\/text>\n      <rect x=\"390\" y=\"170\" width=\"110\" height=\"26\" rx=\"13\" style=\"fill:var(--navy-tint)\"/><text x=\"445\" y=\"188\" text-anchor=\"middle\">onedrive<\/text>\n      <rect x=\"10\" y=\"130\" width=\"140\" height=\"26\" rx=\"13\" style=\"fill:var(--navy-tint)\"/><text x=\"80\" y=\"148\" text-anchor=\"middle\">reprocess_doc<\/text>\n      <rect x=\"370\" y=\"110\" width=\"130\" height=\"26\" rx=\"13\" style=\"fill:var(--navy-tint)\"/><text x=\"435\" y=\"128\" text-anchor=\"middle\">send_mail<\/text>\n    <\/g>\n    <line x1=\"530\" y1=\"10\" x2=\"530\" y2=\"240\" style=\"stroke:var(--line);stroke-width:2\"/>\n  <\/g>\n  <g class=\"rv s1\">\n    <rect x=\"680\" y=\"90\" width=\"180\" height=\"70\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:3\"/>\n    <text x=\"770\" y=\"122\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:var(--ink)\">Jira agent<\/text>\n    <text x=\"770\" y=\"144\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--muted)\">knows project POC<\/text>\n    <rect x=\"705\" y=\"186\" width=\"130\" height=\"30\" rx=\"15\" style=\"fill:var(--good-tint);stroke:var(--good)\"/>\n    <text x=\"770\" y=\"206\" text-anchor=\"middle\" style=\"font-family:var(--mono);font-size:13px;fill:var(--ink)\">jira_search<\/text>\n    <line x1=\"770\" y1=\"160\" x2=\"770\" y2=\"186\" style=\"stroke:var(--good);stroke-width:2\"/>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal The specialist | #f1-spec .s1\n**Specialization:** a narrower agent picks tools better, and its prompt can say exactly how the POC project is organised.\n:::\n\n\n## Where it fits badly\n\n**Ask:** Next week Sam has to write the SD-LOG-01 design. Four agents, one per section. Good idea?\n\n<div class=\"diagram\" id=\"f1-bad\"><svg viewBox=\"0 0 1000 230\" role=\"img\" aria-label=\"Four design sections, each depending on all the others\">\n  <g>\n    <rect x=\"300\" y=\"20\" width=\"170\" height=\"50\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><text x=\"385\" y=\"51\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">collection<\/text>\n    <rect x=\"530\" y=\"20\" width=\"170\" height=\"50\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><text x=\"615\" y=\"51\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">storage, 30 days<\/text>\n    <rect x=\"300\" y=\"160\" width=\"170\" height=\"50\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><text x=\"385\" y=\"191\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">alert rules<\/text>\n    <rect x=\"530\" y=\"160\" width=\"170\" height=\"50\" rx=\"8\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/><text x=\"615\" y=\"191\" text-anchor=\"middle\" style=\"font-size:15px;fill:var(--ink)\">cost, 180 GB/day<\/text>\n  <\/g>\n  <g class=\"rv d1\" style=\"stroke:var(--bad);stroke-width:2\">\n    <line x1=\"470\" y1=\"45\" x2=\"530\" y2=\"45\"/><line x1=\"470\" y1=\"185\" x2=\"530\" y2=\"185\"/>\n    <line x1=\"385\" y1=\"70\" x2=\"385\" y2=\"160\"/><line x1=\"615\" y1=\"70\" x2=\"615\" y2=\"160\"/>\n    <line x1=\"470\" y1=\"70\" x2=\"530\" y2=\"160\"/><line x1=\"530\" y1=\"70\" x2=\"470\" y2=\"160\"/>\n    <text x=\"800\" y=\"120\" style=\"font-size:15px;font-weight:700;fill:var(--bad);stroke:none\">every section<\/text>\n    <text x=\"800\" y=\"142\" style=\"font-size:15px;font-weight:700;fill:var(--bad);stroke:none\">depends on every other<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal Answer | #f1-bad .d1\n**No: one agent.** Anthropic names it as a poor fit: every agent needs the **same context**, or the agents depend on each other at every step. The storage section changes the cost, and the cost changes the collection plan.\n:::\n\n", "content/need-more-agents/the-bill.md": "# The bill\n\n## Overview\n\n**Goal:** Put a price next to the benefit before choosing multi-agent.\n\n**Walk out with:** chat 1×, agent about 4×, multi-agent about 15× the tokens.\n\n\n## How many tokens?\n\n**Ask:** A chat answer costs 1 unit of tokens. Guess, and write down: one agent with tools? Several agents?\n\n<div class=\"diagram\" id=\"f1-bill\"><svg viewBox=\"0 0 1000 290\" role=\"img\" aria-label=\"Bar chart: chat 1x, agent 4x, multi-agent 15x tokens\">\n  <g>\n    <line x1=\"170\" y1=\"250\" x2=\"980\" y2=\"250\" style=\"stroke:var(--line);stroke-width:2\"/>\n    <text x=\"150\" y=\"60\" text-anchor=\"end\" style=\"font-size:17px;fill:var(--ink)\">chat<\/text>\n    <rect x=\"170\" y=\"40\" width=\"50\" height=\"40\" rx=\"4\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"235\" y=\"67\" style=\"font-size:18px;font-weight:700;fill:var(--navy)\">1×<\/text>\n  <\/g>\n  <g class=\"rv c1\">\n    <text x=\"150\" y=\"130\" text-anchor=\"end\" style=\"font-size:17px;fill:var(--ink)\">one agent<\/text>\n    <rect x=\"170\" y=\"110\" width=\"200\" height=\"40\" rx=\"4\" style=\"fill:var(--navy-tint);stroke:var(--navy)\"/>\n    <text x=\"385\" y=\"137\" style=\"font-size:18px;font-weight:700;fill:var(--navy)\">≈ 4×<\/text>\n  <\/g>\n  <g class=\"rv c2\">\n    <text x=\"150\" y=\"200\" text-anchor=\"end\" style=\"font-size:17px;fill:var(--ink)\">multi-agent<\/text>\n    <rect x=\"170\" y=\"180\" width=\"750\" height=\"40\" rx=\"4\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n    <text x=\"935\" y=\"207\" style=\"font-size:18px;font-weight:700;fill:var(--orange)\">≈ 15×<\/text>\n  <\/g>\n<\/svg><\/div>\n\n::: reveal One agent | #f1-bill .c1\n:::\n::: reveal Several agents | #f1-bill .c2\n**About 15× a chat.** Anthropic's own measurement on their research system.\n:::\n\n::: reveal And what you get for it\n**+90.2%** on Anthropic's research eval. Mostly bought with tokens.\n:::\n\n\n\n## Demo: the cost slider\n\n<div class=\"diagram\"><iframe src=\"content/ma-assets/demos/cost-slider.html\" style=\"width:100%;height:600px;border:0\" loading=\"lazy\"><\/iframe><\/div>\n\n", "content/need-more-agents/sort-the-tasks.md": "# One agent, a workflow, or several?\n\n## Overview\n\n**Goal:** Sort real tasks into a workflow, one agent or several agents, and say why.\n\n**Walk out with:** the answer key, to photograph.\n\n\n## Eight tasks\n\n**Task for participants:** In pairs, put each task in one of three piles: **workflow**, **one agent**, **several agents**. Two minutes.\n\n<div class=\"diagram\" id=\"f1-piles\"><svg viewBox=\"0 0 1000 64\" role=\"img\" aria-label=\"Three piles: workflow, one agent, several agents\">\n  <rect x=\"20\" y=\"6\" width=\"290\" height=\"52\" rx=\"12\" style=\"fill:var(--navy-tint);stroke:var(--navy);stroke-width:2\"/>\n  <text x=\"165\" y=\"39\" text-anchor=\"middle\" style=\"font-size:20px;font-weight:700;fill:var(--navy)\">workflow<\/text>\n  <rect x=\"355\" y=\"6\" width=\"290\" height=\"52\" rx=\"12\" style=\"fill:var(--orange-tint);stroke:var(--orange);stroke-width:2\"/>\n  <text x=\"500\" y=\"39\" text-anchor=\"middle\" style=\"font-size:20px;font-weight:700;fill:var(--orange)\">one agent<\/text>\n  <rect x=\"690\" y=\"6\" width=\"290\" height=\"52\" rx=\"12\" style=\"fill:var(--good-tint);stroke:var(--good);stroke-width:2\"/>\n  <text x=\"835\" y=\"39\" text-anchor=\"middle\" style=\"font-size:20px;font-weight:700;fill:var(--good)\">several agents<\/text>\n<\/svg><\/div>\n\n1. Reprocess the four night TIMEOUTs after 06:00\n2. \"Why did we drop vendor A?\"\n3. \"What happened with 7f3a-91c2?\"\n4. Friday status, vendor B vs C\n5. Monthly report: 50 tickets grouped by tenant\n6. Review SD-LOG-01 for security, cost and operations\n7. Sprint review summary from Jira\n8. Write SD-LOG-01 itself\n\n\n## The answer key\n\n| Task | Answer | Why |\n|---|---|---|\n| Reprocess the four night TIMEOUTs | <span class=\"rv k1\">workflow<\/span> | <span class=\"rv k1\">fixed steps, KI-022 says what to do<\/span> |\n| \"Why did we drop vendor A?\" | <span class=\"rv k2\">one agent (or plain RAG)<\/span> | <span class=\"rv k2\">one lookup in the minutes<\/span> |\n| \"What happened with 7f3a-91c2?\" | <span class=\"rv k2\">one agent<\/span> | <span class=\"rv k2\">three tool calls: log, KI-022, SOP-CH-07<\/span> |\n| Friday status, vendor B vs C | <span class=\"rv k3\">several, if one agent fails after the prompt fix<\/span> | <span class=\"rv k3\">4 independent sources, a lot to read<\/span> |\n| 50 tickets grouped by tenant | <span class=\"rv k3\">several (fan-out)<\/span> | <span class=\"rv k3\">parallel, each slice independent<\/span> |\n| Review SD-LOG-01: security, cost, ops | <span class=\"rv k3\">several (parallel specialists)<\/span> | <span class=\"rv k3\">three separate lenses<\/span> |\n| Sprint review summary from Jira | <span class=\"rv k1\">workflow (chain)<\/span> | <span class=\"rv k1\">same steps every two weeks<\/span> |\n| Write SD-LOG-01 itself | <span class=\"rv k2\">one agent<\/span> | <span class=\"rv k2\">sections depend on each other<\/span> |\n\n::: reveal Workflows | .k1\n:::\n::: reveal One agent | .k2\n:::\n::: reveal Several agents | .k3\nOnly three of eight. **Several agents is the exception, not the default.**\n:::\n\n"}, "css": ["viewer/flows/architectures.css", "viewer/flows/frameworks-and-close.css", "viewer/flows/need-more-agents.css", "viewer/flows/production.css", "viewer/flows/talk-and-state.css", "viewer/flows/the-brief.css", "viewer/flows/why-they-fail.css", "viewer/flows/workflow-labs.css", "viewer/flows/workflow-patterns.css", "viewer/student.css", "viewer/theme.css"]};</script>
